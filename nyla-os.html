<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

/* ── Toast Notification System ─────────────────────────────────────── */
let _toastListeners = [];
const toast = (message, type='success', duration=2800) => {
  const id = Date.now() + Math.random();
  _toastListeners.forEach(fn => fn({ id, message, type, duration }));
};
const ToastContainer = () => {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = t => {
      setToasts(prev => [...prev, { ...t, exiting: false }]);
      setTimeout(() => setToasts(prev => prev.map(x => x.id === t.id ? { ...x, exiting: true } : x)), t.duration - 400);
      setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t.id)), t.duration);
    };
    _toastListeners.push(handler);
    return () => { _toastListeners = _toastListeners.filter(fn => fn !== handler); };
  }, []);
  if (!toasts.length) return null;
  const icons = { success: '✓', error: '✕', info: '✦', sync: '↻' };
  const colors = { success: '#3a8a4a', error: '#c44060', info: '#9080d8', sync: '#4285f4' };
  return React.createElement('div', { style: { position: 'fixed', bottom: 90, left: '50%', transform: 'translateX(-50%)', zIndex: 10000, display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', pointerEvents: 'none' } },
    toasts.map(t => React.createElement('div', { key: t.id, style: {
      padding: '10px 20px', borderRadius: 14, background: _dk ? '#2a1e28' : '#fffcfd',
      border: `0.5px solid ${colors[t.type]}40`, boxShadow: `0 6px 24px ${colors[t.type]}30, 0 2px 8px rgba(0,0,0,0.08)`,
      display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, color: _dk ? '#f0e0e8' : '#401828',
      animation: t.exiting ? 'toastOut 0.35s ease forwards' : 'toastIn 0.3s ease', pointerEvents: 'auto',
    } },
      React.createElement('span', { style: { width: 22, height: 22, borderRadius: '50%', background: colors[t.type], color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 } }, icons[t.type]),
      t.message
    ))
  );
};

/* ── Firebase Cross-Device Sync ──────────────────────────────────────
   Fill in FB_CONFIG with your Firebase project details to enable sync.
   Steps: console.firebase.google.com → New project → Add web app →
   Copy config below. Then enable Firestore + Google Sign-In in Firebase.
──────────────────────────────────────────────────────────────────── */
const FB_CONFIG = {
  apiKey:            "AIzaSyCJPO5JqrILVHivCUkRp0uSmljgDGVBEDA",
  authDomain:        "nyla-os.firebaseapp.com",
  projectId:         "nyla-os",
  storageBucket:     "nyla-os.firebasestorage.app",
  messagingSenderId: "437157047081",
  appId:             "1:437157047081:web:67210561739a85d0f8a538"
};

// Raw localStorage.setItem (before our interception, used internally)
const _rawLS = localStorage.setItem.bind(localStorage);
let _fbAuth=null, _fbDb=null, _fbUser=null, _syncTimer=null;
const _syncSubs=new Set();
let _syncState={status:'idle',user:null};
const _setSyncState=s=>{_syncState=s;_syncSubs.forEach(fn=>fn(s));};
// Prevents double-reload when _cloudLoad and onSnapshot both fire on sign-in
let _reloadPending=false;

const useSyncStatus=()=>{
  const [s,setS]=React.useState(_syncState);
  React.useEffect(()=>{_syncSubs.add(setS);return()=>_syncSubs.delete(setS);},[]);
  return s;
};

async function _cloudLoad(){
  if(!_fbUser||!_fbDb) return;
  _setSyncState({status:'syncing',user:_fbUser});
  try{
    const doc=await _fbDb.collection('nylaos').doc(_fbUser.uid).get();
    if(doc.exists){
      const {snapshot,savedAt}=doc.data();
      const localTs=parseInt(localStorage.getItem('nylaos_cloud_ts')||'0');
      if(snapshot&&savedAt>localTs){_applyCloudSnapshot(snapshot,savedAt,_fbUser);return;}
    }
    _setSyncState({status:'synced',user:_fbUser});
  }catch(e){console.warn('Cloud load:',e);_setSyncState({status:'error',user:_fbUser});}
}

function _applyCloudSnapshot(snapshot, savedAt, user){
  if(_reloadPending) return;
  const data=JSON.parse(snapshot);
  Object.entries(data).forEach(([k,v])=>{
    if(k.startsWith('nylaos_')&&k!=='nylaos_cloud_ts') _rawLS(k,v);
  });
  _rawLS('nylaos_cloud_ts',String(savedAt));
  _setSyncState({status:'synced',user});
  _reloadPending=true;
  window.location.reload();
}

async function cloudSave(){
  if(!_fbUser||!_fbDb) return;
  _setSyncState({status:'syncing',user:_fbUser});
  try{
    const snap={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('nylaos_')&&k!=='nylaos_cloud_ts') snap[k]=localStorage.getItem(k);
    }
    const savedAt=Date.now();
    await _fbDb.collection('nylaos').doc(_fbUser.uid).set({
      snapshot:JSON.stringify(snap),savedAt,email:_fbUser.email||''
    });
    _rawLS('nylaos_cloud_ts',String(savedAt));
    _setSyncState({status:'synced',user:_fbUser});
    if(typeof toast==='function') toast('Synced to cloud','sync',2000);
  }catch(e){console.warn('Cloud save:',e);_setSyncState({status:'error',user:_fbUser});if(typeof toast==='function') toast('Sync failed','error');}
}

// Intercept all localStorage writes → auto-sync 2.5s after last change
let _nbFileTimer=null;
localStorage.setItem=function(key,value){
  _rawLS(key,value);
  if(key&&key.startsWith('nylaos_')&&key!=='nylaos_cloud_ts'&&_fbUser){
    if(_syncTimer) clearTimeout(_syncTimer);
    _syncTimer=setTimeout(cloudSave,2500);
  }
  if(key==='nylaos_nb_pages'){
    if(_nbFileTimer) clearTimeout(_nbFileTimer);
    _nbFileTimer=setTimeout(_writeNotebookFile,1500);
    if(window._backupNotebooks) window._backupNotebooks();
  }
};

/* ── Local file auto-save for Notebook ─────────────────────────── */
(function(){
  const _idbOpen=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('nylaos_prefs',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
  const _idbGet=async k=>{const db=await _idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const r=t.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e.target.error);});};
  const _idbSet=async(k,v)=>{const db=await _idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=e=>rej(e.target.error);});};

  window._nbFileHandle=null;

  // Load stored handle on boot and verify permission is still granted
  _idbGet('nb_file_handle').then(async h=>{
    if(!h) return;
    try{
      const p=await h.queryPermission({mode:'readwrite'});
      if(p==='granted') window._nbFileHandle=h;
    }catch(e){}
  });

  window.pickNotebookFile=async()=>{
    if(!window.showSaveFilePicker){alert('Auto-save requires Chrome or Edge.');return;}
    try{
      const h=await window.showSaveFilePicker({
        suggestedName:'nyla os notebooks.md',
        types:[{description:'Markdown',accept:{'text/markdown':['.md']}},{description:'Text file',accept:{'text/plain':['.txt']}}]
      });
      window._nbFileHandle=h;
      await _idbSet('nb_file_handle',h);
      await _writeNotebookFile();
    }catch(e){if(e.name!=='AbortError')console.warn('Notebook file pick:',e);}
  };

  window.unlinkNotebookFile=async()=>{
    window._nbFileHandle=null;
    try{await _idbSet('nb_file_handle',null);}catch(e){}
  };
})();

function _htmlToText(html){
  const d=document.createElement('div');d.innerHTML=html;
  return (d.innerText||d.textContent||'').trim();
}

/* ── Notebook backup to IndexedDB (guard against localStorage loss) ── */
(function(){
  const DB_NAME='nylaos_nb_backup', STORE='snapshots';
  const _openBackupDb=()=>new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE);
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
  window._backupNotebooks=async()=>{
    try{
      const folders=localStorage.getItem('nylaos_nb_folders');
      const pages=localStorage.getItem('nylaos_nb_pages');
      if(!pages) return;
      const db=await _openBackupDb();
      const tx=db.transaction(STORE,'readwrite');
      const s=tx.objectStore(STORE);
      s.put({folders,pages,ts:Date.now()},'latest');
      s.put({folders,pages,ts:Date.now()},'snap_'+new Date().toISOString().split('T')[0]);
      tx.oncomplete=()=>{};
    }catch(e){console.warn('Notebook backup:',e);}
  };
  window._restoreNotebooksIfEmpty=async()=>{
    try{
      const existing=localStorage.getItem('nylaos_nb_pages');
      if(existing&&JSON.parse(existing).length>0) return;
      const db=await _openBackupDb();
      const tx=db.transaction(STORE,'readonly');
      const r=tx.objectStore(STORE).get('latest');
      r.onsuccess=()=>{
        if(!r.result) return;
        const snap=r.result;
        if(snap.pages){
          const parsed=JSON.parse(snap.pages);
          if(parsed.length>0){
            localStorage.setItem('nylaos_nb_pages',snap.pages);
            if(snap.folders) localStorage.setItem('nylaos_nb_folders',snap.folders);
            console.log('Notebooks restored from backup ('+parsed.length+' pages)');
          }
        }
      };
    }catch(e){console.warn('Notebook restore:',e);}
  };
  window._restoreNotebooksIfEmpty();
  setInterval(()=>window._backupNotebooks(),30000);
})();

window._exportNotebookMd=function(){
  const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
  const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
  if(!pages.length) return null;
  const grouped={};
  pages.forEach(p=>{const fid=p.folderId??'__unfiled';if(!grouped[fid])grouped[fid]=[];grouped[fid].push(p);});
  let md=`# Nyla OS Notebooks\n*Exported: ${new Date().toLocaleString()}*\n`;
  const sorted=[...folders].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  for(const f of sorted){
    const fps=grouped[f.id]||[];if(!fps.length)continue;
    md+=`\n---\n\n## ${f.name}\n`;
    for(const p of fps){
      md+=`\n### ${p.name||'Untitled'}\n`;
      if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
      const txt=_htmlToText(p.content||'');
      if(txt)md+=txt+'\n';
    }
  }
  return md;
};

window._exportToGoogleDrive=function(){
  const md=window._exportNotebookMd();
  if(!md){alert('No notebooks to export.');return;}
  const blob=new Blob([md],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='nyla-os-notebooks.md'; a.click();
  URL.revokeObjectURL(url);
  if(typeof toast==='function') toast('Notebooks exported — opening Google Drive','success');
  setTimeout(()=>window.open('https://drive.google.com/drive/my-drive','_blank'),500);
};

async function _writeNotebookFile(){
  const h=window._nbFileHandle;
  if(!h) return;
  try{
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return;

    const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
    const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');

    const grouped={};
    pages.forEach(p=>{const fid=p.folderId??'__unfiled';if(!grouped[fid])grouped[fid]=[];grouped[fid].push(p);});

    let md=`# Nyla OS Notebooks\n*Last updated: ${new Date().toLocaleString()}*\n`;

    const sorted=[...folders].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    for(const f of sorted){
      const fps=grouped[f.id]||[];if(!fps.length)continue;
      md+=`\n---\n\n## ${f.name}\n`;
      for(const p of fps){
        md+=`\n### ${p.name||'Untitled'}\n`;
        if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
        const txt=_htmlToText(p.content||'');
        if(txt)md+=txt+'\n';
      }
    }
    const unfiled=grouped['__unfiled']||[];
    if(unfiled.length){
      md+=`\n---\n\n## Unfiled\n`;
      for(const p of unfiled){
        md+=`\n### ${p.name||'Untitled'}\n`;
        if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
        const txt=_htmlToText(p.content||'');
        if(txt)md+=txt+'\n';
      }
    }

    const w=await h.createWritable();
    await w.write(md);
    await w.close();
  }catch(e){console.warn('Notebook file write:',e);}
}

async function signInWithGoogle(){
  if(!_fbAuth){alert('Firebase config not filled in yet — see code comments.');return;}
  try{await _fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
  catch(e){if(e.code!=='auth/popup-closed-by-user')alert('Sign-in failed: '+e.message);}
}
async function fbSignOut(){if(_fbAuth)await _fbAuth.signOut();}

// Boot Firebase if config is provided
let _cloudListener=null;
(function(){
  if(!FB_CONFIG.apiKey||typeof firebase==='undefined') return;
  try{
    firebase.initializeApp(FB_CONFIG);
    _fbAuth=firebase.auth();
    _fbDb=firebase.firestore();
    _fbAuth.onAuthStateChanged(user=>{
      _fbUser=user;
      // Tear down old real-time listener
      if(_cloudListener){_cloudListener();_cloudListener=null;}
      if(user){
        _setSyncState({status:'syncing',user});
        // onSnapshot fires immediately on attach (initial load) AND on remote changes.
        // We skip _cloudLoad entirely to avoid the double-reload race.
        _cloudListener=_fbDb.collection('nylaos').doc(user.uid).onSnapshot(doc=>{
          if(doc.metadata.hasPendingWrites) return; // ignore our own in-flight writes
          if(!doc.exists){_setSyncState({status:'synced',user});return;}
          const {snapshot,savedAt}=doc.data();
          const localTs=parseInt(localStorage.getItem('nylaos_cloud_ts')||'0');
          if(snapshot&&savedAt>localTs){
            _applyCloudSnapshot(snapshot,savedAt,user);
          } else {
            _setSyncState({status:'synced',user});
          }
        },err=>{console.warn('Cloud listener:',err);_setSyncState({status:'error',user});});
      } else {
        _setSyncState({status:'idle',user:null});
      }
    });
  }catch(e){console.warn('Firebase init:',e);}
})();

const useIsMobile = () => {
  const [v, setV] = useState(() => window.innerWidth < 700);
  useEffect(() => {
    const fn = () => setV(window.innerWidth < 700);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return v;
};

/* ── Data Protection ─────────────────────────────────────────────
   Runs synchronously before React initializes so nothing is lost.
   1. Migrates any legacy keys that were renamed between versions.
   2. Takes an auto-snapshot of all current nylaos_ data so there
      is always a "last session" restore point even after a code update.
──────────────────────────────────────────────────────────────────── */
(function protectData() {
  // Key migrations: [oldKey, newKey]
  const migrations = [
    ['cycleStartDate', 'nylaos_cycleStartDate'],
  ];
  migrations.forEach(([oldK, newK]) => {
    const v = localStorage.getItem(oldK);
    if (v !== null && localStorage.getItem(newK) === null) {
      localStorage.setItem(newK, v);
    }
  });

  // Auto-snapshot: copy every nylaos_ value before new code runs
  try {
    const snap = {};
    let hasData = false;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('nylaos_') && k !== 'nylaos_auto_bak') {
        snap[k] = localStorage.getItem(k);
        hasData = true;
      }
    }
    if (hasData) {
      snap.__savedAt = new Date().toISOString();
      localStorage.setItem('nylaos_auto_bak', JSON.stringify(snap));
    }
  } catch(e) {}
})();

const fmtDateKey = d => {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};

const getMoonForDate = date => {
  const d = new Date(date); d.setHours(12,0,0,0);
  const diff = (d - KNOWN_NEW_MOON) / 86400000;
  const phase = ((diff % 29.53) + 29.53) % 29.53;
  const idx = Math.floor(phase / 29.53 * 8) % 8;
  return { idx, emoji: moonEmoji[idx], label: moonLabel[idx] };
};

const getCycleForDate = date => {
  const startStr = localStorage.getItem('nylaos_cycleStartDate');
  if (!startStr) return null;
  const start = new Date(startStr); start.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const diff = Math.floor((d - start) / 86400000);
  const day = ((diff % 28) + 28) % 28 + 1;
  const phase = CYCLE_PHASES.find(p => day >= p.day1 && day <= p.day2) || CYCLE_PHASES[3];
  return { day, ...phase };
};

const polarToCartesian = (cx, cy, r, deg) => {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
};

const arcPath = (cx, cy, r, a1, a2) => {
  const s = polarToCartesian(cx, cy, r, a1);
  const e = polarToCartesian(cx, cy, r, Math.min(a2, a1 + 359.9));
  const large = (a2 - a1) > 180 ? 1 : 0;
  return `M${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${large} 1 ${e.x.toFixed(2)},${e.y.toFixed(2)}`;
};

/* ── Focus Mode ─────────────────────────────────────────────────── */
const FocusMode = () => {
  const [seconds, setSeconds] = useState(25*60);
  const [running, setRunning] = useState(false);
  const [mode, setMode] = useState('focus');
  const ref = useRef(null);
  useEffect(()=>{
    if (running) {
      ref.current = setInterval(()=>{
        setSeconds(s=>{ if(s<=1){setRunning(false);return mode==='focus'?5*60:25*60;} return s-1; });
      },1000);
    } else clearInterval(ref.current);
    return ()=>clearInterval(ref.current);
  },[running,mode]);
  const mm = String(Math.floor(seconds/60)).padStart(2,'0');
  const ss = String(seconds%60).padStart(2,'0');
  const pct = mode==='focus'?1-(seconds/(25*60)):1-(seconds/(5*60));
  const r=72,cx=80,cy=80,circ=2*Math.PI*r;
  return (
    <div className="fade-in" style={{ maxWidth:420, textAlign:'center' }}>
      <PageTitle>Focus Mode</PageTitle>
      <div style={{ display:'flex', gap:8, justifyContent:'center', marginBottom:28 }}>
        {[['focus','Focus (25m)'],['break','Break (5m)']].map(([m,l])=>(
          <Pill key={m} active={mode===m} onClick={()=>{setMode(m);setRunning(false);setSeconds(m==='focus'?25*60:5*60);}}>{l}</Pill>
        ))}
      </div>
      <svg width={160} height={160} style={{ margin:'0 auto 24px', display:'block' }}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={`${C.pink}60`} strokeWidth={8}/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.rose} strokeWidth={8}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)}
          strokeLinecap="round" transform={`rotate(-90 ${cx} ${cy})`}
          style={{ transition:'stroke-dashoffset 0.9s linear' }}/>
        <text x={cx} y={cy+8} textAnchor="middle"
          style={{ fontFamily:"'DM Serif Display',serif", fontSize:28, fill:C.rose, fontWeight:500 }}>{mm}:{ss}</text>
      </svg>
      <div style={{ display:'flex', gap:10, justifyContent:'center' }}>
        <button onClick={()=>setRunning(r=>!r)} style={{
          padding:'12px 32px', borderRadius:12, background: running ? C.accent : C.rose,
          color:'#fff', border:'none', fontSize:14.5, fontWeight:500, cursor:'pointer',
        }}>{running?'Pause':'Start'}</button>
        <button onClick={()=>{setRunning(false);setSeconds(mode==='focus'?25*60:5*60);}} style={{
          padding:'12px 20px', borderRadius:12, background:`${C.pink}70`,
          border:`0.5px solid ${C.border}`, color:C.rose, fontSize:14.5, cursor:'pointer',
        }}>Reset</button>
      </div>
    </div>
  );
};

const MiniMonth = ({ year, month, events=[] }) => {
  const firstDay = new Date(year,month,1).getDay();
  const dim = new Date(year,month+1,0).getDate();
  const cells = [...Array(firstDay).fill(null), ...Array.from({length:dim},(_,i)=>i+1)];
  const today = new Date();
  const dayKey = d => `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return (
    <div>
      <div style={{ fontSize:11, fontWeight:500, color:C.rose, marginBottom:6 }}>{MONTHS3[month]} {year}</div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:1 }}>
        {DAYS3.map((d,i)=><div key={i} style={{ textAlign:'center', fontSize:8, color:C.textMuted, padding:'2px 0' }}>{d}</div>)}
        {cells.map((day,i)=>{
          const isToday = day&&day===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
          const evts = day ? events.filter(e=>e.date===dayKey(day)) : [];
          return <DayCell key={i} day={day} date={day?new Date(year,month,day):null} events={evts} isToday={isToday} mini />;
        })}
      </div>
    </div>
  );
};

const DayPanel = ({ dateKey, label }) => {
  const TASKS_KEY = 'nylaos_tasks';
  const [allTasks, setAllTasks] = useState(()=>JSON.parse(localStorage.getItem(TASKS_KEY)||'[]'));
  const [events, setEvents] = useState(()=>JSON.parse(localStorage.getItem('nylaos_events')||'[]'));
  const [editId, setEditId] = useState(null);
  const [editText, setEditText] = useState('');
  const [editTime, setEditTime] = useState('');
  const [newText, setNewText] = useState('');
  const [newTime, setNewTime] = useState('');
  const [recurEnd, setRecurEnd] = useState('');
  const [showRecur, setShowRecur] = useState(false);

  // One-time migration: move old nylaos_day_items into nylaos_tasks
  useEffect(()=>{
    const old = JSON.parse(localStorage.getItem('nylaos_day_items')||'[]');
    if(!old.length) return;
    const existing = JSON.parse(localStorage.getItem(TASKS_KEY)||'[]');
    const existIds = new Set(existing.map(t=>String(t.id)));
    const migrated = old.filter(i=>!existIds.has(String(i.id))).map(i=>({
      id:i.id, text:i.text, done:i.done||false,
      calendarDate:i.dateKey, time:i.time||null,
      created:new Date().toISOString()
    }));
    if(migrated.length){
      const merged = [...existing, ...migrated];
      localStorage.setItem(TASKS_KEY, JSON.stringify(merged));
      setAllTasks(merged);
    }
    localStorage.removeItem('nylaos_day_items');
  },[]);

  const saveTasks = tasks => { setAllTasks(tasks); localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); };
  const saveEvents = evts => { setEvents(evts); localStorage.setItem('nylaos_events', JSON.stringify(evts)); };

  // Calendar schedule items (added directly on calendar)
  const scheduleItems = allTasks.filter(t=>t.calendarDate===dateKey&&t.source==='calendar').sort((a,b)=>{
    if(!a.time&&!b.time) return 0; if(!a.time) return 1; if(!b.time) return -1;
    return (a.time||'').localeCompare(b.time||'');
  });
  // Plain calendar events (from nylaos_events)
  const dayEvents = events.filter(e=>e.date===dateKey);
  // Tasks from Tasks panel: assigned to this day OR completed on this day
  const dayTaskItems = allTasks.filter(t=>
    t.source!=='calendar' && (t.calendarDate===dateKey || t.completedDate===dateKey)
  ).sort((a,b)=>{
    if(!a.time&&!b.time) return 0; if(!a.time) return 1; if(!b.time) return -1;
    return (a.time||'').localeCompare(b.time||'');
  });

  const addItem = () => {
    if(!newText.trim()) return;
    if(showRecur && recurEnd) {
      const start = new Date(dateKey + 'T00:00:00');
      const end = new Date(recurEnd + 'T00:00:00');
      if(end < start) { toast('End date must be after start date','error'); return; }
      const newItems = [];
      for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
        const dk = d.toISOString().slice(0,10);
        newItems.push({id:Date.now()+newItems.length,text:newText.trim(),done:false,calendarDate:dk,time:newTime||null,source:'calendar',recurGroup:start.toISOString().slice(0,10)+'_'+recurEnd,created:new Date().toISOString()});
      }
      saveTasks([...allTasks,...newItems]);
      toast(`Added to ${newItems.length} days`,'success',1500);
    } else {
      saveTasks([...allTasks,{id:Date.now(),text:newText.trim(),done:false,calendarDate:dateKey,time:newTime||null,source:'calendar',created:new Date().toISOString()}]);
    }
    setNewText(''); setNewTime(''); setRecurEnd(''); setShowRecur(false);
  };
  const toggleDone = id => {
    const nowDone = !allTasks.find(t=>t.id===id)?.done;
    saveTasks(allTasks.map(t=>t.id===id?{...t,done:nowDone,completedDate:nowDone?dateKey:null}:t));
  };
  const removeItem = id => saveTasks(allTasks.filter(t=>t.id!==id));
  const removeEvent = id => saveEvents(events.filter(e=>e.id!==id));
  const startEdit = item => { setEditId(item.id); setEditText(item.text); setEditTime(item.time||''); };
  const saveEdit = () => {
    saveTasks(allTasks.map(t=>t.id===editId?{...t,text:editText.trim()||t.text,time:editTime||null}:t));
    setEditId(null);
  };

  const sectionLabel = (text) => (
    <div style={{ fontSize:10, fontWeight:700, color:C.textMuted, letterSpacing:0.9, textTransform:'uppercase', marginBottom:8, marginTop:4 }}>{text}</div>
  );

  const allEmpty = scheduleItems.length===0 && dayEvents.length===0 && dayTaskItems.length===0;

  return (
    <Card style={{ marginTop:12, padding:'16px 18px' }}>
      <SectionHeading style={{ marginBottom:12 }}>{label}</SectionHeading>

      {/* ── Schedule section ── */}
      {sectionLabel('📅 Schedule')}
      <div style={{ display:'flex', flexDirection:'column', gap:6, marginBottom:10 }}>
        {dayEvents.map(evt=>(
          <div key={evt.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 0', borderBottom:`0.5px solid ${C.border}60` }}>
            <div style={{ width:7, height:7, borderRadius:'50%', background:C.rose, flexShrink:0, opacity:0.7 }}/>
            <span style={{ flex:1, fontSize:13.5, color:C.text }}>{evt.text}</span>
            <button onClick={()=>removeEvent(evt.id)} style={{ background:'none', border:'none', cursor:'pointer', color:C.textMuted, fontSize:14, padding:'0 2px', opacity:0.4, lineHeight:1 }}
              onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0.4}>🗑</button>
          </div>
        ))}
        {scheduleItems.map(item=>(
          <div key={item.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 0', borderBottom:`0.5px solid ${C.border}60` }}>
            <Checkbox checked={item.done} onChange={()=>toggleDone(item.id)} size={18} />
            {editId===item.id ? (
              <>
                <input autoFocus value={editText} onChange={e=>setEditText(e.target.value)}
                  onKeyDown={e=>{ if(e.key==='Enter') saveEdit(); if(e.key==='Escape') setEditId(null); }}

const CalendarPanel = ({ sub }) => {
  const today = new Date();
  const isMobile = useIsMobile();
  const [viewDate, setViewDate] = useState(today);
  const [events] = useState(()=>JSON.parse(localStorage.getItem('nylaos_events')||'[]')); // read-only for dot indicators
  const [selectedDay, setSelectedDay] = useState(null);

  const y = viewDate.getFullYear(), m = viewDate.getMonth();

  const navMonth = d => { const dt=new Date(y,m+d,1); setViewDate(dt); setSelectedDay(null); };
  const navDay   = d => { const dt=new Date(viewDate); dt.setDate(dt.getDate()+d); setViewDate(dt); };
  const navWeek  = d => { const dt=new Date(viewDate); dt.setDate(dt.getDate()+d*7); setViewDate(dt); };

  const NavBar = ({ onPrev, onNext, label }) => (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:21, color:C.rose }}>{label}</div>
      <div style={{ display:'flex', gap:8 }}>
        {[[-1,'‹'],[1,'›']].map(([d,l])=>(
          <button key={d} onClick={d<0?onPrev:onNext} style={{
            width:34, height:34, borderRadius:9, background:`${C.pink}80`,
            border:`0.5px solid ${C.border}`, cursor:'pointer', fontSize:17, color:C.rose,
          }}>{l}</button>
        ))}
      </div>
    </div>
  );

  /* DAILY */
  if (sub==='Daily') {
    const dStr = fmtDateKey(viewDate);
    const moon = getMoonForDate(viewDate);
    const cycle = getCycleForDate(viewDate);
    const dayLabel = viewDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    return (
      <div className="fade-in" style={{ maxWidth:560 }}>
        <NavBar onPrev={()=>navDay(-1)} onNext={()=>navDay(1)} label={dayLabel} />
        <div style={{ display:'flex', gap:10, marginBottom:4, flexWrap:'wrap' }}>
          <span style={{ padding:'4px 12px', borderRadius:14, background:'#1a0a2eCC', color:'#E8D0F5', fontSize:12.5 }}>{moon.emoji} {moon.label}</span>
          {cycle && <span style={{ padding:'4px 12px', borderRadius:14, background:cycle.bg, color:cycle.color, fontSize:12.5, fontWeight:500 }}>● {cycle.name} · Day {cycle.day}</span>}
        </div>
        <DayPanel dateKey={dStr} label={dayLabel} />
      </div>
    );
  }

  /* WEEKLY */
  if (sub==='Weekly') {
    const weekStart = new Date(viewDate);
    weekStart.setDate(viewDate.getDate() - viewDate.getDay());
    const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(weekStart.getDate()+i); return d; });
    return (
      <div className="fade-in" style={{ maxWidth:760 }}>
        <NavBar onPrev={()=>navWeek(-1)} onNext={()=>navWeek(1)}
          label={`Week of ${weekStart.toLocaleDateString('en-US',{month:'long',day:'numeric'})}`} />
        <div style={{ overflowX: isMobile ? 'auto' : 'visible', WebkitOverflowScrolling:'touch', marginRight: isMobile ? -14 : 0 }}>
        <div style={{ display:'grid', gridTemplateColumns: isMobile ? 'repeat(7,minmax(90px,1fr))' : 'repeat(7,1fr)', gap:8, minWidth: isMobile ? 630 : 'unset' }}>
          {weekDays.map((d,i)=>{
            const isToday = d.toDateString()===today.toDateString();
            const dStr = fmtDateKey(d);
            const moon = getMoonForDate(d);
            const cycle = getCycleForDate(d);
            const dayEvts = events.filter(e=>e.date===dStr);
            return (
              <div key={i} style={{ display:'flex', flexDirection:'column', gap:6 }}>
                <Card style={{
                  padding:'10px 8px', textAlign:'center',
                  background: isToday ? C.rose : C.card,
                  cursor:'pointer',
                }} onClick={()=>setSelectedDay(dStr)}>
                  <div style={{ fontSize:10, color: isToday?'rgba(255,255,255,0.7)':C.textLight, marginBottom:2 }}>{DAYS[i]}</div>
                  <div style={{ fontSize:15, fontWeight:600, color: isToday?'#fff':C.rose }}>{d.getDate()}</div>
                  <div style={{ fontSize:13, marginTop:2 }}>{moon.emoji}</div>
                  {cycle && <div style={{ width:8, height:8, borderRadius:'50%', background: isToday?'rgba(255,255,255,0.7)':cycle.color, margin:'4px auto 0' }} />}
                </Card>
                {dayEvts.slice(0,3).map(e=>(
                  <div key={e.id} style={{ padding:'5px 8px', borderRadius:8, background:`${C.lavender}80`, fontSize:11, color:C.rose, lineHeight:1.3 }}>{e.text}</div>
                ))}
                {dayEvts.length>3 && <div style={{ fontSize:10, color:C.textMuted, paddingLeft:4 }}>+{dayEvts.length-3} more</div>}
              </div>
            );
          })}
        </div>
        </div>
        {selectedDay && (
          <DayPanel dateKey={selectedDay}
            label={new Date(selectedDay+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} />
        )}
      </div>
    );
  }

  /* MONTHLY */
  if (sub==='Monthly') {
    const firstDay = new Date(y,m,1).getDay();
    const dim = new Date(y,m+1,0).getDate();
    const cells = [...Array(firstDay).fill(null), ...Array.from({length:dim},(_,i)=>i+1)];
    const selDStr = selectedDay ? `${y}-${String(m+1).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}` : null;
    const allTasksForMonth = JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
    return (
      <div className="fade-in" style={{ maxWidth:560 }}>
        <NavBar onPrev={()=>navMonth(-1)} onNext={()=>navMonth(1)} label={`${MONTHS[m]} ${y}`} />
        <Card style={{ padding:'16px 14px' }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3, marginBottom:6 }}>
            {DAYS.map(d=><div key={d} style={{ textAlign:'center', fontSize:11, color:C.textLight, fontWeight:500, padding:'4px 0' }}>{d}</div>)}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3 }}>
            {cells.map((day,i)=>{
              const isToday = day&&day===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
              const isSelected = day===selectedDay;
              const dStr = day?`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`:null;
              // Include both calendar events AND tasks due on this day
              const evts = dStr ? [
                ...events.filter(e=>e.date===dStr),
                ...allTasksForMonth.filter(t=>t.calendarDate===dStr && !t.done)
              ] : [];
              return (
                <DayCell key={i} day={day} date={day?new Date(y,m,day):null}
                  events={evts} isToday={isToday} isSelected={isSelected}
                  onClick={()=>day&&setSelectedDay(selectedDay===day?null:day)} />
              );
            })}
          </div>
        </Card>
        {selectedDay && selDStr && (
          <DayPanel dateKey={selDStr} label={`${MONTHS[m]} ${selectedDay}, ${y}`} />
        )}
      </div>
    );
  }

  /* QUARTERLY */
  if (sub==='Quarterly') {
    const q = Math.floor(m/3);
    const qStart = q*3;
    return (
      <div className="fade-in" style={{ maxWidth:760 }}>
        <NavBar onPrev={()=>navMonth(-3)} onNext={()=>navMonth(3)} label={`Q${q+1} ${y}`} />
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:20 }}>
          {[0,1,2].map(offset=>{
            const mo = (qStart+offset)%12;
            const yr = mo < qStart%12 ? y+1 : y;
            return (
              <Card key={offset} style={{ padding:'16px 14px' }}>
                <MiniMonth year={yr} month={mo} events={events} />
              </Card>
            );
          })}
        </div>
      </div>
    );
  }

  /* YEARLY */
  return (
    <div className="fade-in" style={{ maxWidth:820 }}>
      <NavBar onPrev={()=>setViewDate(new Date(y-1,m,1))} onNext={()=>setViewDate(new Date(y+1,m,1))} label={`${y}`} />
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:16 }}>
        {Array.from({length:12},(_,mo)=>(
          <Card key={mo} style={{ padding:'14px 12px' }}>
            <MiniMonth year={y} month={mo} events={events} />
          </Card>
        ))}
      </div>
    </div>
  );
};

/* ── Trash / Soft Delete ────────────────────────────────────────── */
const TRASH_KEY = 'nylaos_trash';
const getTrash = () => JSON.parse(localStorage.getItem(TRASH_KEY)||'[]');
const saveTrash = items => localStorage.setItem(TRASH_KEY, JSON.stringify(items));
const addToTrash = (type, name, data, storageKey) => {
  const item = { id:Date.now(), type, name, data, storageKey, deletedAt:new Date().toISOString() };
  saveTrash([item, ...getTrash()]);
};
const restoreTrashItem = id => {
  const trash = getTrash();
  const item = trash.find(t=>t.id===id);
  if (!item) return null;
  if (item.storageKey) {
    const current = JSON.parse(localStorage.getItem(item.storageKey)||'[]');
    localStorage.setItem(item.storageKey, JSON.stringify([item.data, ...current]));
  }
  saveTrash(trash.filter(t=>t.id!==id));
  return item;
};
const permanentDelete = id => saveTrash(getTrash().filter(t=>t.id!==id));
const purgeOldTrash = () => {
  const cutoff = Date.now() - 30*24*60*60*1000;
  saveTrash(getTrash().filter(t=>new Date(t.deletedAt).getTime()>cutoff));
};

const TrashPanel = ({ type, onRestoreBusiness }) => {
  const [trash, setTrash] = useState(()=>{ purgeOldTrash(); return getTrash(); });
  const filtered = type ? trash.filter(t=>t.type===type) : trash;
  const refresh = () => setTrash(getTrash());
  const handleRestore = item => {
    if (item.type==='business' && onRestoreBusiness) {
      onRestoreBusiness(item.data.name);
      permanentDelete(item.id);
    } else {
      restoreTrashItem(item.id);
    }
    refresh();
  };
  const handleDelete = id => { permanentDelete(id); refresh(); };
  const typeLabel = { task:'Task', goal:'Goal', business:'Business', notebook_page:'Note' };
  return (
    <div className="fade-in" style={{ maxWidth:620 }}>
      <PageTitle>Recently Deleted</PageTitle>
      {filtered.length===0 && <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'28px 4px' }}>Nothing deleted recently — your trash is empty.</div>}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {filtered.map(item=>{
          const daysAgo = Math.floor((Date.now()-new Date(item.deletedAt).getTime())/86400000);
          const whenStr = daysAgo===0?'Today':daysAgo===1?'Yesterday':`${daysAgo} days ago`;
          return (
            <Card key={item.id} style={{ padding:'12px 16px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13.5, color:C.text }}>{item.name}</div>
                  <div style={{ fontSize:11.5, color:C.textMuted, marginTop:3 }}>{typeLabel[item.type]||item.type} · Deleted {whenStr}</div>
                </div>
                <button onClick={()=>handleRestore(item)} style={{ padding:'6px 14px', borderRadius:8, background:`${C.accent}25`, border:`0.5px solid ${C.border}`, color:C.text, fontSize:12, cursor:'pointer' }}>Restore</button>
                <button onClick={()=>handleDelete(item.id)} style={{ padding:'6px 14px', borderRadius:8, background:'none', border:`0.5px solid ${C.border}`, color:C.textMuted, fontSize:12, cursor:'pointer' }}>Delete forever</button>
              </div>
            </Card>
          );
        })}
      </div>
      {filtered.length>0 && (
        <div style={{ marginTop:20, fontSize:12.5, color:C.textMuted }}>
          Items are automatically removed after 30 days ·{' '}
          <button onClick={()=>{ filtered.forEach(t=>permanentDelete(t.id)); refresh(); }} style={{ background:'none', border:'none', cursor:'pointer', color:C.rose, fontSize:12.5, textDecoration:'underline' }}>Clear all</button>
        </div>
      )}
    </div>
  );
};

/* ── Kanban Board ─────────────────────────────────────────────────── */
const KanbanBoard = ({ storageKey='nylaos_tasks' }) => {
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(storageKey)||'[]').filter(t=>t.source!=='calendar'));
  const [input, setInput] = useState('');
  const save = t => { const all=JSON.parse(localStorage.getItem(storageKey)||'[]'); const calTasks=all.filter(x=>x.source==='calendar'); setTasks(t); localStorage.setItem(storageKey,JSON.stringify([...t,...calTasks])); };
  const cols = [
    { key:'todo', label:'To Do', filter: t=>!t.done&&!t.status, color:C.pink },
    { key:'progress', label:'In Progress', filter: t=>!t.done&&t.status==='progress', color:`${C.accent}60` },
    { key:'done', label:'Done', filter: t=>t.done, color:`#68c97a40` },
  ];
  const moveTask = (id, col) => {
    save(tasks.map(t=>{
      if(t.id!==id) return t;
      if(col==='done') return {...t,done:true,status:null,completedDate:toDateKey()};
      if(col==='progress') return {...t,done:false,status:'progress',completedDate:null};
      return {...t,done:false,status:null,completedDate:null};
    }));
    toast(col==='done'?'Task completed ✓':'Task moved','success',1500);
  };
  const addTask = () => { if(!input.trim()) return; save([...tasks,{id:Date.now(),text:input.trim(),done:false,created:new Date().toISOString()}]); setInput(''); };
  return (
    <div className="fade-in">
      <PageTitle>Kanban</PageTitle>
      <div style={{display:'flex',gap:10,marginBottom:20}}>
        <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Add a task..." onKeyDown={e=>e.key==='Enter'&&addTask()} style={{flex:1}}/>
        <button onClick={addTask} style={{padding:'9px 22px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13.5,fontWeight:500,cursor:'pointer'}}>Add</button>
      </div>
      <div style={{display:'flex',gap:14,minHeight:400}}>
        {cols.map(col=>{
          const items=tasks.filter(col.filter);
          return (
            <div key={col.key} style={{flex:1,background:col.color,borderRadius:14,padding:12,border:`0.5px solid ${C.border}`}}>
              <div style={{fontSize:12,fontWeight:600,color:C.text,marginBottom:10,textTransform:'uppercase',letterSpacing:0.5}}>{col.label} ({items.length})</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {items.map(t=>(
                  <div key={t.id} className="card-hover" style={{padding:'10px 12px',borderRadius:10,background:C.card,border:`0.5px solid ${C.border}`,cursor:'default'}}>
                    <div style={{fontSize:12.5,color:t.done?C.textMuted:C.text,textDecoration:t.done?'line-through':'none',marginBottom:6}}>{t.text}</div>
                    {t.tag&&<span style={{fontSize:10,padding:'2px 7px',borderRadius:8,background:TAG_COLORS[t.tag]?.light||'',color:TAG_COLORS[t.tag]?.bg||C.rose}}>{TAG_COLORS[t.tag]?.label||t.tag}</span>}
                    <div style={{display:'flex',gap:4,marginTop:6}}>
                      {col.key!=='todo'&&<button onClick={()=>moveTask(t.id,'todo')} style={{fontSize:10,padding:'2px 8px',borderRadius:6,background:`${C.pink}60`,border:'none',color:C.rose,cursor:'pointer'}}>← To Do</button>}
                      {col.key!=='progress'&&<button onClick={()=>moveTask(t.id,'progress')} style={{fontSize:10,padding:'2px 8px',borderRadius:6,background:`${C.accent}30`,border:'none',color:C.accent,cursor:'pointer'}}>⟳ Progress</button>}
                      {col.key!=='done'&&<button onClick={()=>moveTask(t.id,'done')} style={{fontSize:10,padding:'2px 8px',borderRadius:6,background:'#68c97a30',border:'none',color:'#3a8a4a',cursor:'pointer'}}>✓ Done</button>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ── Habit Tracker ─────────────────────────────────────────────────── */
const DEFAULT_HABITS = ['💧 Water','🏋️ Exercise','📖 Read','🧘 Meditate','📝 Journal'];
const HabitTracker = () => {
  const HK = 'nylaos_habits';
  const [habits, setHabits] = useState(()=>JSON.parse(localStorage.getItem(HK)||'null')||DEFAULT_HABITS.map((h,i)=>({id:i+1,name:h})));
  const [log, setLog] = useState(()=>JSON.parse(localStorage.getItem('nylaos_habit_log')||'{}'));
  const [newHabit, setNewHabit] = useState('');
  const saveHabits = h => { setHabits(h); localStorage.setItem(HK,JSON.stringify(h)); };
  const saveLog = l => { setLog(l); localStorage.setItem('nylaos_habit_log',JSON.stringify(l)); };
  const toggleDay = (habitId, dateKey) => {
    const k = `${habitId}_${dateKey}`;
    const nl = {...log};
    nl[k] = !nl[k];
    saveLog(nl);
    if(nl[k]) toast('Habit checked ✓','success',1200);
  };
  const addHabit = () => { if(!newHabit.trim()) return; saveHabits([...habits,{id:Date.now(),name:newHabit.trim()}]); setNewHabit(''); };
  const removeHabit = id => { saveHabits(habits.filter(h=>h.id!==id)); };
  const days = [];
  for(let i=27;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const getStreak = (habitId) => { let s=0; for(let i=0;i<28;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(log[`${habitId}_${toDateKey(d)}`]) s++; else break; } return s; };
  return (
    <div className="fade-in" style={{maxWidth:780}}>
      <PageTitle>Habits</PageTitle>
      <div style={{display:'flex',gap:10,marginBottom:20}}>
        <InlineInput value={newHabit} onChange={e=>setNewHabit(e.target.value)} placeholder="Add a habit..." onKeyDown={e=>e.key==='Enter'&&addHabit()} style={{flex:1}}/>
        <button onClick={addHabit} style={{padding:'9px 22px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13.5,fontWeight:500,cursor:'pointer'}}>Add</button>
      </div>
      <Card style={{padding:'16px 12px',overflowX:'auto'}}>
        <div style={{display:'grid',gridTemplateColumns:`140px repeat(28, 1fr)`,gap:2,alignItems:'center',minWidth:600}}>

          {days.map((d,i)=><div key={i} style={{fontSize:8,color:C.textMuted,textAlign:'center',transform:'rotate(-45deg)',transformOrigin:'center'}}>{d.getDate()}</div>)}
          {habits.map(h=>(
            React.createElement(React.Fragment,{key:h.id},
              React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,fontSize:12,color:C.text,paddingRight:8}},
                React.createElement('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}},h.name),

              ),

/* ── Bucket List ───────────────────────────────────────────────── */
const BUCKET_LEVELS = [
  {key:'free',label:'Free & Easy',emoji:'🌿',color:'#34a853',desc:'Costs nothing, do it this week'},
  {key:'money',label:'Costs Money',emoji:'💸',color:'#4285f4',desc:'Save up or treat yourself'},
  {key:'big',label:'Life-Changing',emoji:'🌍',color:'#9080d8',desc:'Big moves, major milestones'},
  {key:'absurd',label:'Absurd',emoji:'🦈',color:'#ea4335',desc:'Wildly ambitious, why not'},
];
const BucketList = () => {
  const BK='nylaos_bucket_list';
  const [items, setItems] = useState(()=>JSON.parse(localStorage.getItem(BK)||'[]'));
  const [input, setInput] = useState('');
  const [level, setLevel] = useState('free');
  const [filter, setFilter] = useState('all');
  const save = i => { setItems(i); localStorage.setItem(BK,JSON.stringify(i)); };
  const add = () => { if(!input.trim()) return; save([...items,{id:Date.now(),text:input.trim(),level,done:false,created:new Date().toISOString()}]); setInput(''); };
  const toggle = id => {
    const item=items.find(i=>i.id===id);
    const nowDone=!item?.done;
    save(items.map(i=>i.id===id?{...i,done:nowDone,completedDate:nowDone?new Date().toISOString():null}:i));
    if(nowDone) toast('Bucket list item checked off! 🎉','success');
  };
  const remove = id => save(items.filter(i=>i.id!==id));
  const filtered = filter==='all'?items:filter==='done'?items.filter(i=>i.done):items.filter(i=>i.level===filter&&!i.done);
  const doneCount = items.filter(i=>i.done).length;
  return (
    <div className="fade-in" style={{maxWidth:620}}>
      <PageTitle>Bucket List</PageTitle>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{fontSize:28,fontFamily:"'DM Serif Display',serif",color:C.rose}}>{doneCount}</div>
        <div><div style={{fontSize:11,color:C.textMuted}}>of {items.length} completed</div>
          <div style={{width:120,height:5,borderRadius:3,background:`${C.pink}60`,marginTop:3}}><div style={{width:`${items.length?doneCount/items.length*100:0}%`,height:'100%',borderRadius:3,background:C.rose,transition:'width 0.3s'}}/></div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Something you want to do before you die..." onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1}}/>
        <select value={level} onChange={e=>setLevel(e.target.value)} style={{padding:'8px 10px',borderRadius:10,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}>
          {BUCKET_LEVELS.map(l=><option key={l.key} value={l.key}>{l.emoji} {l.label}</option>)}
        </select>
        <button onClick={add} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Add</button>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        <button onClick={()=>setFilter('all')} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter==='all'?C.rose:C.border}`,background:filter==='all'?C.rose:'transparent',color:filter==='all'?'#fff':C.textMuted,cursor:'pointer'}}>All ({items.length})</button>
        {BUCKET_LEVELS.map(l=>{const c=items.filter(i=>i.level===l.key&&!i.done).length; return(
          <button key={l.key} onClick={()=>setFilter(l.key)} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter===l.key?l.color:C.border}`,background:filter===l.key?l.color+'20':'transparent',color:filter===l.key?l.color:C.textMuted,cursor:'pointer'}}>{l.emoji} {l.label} ({c})</button>
        );})}
        <button onClick={()=>setFilter('done')} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter==='done'?'#34a853':C.border}`,background:filter==='done'?'#34a85320':'transparent',color:filter==='done'?'#34a853':C.textMuted,cursor:'pointer'}}>✓ Done ({doneCount})</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {filtered.map(item=>{
          const lv=BUCKET_LEVELS.find(l=>l.key===item.level)||BUCKET_LEVELS[0];
          return (
            <Card key={item.id} className="card-hover" style={{padding:'12px 16px',borderLeft:`3px solid ${lv.color}`,opacity:item.done?0.6:1}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <button onClick={()=>toggle(item.id)} style={{width:22,height:22,borderRadius:6,border:`1.5px solid ${lv.color}`,background:item.done?lv.color:'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:12,color:'#fff',animation:item.done?'checkPop 0.3s ease':'none'}}>{item.done?'✓':''}</button>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,color:item.done?C.textMuted:C.text,textDecoration:item.done?'line-through':'none'}}>{item.text}</div>
                  <div style={{display:'flex',gap:6,marginTop:4}}>
                    <span style={{fontSize:10,padding:'2px 8px',borderRadius:8,background:lv.color+'18',color:lv.color}}>{lv.emoji} {lv.label}</span>
                    {item.done&&item.completedDate&&<span style={{fontSize:10,color:C.textMuted}}>✓ {new Date(item.completedDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>}
                  </div>
                </div>
                <button onClick={()=>remove(item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:16,opacity:0.5}}>×</button>
              </div>
            </Card>
          );
        })}
        {filtered.length===0&&<div style={{fontSize:13,color:C.textMuted,fontStyle:'italic',padding:20,textAlign:'center'}}>Nothing here yet. What do you want to do before you die?</div>}
      </div>
    </div>
  );
};

/* ── Event Planner ─────────────────────────────────────────────── */
const EventPlanner = () => {
  const EK='nylaos_events_planner';
  const [events, setEvents] = useState(()=>JSON.parse(localStorage.getItem(EK)||'[]'));
  const [activeId, setActiveId] = useState(null);

  const [newName, setNewName] = useState('');
  const [newType, setNewType] = useState('party');
  const save = e => { setEvents(e); localStorage.setItem(EK,JSON.stringify(e)); };
  const TYPES = [{key:'party',emoji:'🎉'},{key:'launch',emoji:'🚀'},{key:'trip',emoji:'✈️'},{key:'move',emoji:'📦'},{key:'meeting',emoji:'💼'},{key:'other',emoji:'📋'}];
  const SECTIONS = ['Timeline','Budget','Guest List','Supplies','Notes'];
  const addEvent = () => {
    if(!newName.trim()) return;
    const ev={id:Date.now(),name:newName.trim(),type:newType,date:'',sections:Object.fromEntries(SECTIONS.map(s=>[s,''])),created:new Date().toISOString()};
    save([ev,...events]); setActiveId(ev.id); setNewName(''); setShowNew(false); toast('Event created','success',1500);
  };
  const updateEvent = (id, field, val) => save(events.map(e=>e.id===id?{...e,[field]:val}:e));
  const updateSection = (id, section, val) => save(events.map(e=>e.id===id?{...e,sections:{...e.sections,[section]:val}}:e));
  const removeEvent = id => { save(events.filter(e=>e.id!==id)); if(activeId===id) setActiveId(null); };
  const active = events.find(e=>e.id===activeId);

  return (
    <div className="fade-in" style={{maxWidth:720}}>
      <PageTitle>Event Planner</PageTitle>
      <div style={{display:'flex',gap:16}}>
        {/* Event list */}
        <div style={{width:200,flexShrink:0}}>
          <button onClick={()=>setShowNew(true)} style={{width:'100%',padding:'8px 12px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:12.5,cursor:'pointer',marginBottom:10}}>+ New Event</button>
          {showNew&&(
            <Card style={{padding:'10px 12px',marginBottom:8}}>
              <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Event name..." onKeyDown={e=>e.key==='Enter'&&addEvent()}
                style={{width:'100%',padding:'6px 8px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit',marginBottom:6}}/>
              <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6}}>
                {TYPES.map(t=><button key={t.key} onClick={()=>setNewType(t.key)} style={{padding:'3px 8px',borderRadius:6,fontSize:11,border:`0.5px solid ${newType===t.key?C.rose:C.border}`,background:newType===t.key?`${C.rose}20`:'transparent',color:C.text,cursor:'pointer'}}>{t.emoji}</button>)}
              </div>
              <button onClick={addEvent} style={{padding:'5px 14px',borderRadius:6,background:C.rose,color:'#fff',border:'none',fontSize:11,cursor:'pointer'}}>Create</button>
            </Card>
          )}
          {events.map(ev=>(
            <button key={ev.id} onClick={()=>setActiveId(ev.id)} style={{width:'100%',padding:'8px 10px',borderRadius:8,textAlign:'left',marginBottom:4,
              background:activeId===ev.id?`${C.pink}80`:'transparent',border:`0.5px solid ${activeId===ev.id?C.border:'transparent'}`,color:C.text,fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
              <span>{TYPES.find(t=>t.key===ev.type)?.emoji||'📋'}</span><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.name}</span>
            </button>
          ))}
          {events.length===0&&!showNew&&<div style={{fontSize:11,color:C.textMuted,fontStyle:'italic',padding:8}}>No events planned yet</div>}
        </div>

        {/* Active event detail */}
        {active?(
          <div style={{flex:1}}>
            <Card style={{padding:'20px 24px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.rose}}>{TYPES.find(t=>t.key===active.type)?.emoji} {active.name}</div>
                <button onClick={()=>removeEvent(active.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>🗑</button>
              </div>
              <div style={{marginBottom:16}}>
                <span style={{fontSize:11,color:C.textMuted}}>Date: </span>
                <input type="date" value={active.date||''} onChange={e=>updateEvent(active.id,'date',e.target.value)}
                  style={{padding:'5px 10px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}/>
              </div>
              {SECTIONS.map(section=>(
                <div key={section} style={{marginBottom:14}}>
                  <div style={{fontSize:11,fontWeight:600,color:C.rose,textTransform:'uppercase',letterSpacing:0.5,marginBottom:4}}>{section}</div>
                  <textarea value={active.sections[section]||''} onChange={e=>updateSection(active.id,section,e.target.value)}
                    placeholder={section==='Budget'?'Total budget: $___\nVenue: $___\nFood: $___':section==='Guest List'?'Name — RSVP status\n':section==='Timeline'?'1 month before:\n2 weeks before:\n1 week before:\nDay of:':section==='Supplies'?'- \n- \n- ':'Notes, links, ideas...'}
                    style={{width:'100%',height:section==='Notes'?80:60,padding:'8px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit',resize:'vertical',lineHeight:1.6}}/>
                </div>
              ))}
            </Card>
          </div>
        ):(
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:C.textMuted,fontSize:13,fontStyle:'italic'}}>Select or create an event</div>
        )}
      </div>
    </div>
  );
};

/* ── Pros & Cons ───────────────────────────────────────────────── */
const ProsConsMaker = () => {
  const PK='nylaos_proscons';
  const [decisions, setDecisions] = useState(()=>JSON.parse(localStorage.getItem(PK)||'[]'));
  const [activeId, setActiveId] = useState(null);
  const [newQ, setNewQ] = useState('');
  const save = d => { setDecisions(d); localStorage.setItem(PK,JSON.stringify(d)); };
  const addDecision = () => { if(!newQ.trim()) return; const d={id:Date.now(),question:newQ.trim(),pros:[],cons:[],resolved:false,verdict:'',created:new Date().toISOString()}; save([d,...decisions]); setActiveId(d.id); setNewQ(''); };
  const addItem = (id, side) => { save(decisions.map(d=>d.id===id?{...d,[side]:[...d[side],{id:Date.now(),text:'',weight:1}]}:d)); };
  const updateItem = (decId, side, itemId, text) => { save(decisions.map(d=>d.id===decId?{...d,[side]:d[side].map(i=>i.id===itemId?{...i,text}:i)}:d)); };
  const removeItem = (decId, side, itemId) => { save(decisions.map(d=>d.id===decId?{...d,[side]:d[side].filter(i=>i.id!==itemId)}:d)); };
  const resolve = (id, verdict) => { save(decisions.map(d=>d.id===id?{...d,resolved:true,verdict}:d)); toast('Decision made ✓','success'); };
  const active = decisions.find(d=>d.id===activeId);

  return (
    <div className="fade-in" style={{maxWidth:700}}>
      <PageTitle>Pros & Cons</PageTitle>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <InlineInput value={newQ} onChange={e=>setNewQ(e.target.value)} placeholder="What are you deciding? e.g. 'Should I take this job?'" onKeyDown={e=>e.key==='Enter'&&addDecision()} style={{flex:1}}/>
        <button onClick={addDecision} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>New Decision</button>
      </div>

      {/* Past decisions */}
      {decisions.length>0&&!active&&(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {decisions.map(d=>(
            <Card key={d.id} className="card-hover" onClick={()=>setActiveId(d.id)} style={{padding:'12px 16px',cursor:'pointer',opacity:d.resolved?0.7:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:16}}>{d.resolved?'✅':'🤔'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,color:C.text,fontWeight:500}}>{d.question}</div>
                  <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>{d.pros.length} pros · {d.cons.length} cons{d.resolved?` · Verdict: ${d.verdict}`:''}</div>
                </div>
                <span style={{fontSize:10,color:C.textMuted}}>{new Date(d.created).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* Active decision */}
      {active&&(
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <button onClick={()=>setActiveId(null)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14}}>←</button>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.rose,flex:1}}>{active.question}</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
            {/* Pros */}
            <Card style={{padding:'16px 18px',borderTop:`3px solid #34a853`}}>
              <div style={{fontSize:13,fontWeight:600,color:'#34a853',marginBottom:10}}>Pros ({active.pros.length})</div>
              {active.pros.map(item=>(
                <div key={item.id} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                  <span style={{color:'#34a853',fontSize:12}}>+</span>
                  <input value={item.text} onChange={e=>updateItem(active.id,'pros',item.id,e.target.value)} placeholder="Why yes..."
                    style={{flex:1,padding:'5px 8px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
                  <button onClick={()=>removeItem(active.id,'pros',item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>×</button>
                </div>
              ))}
              <button onClick={()=>addItem(active.id,'pros')} style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:'#34a85315',border:'none',color:'#34a853',cursor:'pointer',marginTop:4}}>+ Add pro</button>
            </Card>
            {/* Cons */}
            <Card style={{padding:'16px 18px',borderTop:`3px solid #ea4335`}}>
              <div style={{fontSize:13,fontWeight:600,color:'#ea4335',marginBottom:10}}>Cons ({active.cons.length})</div>
              {active.cons.map(item=>(
                <div key={item.id} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                  <span style={{color:'#ea4335',fontSize:12}}>−</span>
                  <input value={item.text} onChange={e=>updateItem(active.id,'cons',item.id,e.target.value)} placeholder="Why not..."
                    style={{flex:1,padding:'5px 8px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
                  <button onClick={()=>removeItem(active.id,'cons',item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>×</button>
                </div>
              ))}
              <button onClick={()=>addItem(active.id,'cons')} style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:'#ea433515',border:'none',color:'#ea4335',cursor:'pointer',marginTop:4}}>+ Add con</button>
            </Card>
          </div>
          {!active.resolved&&(
            <div style={{display:'flex',gap:8,marginTop:16,justifyContent:'center'}}>
              <button onClick={()=>resolve(active.id,'Yes — do it')} style={{padding:'10px 24px',borderRadius:10,background:'#34a853',color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>✓ Yes, do it</button>
              <button onClick={()=>resolve(active.id,'No — pass')} style={{padding:'10px 24px',borderRadius:10,background:'#ea4335',color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>✕ No, pass</button>
              <button onClick={()=>resolve(active.id,'Need more info')} style={{padding:'10px 24px',borderRadius:10,background:C.accent,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>? Need more info</button>
            </div>
          )}
          {active.resolved&&(
            <Card style={{marginTop:16,padding:'14px 18px',background:`${C.lavender}40`,textAlign:'center'}}>
              <div style={{fontSize:12,color:C.textMuted,marginBottom:4}}>Decision Made</div>
              <div style={{fontSize:16,fontFamily:"'DM Serif Display',serif",color:C.rose}}>{active.verdict}</div>
            </Card>
          )}
        </div>
      )}
      {decisions.length===0&&<div style={{textAlign:'center',padding:32,color:C.textMuted,fontSize:13,fontStyle:'italic'}}>No decisions yet. What are you weighing?</div>}
    </div>
  );
};


/* ── Section Renamer (Name Everything) ─────────────────────────── */
const _getCustomNames = () => JSON.parse(localStorage.getItem('nylaos_custom_names')||'{}');
const _getName = (id) => _getCustomNames()[id] || null;

/* ── Eisenhower Matrix ──────────────────────────────────────────── */
const EisenhowerMatrix = ({ storageKey='nylaos_tasks' }) => {
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(storageKey)||'[]').filter(t=>!t.done&&t.source!=='calendar'));
  const [input, setInput] = useState('');
  const [addQ, setAddQ] = useState('ui');
  const save = t => { const all=JSON.parse(localStorage.getItem(storageKey)||'[]'); const other=all.filter(x=>x.done||x.source==='calendar'); setTasks(t); localStorage.setItem(storageKey,JSON.stringify([...t,...other])); };
  const setQuadrant = (id, q) => { save(tasks.map(t=>t.id===id?{...t,quadrant:q}:t)); };
  const addTask = () => { if(!input.trim()) return; save([...tasks,{id:Date.now(),text:input.trim(),done:false,quadrant:addQ,created:new Date().toISOString()}]); setInput(''); toast('Task added','success',1200); };
  const complete = id => { save(tasks.map(t=>t.id===id?{...t,done:true,completedDate:toDateKey()}:t)); toast('Done ✓','success',1200); };
  const quads = [
    { key:'ui', label:'Do First', sub:'Urgent & Important', color:'#ea4335', bg:'#ea433512', icon:'🔥' },
    { key:'ni', label:'Schedule', sub:'Not Urgent & Important', color:'#34a853', bg:'#34a85312', icon:'📅' },
    { key:'un', label:'Delegate', sub:'Urgent & Not Important', color:'#fbbc04', bg:'#fbbc0412', icon:'📤' },
    { key:'nn', label:'Eliminate', sub:'Not Urgent & Not Important', color:C.textMuted, bg:`${C.pink}20`, icon:'🗑' },
  ];
  return (
    <div className="fade-in">
      <PageTitle>Eisenhower Matrix</PageTitle>
      <div style={{display:'flex',gap:8,marginBottom:16,alignItems:'center'}}>
        <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Add task..." onKeyDown={e=>e.key==='Enter'&&addTask()} style={{flex:1}}/>
        <select value={addQ} onChange={e=>setAddQ(e.target.value)} style={{padding:'8px 10px',borderRadius:10,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}>
          {quads.map(q=><option key={q.key} value={q.key}>{q.icon} {q.label}</option>)}
        </select>
        <button onClick={addTask} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Add</button>

const VoiceNotes = () => {
  const [recording, setRecording] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [status, setStatus] = useState('');
  const recRef = useRef(null);
  const startRecording = () => {
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
      toast('Speech recognition not supported in this browser','error'); return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    let final = '';
    rec.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      setTranscript(final + interim);
    };
    rec.onerror = e => { setStatus('Error: '+e.error); setRecording(false); };
    rec.onend = () => { if(recording) rec.start(); };
    rec.start();
    recRef.current = rec;
    setRecording(true); setStatus('Listening...'); setTranscript('');
  };
  const stopRecording = () => {
    if(recRef.current){ recRef.current.onend=null; recRef.current.stop(); }
    setRecording(false); setStatus('');
  };
  const saveAsNote = () => {
    if(!transcript.trim()){ toast('Nothing to save','error'); return; }
    const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
    const name='Voice Note · '+new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    pages.push({id:Date.now(),name,folderId:1,content:`<p>${transcript.trim().replace(/\n/g,'</p><p>')}</p>`,created:new Date().toISOString(),updated:new Date().toISOString()});
    localStorage.setItem('nylaos_nb_pages',JSON.stringify(pages));
    toast('Saved to Notebook','success');
    setTranscript('');
  };
  return (
    <div className="fade-in" style={{maxWidth:560}}>
      <PageTitle>Voice Notes</PageTitle>
      <Card style={{textAlign:'center',padding:'30px 24px'}}>
        <button onClick={recording?stopRecording:startRecording} style={{
          width:80,height:80,borderRadius:'50%',border:'none',cursor:'pointer',
          background:recording?'#ea4335':C.rose,color:'#fff',fontSize:28,
          boxShadow:recording?'0 0 0 8px #ea433530':`0 4px 18px ${C.rose}50`,
          transition:'all 0.2s',animation:recording?'checkPop 1s ease infinite':'none',
          display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',
        }}>{recording?'⏹':'🎙'}</button>
        <div style={{fontSize:13,color:recording?'#ea4335':C.textMuted,fontWeight:500,marginBottom:16}}>
          {recording?'Recording... tap to stop':'Tap to start recording'}
        </div>
        {status&&<div style={{fontSize:11,color:C.textMuted,marginBottom:8}}>{status}</div>}
        {transcript&&(
          <>
            <div style={{textAlign:'left',padding:'14px 18px',borderRadius:12,background:C.pinkLight,border:`0.5px solid ${C.border}`,fontSize:13,color:C.text,lineHeight:1.7,marginBottom:14,minHeight:80,whiteSpace:'pre-wrap'}}>{transcript}</div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              <button onClick={saveAsNote} style={{padding:'9px 20px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Save to Notebook</button>
              <button onClick={()=>setTranscript('')} style={{padding:'9px 20px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:13,cursor:'pointer'}}>Clear</button>
            </div>
          </>
        )}
      </Card>
    </div>
  );
};

const TasksPanel = ({ sub, storageKey='nylaos_tasks' }) => {
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(storageKey)||'[]'));
  const [input, setInput] = useState('');
  const [expanded, setExpanded] = useState(null);
  const [editTaskId, setEditTaskId] = useState(null);
  const [editTaskText, setEditTaskText] = useState('');
  const [newTag, setNewTag] = useState('');
  const [recurMenu, setRecurMenu] = useState(null);
  const [recurText, setRecurText] = useState('');
  const [recurFreq, setRecurFreq] = useState('weekly');
  const goals = JSON.parse(localStorage.getItem('nylaos_goals')||'[]');

  const save = t => { setTasks(t); localStorage.setItem(storageKey,JSON.stringify(t)); };
  const add = () => {
    if(!input.trim()) return;
    save([...tasks,{id:Date.now(),text:input.trim(),done:false,tag:newTag||null,created:new Date().toISOString()}]);
    setInput(''); toast('Task added','success',1500);
  };
  const toggle = id => {
    const nowDone=!tasks.find(t=>t.id===id)?.done;
    save(tasks.map(t=>t.id===id?{...t,done:nowDone,completedDate:nowDone?toDateKey():null}:t));
    if(nowDone) toast('Task completed ✓','success',1500);
  };
  const remove = id => {
    const t = tasks.find(x=>x.id===id);
    if (t) addToTrash('task', t.text, t, storageKey);
    save(tasks.filter(t=>t.id!==id));
    if(expanded?.id===id) setExpanded(null);
  };
  const setTag = (id, tag) => { save(tasks.map(t=>t.id===id?{...t,tag}:t)); };
  const addRecurring = (text, freq, tag) => {
    const now = new Date();
    const newTasks = [];
    const count = freq==='daily'?14:freq==='weekly'?12:6;
    for(let i=0;i<count;i++){
      const d = new Date(now);
      if(freq==='daily') d.setDate(d.getDate()+i);
      else if(freq==='weekly') d.setDate(d.getDate()+i*7);
      else d.setMonth(d.getMonth()+i);
      newTasks.push({id:Date.now()+i,text,done:false,tag:tag||null,calendarDate:toDateKey(d),recurring:freq,created:new Date().toISOString()});
    }
    save([...tasks,...newTasks]);
    toast(`${count} recurring tasks created`,'success');
    setRecurMenu(null);
  };

  const assignDate = (id, date) => {
    if (date) {
      const evts = JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      const task = tasks.find(t=>t.id===id);
      const noOld = evts.filter(e=>e.taskId!==id);
      localStorage.setItem('nylaos_events', JSON.stringify([...noOld,{id:Date.now(),date,text:task.text,taskId:id}]));
    }
    save(tasks.map(t=>t.id===id?{...t,calendarDate:date||null}:t));
    setExpanded(null);
  };
  const assignGoal = (id, goalId) => {
    save(tasks.map(t=>t.id===id?{...t,goalId:goalId?parseInt(goalId):null}:t));
    setExpanded(null);
  };
  const startEditTask = t => { setEditTaskId(t.id); setEditTaskText(t.text); };
  const saveEditTask = () => {
    if (editTaskText.trim()) save(tasks.map(t=>t.id===editTaskId?{...t,text:editTaskText.trim()}:t));
    setEditTaskId(null);
  };

  if (sub==='Recently Deleted') return <TrashPanel type="task" />;
  if (sub==='Kanban') return <KanbanBoard storageKey={storageKey} />;
  if (sub==='Eisenhower') return <EisenhowerMatrix storageKey={storageKey} />;
  if (sub==='Bucket List') return <BucketList />;
  if (sub==='Habits') return <HabitTracker />;
  if (sub==='Bored Bucket') return <BoredBucket />;

  const isCompleted = sub==='Completed';
  const filtered = isCompleted ? tasks.filter(t=>t.done && t.source!=='calendar') : tasks.filter(t=>!t.done && t.source!=='calendar');

  const BtnStyle = (active) => ({
    width:28, height:28, borderRadius:7, border:`0.5px solid ${C.border}`,
    background: active ? C.rose : `${C.pink}60`,
    color: active ? '#fff' : C.rose,
    cursor:'pointer', fontSize:13, display:'flex', alignItems:'center', justifyContent:'center',
  });

  return (
    <div className="fade-in" style={{ maxWidth:620 }}>
      <PageTitle>{sub}</PageTitle>
      {!isCompleted && (<>
        <div style={{ display:'flex', gap:10, marginBottom:8 }}>
          <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Add a task — press Enter..."
            onKeyDown={e=>e.key==='Enter'&&add()} style={{ flex:1 }} />
          <button onClick={add} style={{ padding:'9px 22px', borderRadius:12, background:C.rose, color:'#fff', border:'none', fontSize:13.5, fontWeight:500, cursor:'pointer' }}>Add</button>
        </div>
        <div style={{ display:'flex', gap:6, marginBottom:16, flexWrap:'wrap', alignItems:'center' }}>
          <span style={{fontSize:11,color:C.textMuted}}>Tag:</span>
          <button onClick={()=>setNewTag('')} style={{fontSize:11,padding:'3px 9px',borderRadius:10,border:`0.5px solid ${!newTag?C.rose:C.border}`,background:!newTag?`${C.rose}20`:'transparent',color:!newTag?C.rose:C.textMuted,cursor:'pointer'}}>None</button>
          {Object.entries(TAG_COLORS).map(([k,v])=>(
            <button key={k} onClick={()=>setNewTag(k)} style={{fontSize:11,padding:'3px 9px',borderRadius:10,border:`0.5px solid ${newTag===k?v.bg:C.border}`,background:newTag===k?v.light:'transparent',color:newTag===k?v.bg:C.textMuted,cursor:'pointer'}}>{v.label}</button>
          ))}
          <span style={{color:C.border,margin:'0 4px'}}>|</span>
          <button onClick={()=>setRecurMenu(recurMenu?null:'open')} style={{fontSize:11,padding:'3px 9px',borderRadius:10,border:`0.5px solid ${C.border}`,background:recurMenu?`${C.accent}20`:'transparent',color:recurMenu?C.accent:C.textMuted,cursor:'pointer'}}>🔁 Recurring</button>
        </div>
        {recurMenu && (
          <Card style={{padding:'14px 16px',marginBottom:16}}>
            <div style={{fontSize:12,color:C.text,fontWeight:500,marginBottom:8}}>Create recurring task</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
              <input value={recurText} onChange={e=>setRecurText(e.target.value)} placeholder="Task name..."
                style={{flex:1,padding:'7px 12px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12.5,fontFamily:'inherit',minWidth:160}}/>
              <select value={recurFreq} onChange={e=>setRecurFreq(e.target.value)}
                style={{padding:'7px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}>
                <option value="daily">Daily (14 days)</option>
                <option value="weekly">Weekly (12 wks)</option>
                <option value="monthly">Monthly (6 mo)</option>
              </select>
              <button onClick={()=>{if(recurText.trim()){addRecurring(recurText.trim(),recurFreq,newTag);setRecurText('');}}}
                style={{padding:'7px 16px',borderRadius:8,background:C.accent,color:'#fff',border:'none',fontSize:12,cursor:'pointer'}}>Create</button>
            </div>
          </Card>
        )}
      </>)}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {filtered.map(t=>{

          const tagInfo = t.tag ? TAG_COLORS[t.tag] : null;
          return (
            <Card key={t.id} className="card-hover" style={{ padding:'12px 16px', borderLeft:tagInfo?`3px solid ${tagInfo.bg}`:'none' }}>
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <Checkbox checked={t.done} onChange={()=>toggle(t.id)} />
                <div style={{ flex:1 }}>
                  {editTaskId===t.id ? (
                    <input autoFocus value={editTaskText} onChange={e=>setEditTaskText(e.target.value)}
                      onKeyDown={e=>{ if(e.key==='Enter') saveEditTask(); if(e.key==='Escape') setEditTaskId(null); }}
                      onBlur={saveEditTask}
                      style={{ width:'100%', padding:'4px 8px', borderRadius:8, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13.5, fontFamily:'inherit' }}/>
                  ) : (
                    <div onClick={()=>!t.done&&startEditTask(t)} title={t.done?'':'Click to edit'}
                      style={{ fontSize:13.5, color:t.done?C.textMuted:C.text, textDecoration:t.done?'line-through':'none', cursor:t.done?'default':'text' }}>{t.text}</div>
