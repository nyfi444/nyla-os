/* Multi-action pipeline docs — used by agents whose chat shows a real preview/approval
   step before anything executes (the Live Agent Office), not the quick single-action chat. */
const AGENT_ACTION_DOCS = `

You can propose real actions in Nyla's dashboard. Nothing you propose executes until she clicks Approve — you are never executing directly, only proposing a plan.

When she asks you to create, schedule, or add something, respond conversationally, then end with ONE block containing an array of every action needed:
[CMDS:[{"action":"addTask","text":"..."},{"action":"addEvent","date":"YYYY-MM-DD","text":"..."}]]

Available actions and their fields:
- addTask: {text, date (optional: YYYY-MM-DD, or "today"; leave it out for an undated task)}
- addGoal: {title, category, periodType, periodValue, targetDate}
- addEvent: {date, text, time (optional, 24h HH:MM), location, reminder}
- addRecurringEvent: {text, startDate, frequency: daily|weekly|biweekly|monthly, endDate OR count, location, reminder, endTime}
- addNote: {name, folder, content}
- addIdea: {title, content, category}

Rules:
- If she mentions a recurring commitment (e.g. "class Monday Wednesday Friday at 10am"), use addRecurringEvent and ask conversationally (in your text, not the command) for whatever required info is missing — course name, end time, start date, end date, location, reminder — rather than guessing. You can still include the command with the fields you do have; the dashboard will prompt her for anything missing before she can approve.
- Only include fields you actually know; never invent a date or detail that wasn't given.
- Always include every action from a multi-part request in the SAME [CMDS:...] block so she reviews them together.`;

const execAgentCmd = text => {
  const match = text.match(/\[CMD:(\{[\s\S]*?\})\]/);
  if (!match) return;
  try {
    const cmd = JSON.parse(match[1]);
    if (cmd.action==='addTask') {
      const t=JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
      t.push({id:Date.now(),text:cmd.text,done:false,created:new Date().toISOString()});
      localStorage.setItem('nylaos_tasks',JSON.stringify(t));
    } else if (cmd.action==='completeTask') {
      const t=JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
      const q=(cmd.text||'').toLowerCase();
      localStorage.setItem('nylaos_tasks',JSON.stringify(t.map(x=>x.text.toLowerCase().includes(q)?{...x,done:true}:x)));
    } else if (cmd.action==='addGoal') {
      const now=new Date();
      const g=JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
      const pt=cmd.periodType||'monthly';
      const pv=cmd.periodValue||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      g.push({id:Date.now(),title:cmd.title,description:cmd.description||'',targetDate:cmd.targetDate||'',category:cmd.category||'',progress:0,periodType:pt,periodValue:pv,created:now.toISOString()});
      localStorage.setItem('nylaos_goals',JSON.stringify(g));
    } else if (cmd.action==='updateGoalProgress') {
      const g=JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
      const q=(cmd.title||'').toLowerCase();
      localStorage.setItem('nylaos_goals',JSON.stringify(g.map(x=>x.title.toLowerCase().includes(q)?{...x,progress:Math.min(100,Math.max(0,parseInt(cmd.progress)||0))}:x)));
    } else if (cmd.action==='addEvent') {
      const e=JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      e.push({id:Date.now(),date:cmd.date,text:cmd.text});
      localStorage.setItem('nylaos_events',JSON.stringify(e));
    } else if (cmd.action==='addRecurringEvent') {
      const e=JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      const freq=cmd.frequency||'weekly';
      const defaultCounts={daily:14,weekly:26,biweekly:13,monthly:12};
      const count=Math.min(Math.max(1,parseInt(cmd.count)||defaultCounts[freq]||12),100);
      const groupId=Date.now();
      const start=new Date(cmd.startDate);
      if(isNaN(start.getTime())) throw new Error('Invalid startDate');
      for(let i=0;i<count;i++){
        const d=new Date(start);
        if(freq==='daily')      d.setDate(d.getDate()+i);
        else if(freq==='weekly') d.setDate(d.getDate()+i*7);
        else if(freq==='biweekly') d.setDate(d.getDate()+i*14);
        else if(freq==='monthly')  d.setMonth(d.getMonth()+i);
        const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        e.push({id:groupId+i,date:dateStr,text:cmd.text,recurringGroupId:groupId});
      }
      localStorage.setItem('nylaos_events',JSON.stringify(e));
    } else if (cmd.action==='addNote') {
      const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
      const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
      const folder=folders.find(f=>f.name===(cmd.folder||'All Notes'));
      pages.push({id:Date.now(),name:cmd.name||'New Note',folderId:folder?folder.id:1,content:cmd.content||'',created:new Date().toISOString(),updated:new Date().toISOString()});
      localStorage.setItem('nylaos_nb_pages',JSON.stringify(pages));
    } else if (cmd.action==='createNotebook') {
      const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
      folders.push({id:Date.now(),name:cmd.name||'New Notebook',created:new Date().toISOString()});
      localStorage.setItem('nylaos_nb_folders',JSON.stringify(folders));
    }
  } catch(e) { console.error('Agent CMD error',e); }
};

/* ── Floating AI Chat ───────────────────────────────────────────── */
const FLOAT_SYSTEM = `You are Nyla's personal dashboard assistant — warm, wise, and efficient. You help manage her tasks, goals, calendar, and notes. Always be warm and concise.${AGENT_CMD_DOCS}`;

const FloatingChat = () => {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{role:'assistant',text:'Hi Nyla ✦ I\'m here to help — ask me anything or say "add task..." to update your dashboard directly.'}]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const sessionId = useRef(null);
  const endRef = useRef(null);
  useEffect(()=>{ if(open||fullscreen) endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading,open,fullscreen]);
  useEffect(()=>{ window._openFloatingChat=()=>setOpen(true); return ()=>{ delete window._openFloatingChat; }; },[]);

  const att = useAttachments();
  const send = async () => {
    if ((!input.trim()&&!att.items.length)||loading) return;
    if(!sessionId.current) sessionId.current=Date.now();
    const ids = att.take();
    const history=[...msgs,{role:'user',text:input.trim(),photos:ids.length?ids:undefined}];
    setMsgs(history); setInput(''); setLoading(true);
    try {
      const reply = await callClaude({ system: FLOAT_SYSTEM+buildAgentContext(null), messages: await messagesWithPhotos(history), maxTokens:8000, effort:'low' });
      const updated=[...history,{role:'assistant',text:reply}];
      setMsgs(updated);
      execAgentCmd(reply);
      saveChatSession(sessionId.current,'Quick Chat','float',updated);
    } catch(e) {
      setMsgs(m=>[...m,{role:'assistant',text:`⚠️ ${e.message}`}]);
    } finally { setLoading(false); }
  };

  const renderMsgs = () => (<>
    {msgs.map((m,i)=><Bubble key={i} m={m}>{m.role==='assistant'?<RichReply text={m.text.replace(/\[CMD:\{[\s\S]*?\}\]/,'').trim()}/>:null}</Bubble>)}
    {loading && <TypingDots/>}
    <div ref={endRef}/>
  </>);

  const renderInput = () => (
    <ChatComposer value={input} onChange={setInput} onSend={send} loading={loading} att={att} placeholder="Ask anything or give a command…"/>
  );

  if (fullscreen) return (
    <div style={{ position:'fixed', inset:0, zIndex:9999, background:C.cream, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 16px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', gap:9, background:C.sidebarBg, flexShrink:0 }}>
        <div style={{ width:30,height:30,borderRadius:9,background:C.gradA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontFamily:"'DM Serif Display',serif",fontWeight:600,color:C.rose }}>N</div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12.5, fontWeight:500, color:C.rose }}>Nyla AI</div>
          <div style={{ fontSize:10.5, color:C.textMuted }}>Dashboard assistant</div>
        </div>
        <button onClick={()=>setFullscreen(false)} style={{ background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:20,lineHeight:1 }}>✕</button>
      </div>
      <div style={{ flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8 }}>{renderMsgs()}</div>
      {renderInput()}
    </div>
  );

  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:1000, display:'flex', flexDirection:'column', alignItems:'flex-end' }}>
      {open && (
        <div style={{ width:'min(380px, calc(100vw - 32px))', height:'min(540px, calc(100vh - 120px))', background:C.cream, borderRadius:20, boxShadow:`0 12px 40px ${C.pink}70,0 2px 12px rgba(0,0,0,0.08)`, border:`0.5px solid ${C.border}`, display:'flex', flexDirection:'column', marginBottom:12, overflow:'hidden' }}>
          <div style={{ padding:'12px 16px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', gap:9, background:C.sidebarBg, flexShrink:0 }}>
            <div style={{ width:30,height:30,borderRadius:9,background:C.gradA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontFamily:"'DM Serif Display',serif",fontWeight:600,color:C.rose }}>N</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:12.5, fontWeight:500, color:C.rose }}>Nyla AI</div>
              <div style={{ fontSize:10.5, color:C.textMuted }}>Dashboard assistant</div>
            </div>
            <button onClick={()=>setFullscreen(true)} title="Fullscreen" style={{ background:'none',border:`0.5px solid ${C.border}`,borderRadius:6,color:C.textMuted,cursor:'pointer',fontSize:13,padding:'2px 7px',lineHeight:1,marginRight:4 }}>⤢</button>
            <button onClick={()=>setOpen(false)} style={{ background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:20,lineHeight:1 }}>×</button>
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8 }}>{renderMsgs()}</div>
          {renderInput()}
        </div>
      )}
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:54, height:54, borderRadius:'50%', background:open?C.roseDark:C.rose,
        border:`2px solid ${C.roseDark}`, color:'#fff', fontSize:22, cursor:'pointer',
        boxShadow:`0 4px 20px ${C.rose}90`, display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.2s',
      }}>{open?'×':'✦'}</button>
    </div>
  );
};

/* ── Mobile navigation ─────────────────────────────────────────────── */
const PRIMARY_NAV = ['home','calendar','tasks','lists'];
const MobileMoreMenu = ({ activeNav, onNavSelect, onClose }) => {
  const extras = NAV.filter(n => !PRIMARY_NAV.includes(n.id));
  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(30,12,24,0.35)', backdropFilter:'blur(3px)' }} onClick={onClose}>
      <div className="sheet-up" style={{ position:'absolute', bottom:0, left:0, right:0, background:C.cream, borderRadius:'26px 26px 0 0', padding:'12px 16px calc(84px + env(safe-area-inset-bottom,0px))', boxShadow:'0 -10px 40px rgba(0,0,0,0.18)' }}
        onClick={e=>e.stopPropagation()}>
        <div style={{ width:40, height:4, borderRadius:2, background:C.border, margin:'0 auto 16px' }} />
        <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10 }}>
          {extras.map(item => {
            const active = activeNav===item.id;
            return (
              <button key={item.id} onClick={()=>{ onNavSelect(item.id); onClose(); }} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:7,
                background: active ? (_dk ? `${C.rose}33` : `linear-gradient(145deg, ${C.pink}, ${C.lavLight})`) : C.card, border:`0.5px solid ${active ? C.rose+'60' : C.border}`, borderRadius:18, padding:'14px 6px', cursor:'pointer' }}>
                <Ico d={icons[item.id]} size={22} active={active} />
                <span style={{ fontSize:10.5, color: active ? C.rose : C.textLight, fontWeight: active?600:400, textAlign:'center', lineHeight:1.2 }}>{item.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
};

const MobileBottomNav = ({ activeNav, onNavSelect }) => {
  const [showMore, setShowMore] = useState(false);
  const isInMore = !PRIMARY_NAV.includes(activeNav);
  const btn = (key, label, icon, active, onClick) => (
    <button key={key} onClick={onClick} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3, background:'none', border:'none', cursor:'pointer', padding:'6px 4px', flex:1, position:'relative' }}>
      <span style={{ width:44, height:28, borderRadius:14, display:'grid', placeItems:'center', background: active?(_dk?`${C.rose}33`:C.pink):'transparent', transition:'background .18s' }}><Ico d={icons[icon]} size={20} active={active} /></span>
      <span style={{ fontSize:10, color: active ? C.rose : C.textMuted, fontWeight: active?600:400 }}>{label}</span>
    </button>
  );
  const activeMoreItem = isInMore ? NAV.find(n=>n.id===activeNav) : null;
  return (
    <>
      {showMore && <MobileMoreMenu activeNav={activeNav} onNavSelect={onNavSelect} onClose={()=>setShowMore(false)} />}
      <div style={{ background: _dk?'rgba(35,24,32,.94)':'rgba(250,243,247,.94)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)', borderTop:`0.5px solid ${C.border}`,
        display:'flex', alignItems:'center', flexShrink:0, zIndex:210, padding:'4px 6px calc(4px + env(safe-area-inset-bottom,0px))' }}>
        {PRIMARY_NAV.map(id => btn(id, NAV.find(n=>n.id===id)?.label, id, activeNav===id && !showMore, ()=>{ onNavSelect(id); setShowMore(false); }))}
        {btn('more', activeMoreItem ? activeMoreItem.label : 'More', activeMoreItem?.id||'settings', showMore||isInMore, ()=>setShowMore(s=>!s))}
      </div>
    </>
  );
};

const MobileSubTabs = ({ navItem, activeSub, onSubSelect }) => {
  if (!navItem || !navItem.sub || navItem.sub.length <= 1) return null;
  return (
    <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:10, marginBottom:6, scrollbarWidth:'none', WebkitOverflowScrolling:'touch' }}>
      {navItem.sub.map(s => {
        const badge = navBadge(navItem.id, s);
        return (
          <button key={s} onClick={()=>onSubSelect(s)} style={{ padding:'7px 14px', borderRadius:20, border:`0.5px solid ${activeSub===s ? C.rose : C.border}`, flexShrink:0,
            background: activeSub===s ? `linear-gradient(135deg, ${C.rose}, ${C.roseDark})` : C.card, color: activeSub===s ? '#fff' : C.text,
            fontSize:12.5, fontWeight: activeSub===s ? 600 : 400, cursor:'pointer', whiteSpace:'nowrap' }}>{s==='Recently Deleted'?'🗑':s}{badge?` · ${badge.n}`:''}</button>
        );
      })}
    </div>
  );
};

/* ── Quick add ──────────────────────────────────────────────────────
   Desktop: "+ New" in the top bar. Phone: a floating button above the tab
   bar. Task, event, note, idea, shopping item, or a quick question to AI. */
const QuickAdd = ({ variant='bar' }) => {
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState(null);
  const [val, setVal] = useState('');
  const [today, setToday] = useState(true);
  const [date, setDate] = useState(toDateKey());
  const [time, setTime] = useState('');
  const [aiReply, setAiReply] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const ref = useRef(null);
  useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) close(); };
    const k=e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('mousedown',h); document.addEventListener('keydown',k);
    return ()=>{ document.removeEventListener('mousedown',h); document.removeEventListener('keydown',k); };
  },[open]);
  const close = () => { setOpen(false); setMode(null); setVal(''); setAiReply(''); setTime(''); };
  const L = k => JSON.parse(localStorage.getItem(k)||'[]');
  const submit = async () => {
    const text = val.trim(); if (!text) return;
    if (mode==='task') { localStorage.setItem('nylaos_tasks', JSON.stringify([...L('nylaos_tasks'), { id:Date.now(), text, done:false, calendarDate: today?toDateKey():null, created:new Date().toISOString() }])); toast(today?'Added to today ☀':'Task added','success',1400); }
    else if (mode==='event') { localStorage.setItem('nylaos_events', JSON.stringify([...L('nylaos_events'), { id:Date.now(), date, text, time:time||null, color:'rose' }])); toast(`Added to ${prettyDue(date)?.label||date}`,'success',1400); }
    else if (mode==='note') { const p = L('nylaos_nb_pages'); const id = Date.now(); p.push({ id, name:text, folderId:1, content:'<p><br></p>', created:new Date().toISOString(), updated:new Date().toISOString() }); localStorage.setItem('nylaos_nb_pages', JSON.stringify(p)); localStorage.setItem('nylaos_nb_open_request', String(id)); toast('Note created — opening it','success',1400); close(); window._navigateTo && window._navigateTo('notebook'); return; }
    else if (mode==='idea') { localStorage.setItem('nylaos_ideas', JSON.stringify([{ id:Date.now(), title:text, content:'', category:'personal', created:new Date().toISOString() }, ...L('nylaos_ideas')])); toast('Idea saved 💡','success',1400); }
    else if (mode==='shop') { localStorage.setItem('nylaos_shopping_list', JSON.stringify([...L('nylaos_shopping_list'), { id:Date.now(), text, done:false, created:new Date().toISOString() }])); toast('Added to shopping list','success',1400); }
    else if (mode==='ai') {
      setAiLoading(true);
      try { setAiReply(await callClaude({ system:"You are Nyla's quick AI assistant. Be concise and helpful — a few sentences at most.", messages:[{role:'user',content:text}], maxTokens:4000, effort:'low' })); }
      catch(e) { setAiReply(`⚠️ ${e.message}`); }
      setAiLoading(false); setVal(''); return;
    }
    setVal('');
    if (mode!=='task' && mode!=='shop') close();
  };
  const actions = [
    { key:'task',  icon:'✓',  label:'Task',          hint:'For today or anytime' },
    { key:'event', icon:'📅', label:'Event',         hint:'On your calendar' },
    { key:'note',  icon:'📝', label:'Note',          hint:'Opens in Notebook' },
    { key:'idea',  icon:'💡', label:'Idea',          hint:'To your Idea Bank' },
    { key:'shop',  icon:'🛒', label:'Shopping item', hint:'Shopping List' },
    { key:'ai',    icon:'✦',  label:'Ask AI',        hint:'Quick question' },
  ];
  const isFab = variant==='fab';
  const panel = open && (
    <div className="fade-in" style={{ position:'absolute', ...(isFab ? { bottom:62, right:0 } : { top:44, right:0 }), width: mode==='ai'?340:290, background:C.cream, border:`0.5px solid ${C.border}`, borderRadius:18, boxShadow:'0 18px 50px rgba(0,0,0,.18)', padding:8, zIndex:400 }}>
      {!mode ? actions.map(a=>(
        <button key={a.key} onClick={()=>setMode(a.key)} style={{ width:'100%', display:'flex', alignItems:'center', gap:11, padding:'9px 10px', borderRadius:12, border:'none', background:'transparent', cursor:'pointer', textAlign:'left' }}
          onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <span style={{ width:32, height:32, borderRadius:10, display:'grid', placeItems:'center', background:C.card, border:`0.5px solid ${C.border}`, fontSize:14, color:C.rose }}>{a.icon}</span>
          <span><span style={{ display:'block', fontSize:13, color:C.text, fontWeight:500 }}>{a.label}</span><span style={{ fontSize:11, color:C.textMuted }}>{a.hint}</span></span>
        </button>
      )) : (
        <div style={{ padding:6 }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
            <button onClick={()=>{ setMode(null); setAiReply(''); }} style={{ fontSize:12, color:C.textMuted, background:'none', border:'none', cursor:'pointer', padding:0 }}>‹ Back</button>
            <span style={{ fontSize:11, color:C.textMuted, textTransform:'uppercase', letterSpacing:.7 }}>{actions.find(a=>a.key===mode)?.label}</span>
          </div>
          {aiReply && <div style={{ padding:'9px 11px', borderRadius:12, background:C.card, border:`0.5px solid ${C.border}`, fontSize:12.5, lineHeight:1.6, marginBottom:8, maxHeight:240, overflowY:'auto' }}><RichReply text={aiReply}/></div>}
          {aiLoading && <div style={{ marginBottom:8 }}><TypingDots/></div>}
          <div style={{ display:'flex', gap:6 }}>
            <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}
              placeholder={mode==='task'?'What needs doing?':mode==='event'?'What’s happening?':mode==='note'?'Note title':mode==='idea'?'Your idea':mode==='shop'?'What do you need?':'Ask anything'}
              style={{ flex:1, minWidth:0, padding:'9px 12px', borderRadius:12, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:13, fontFamily:'inherit' }}/>
            <VoiceButton size={36} onText={t=>setVal(v=>(v?v+' ':'')+t)}/>
          </div>
          {mode==='task' && <label style={{ display:'flex', alignItems:'center', gap:7, fontSize:12, color:C.textLight, marginTop:8, cursor:'pointer' }}><input type="checkbox" checked={today} onChange={e=>setToday(e.target.checked)} style={{ accentColor:C.rose }}/> Put it on today</label>}
          {mode==='event' && <div style={{ display:'flex', gap:6, marginTop:8 }}><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{ flex:1, padding:'7px 8px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12 }}/><input type="time" value={time} onChange={e=>setTime(e.target.value)} style={{ width:100, padding:'7px 8px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12 }}/></div>}
          <button onClick={submit} disabled={aiLoading||!val.trim()} style={{ width:'100%', marginTop:10, padding:'9px', borderRadius:12, border:'none', background: val.trim()?`linear-gradient(135deg, ${C.rose}, ${C.roseDark})`:`${C.rose}50`, color:'#fff', fontSize:13, cursor:'pointer' }}>{mode==='ai'?'Ask':'Add'}</button>
          {(mode==='task'||mode==='shop') && <div style={{ fontSize:10.5, color:C.textMuted, textAlign:'center', marginTop:6 }}>Stays open so you can add several</div>}
        </div>
      )}
    </div>
  );
  if (isFab) return (
    <div ref={ref} style={{ position:'fixed', right:16, bottom:'calc(78px + env(safe-area-inset-bottom,0px))', zIndex:220 }}>
      {panel}
      <button onClick={()=>open?close():setOpen(true)} aria-label="Quick add" style={{ width:54, height:54, borderRadius:'50%', border:'none', background:`linear-gradient(135deg, ${C.rose}, ${C.accent})`, color:'#fff', fontSize:26, cursor:'pointer',
        boxShadow:`0 10px 26px ${C.rose}66`, transition:'transform .2s', transform: open?'rotate(45deg)':'none' }}>+</button>
    </div>
  );
  return (
    <div ref={ref} style={{ position:'relative' }}>
      <button onClick={()=>open?close():setOpen(true)} style={{ height:36, padding:'0 14px', borderRadius:12, border:'none', background:`linear-gradient(135deg, ${C.rose}, ${C.roseDark})`, color:'#fff', fontSize:13, fontWeight:500, cursor:'pointer', boxShadow:`0 6px 16px ${C.rose}40` }}>+ New</button>
      {panel}
    </div>
  );
};

/* ── App ────────────────────────────────────────────────────────── */
const App = () => {
  const isMobile = useIsMobile();
  // Reopen where you left off (kept on this device only — not a synced key).
  const _last = (()=>{ try { const v = JSON.parse(localStorage.getItem('nyla_last_view')||'null'); const item = v && NAV.find(n=>n.id===v.nav); return item ? { nav:v.nav, sub: item.sub.includes(v.sub) ? v.sub : item.sub[0] } : null; } catch(e) { return null; } })();
  const [activeNav, setActiveNav] = useState(_last?.nav || 'home');
  const [activeSub, setActiveSub] = useState(_last?.sub || 'Overview');
  useEffect(()=>{ try { localStorage.setItem('nyla_last_view', JSON.stringify({ nav:activeNav, sub:activeSub })); } catch(e) {} },[activeNav, activeSub]);
  const [secCollapsed, setSecCollapsed] = useState(() => window.innerWidth < 700);

  // Auto-collapse secondary sidebar when switching to mobile
  useEffect(() => { if (isMobile) setSecCollapsed(true); }, [isMobile]);

  // Global cross-section navigation bridge (e.g. "Open Notebook Page" from an Idea Bank card)
  useEffect(() => {
    window._navigateTo = (nav, sub) => {
      const item = NAV.find(n=>n.id===nav);
      if (!item) return; // e.g. an old link to the removed Business section
      setActiveNav(nav); setActiveSub(sub && item.sub.includes(sub) ? sub : (item.sub[0]||''));
    };
    return () => { delete window._navigateTo; };
  }, []);

  const navItem = NAV.find(n=>n.id===activeNav);

  const handleNavSelect = id => {
    setActiveNav(id);
    setActiveSub(NAV.find(n=>n.id===id)?.sub[0]||'');
  };

  const isNotebook = activeNav === 'notebook';
  const isFullWidth = activeNav === 'notebook' || activeNav === 'ideas';
  const mainPadding = isNotebook ? '0' : isMobile ? 'calc(16px * var(--nyla-space,1)) calc(14px * var(--nyla-space,1)) calc(20px * var(--nyla-space,1))' : 'calc(28px * var(--nyla-space,1)) calc(32px * var(--nyla-space,1))';

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', background:(()=>{
      const WALLPAPERS = {gradient1:'linear-gradient(135deg,#fce4ec,#f3e5f5,#e8eaf6)',gradient2:'linear-gradient(135deg,#e0f2f1,#e1f5fe,#ede7f6)',gradient3:'linear-gradient(135deg,#fce4ec,#fff3e0,#fce4ec)',gradient4:'linear-gradient(135deg,#1a0a2e,#2d1450,#120820)',gradient5:'linear-gradient(135deg,#1b3a2d,#0d2818,#2a4a3a)',customGradient:_ap.customGradientCss};
      if(_ap.wallpaperUrl) return `url(${_ap.wallpaperUrl}) center/cover fixed`;
      if(_ap.wallpaper&&WALLPAPERS[_ap.wallpaper]) return WALLPAPERS[_ap.wallpaper];
      return C.cream;
    })() }}>
      <TopBar activeNav={activeNav} activeSub={activeSub} />
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        {!isMobile && (
          <LeftSidebar activeNav={activeNav} onNavSelect={handleNavSelect}
            secCollapsed={secCollapsed} onToggleSec={()=>setSecCollapsed(c=>!c)} />
        )}
        {!isMobile && !isFullWidth && (
          <SecondarySidebar navItem={navItem} activeSub={activeSub} onSubSelect={setActiveSub}
            collapsed={secCollapsed} />
        )}
        <main key={activeNav} style={{ flex:1, overflowY:'auto', padding: mainPadding, background:C.cream,
          overflow: isNotebook ? 'hidden' : 'auto', paddingBottom: isMobile && !isNotebook ? 96 : undefined }}>
          {isMobile && !isNotebook && (
            <MobileSubTabs navItem={navItem} activeSub={activeSub} onSubSelect={setActiveSub} />
          )}
          <MainContent navId={activeNav} sub={activeSub} />
        </main>
      </div>
      {isMobile && <MobileBottomNav activeNav={activeNav} onNavSelect={handleNavSelect} />}
      {isMobile && <QuickAdd variant="fab" />}
      <ToastContainer />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="pwa.js"></script>
</body>
</html>
