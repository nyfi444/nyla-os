const GoalsPanel = ({ sub }) => {
  const KEY = 'nylaos_goals';
  const now = new Date();
  const isMobile = useIsMobile();
  const [goals, setGoalsState] = useState(()=>JSON.parse(localStorage.getItem(KEY)||'[]'));
  const [tasks, setTasksState] = useState(()=>JSON.parse(localStorage.getItem('nylaos_tasks')||'[]'));
  const [editing, setEditing] = useState(null);
  const [selYear, setSelYear] = useState(now.getFullYear());
  const [selQ, setSelQ] = useState(Math.floor(now.getMonth()/3)+1);
  const [selMonth, setSelMonth] = useState(now.getMonth());
  const [stepFor, setStepFor] = useState(null);
  const [stepText, setStepText] = useState('');
  const [msFor, setMsFor] = useState(null);
  const [msText, setMsText] = useState('');
  const [showDone, setShowDone] = useState(false);

  const sync = (list, t) => list.map(x=>({ ...x, manualProgress: goalIsManual(x), progress: goalProgress(x, t) }));
  const saveGoals = g => { const synced = sync(g, tasks); setGoalsState(synced); localStorage.setItem(KEY, JSON.stringify(synced)); };
  const saveTasks = t => { setTasksState(t); localStorage.setItem('nylaos_tasks', JSON.stringify(t));
    const synced = sync(goals, t); setGoalsState(synced); localStorage.setItem(KEY, JSON.stringify(synced)); };
  // Bring stored progress up to date with tasks checked off elsewhere.
  useEffect(()=>{ if (goals.some(g=>goalProgress(g,tasks)!==(g.progress||0) || g.manualProgress===undefined)) saveGoals(goals); },[]);

  if (sub==='Recently Deleted') return <TrashPanel type="goal" />;
  if (sub==='Dream Life') return <DreamLifeBlueprint />;

  const upsert = data => {
    if (data.id) saveGoals(goals.map(g=>g.id===data.id?{...g,...data}:g));
    else saveGoals([...goals, { ...data, id:Date.now(), created:new Date().toISOString() }]);
    setEditing(null); toast(data.id?'Goal updated':'Goal created 🎯','success',1300);
  };
  const remove = g => { addToTrash('goal', g.title, g, KEY); saveGoals(goals.filter(x=>x.id!==g.id)); setEditing(null); toast('Moved to Recently Deleted','info',1400); };
  const toggleMs = (g, id) => saveGoals(goals.map(x=>x.id===g.id?{ ...x, milestones:x.milestones.map(m=>m.id===id?{...m,done:!m.done}:m) }:x));
  const addMs = g => { if(!msText.trim()) return; saveGoals(goals.map(x=>x.id===g.id?{ ...x, milestones:[...(x.milestones||[]), { id:Date.now(), text:msText.trim(), done:false }] }:x)); setMsText(''); };
  const addStep = (g, today) => { if(!stepText.trim()) return; saveTasks([...tasks, { id:Date.now(), text:stepText.trim(), done:false, goalId:g.id, calendarDate: today?toDateKey():null, created:new Date().toISOString() }]); setStepText(''); toast(today?'Next step added to today ☀':'Next step added to Tasks','success',1400); };

  // Called as a function (not <GoalCard/>) so its inputs keep focus while typing.
  const goalCard = (g) => {
    const pct = goalProgress(g, tasks);
    const ink = GOAL_CAT_INK[g.category] || C.rose;
    const linked = tasks.filter(t=>t.goalId===g.id);
    const openSteps = linked.filter(t=>!t.done);
    const days = g.targetDate ? dayDiff(toDateKey(), g.targetDate) : null;
    return (
      <Card key={g.id} style={{ padding:0, overflow:'hidden', display:'flex', flexDirection:'column' }}>
        <div style={{ height:4, background:`linear-gradient(90deg, ${ink}, ${ink}55)` }}/>
        <div style={{ padding:'16px 18px 12px', display:'flex', gap:14, alignItems:'flex-start' }}>
          <ProgressRing pct={pct} color={ink}/>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:4 }}>
              {g.category && <span style={{ fontSize:10.5, padding:'2px 8px', borderRadius:10, background:`${ink}18`, color:ink, fontWeight:600 }}>{GOAL_CAT_EMOJI[g.category]} {g.category}</span>}
              <span style={{ fontSize:10.5, padding:'2px 8px', borderRadius:10, background:`${C.lavender}70`, color:C.textLight }}>{goalPeriodLabel(g)}</span>
              {g.venture && <span style={{ fontSize:10.5, padding:'2px 8px', borderRadius:10, background:`${C.accent}18`, color:C.textLight }}>💼 {g.venture}</span>}
            </div>
            <div style={{ fontSize:15.5, fontWeight:600, color:C.text, lineHeight:1.35 }}>{g.title}</div>
            {g.description && <div style={{ fontSize:12.5, color:C.textLight, lineHeight:1.55, marginTop:3 }}>{g.description}</div>}
            {days!==null && pct<100 && <div style={{ fontSize:11.5, marginTop:5, color: days<0?'#d05a5a':days<=14?'#c4904a':C.textMuted }}>{days<0?`${Math.abs(days)} days past target`:days===0?'Due today':`${days} days left`}</div>}
          </div>
          <button onClick={()=>setEditing(g)} title="Edit goal" style={{ width:30, height:30, borderRadius:10, border:`0.5px solid ${C.border}`, background:'transparent', color:C.textMuted, cursor:'pointer', flexShrink:0 }}>✎</button>
        </div>
        {(g.milestones||[]).length>0 && (
          <div style={{ padding:'0 18px 8px' }}>
            <div style={{ fontSize:10.5, color:C.textMuted, fontWeight:600, letterSpacing:.7, textTransform:'uppercase', marginBottom:4 }}>Milestones · {g.milestones.filter(m=>m.done).length}/{g.milestones.length}</div>
            {g.milestones.map(m=>(
              <div key={m.id} style={{ display:'flex', alignItems:'center', gap:9, padding:'3px 0' }}>
                <Checkbox size={16} checked={m.done} onChange={()=>toggleMs(g, m.id)}/>
                <span style={{ fontSize:13, color:m.done?C.textMuted:C.text, textDecoration:m.done?'line-through':'none' }}>{m.text}</span>
              </div>
            ))}
          </div>
        )}
        {msFor===g.id && (
          <div style={{ padding:'0 18px 8px', display:'flex', gap:6 }}>
            <input autoFocus value={msText} onChange={e=>setMsText(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') addMs(g); if(e.key==='Escape') setMsFor(null); }} placeholder="New milestone" style={{ ...socialField, flex:1, padding:'7px 10px' }}/>
            <button onClick={()=>addMs(g)} style={{ padding:'0 12px', borderRadius:10, background:C.rose, color:'#fff', border:'none', cursor:'pointer' }}>Add</button>
          </div>
        )}
        <div style={{ margin:'auto 0 0', padding:'10px 18px 14px', borderTop:`0.5px solid ${C.border}`, background:`${C.pinkLight}80` }}>
          {openSteps.length>0 ? (
            <div style={{ marginBottom:6 }}>
              {openSteps.slice(0,3).map(t=>(
                <div key={t.id} style={{ display:'flex', alignItems:'center', gap:9, padding:'3px 0' }}>
                  <Checkbox size={16} checked={t.done} onChange={()=>saveTasks(toggleTaskIn(tasks, t.id).list)}/>
                  <span style={{ flex:1, fontSize:12.5, color:C.text }}>{t.text}</span>
                  {t.calendarDate && <span style={{ fontSize:10.5, color:C.textMuted }}>{prettyDue(t.calendarDate)?.label}</span>}
                </div>
              ))}
              {openSteps.length>3 && <div style={{ fontSize:11, color:C.textMuted }}>+{openSteps.length-3} more steps</div>}
            </div>
          ) : pct<100 && <div style={{ fontSize:12, color:C.textMuted, marginBottom:6 }}>No next step yet — what's one small move?</div>}
          {stepFor===g.id ? (
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              <input autoFocus value={stepText} onChange={e=>setStepText(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') addStep(g,false); if(e.key==='Escape') setStepFor(null); }} placeholder="Next step…" style={{ ...socialField, flex:1, minWidth:140, padding:'7px 10px' }}/>
              <button onClick={()=>addStep(g,true)} style={{ padding:'0 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, fontSize:12, cursor:'pointer' }}>☀ Today</button>
              <button onClick={()=>addStep(g,false)} style={{ padding:'0 12px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:12, cursor:'pointer' }}>Add</button>
            </div>
          ) : (
            <div style={{ display:'flex', gap:12 }}>
              <button onClick={()=>{ setStepFor(g.id); setStepText(''); }} style={{ fontSize:12, color:C.rose, background:'none', border:'none', cursor:'pointer', padding:0 }}>+ Next step</button>
              <button onClick={()=>{ setMsFor(msFor===g.id?null:g.id); setMsText(''); }} style={{ fontSize:12, color:C.textLight, background:'none', border:'none', cursor:'pointer', padding:0 }}>+ Milestone</button>
            </div>
          )}
        </div>
      </Card>
    );
  };
  const grid = list => <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(auto-fill,minmax(330px,1fr))', gap:14 }}>{list.map(goalCard)}</div>;
  const newBtn = (defaults={}) => <button onClick={()=>setEditing({ ...defaults })} style={{ padding:'9px 18px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>+ New goal</button>;
  const editor = editing && <GoalEditor initial={editing} onSave={upsert} onClose={()=>setEditing(null)} onDelete={editing.id?()=>remove(editing):null}/>;

  /* Overview */
  if (sub==='Overview') {
    const active = goals.filter(g=>goalProgress(g,tasks)<100);
    const done = goals.filter(g=>goalProgress(g,tasks)>=100);
    const avg = active.length ? Math.round(active.reduce((s,g)=>s+goalProgress(g,tasks),0)/active.length) : 0;
    const soon = active.filter(g=>g.targetDate && g.targetDate<=addDaysKey(30)).sort((a,b)=>a.targetDate.localeCompare(b.targetDate));
    const stuck = active.filter(g=>!tasks.some(t=>t.goalId===g.id && !t.done) && !(g.milestones||[]).some(m=>!m.done));
    const areas = GOAL_CATEGORIES.map(c=>{ const list = goals.filter(g=>g.category===c); return { c, list, pct: list.length ? Math.round(list.reduce((s,g)=>s+goalProgress(g,tasks),0)/list.length) : null }; });

        <PageTitle subtitle="Every goal in one place — personal and business" right={newBtn()}>Goals</PageTitle>

          <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr 1fr':'repeat(4,1fr)', gap:12, marginBottom:16 }}>
            <StatTile icon="🎯" label="Active" value={active.length}/>
            <StatTile icon="✓" label="Achieved" value={done.length} color="#4f9d8a"/>
            <StatTile icon="◔" label="Avg progress" value={`${avg}%`} color={C.accent}/>
            <StatTile icon="⏳" label="Due in 30 days" value={soon.length} color="#c4904a"/>
          </div>
          <Card style={{ marginBottom:16 }}>
            <SectionHeading>Life areas</SectionHeading>

          </div>
          {grid([...active].sort((a,b)=>(a.targetDate||'9999').localeCompare(b.targetDate||'9999')))}
          {showDone && <div style={{ marginTop:14 }}>{grid(done)}</div>}
        </>}
        {editor}
      </div>
    );
  }

  /* Yearly / Quarterly / Monthly */
  const pt = sub==='Quarterly'?'quarterly':sub==='Monthly'?'monthly':'yearly';
  const periodVal = pt==='yearly' ? String(selYear) : pt==='quarterly' ? `${selYear}-Q${selQ}` : `${selYear}-${String(selMonth+1).padStart(2,'0')}`;
  const inPeriod = g => {
    const gpt = g.periodType||'yearly', v = g.periodValue||String(now.getFullYear());
    if (pt==='yearly') return v.startsWith(String(selYear));
    if (pt==='quarterly') return (gpt==='quarterly' && v===periodVal) || (gpt==='monthly' && v.startsWith(`${selYear}-`) && Math.ceil(parseInt(v.split('-')[1])/3)===selQ);
    return gpt==='monthly' && v===periodVal;
  };
  const list = goals.filter(inPeriod).sort((a,b)=>((a.periodType||'yearly')!==pt)-((b.periodType||'yearly')!==pt) || (a.periodValue||'').localeCompare(b.periodValue||''));
  const reflKey = pt==='yearly' ? `nylaos_reflection_year_${selYear}` : `nylaos_reflection_${periodVal}`;
  const chip = (label, on, onClick) => <button key={label} onClick={onClick} style={{ padding:'6px 13px', borderRadius:20, fontSize:12.5, cursor:'pointer', border:`0.5px solid ${on?C.rose:C.border}`, background:on?C.rose:C.card, color:on?'#fff':C.text }}>{label}</button>;
  const pctAll = list.length ? Math.round(list.reduce((s,g)=>s+goalProgress(g,tasks),0)/list.length) : 0;
  return (
    <div className="fade-in" style={{ maxWidth:1100 }}>
      <PageTitle subtitle={`${list.length} goal${list.length===1?'':'s'} · ${pctAll}% overall`} right={newBtn({ periodType:pt, periodValue:periodVal })}>{sub} Goals</PageTitle>
      <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap', marginBottom:16 }}>
        <button onClick={()=>setSelYear(y=>y-1)} style={{ width:32, height:32, borderRadius:'50%', border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, cursor:'pointer' }}>‹</button>
        <span style={{ fontFamily:"'DM Serif Display',serif", fontSize:18, color:C.rose, minWidth:52, textAlign:'center' }}>{selYear}</span>
        <button onClick={()=>setSelYear(y=>y+1)} style={{ width:32, height:32, borderRadius:'50%', border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, cursor:'pointer' }}>›</button>
        <span style={{ width:10 }}/>
        {pt==='quarterly' && [1,2,3,4].map(q=>chip(`Q${q}`, selQ===q, ()=>setSelQ(q)))}
        {pt==='monthly' && MONTHS3.map((mn,i)=>chip(mn, selMonth===i, ()=>setSelMonth(i)))}
      </div>
      {list.length ? grid(list) : <EmptyState icon="🎯" title={`No goals for ${pt==='yearly'?selYear:pt==='quarterly'?`Q${selQ} ${selYear}`:`${MONTHS[selMonth]} ${selYear}`}`} text="Set one — it will show up on Home and in your Overview." action={newBtn({ periodType:pt, periodValue:periodVal })}/>}
      <Card style={{ marginTop:18 }}>
        <SectionHeading>{pt==='yearly'?`${selYear} theme & reflection`:'Reflection & review'}</SectionHeading>
        <ReflectionArea key={reflKey} storageKey={reflKey} placeholder={pt==='yearly'?`What's your word or theme for ${selYear}? What do you want to create, become, or achieve?`:pt==='quarterly'?`Q${selQ} ${selYear} — what did you accomplish? What will you do differently?`:`${MONTHS[selMonth]} ${selYear} — how did this month go? What are you proud of?`} height={110}/>
      </Card>
      {editor}
    </div>
  );
};

/* ── Syllabus Upload / Extraction Pipeline ──────────────────────── */
const SYLLABUS_EXTRACT_SYSTEM = `You extract structured data from a college syllabus. Reply with ONLY a single JSON object, no markdown fences, no commentary, matching exactly this shape (use "" or [] for anything not present in the text — never invent information):
{
  "courseName": "", "courseCode": "", "instructor": "", "instructorEmail": "", "officeHours": "",
  "location": "", "semester": "", "creditHours": 3,
  "schedule": [{"days": "e.g. Mon/Wed/Fri", "time": "e.g. 10:00 AM–10:50 AM"}],
  "textbooks": [""],
  "assignments": [{"title": "", "dueDate": "YYYY-MM-DD or ''"}],
  "exams": [{"title": "", "date": "YYYY-MM-DD or ''"}],
  "attendancePolicy": "", "lateWorkPolicy": "", "rules": ""
}`;

const parseSyllabusText = async text => {
  const key = localStorage.getItem('nylaos_api_key');
  if(!key) throw new Error('Add your API key in Settings → API Keys first');
  const raw = await callClaude({ system:SYLLABUS_EXTRACT_SYSTEM, messages:[{role:'user', content:text}], maxTokens:12000, effort:'low' });
  const jsonStr = raw.match(/\{[\s\S]*\}/)?.[0] || '{}';
  return JSON.parse(jsonStr);
};

const SyllabusUploader = () => {
  const [step, setStep] = useState('input'); // input | extracting | review | done
  const [pastedText, setPastedText] = useState('');
  const [extracted, setExtracted] = useState(null);
  const [semesterStart, setSemesterStart] = useState('');
  const [semesterEnd, setSemesterEnd] = useState('');
  const [error, setError] = useState('');
  const [createdSummary, setCreatedSummary] = useState(null);
  const fileRef = useRef(null);

  const handleFile = file => {
    if(!file.name.match(/\.(txt|md)$/i)){ setError('Only pasted text or .txt files are supported right now — PDF/DOCX/image/Google Drive/Canvas import need OCR or file-parsing support that isn\'t built yet.'); return; }
    const reader = new FileReader();
    reader.onload = e => setPastedText(e.target.result);
    reader.readAsText(file);
  };

  const extract = async () => {
    if(!pastedText.trim()) return;
    setStep('extracting'); setError('');
    try {
      const data = await parseSyllabusText(pastedText);
      setExtracted(data);
      const now = new Date();
      setSemesterStart(now.toISOString().slice(0,10));
      const end = new Date(now); end.setMonth(end.getMonth()+4);
      setSemesterEnd(end.toISOString().slice(0,10));
      setStep('review');
    } catch(e) {
      setError(e.message || 'Could not extract this syllabus — try again.');
      setStep('input');
    }
  };

  const updateField = (field, val) => setExtracted(e=>({...e, [field]:val}));
  const updateListItem = (listField, i, key, val) => setExtracted(e=>({...e, [listField]: e[listField].map((item,idx)=>idx===i?{...item,[key]:val}:item)}));
  const removeListItem = (listField, i) => setExtracted(e=>({...e, [listField]: e[listField].filter((_,idx)=>idx!==i)}));

  const approve = () => {
    const created = { course:null, events:0, assignments:0, notebookPageId:null };
    // 1. Course
    const coursesKey='nylaos_courses';
    const courses = JSON.parse(localStorage.getItem(coursesKey)||'[]');
    const courseId = Date.now();
    const course = {
      id:courseId, code:extracted.courseCode||'', name:extracted.courseName||'Untitled Course', credits:parseInt(extracted.creditHours)||3, grade:'A',
      semester:extracted.semester||'', instructor:extracted.instructor||'', instructorEmail:extracted.instructorEmail||'', officeHours:extracted.officeHours||'',
      location:extracted.location||'', textbooks:extracted.textbooks||[], attendancePolicy:extracted.attendancePolicy||'', lateWorkPolicy:extracted.lateWorkPolicy||'',
      semesterStart, semesterEnd, created:new Date().toISOString(),
    };
    courses.push(course);
    localStorage.setItem(coursesKey, JSON.stringify(courses));
    created.course = JSON.parse(localStorage.getItem(coursesKey)||'[]').some(c=>c.id===courseId) ? course : null;

    // 2. Recurring class meetings on the calendar, one event series per schedule row
    const eventsKey='nylaos_events';
    let events = JSON.parse(localStorage.getItem(eventsKey)||'[]');
    (extracted.schedule||[]).forEach(row=>{
      const dayMap = {mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0};
      const dayTokens = (row.days||'').toLowerCase().match(/mon|tue|wed|thu|fri|sat|sun/g) || [];
      const start = new Date(semesterStart+'T00:00:00'), end = new Date(semesterEnd+'T00:00:00');
      const groupId = Date.now()+Math.floor(Math.random()*1000);
      let n=0;
      for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
        if(dayTokens.some(t=>dayMap[t]===d.getDay())){
          const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          events.push({id:groupId+n, date:dateStr, text:`${extracted.courseName}${row.time?` (${row.time})`:''}`, recurringGroupId:groupId, courseId});
          n++;
        }
      }
      created.events += n;
    });
    // 3. Assignments + exams, each also gets a calendar reminder on its due date
    const assignKey='nylaos_assignments';
    const assignments = JSON.parse(localStorage.getItem(assignKey)||'[]');
    [...(extracted.assignments||[]).map(a=>({...a,kind:'Assignment'})), ...(extracted.exams||[]).map(a=>({title:a.title,dueDate:a.date,kind:'Exam'}))].forEach(item=>{
      if(!item.title) return;
      const id=Date.now()+Math.floor(Math.random()*10000);
      assignments.push({id, title:`${item.kind==='Exam'?'📝 ':''}${item.title}`, course:extracted.courseCode||extracted.courseName, dueDate:item.dueDate||'', priority: item.kind==='Exam'?'high':'medium', status:'pending'});
      if(item.dueDate) events.push({id:id+1, date:item.dueDate, text:`${item.kind}: ${item.title} (${extracted.courseName})`});
      created.assignments++;
    });
    localStorage.setItem(eventsKey, JSON.stringify(events));
    localStorage.setItem(assignKey, JSON.stringify(assignments));

    // 4. Course notebook page with the original syllabus + a suggested study plan
    const foldersKey='nylaos_nb_folders';
    let folders = JSON.parse(localStorage.getItem(foldersKey)||'[]');
    if(folders.length===0) folders=[{id:1,name:'All Notes',icon:'📝',parentId:null},{id:2,name:'Journal',icon:'📖',parentId:null},{id:3,name:'Ideas',icon:'💡',parentId:null},{id:4,name:'Bookmarks',icon:'🔖',parentId:null}];
    let coursesFolder = folders.find(f=>f.name==='Courses');
    if(!coursesFolder){ coursesFolder={id:Date.now(), name:'Courses', icon:'🎓', parentId:null}; folders.push(coursesFolder); localStorage.setItem(foldersKey, JSON.stringify(folders)); }
    const pagesKey='nylaos_nb_pages';
    const pages = JSON.parse(localStorage.getItem(pagesKey)||'[]');
    const pageId = Date.now()+1;
    const studyPlan = `Review ${extracted.courseName} material weekly rather than cramming before exams. Prioritize assignments due within the next 7 days, and revisit lecture notes within 48 hours of class while they're fresh.`;
    const content = `<h2>${extracted.courseName} — Course Notebook</h2>`
      + `<p><strong>Instructor:</strong> ${extracted.instructor||'—'} ${extracted.instructorEmail?`(${extracted.instructorEmail})`:''}</p>`
      + `<p><strong>Office Hours:</strong> ${extracted.officeHours||'—'}</p>`
      + `<p><strong>Location:</strong> ${extracted.location||'—'}</p>`
      + `<h3>Suggested Study Plan</h3><p>${studyPlan}</p>`
      + `<h3>Attendance Policy</h3><p>${extracted.attendancePolicy||'—'}</p>`
      + `<h3>Late Work Policy</h3><p>${extracted.lateWorkPolicy||'—'}</p>`
      + `<h3>Original Syllabus (pasted text)</h3><p style="white-space:pre-wrap;">${pastedText.replace(/</g,'&lt;')}</p>`;
    pages.push({id:pageId, name:`${extracted.courseName} — Syllabus`, folderId:coursesFolder.id, content, created:new Date().toISOString(), updated:new Date().toISOString(), courseId});
    localStorage.setItem(pagesKey, JSON.stringify(pages));
    created.notebookPageId = JSON.parse(localStorage.getItem(pagesKey)||'[]').some(p=>p.id===pageId) ? pageId : null;

    setCreatedSummary(created);
    setStep('done');
  };

  if(step==='done' && createdSummary) return (
    <div className="fade-in" style={{maxWidth:600}}>
      <PageTitle>Syllabus Processed ✓</PageTitle>
      <Card style={{padding:'16px 18px'}}>
        <div style={{fontSize:13,color:C.text,lineHeight:2}}>
          {createdSummary.course && <div>✅ Created course: <strong>{createdSummary.course.name}</strong></div>}
          <div>✅ Added {createdSummary.events} class/exam calendar events</div>
          <div>✅ Added {createdSummary.assignments} assignments/exams to your tracker</div>
          {createdSummary.notebookPageId && <div>✅ Created a course Notebook page with the syllabus and a suggested study plan</div>}
        </div>
        <div style={{display:'flex',gap:8,marginTop:14}}>
          <button onClick={()=>window._navigateTo&&window._navigateTo('university','Courses')} style={{padding:'8px 16px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:12.5,cursor:'pointer'}}>View Courses</button>
          <button onClick={()=>window._navigateTo&&window._navigateTo('calendar','Monthly')} style={{padding:'8px 16px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.text,fontSize:12.5,cursor:'pointer'}}>View Calendar</button>
          {createdSummary.notebookPageId && <button onClick={()=>{localStorage.setItem('nylaos_nb_open_request',String(createdSummary.notebookPageId));window._navigateTo&&window._navigateTo('notebook','Courses');}} style={{padding:'8px 16px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.text,fontSize:12.5,cursor:'pointer'}}>View Notebook Page</button>}
        </div>
        <button onClick={()=>{setStep('input');setPastedText('');setExtracted(null);setCreatedSummary(null);}} style={{marginTop:12,background:'none',border:'none',color:C.textMuted,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Process another syllabus</button>
      </Card>
    </div>
  );

  if(step==='review' && extracted) return (
    <div className="fade-in" style={{maxWidth:660}}>
      <PageTitle>Review Before Creating</PageTitle>
      <Card style={{padding:'16px 18px',marginBottom:14}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
          <LabeledInput label="Course name" value={extracted.courseName} onChange={v=>updateField('courseName',v)}/>
          <LabeledInput label="Course code" value={extracted.courseCode} onChange={v=>updateField('courseCode',v)}/>
          <LabeledInput label="Instructor" value={extracted.instructor} onChange={v=>updateField('instructor',v)}/>
          <LabeledInput label="Instructor email" value={extracted.instructorEmail} onChange={v=>updateField('instructorEmail',v)}/>
          <LabeledInput label="Office hours" value={extracted.officeHours} onChange={v=>updateField('officeHours',v)}/>
          <LabeledInput label="Location" value={extracted.location} onChange={v=>updateField('location',v)}/>
          <LabeledInput label="Semester" value={extracted.semester} onChange={v=>updateField('semester',v)}/>
          <LabeledInput label="Credit hours" value={extracted.creditHours} onChange={v=>updateField('creditHours',v)}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:4}}>
          <div>
            <div style={{fontSize:10.5,color:C.textMuted,marginBottom:3}}>Semester start (for recurring classes)</div>
            <input type="date" value={semesterStart} onChange={e=>setSemesterStart(e.target.value)} style={{width:'100%',padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
          </div>
          <div>
            <div style={{fontSize:10.5,color:C.textMuted,marginBottom:3}}>Semester end</div>
            <input type="date" value={semesterEnd} onChange={e=>setSemesterEnd(e.target.value)} style={{width:'100%',padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
          </div>
        </div>
      </Card>

      <Card style={{padding:'16px 18px',marginBottom:14}}>
        <SectionHeading>Class Schedule</SectionHeading>
        {(extracted.schedule||[]).length===0 && <div style={{fontSize:12,color:C.textMuted,fontStyle:'italic'}}>No recurring meeting times detected — you can add them manually after.</div>}
        {(extracted.schedule||[]).map((row,i)=>(
          <div key={i} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
            <input value={row.days||''} onChange={e=>updateListItem('schedule',i,'days',e.target.value)} placeholder="Days (e.g. Mon/Wed/Fri)" style={{flex:1,padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <input value={row.time||''} onChange={e=>updateListItem('schedule',i,'time',e.target.value)} placeholder="Time" style={{flex:1,padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <button onClick={()=>removeListItem('schedule',i)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14}}>×</button>
          </div>
        ))}
      </Card>

      <Card style={{padding:'16px 18px',marginBottom:14}}>
        <SectionHeading>Assignments & Exams ({(extracted.assignments||[]).length + (extracted.exams||[]).length})</SectionHeading>
        {(extracted.assignments||[]).map((a,i)=>(
          <div key={'a'+i} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
            <input value={a.title||''} onChange={e=>updateListItem('assignments',i,'title',e.target.value)} placeholder="Assignment title" style={{flex:2,padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <input type="date" value={a.dueDate||''} onChange={e=>updateListItem('assignments',i,'dueDate',e.target.value)} style={{flex:1,padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <button onClick={()=>removeListItem('assignments',i)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14}}>×</button>
          </div>
        ))}
        {(extracted.exams||[]).map((a,i)=>(
          <div key={'e'+i} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
            <input value={a.title||''} onChange={e=>updateListItem('exams',i,'title',e.target.value)} placeholder="Exam title" style={{flex:2,padding:'6px 9px',borderRadius:8,border:`0.5px solid #F4A261`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <input type="date" value={a.date||''} onChange={e=>updateListItem('exams',i,'date',e.target.value)} style={{flex:1,padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12}}/>
            <button onClick={()=>removeListItem('exams',i)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14}}>×</button>
          </div>
        ))}
      </Card>

      <div style={{display:'flex',gap:8}}>
        <button onClick={approve} style={{padding:'9px 20px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:13,fontWeight:500,cursor:'pointer'}}>Approve & Create Everything</button>
        <button onClick={()=>{setStep('input');setExtracted(null);}} style={{padding:'9px 16px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:13,cursor:'pointer'}}>Start Over</button>
      </div>
    </div>
  );

  return (
    <div className="fade-in" style={{maxWidth:600}}>
      <PageTitle>Upload Syllabus</PageTitle>
      <Card style={{padding:'16px 18px',marginBottom:14}}>
        <div style={{fontSize:12.5,color:C.textLight,marginBottom:10,lineHeight:1.6}}>
          Paste your syllabus text below, or upload a .txt file. <strong>PDF, DOCX, image, Google Drive file, and Canvas export</strong> aren't supported yet — those need file-parsing/OCR support this app doesn't have built in.
        </div>
        <textarea value={pastedText} onChange={e=>setPastedText(e.target.value)} placeholder="Paste the full syllabus text here..."
          style={{width:'100%',height:180,padding:'10px 12px',borderRadius:10,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12.5,fontFamily:'inherit',resize:'vertical',marginBottom:10}}/>
        {error && <div style={{fontSize:12,color:'#e57373',marginBottom:10}}>{error}</div>}
        <div style={{display:'flex',gap:8}}>
          <button onClick={extract} disabled={!pastedText.trim()||step==='extracting'} style={{padding:'9px 20px',borderRadius:10,background:pastedText.trim()?C.rose:C.textMuted,color:'#fff',border:'none',fontSize:13,fontWeight:500,cursor:pastedText.trim()?'pointer':'not-allowed'}}>
            {step==='extracting'?'Extracting…':'Extract Syllabus Info'}
          </button>
          <button onClick={()=>fileRef.current?.click()} style={{padding:'9px 16px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.text,fontSize:13,cursor:'pointer'}}>📁 Upload .txt file</button>
          <input ref={fileRef} type="file" accept=".txt,.md" hidden onChange={e=>e.target.files[0]&&handleFile(e.target.files[0])}/>
        </div>
      </Card>
    </div>
  );
};

const LabeledInput = ({label, value, onChange}) => (
  <div>
    <div style={{fontSize:10.5,color:C.textMuted,marginBottom:3}}>{label}</div>
    <input value={value||''} onChange={e=>onChange(e.target.value)} style={{width:'100%',padding:'6px 9px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
  </div>
);

const UniversityDashboard = () => {
  const isMobile = useIsMobile();
  const courses = JSON.parse(localStorage.getItem('nylaos_courses')||'[]');
  const [assignments, setAssignments] = useState(()=>JSON.parse(localStorage.getItem('nylaos_assignments')||'[]'));
  const gpaEntries = JSON.parse(localStorage.getItem('nylaos_gpa_entries')||'[]');
  const events = JSON.parse(localStorage.getItem('nylaos_events')||'[]');
  const focus = JSON.parse(localStorage.getItem('nylaos_focus_sessions')||'[]');
  const [targetCredits, setTargetCredits] = useState(()=>parseInt(localStorage.getItem('nylaos_credit_target')||'120'));
  const [attendance, setAttendance] = useState(()=>JSON.parse(localStorage.getItem('nylaos_attendance')||'{}'));
  const today = toDateKey();
  const setCreditTarget = v => { setTargetCredits(v); localStorage.setItem('nylaos_credit_target',String(v)); };
  const markAttendance = (courseId, present) => {
    const cur = attendance[courseId]||{present:0,absent:0};
    const updated = {...attendance, [courseId]: {...cur, [present?'present':'absent']: cur[present?'present':'absent']+1}};
    setAttendance(updated); localStorage.setItem('nylaos_attendance', JSON.stringify(updated)); toast(present?'Marked present':'Marked absent','info',1000);
  };
  const toggle = id => { const next = assignments.map(a=>a.id===id?{...a,status:a.status==='completed'?'pending':'completed'}:a); setAssignments(next); localStorage.setItem('nylaos_assignments', JSON.stringify(next)); };

  const validEntries = gpaEntries.filter(e=>e.points!=null);
  const totalCredits = validEntries.reduce((s,e)=>s+e.credits,0);
  const gpa = totalCredits>0 ? validEntries.reduce((s,e)=>s+e.points*e.credits,0)/totalCredits : null;
  const graded = courses.filter(c=>c.grade&&GRADE_POINTS[c.grade]!=null);
  const projCredits = totalCredits + graded.reduce((s,c)=>s+(c.credits||3),0);
  const projectedGpa = projCredits>0 ? (validEntries.reduce((s,e)=>s+e.points*e.credits,0) + graded.reduce((s,c)=>s+GRADE_POINTS[c.grade]*(c.credits||3),0))/projCredits : null;
  const creditsEarned = totalCredits + courses.reduce((s,c)=>s+(c.credits||3),0);
  const open = assignments.filter(a=>a.status!=='completed').sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  const overdue = open.filter(a=>a.dueDate && a.dueDate<today);
  const thisWeek = open.filter(a=>a.dueDate && a.dueDate>=today && a.dueDate<=addDaysKey(7));
  const classesToday = events.filter(e=>e.date===today && e.courseId).map(e=>({ e, c:courses.find(c=>c.id===e.courseId) }));
  const weekStudy = focus.filter(s=>s.date>=addDaysKey(-6)).reduce((s,x)=>s+x.minutes,0);
  const latestEnd = courses.map(c=>c.semesterEnd).filter(Boolean).sort().pop();
  const daysLeft = latestEnd ? Math.ceil((new Date(latestEnd+'T00:00:00')-new Date())/86400000) : null;
  return (
    <div className="fade-in" style={{ maxWidth:1050 }}>
      <PageTitle subtitle={daysLeft!=null ? `${daysLeft} days left in the semester` : 'Your semester at a glance'} right={<button onClick={()=>window._navigateTo('university','Upload Syllabus')} style={{ padding:'8px 16px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, fontSize:13, cursor:'pointer' }}>⬆ Upload syllabus</button>}>University</PageTitle>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr 1fr':'repeat(4,1fr)', gap:12, marginBottom:14 }}>
        <StatTile icon="🎓" label="GPA" value={gpa?gpa.toFixed(2):'—'} sub={projectedGpa?`projected ${projectedGpa.toFixed(2)}`:`${totalCredits} credits graded`}/>
        <StatTile icon="📚" label="Credits" value={`${creditsEarned}/${targetCredits}`} sub={`${Math.min(100,Math.round(creditsEarned/Math.max(1,targetCredits)*100))}% to graduation`} color={C.accent}/>
        <StatTile icon="📝" label="Due this week" value={thisWeek.length} sub={overdue.length?`${overdue.length} overdue`:'nothing overdue'} color={overdue.length?'#d05a5a':'#c4904a'}/>
        <StatTile icon="⏱" label="Focus this week" value={`${Math.floor(weekStudy/60)}h ${weekStudy%60}m`} sub="from Focus Mode" color="#4f9d8a"/>
      </div>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'minmax(0,1.3fr) minmax(0,1fr)', gap:14, marginBottom:14 }}>
        <Card>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
            <SectionHeading style={{ marginBottom:0 }}>Coming up</SectionHeading>
            <button onClick={()=>window._navigateTo('university','Assignments')} style={{ fontSize:12, color:C.rose, background:'none', border:'none', cursor:'pointer' }}>All assignments →</button>
          </div>
          {open.length===0 && <div style={{ fontSize:13, color:C.textMuted }}>Nothing due — you're clear. 🎉</div>}
          {open.slice(0,7).map(a=>{ const c = findCourse(courses, a.course); const due = dueLabel(a.dueDate); return (
            <div key={a.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:`0.5px solid ${C.border}70` }}>
              <Checkbox size={18} checked={false} onChange={()=>toggle(a.id)}/>
              <span style={{ width:4, alignSelf:'stretch', borderRadius:2, background: c?courseColor(c):C.accent }}/>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13.5, color:C.text }}>{a.title}</div><div style={{ fontSize:11.5, color:C.textMuted }}>{a.course||'No course'}</div></div>
              <span style={{ fontSize:11.5, color:due.tone, whiteSpace:'nowrap' }}>{due.text}</span>
            </div>
          ); })}
        </Card>
        <Card>
          <SectionHeading>Today's classes</SectionHeading>
          {classesToday.length===0 ? <div style={{ fontSize:13, color:C.textMuted }}>No classes on the calendar today.</div> : classesToday.map(({e,c})=>(
            <div key={e.id} style={{ display:'flex', gap:10, alignItems:'center', padding:'8px 10px', borderRadius:12, marginBottom:6, background:`${courseColor(c)}14` }}>
              <span style={{ width:10, height:10, borderRadius:'50%', background:courseColor(c) }}/>
              <div style={{ flex:1 }}><div style={{ fontSize:13.5, color:C.text, fontWeight:500 }}>{c?.name||e.text}</div><div style={{ fontSize:11.5, color:C.textMuted }}>{e.time?fmtTime(e.time):e.text}{c?.room?` · ${c.room}`:''}</div></div>
              {c && <><button onClick={()=>markAttendance(c.id,true)} title="Present" style={{ padding:'3px 9px', borderRadius:10, border:'none', background:'#4CAF7725', color:'#3f9a6a', cursor:'pointer', fontSize:11 }}>✓</button><button onClick={()=>markAttendance(c.id,false)} title="Absent" style={{ padding:'3px 9px', borderRadius:10, border:'none', background:'#e5737325', color:'#d05a5a', cursor:'pointer', fontSize:11 }}>✕</button></>}
            </div>
          ))}
          {courses.length>0 && <>
            <div style={{ fontSize:10.5, fontWeight:600, letterSpacing:.8, textTransform:'uppercase', color:C.textMuted, margin:'14px 0 6px' }}>Attendance</div>
            {courses.map(c=>{ const att = attendance[c.id]||{present:0,absent:0}; const tot = att.present+att.absent; const pct = tot ? Math.round(att.present/tot*100) : null; return (
              <div key={c.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'3px 0', fontSize:12.5 }}>
                <span style={{ width:8, height:8, borderRadius:'50%', background:courseColor(c) }}/><span style={{ flex:1, color:C.text }}>{c.code||c.name}</span>
                <span style={{ color: pct===null?C.textMuted:pct>=90?'#3f9a6a':pct>=75?'#c4904a':'#d05a5a' }}>{pct===null?'—':`${pct}%`}</span>
                <button onClick={()=>markAttendance(c.id,true)} style={{ padding:'1px 7px', borderRadius:8, border:'none', background:'#4CAF7720', color:'#3f9a6a', cursor:'pointer', fontSize:10.5 }}>+ present</button>

// A generated cover: a soft gradient picked from the title, with title & author set in type.
const BOOK_COVER_HUES = [['#c4607a','#7a3048'],['#9080d8','#4c3a8a'],['#5b8ed6','#2d4f8a'],['#4f9d8a','#2a5e52'],['#c4904a','#7a5424'],['#a8467a','#5a2044'],['#d08a9a','#8a4a5a']];
const BookCover = ({ book, width=120 }) => {
  const h = [...(book.title||'')].reduce((a,c)=>a+c.charCodeAt(0),0) % BOOK_COVER_HUES.length;
  const [c1,c2] = BOOK_COVER_HUES[h];
  return (
    <div style={{ width, aspectRatio:'2 / 3', borderRadius:'4px 10px 10px 4px', padding: width*0.09, display:'flex', flexDirection:'column', justifyContent:'space-between', color:'#fff', position:'relative', overflow:'hidden',
      background:`linear-gradient(155deg, ${c1}, ${c2})`, boxShadow:'inset 6px 0 0 rgba(0,0,0,.14), 0 8px 18px rgba(64,24,40,.18)' }}>
      <div style={{ position:'absolute', right:-20, top:-20, width:width*0.7, height:width*0.7, borderRadius:'50%', background:'rgba(255,255,255,.1)' }}/>
      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize: width*0.13, lineHeight:1.1, position:'relative', display:'-webkit-box', WebkitLineClamp:4, WebkitBoxOrient:'vertical', overflow:'hidden' }}>{book.title}</div>
      <div style={{ fontSize: width*0.075, opacity:.85, position:'relative', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{book.author}</div>
    </div>
  );
};

const useBooks = () => {
  const [books, setBooks] = useState(()=>JSON.parse(localStorage.getItem(BOOKS_KEY)||'[]'));
  const save = list => { setBooks(list); localStorage.setItem(BOOKS_KEY, JSON.stringify(list)); };
  const add = data => { save([{ id:Date.now(), created:new Date().toISOString(), updated:new Date().toISOString(), ...(data.status==='finished'?{finishedDate:toDateKey()}:{}), ...data }, ...books]); toast('Book added 📚','success',1300); };
  const update = (id, fields) => save(books.map(b=>{ if (b.id!==id) return b; const next = { ...b, ...fields, updated:new Date().toISOString() };
    if (fields.status==='finished' && b.status!=='finished') { next.finishedDate = toDateKey(); if (next.pages) next.currentPage = next.pages; }
    if (fields.status==='reading' && !b.startedDate) next.startedDate = toDateKey();
    return next; }));
  const remove = id => { const book = books.find(b=>b.id===id); if (book) addToTrash('book', book.title, book, BOOKS_KEY); save(books.filter(b=>b.id!==id)); toast('Moved to Recently Deleted','info',1500); };
  return { books, add, update, remove };
};
const bookFinishedYear = b => (b.finishedDate || (b.status==='finished' && b.updated) || '').slice(0,4);

        <button onClick={()=>setForm({})} style={{ padding:'8px 18px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>+ Add book</button></div>}>My Library</PageTitle>

      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(150px, 1fr))', gap:'26px 18px' }}>
        {filtered.map(b=>{ const st = BOOK_STATUSES.find(s=>s.key===b.status)||BOOK_STATUSES[0]; const pct = b.pages ? Math.min(100, Math.round((b.currentPage||0)/b.pages*100)) : null; return (
          <div key={b.id} className="book-tile" onClick={()=>setDetailId(b.id)} style={{ cursor:'pointer' }}>
            <div className="book-lift" style={{ display:'flex', justifyContent:'center', marginBottom:10 }}><BookCover book={b} width={128}/></div>
            <div style={{ fontSize:13, fontWeight:600, color:C.text, lineHeight:1.3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{b.title}</div>
            <div style={{ fontSize:11.5, color:C.textMuted, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{b.author||'—'}</div>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:5 }}>
              <span style={{ fontSize:10, padding:'1px 7px', borderRadius:10, background:`${st.color}22`, color:st.color, fontWeight:600 }}>{st.label}</span>
              {b.rating>0 && <StarRating value={b.rating} readOnly size={10}/>}
            </div>
            {b.status==='reading' && pct!==null && <div style={{ height:4, borderRadius:2, background:`${C.pink}70`, marginTop:6 }}><div style={{ width:`${pct}%`, height:'100%', borderRadius:2, background:C.rose }}/></div>}
          </div>
        ); })}
      </div>
      {form && <BookForm initial={form.id?form:null} onSave={data=>{ form.id ? update(form.id, data) : add(data); setForm(null); }} onCancel={()=>setForm(null)}/>}
      {detailId && books.find(b=>b.id===detailId) && <BookDetailModal book={books.find(b=>b.id===detailId)} onClose={()=>setDetailId(null)} onUpdate={update} onDelete={remove} onEdit={b=>{ setDetailId(null); setForm(b); }}/>}
    </div>
  );

const BooksOverview = () => {
  const { books, update } = useBooks();
  const isMobile = useIsMobile();
  const year = String(new Date().getFullYear());
  const [goal, setGoal] = useState(()=>parseInt(localStorage.getItem(`nylaos_reading_goal_${year}`))||12);
  const finished = books.filter(b=>b.status==='finished' && bookFinishedYear(b)===year);
  const reading = books.filter(b=>b.status==='reading');
  const want = books.filter(b=>b.status==='want');
  const rated = books.filter(b=>b.rating>0);
  const avg = rated.length ? (rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1) : '—';
  const pagesRead = finished.reduce((s,b)=>s+(b.pages||0),0);
  const monthOfYear = new Date().getMonth()+1; const expected = Math.round(goal*monthOfYear/12);
  const genres = {}; books.forEach(b=>{ if(b.genre) genres[b.genre]=(genres[b.genre]||0)+1; });
  const go = sub => window._navigateTo && window._navigateTo('books', sub);
  return (
    <div className="fade-in" style={{ maxWidth:1000 }}>
      <PageTitle subtitle="What you're reading and how the year is going" right={<button onClick={()=>go('My Library')} style={{ padding:'8px 18px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>Open library</button>}>Books</PageTitle>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'minmax(0,1fr) minmax(0,1.3fr)', gap:14, marginBottom:14 }}>
        <Card style={{ display:'flex', alignItems:'center', gap:18, background:C.gradA, border:'none' }}>
          <ProgressRing pct={Math.min(100, Math.round(finished.length/Math.max(1,goal)*100))} size={96} stroke={8}/>
          <div>
            <div style={{ fontSize:10.5, letterSpacing:1, textTransform:'uppercase', color:C.textMuted }}>{year} reading goal</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:30, color:C.rose, lineHeight:1.1 }}>{finished.length} <span style={{ fontSize:17, color:C.textLight }}>of</span> <input inputMode="numeric" value={goal} onChange={e=>{ const v=parseInt(e.target.value.replace(/[^0-9]/g,''))||0; setGoal(v); localStorage.setItem(`nylaos_reading_goal_${year}`, String(v)); }} style={{ width:52, border:'none', borderBottom:`1px dashed ${C.border}`, background:'transparent', fontFamily:"'DM Serif Display',serif", fontSize:26, color:C.rose, textAlign:'center' }}/></div>
            <div style={{ fontSize:12, color:C.textLight }}>{finished.length>=expected ? 'Right on track ✨' : `${expected-finished.length} behind pace`} · {pagesRead.toLocaleString()} pages</div>
          </div>
        </Card>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12 }}>
          <StatTile label="Reading" value={reading.length} color="#F4A261"/>
          <StatTile label="Want to read" value={want.length} color="#9080d8"/>
          <StatTile label="Avg rating" value={avg} sub={`${rated.length} rated`} color={C.accent}/>
        </div>
      </div>
      <Card style={{ marginBottom:14 }}>
        <SectionHeading>Currently reading</SectionHeading>
        {reading.length===0 && <div style={{ fontSize:13, color:C.textMuted }}>Nothing on the go. {want.length ? 'Pick one from your want-to-read list:' : 'Add a book to your library.'}</div>}
        {reading.length===0 && want.slice(0,4).map(b=><button key={b.id} onClick={()=>update(b.id,{ status:'reading' })} style={{ margin:'8px 8px 0 0', padding:'6px 12px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.card, color:C.text, fontSize:12.5, cursor:'pointer' }}>Start “{b.title}”</button>)}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))', gap:14 }}>
          {reading.map(b=>{ const pct = b.pages ? Math.min(100, Math.round((b.currentPage||0)/b.pages*100)) : null; return (
            <div key={b.id} style={{ display:'flex', gap:14, alignItems:'center' }}>
              <BookCover book={b} width={70}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:14, fontWeight:600, color:C.text }}>{b.title}</div>
                <div style={{ fontSize:12, color:C.textMuted, marginBottom:6 }}>{b.author}</div>
                {pct!==null ? <>
                  <div style={{ height:6, borderRadius:3, background:`${C.pink}70` }}><div style={{ width:`${pct}%`, height:'100%', borderRadius:3, background:`linear-gradient(90deg, ${C.accent}, ${C.rose})` }}/></div>
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:6, fontSize:11.5, color:C.textLight }}>
                    <span>p. {b.currentPage||0} / {b.pages} · {pct}%</span>
                    <button onClick={()=>update(b.id,{ currentPage: Math.min(b.pages, (b.currentPage||0)+10) })} style={{ padding:'2px 8px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, fontSize:11, cursor:'pointer' }}>+10</button>
                    <button onClick={()=>update(b.id,{ status:'finished' })} style={{ padding:'2px 8px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.card, color:'#4CAF77', fontSize:11, cursor:'pointer' }}>Finished ✓</button>
                  </div>
                </> : <button onClick={()=>update(b.id,{ status:'finished' })} style={{ padding:'3px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.card, color:'#4CAF77', fontSize:11.5, cursor:'pointer' }}>Mark finished ✓</button>}
              </div>
            </div>
          ); })}
        </div>
      </Card>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1.4fr 1fr', gap:14 }}>
        <Card>
          <SectionHeading>Finished in {year}</SectionHeading>
          {finished.length===0 ? <div style={{ fontSize:13, color:C.textMuted }}>Your first finish of the year will show up here.</div> : (
            <div style={{ display:'flex', gap:12, overflowX:'auto', paddingBottom:4 }}>
              {finished.sort((a,b)=>(b.finishedDate||'').localeCompare(a.finishedDate||'')).map(b=><div key={b.id} style={{ flexShrink:0, width:84 }}><BookCover book={b} width={84}/>{b.rating>0 && <div style={{ marginTop:4 }}><StarRating value={b.rating} readOnly size={10}/></div>}</div>)}
            </div>
          )}
        </Card>
        <Card>
          <SectionHeading>Genres</SectionHeading>
          <HBars rows={Object.entries(genres).map(([label,value])=>({ label, value })).sort((a,b)=>b.value-a.value).slice(0,6)} valueFmt={v=>`${v}`} empty="Add a genre to your books to see your mix."/>
        </Card>
      </div>
    </div>
  );
};

const BooksPanel = ({ sub }) => {
  if (sub === 'Recently Deleted') return <TrashPanel type="book" />;
  if (sub === 'My Library') return <BookLibrary />;
  return <BooksOverview />;

/* ── AI Agents ──────────────────────────────────────────────────── */
// Every default agent carries the same permission shape used by the executor:
// canDelete is always false (hard ceiling, not just a default — no action spec can delete anyway),
// folderAccess:[] means "no notebook folder restriction", autoApprove only ever applies to
// single-item batches regardless of what's set here (multi-item/calendar/notebook always require approval).
const AGENT_PERM_DEFAULTS = { permissions:{canCreate:true,canEdit:true,canDelete:false}, folderAccess:[], autoApprove:false, businessAssignment:null };
const DEFAULT_AGENTS = [

const AGENT_STATUS_META = {
  available:         {label:'Available',          icon:'●', color:'#4CAF77'},
  thinking:           {label:'Thinking',           icon:'◐', color:'#4285f4'},
  working:            {label:'Working',            icon:'⚙',  color:'#4285f4'},
  waiting_approval:   {label:'Waiting for Approval',icon:'⏸', color:'#F4A261'},
  needs_information:  {label:'Needs Information',  icon:'❓', color:'#F4A261'},
  completed:          {label:'Completed',          icon:'✓', color:'#4CAF77'},
  error:              {label:'Error',              icon:'⚠',  color:'#e57373'},
};

const AgentCard = ({ agent, onEdit, onDelete, compact=false }) => {
  const [chatOpen, setChatOpen] = useState(false);
  const [msgs, setMsgs] = useState([{role:'assistant',text:`Hi Nyla! I'm your ${agent.name}. How can I help you today? ✦`}]);
  const [input, setInput] = useState('');
  const att = useAttachments();
  const [loading, setLoading] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const [pendingPlan, setPendingPlan] = useState(null); // {msgIndex, steps}
  const [errorState, setErrorState] = useState(false);
  const [justCompleted, setJustCompleted] = useState(false);
  const sessionId = useRef(null);
  const endRef = useRef(null);

  const status = errorState ? 'error'
    : loading ? 'thinking'
    : pendingPlan ? (pendingPlan.steps.some(s=>s.status==='needs_info') ? 'needs_information' : 'waiting_approval')
    : justCompleted ? 'completed'
    : 'available';
  const statusMeta = AGENT_STATUS_META[status];

  const activityLog = JSON.parse(localStorage.getItem('nylaos_agent_activity_log')||'[]');
  const recentWork = activityLog.find(e=>e.agent===agent.name);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading,fullscreen,pendingPlan]);

  useEffect(()=>{
    const ctx = JSON.parse(localStorage.getItem('nylaos_agent_pending_context')||'null');
    if(ctx && ctx.source==='idea'){
      localStorage.removeItem('nylaos_agent_pending_context');
      setMsgs(m=>[...m,{role:'assistant',text:`I see you shared "${ctx.title}" from your Idea Bank. What would you like me to do with it — turn it into a task, a notebook page, or something else?`}]);
    }
  },[]);

  const send = async () => {
    if((!input.trim()&&!att.items.length)||loading) return;
    if(!localStorage.getItem('nylaos_api_key')){ toast('Add your API key in Settings → API Keys first','error'); return; }
    if(!sessionId.current) sessionId.current=Date.now();
    const userText=input.trim();
    const sent=att.take();
    const history=[...msgs,{role:'user',text:userText,photos:sent.length?sent:undefined}];
    setMsgs(history); setInput(''); setLoading(true); setErrorState(false); setJustCompleted(false);
    try {
      const agentSystem=agent.systemPrompt+buildAgentContext(agent.name)+AGENT_ACTION_DOCS;
      const reply = await callClaude({ system:agentSystem, messages:await messagesWithPhotos(history), maxTokens:16000, effort:'medium' });
      const updated=[...history,{role:'assistant',text:reply}];
      setMsgs(updated);
      const rawCmds = parseAgentActions(reply);
      if(rawCmds.length){
        setPendingPlan({msgIndex:updated.length-1, steps:buildActionPlan(rawCmds)});
      }
      saveChatSession(sessionId.current, agent.name, 'agent', updated);
    } catch(e) {
      setErrorState(true);
      setMsgs(m=>[...m,{role:'assistant',text:`⚠️ ${e.message}`}]);
    } finally { setLoading(false); }
  };

  const [undoneBatch, setUndoneBatch] = useState(new Set());
  const approvePlan = approvedSteps => {
    const results = executeActionPlan(approvedSteps, agent);
    const done = results.filter(r=>r.execStatus==='done');
    const failed = results.filter(r=>r.execStatus!=='done');
    let summary = done.length ? `✅ Done:\n${done.map(r=>'· '+r.previewLine).join('\n')}` : '';
    if(failed.length) summary += `${summary?'\n\n':''}⚠️ Needs attention:\n${failed.map(r=>'· '+r.previewLine+' — '+r.reason).join('\n')}`;
    setMsgs(m=>{
      const updated=[...m,{role:'assistant',text:summary||'Nothing to do.',batchResults:done.length?results:null}];
      return updated;
    });
    setPendingPlan(null);
    if(failed.length && !done.length) setErrorState(true);
    else { setJustCompleted(true); setTimeout(()=>setJustCompleted(false), 6000); }
  };
  const undoBatch = (msgIdx, results) => {
    undoActionBatch(results);
    setUndoneBatch(s=>new Set(s).add(msgIdx));
    setMsgs(m=>[...m,{role:'assistant',text:'Undone — everything from that batch was moved to Recently Deleted.'}]);
  };

  const renderMsgs = () => (<>
    {msgs.map((m,i)=>(<React.Fragment key={i}>
      <Bubble m={m}>{m.role==='assistant' ? <RichReply text={stripAgentCmd(m.text)}/> : null}</Bubble>
      {m.batchResults && !undoneBatch.has(i) && (
        <div style={{display:'flex',justifyContent:'flex-start'}}>
          <button onClick={()=>undoBatch(i,m.batchResults)} style={{marginTop:2,padding:'4px 10px',borderRadius:8,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:11,cursor:'pointer'}}>↩ Undo this batch</button>
        </div>
      )}
      {pendingPlan && pendingPlan.msgIndex===i && (
        <ActionPreviewPanel plan={pendingPlan.steps} onApprove={approvePlan} onCancel={()=>setPendingPlan(null)} />
      )}
    </React.Fragment>))}
    {loading&&<TypingDots label={`${agent.name} is thinking`}/>}
    <div ref={endRef}/>
  </>);

  const renderInput = () => (
    <ChatComposer value={input} onChange={setInput} onSend={send} loading={loading} att={att} placeholder={`Message ${agent.name}…`}
      extra={!fullscreen && <button onClick={()=>setFullscreen(true)} title="Fullscreen" style={{ width:36, height:36, borderRadius:'50%', background:'transparent', border:`0.5px solid ${C.border}`, color:C.textMuted, fontSize:13, cursor:'pointer', flexShrink:0 }}>⤢</button>}/>
  );

  return (
    <>
      {chatOpen && fullscreen && (
        <div style={{ position:'fixed', inset:0, zIndex:9998, background:C.cream, display:'flex', flexDirection:'column' }}>
          <div style={{ padding:'12px 18px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', gap:12, background:C.sidebarBg, flexShrink:0 }}>
            <div style={{ width:34, height:34, borderRadius:10, background:agent.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18 }}>{agent.emoji}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:500, color:C.rose }}>{agent.name}</div>
              <div style={{ fontSize:11.5, color:C.textLight }}>{agent.role}</div>
            </div>
            <button onClick={()=>{setFullscreen(false); if(compact) setChatOpen(false);}} style={{ background:'none', border:'none', fontSize:20, color:C.textMuted, cursor:'pointer', lineHeight:1 }}>✕</button>
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:'16px 18px', display:'flex', flexDirection:'column', gap:10, background:C.lavLight }}><div style={{ maxWidth:820, width:'100%', margin:'0 auto', display:'flex', flexDirection:'column', gap:10 }}>{renderMsgs()}</div></div>
          {renderInput()}
        </div>
      )}
      {compact ? (
        <div onClick={()=>{setChatOpen(true); setFullscreen(true);}} title={`${agent.name} — ${statusMeta.label}`}
          style={{ width:96, display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor:'pointer', padding:'10px 6px', borderRadius:14,
            background:C.card, border:`0.5px solid ${C.border}`, transition:'transform 0.15s' }}
          onMouseEnter={e=>e.currentTarget.style.transform='translateY(-2px)'}
          onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
          <div style={{ position:'relative' }}>
            <div className={status==='thinking'||status==='working'?'agent-pulse':''}
              style={{ '--pulse-color':`${statusMeta.color}80`, width:44, height:44, borderRadius:13, background:agent.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:21 }}>{agent.emoji}</div>
            <div style={{ position:'absolute', bottom:-2, right:-2, width:13, height:13, borderRadius:'50%', background:statusMeta.color, border:`2px solid ${C.card}` }}/>
          </div>
          <div style={{ fontSize:10.5, fontWeight:600, color:C.text, textAlign:'center', lineHeight:1.25 }}>{agent.name}</div>
          <div style={{ fontSize:8.5, color:statusMeta.color, fontWeight:600, textTransform:'uppercase', letterSpacing:0.3 }}>{statusMeta.label}</div>
        </div>
      ) : (
      <Card style={{ padding:'18px', display:'flex', flexDirection:'column' }}>
        <div style={{ display:'flex', alignItems:'flex-start', gap:12, marginBottom:10 }}>
          <div style={{ position:'relative', flexShrink:0 }}>
            <div style={{ width:44, height:44, borderRadius:13, background:agent.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:22 }}>{agent.emoji}</div>
            <div title={statusMeta.label} style={{ position:'absolute', bottom:-2, right:-2, width:15, height:15, borderRadius:'50%', background:statusMeta.color, border:`2px solid ${C.card}`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:7, color:'#fff' }}/>
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:500, color:C.rose, marginBottom:2 }}>{agent.name}</div>
            <div style={{ fontSize:12, color:C.textLight, lineHeight:1.4 }}>{agent.role}</div>
            <div style={{ display:'flex', alignItems:'center', gap:5, marginTop:4 }}>
              <span style={{ fontSize:10, color:statusMeta.color, fontWeight:600 }}>{statusMeta.icon} {statusMeta.label}</span>
              {agent.businessAssignment && <span style={{ fontSize:9.5, padding:'1px 6px', borderRadius:6, background:`${C.accent}18`, color:C.accent }}>{agent.businessAssignment}</span>}
            </div>
          </div>
          <div style={{ display:'flex', gap:4, flexShrink:0 }}>
            {onEdit&&<button onClick={onEdit} style={{ background:`${C.lavender}90`,border:'none',borderRadius:7,padding:'4px 9px',fontSize:11,color:C.rose,cursor:'pointer' }}>Edit</button>}
            {onDelete&&<button onClick={onDelete} style={{ background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:18,lineHeight:1 }}>×</button>}
          </div>
        </div>
        {recentWork && (
          <div style={{ fontSize:10.5, color:C.textMuted, marginBottom:10, padding:'6px 8px', borderRadius:8, background:`${C.pinkLight}` }}>
            Recent: {recentWork.actions[0]?.preview} <span style={{opacity:0.7}}>· {new Date(recentWork.ts).toLocaleDateString()}</span>
          </div>
        )}
        <button onClick={()=>setChatOpen(o=>!o)} style={{ padding:'7px 0', borderRadius:10, background:chatOpen?C.rose:`${C.pink}55`, color:chatOpen?'#fff':C.rose, border:`0.5px solid ${chatOpen?C.rose:C.border}`, fontSize:12.5, cursor:'pointer', transition:'all 0.15s' }}>
          {chatOpen?'Close Chat':'✦ Open Chat'}
        </button>
        {chatOpen && !fullscreen && (
          <div style={{ marginTop:10, border:`0.5px solid ${C.border}`, borderRadius:12, overflow:'hidden' }}>
            <div style={{ height:260, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:10, background:C.lavLight }}>{renderMsgs()}</div>
            {renderInput()}
          </div>
        )}
      </Card>
      )}
    </>
  );
};

const AgentsChat = () => {
  const [msgs, setMsgs] = useState([
    { role:'assistant', text:'Hello Nyla ✦ I\'m connected and ready. I\'m here to support your vision, your business, your wellbeing — whatever you need right now.' }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [apiKey, setApiKey] = useState(()=>localStorage.getItem('nylaos_api_key')||'');
  const [showKeyInput, setShowKeyInput] = useState(!localStorage.getItem('nylaos_api_key'));
  const [fullscreen, setFullscreen] = useState(false);
  const sessionId = useRef(null);
  const endRef = useRef(null);

  useEffect(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),[msgs,loading,fullscreen]);

  const saveKey = k => { setApiKey(k); localStorage.setItem('nylaos_api_key',k); if(k) setShowKeyInput(false); };

  const att = useAttachments();
  const send = async () => {
    if ((!input.trim()&&!att.items.length)||loading) return;
    if (!localStorage.getItem('nylaos_api_key')) { setShowKeyInput(true); return; }
    const ids = att.take();
    const history = [...msgs, { role:'user', text:input.trim(), photos: ids.length?ids:undefined }];
    setMsgs(history); setInput(''); setLoading(true);
    try {
      const reply = await callClaude({ system: FLOAT_SYSTEM+buildAgentContext(null), messages: await messagesWithPhotos(history), maxTokens:16000, effort:'medium' });
      if(!sessionId.current) sessionId.current=Date.now();
      const updated=[...history,{role:'assistant',text:reply}];
      setMsgs(updated);
      saveChatSession(sessionId.current,'Nyla AI','main',updated);
    } catch(e) {
      setMsgs(m=>[...m, { role:'assistant', text:`⚠️ ${e.message}` }]);
    } finally { setLoading(false); }
  };

  const renderMsgs = () => (<>
    {msgs.map((m,i)=><Bubble key={i} m={m}/>)}
    {loading && <TypingDots/>}
    <div ref={endRef}/>
  </>);

  const renderInput = () => (
    <ChatComposer value={input} onChange={setInput} onSend={send} loading={loading} att={att} disabled={!apiKey}
      placeholder={apiKey?'Message Nyla AI — attach photos or files, or tap the mic…':'Add your API key above to begin'}
      extra={<button onClick={()=>setFullscreen(f=>!f)} title={fullscreen?'Exit fullscreen':'Fullscreen'} style={{ width:36, height:36, borderRadius:'50%', background:'transparent', border:`0.5px solid ${C.border}`, color:C.textMuted, fontSize:13, cursor:'pointer', flexShrink:0 }}>⤢</button>}/>
  );

  const keyCard = showKeyInput && (
    <Card style={{ marginBottom:12, padding:'14px 16px', background:`${C.lavender}60` }}>
      <div style={{ fontSize:13, color:C.rose, marginBottom:8 }}>Enter your Anthropic API key to activate Claude:</div>
      <div style={{ display:'flex', gap:8 }}>
        <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
          placeholder="sk-ant-..." style={{ flex:1, padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
        <button onClick={()=>saveKey(apiKey)} style={{ padding:'8px 16px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>Save</button>
      </div>
      <div style={{ fontSize:11, color:C.textMuted, marginTop:6 }}>Stored locally only. Never leaves your browser.</div>
    </Card>
  );

  if (fullscreen) return (
    <div style={{ position:'fixed', inset:0, zIndex:9998, background:C.cream, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 20px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', background:C.sidebarBg, flexShrink:0 }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:16, color:C.rose }}>✦ Nyla AI</div>
        <button onClick={()=>setFullscreen(false)} style={{ background:'none', border:'none', fontSize:20, color:C.textMuted, cursor:'pointer', lineHeight:1 }}>✕</button>
      </div>
      {keyCard}
      <div style={{ flex:1, overflowY:'auto', padding:20, display:'flex', flexDirection:'column', gap:12 }}>{renderMsgs()}</div>
      {renderInput()}
    </div>
  );

  return (
    <div className="fade-in" style={{ maxWidth:600, display:'flex', flexDirection:'column', height:'calc(100vh - 152px)' }}>
      <PageTitle>AI Chat</PageTitle>
      {keyCard}
      <Card style={{ flex:1, display:'flex', flexDirection:'column', padding:0, overflow:'hidden' }}>
        <div style={{ flex:1, overflowY:'auto', padding:20, display:'flex', flexDirection:'column', gap:12 }}>{renderMsgs()}</div>
        {renderInput()}
      </Card>
    </div>
  );
};

const AgentOfficeView = ({ agents }) => {
  const [showBiz, setShowBiz] = useState(false);
  const personal = agents.filter(a=>!a.businessAssignment);
  const biz = {}; agents.filter(a=>a.businessAssignment).forEach(a=>{ (biz[a.businessAssignment]=biz[a.businessAssignment]||[]).push(a); });
  const desk = (title, list) => (
    <div style={{ marginBottom:22 }}>
      <div style={{ fontSize:11, fontWeight:600, color:C.textMuted, textTransform:'uppercase', letterSpacing:.8, marginBottom:10 }}>{title}</div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(104px,1fr))', gap:12, padding:16, borderRadius:20, background:`linear-gradient(135deg, ${C.lavender}30, ${C.pink}25)`, border:`0.5px solid ${C.border}` }}>
        {list.map(a=><div key={a.id} style={{ display:'flex', justifyContent:'center' }}><AgentCard agent={a} compact/></div>)}
      </div>
    </div>
  );
  return (
    <div>
      {personal.length>0 && desk('✦ Your team', personal)}
      {Object.keys(biz).length>0 && (
        <>
          <button onClick={()=>setShowBiz(v=>!v)} style={{ fontSize:12.5, color:C.textLight, background:'none', border:`0.5px dashed ${C.border}`, borderRadius:20, padding:'7px 14px', cursor:'pointer', marginBottom:14 }}>
            {showBiz?'▾':'▸'} Business desks ({Object.values(biz).reduce((n,l)=>n+l.length,0)}) — each business has its own OS now
          </button>
          {showBiz && Object.keys(biz).sort().map(g=><React.Fragment key={g}>{desk(`💼 ${g}`, biz[g])}</React.Fragment>)}
        </>
      )}
      {agents.length===0 && <EmptyState icon="🤖" title="No agents match" text="Try another search."/>}
    </div>
  );
};

const AgentsPanel = () => {

  const [showCreate, setShowCreate] = useState(false);
  const [editId, setEditId] = useState(null);

  const save = a=>{setAgents(a);localStorage.setItem(KEY,JSON.stringify(a));};

    if(!form.name.trim()) return;

            <button onClick={()=>setView('list')} style={{ padding:'9px 14px', background:view==='list'?C.rose:'transparent', color:view==='list'?'#fff':C.text, border:'none', fontSize:13, cursor:'pointer' }}>☰ List</button>
          </div>
          <button onClick={()=>setShowLog(s=>!s)} style={{ padding:'9px 16px', borderRadius:12, background:showLog?`${C.accent}25`:'transparent', border:`0.5px solid ${C.border}`, color:C.text, fontSize:13, cursor:'pointer' }}>🕐 Activity Log{activityLog.length?` (${activityLog.length})`:''}</button>
          <button onClick={()=>{setShowCreate(s=>!s);setEditId(null);setForm(BLANK_FORM); }}
            style={{ padding:'9px 20px', borderRadius:12, background:C.rose, color:'#fff', border:'none', fontSize:13.5, fontWeight:500, cursor:'pointer' }}>+ Create Agent</button>
        </div>}>AI Agents</PageTitle>

              <div style={{fontSize:11,color:C.textMuted,marginBottom:4}}>{entry.agent} · {new Date(entry.ts).toLocaleString()}</div>

                </label>
              </div>
              <div style={{display:'flex',gap:10,marginBottom:8}}>
                <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:C.textLight,cursor:'pointer'}}>
                  <input type="checkbox" checked={form.permissions.canCreate} onChange={e=>setForm(f=>({...f,permissions:{...f.permissions,canCreate:e.target.checked}}))}/> Can create

                <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:C.textMuted,cursor:'not-allowed'}} title="Agents can never permanently delete — this is a hard ceiling, not a per-agent setting.">

              </div>
              {notebookFolders.length>0 && (<>

                  {notebookFolders.map(f=>(
                    <button key={f.id} onClick={()=>toggleFormFolder(f.name)} type="button" style={{padding:'3px 9px',borderRadius:7,fontSize:10.5,cursor:'pointer',
                      background:form.folderAccess.includes(f.name)?`${C.accent}30`:'transparent',border:`0.5px solid ${form.folderAccess.includes(f.name)?C.accent:C.border}`,color:form.folderAccess.includes(f.name)?C.accent:C.textMuted}}>{f.icon} {f.name}</button>

          {shownAgents.map(a=>(
