const BirthChartWheel = () => {
  const CX=150,CY=150,RO=138,RS=108,RP=76,RC=52;
  const SIGNS=[{g:'♈',e:'fire'},{g:'♉',e:'earth'},{g:'♊',e:'air'},{g:'♋',e:'water'},{g:'♌',e:'fire'},{g:'♍',e:'earth'},{g:'♎',e:'air'},{g:'♏',e:'water'},{g:'♐',e:'fire'},{g:'♑',e:'earth'},{g:'♒',e:'air'},{g:'♓',e:'water'}];
  const SC={fire:'rgba(196,96,122,0.18)',earth:'rgba(80,150,80,0.18)',air:'rgba(170,145,60,0.18)',water:'rgba(70,100,190,0.18)'};
  const GC={fire:'#B04060',earth:'#407040',air:'#806020',water:'#304090'};
  const PLANETS=[
    {g:'Su',s:8, c:'#B07830'},
    {g:'Mo',s:5, c:'#5060A0'},
    {g:'AC',s:4, c:'#C4607A'},
    {g:'Me',s:8, c:'#307080'},
    {g:'Ve',s:9, c:'#904060'},
    {g:'Ma',s:1, c:'#A03030'},
    {g:'Ju',s:7, c:'#805030'},
    {g:'Sa',s:4, c:'#604880'},
    {g:'Ur',s:11,c:'#208080'},
    {g:'Ne',s:10,c:'#304080'},
    {g:'Pl',s:8, c:'#704050'},
  ];
  const bySign={};
  PLANETS.forEach(p=>{if(!bySign[p.s])bySign[p.s]=[];bySign[p.s].push(p);});
  const xy=(r,deg)=>{const a=(deg-90)*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];};
  const arc=(ro,ri,s,e)=>{const[x1,y1]=xy(ro,s);const[x2,y2]=xy(ro,e);const[x3,y3]=xy(ri,e);const[x4,y4]=xy(ri,s);return `M${x1},${y1} A${ro},${ro} 0 0,1 ${x2},${y2} L${x3},${y3} A${ri},${ri} 0 0,0 ${x4},${y4}Z`;};
  return (
    <svg width="300" height="300" viewBox="0 0 300 300" style={{maxWidth:'100%',display:'block',margin:'0 auto'}}>
      {/* transparent — no background fill */}
      {SIGNS.map((sg,i)=><path key={i} d={arc(RO,RS,i*30,i*30+30)} fill={SC[sg.e]} stroke="rgba(0,0,0,0.07)" strokeWidth="0.5"/>)}
      {SIGNS.map((sg,i)=><path key={'pb'+i} d={arc(RS,RP,i*30,i*30+30)} fill={bySign[i]?SC[sg.e].replace('0.18','0.09'):'rgba(0,0,0,0.02)'} stroke="rgba(0,0,0,0.05)" strokeWidth="0.5"/>)}
      {SIGNS.map((_,i)=>{const[x1,y1]=xy(RP,i*30);const[x2,y2]=xy(RO,i*30);return <line key={'dl'+i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(0,0,0,0.1)" strokeWidth="0.5"/>;} )}
      <circle cx={CX} cy={CY} r={RO+1} fill="none" stroke="rgba(0,0,0,0.08)" strokeWidth="1"/>
      {SIGNS.map((sg,i)=>{const[x,y]=xy((RO+RS)/2,i*30+15);return <text key={'sg'+i} x={x} y={y} textAnchor="middle" dominantBaseline="central" fontSize="13" fill={GC[sg.e]}>{sg.g}</text>;})}
      {Object.entries(bySign).map(([si,ps])=>ps.map((p,j)=>{
        const n=ps.length;
        const[x,y]=xy((RS+RP)/2,parseInt(si)*30+15+(j-(n-1)/2)*9);
        const isAC=p.g==='AC';
        return(
          <g key={si+'-'+j}>
            <circle cx={x} cy={y} r={isAC?4:3.2} fill={p.c} opacity="0.9"/>

          </g>
        );
      }))}
      <circle cx={CX} cy={CY} r={RP} fill="rgba(255,255,255,0.35)" stroke="rgba(0,0,0,0.06)" strokeWidth="0.5"/>
      <circle cx={CX} cy={CY} r={RC} fill="rgba(255,255,255,0.55)" stroke="rgba(0,0,0,0.08)" strokeWidth="0.5"/>

      <text x={CX} y={CY+2} textAnchor="middle" fontSize="8" fill="#6050A0" fontFamily="sans-serif">Sagittarius · Virgo · Leo</text>
      <text x={CX} y={CY+15} textAnchor="middle" fontSize="7" fill="#8060B0" fontFamily="sans-serif">11 · 23 · 2005</text>
    </svg>
  );
};

const GOAL_CATEGORIES = ['Personal','Business','Health','Financial','Creative','Spiritual','Education'];
const GOAL_CAT_COLORS = {
  Personal:'#F2C4CE', Business:'#E8E0F5', Health:'#C8E6C9',

const GoalsPanel = ({ sub }) => {
  const KEY = 'nylaos_goals';
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();
  const curQ = Math.floor(curMonth/3)+1;
  const [goals, setGoals] = useState(()=>JSON.parse(localStorage.getItem(KEY)||'[]'));
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [selYear, setSelYear] = useState(curYear);
  const [selQ, setSelQ] = useState(curQ);
  const [selMonth, setSelMonth] = useState(curMonth);
  const [reflection, setReflection] = useState('');

  const getPeriodType = () => sub==='Yearly'?'yearly':sub==='Quarterly'?'quarterly':'monthly';
  const getPeriodValue = (y,q,m) => {
    if(sub==='Yearly') return String(y);
    if(sub==='Quarterly') return `${y}-Q${q}`;
    return `${y}-${String(m+1).padStart(2,'0')}`;
  };
  const periodVal = getPeriodValue(selYear,selQ,selMonth);
  const reflKey = `nylaos_reflection_${periodVal}`;

  useEffect(()=>{ setReflection(localStorage.getItem(reflKey)||''); },[reflKey]);

  const blankForm = () => ({title:'',description:'',targetDate:'',category:'',progress:0,periodType:getPeriodType(),periodValue:periodVal,milestones:[]});
  const [form, setForm] = useState(blankForm);
  const [newMilestone, setNewMilestone] = useState('');
  useEffect(()=>{ if(!showForm){ setForm(blankForm()); setNewMilestone(''); } },[sub,selYear,selQ,selMonth]);

  const save = g => { setGoals(g); localStorage.setItem(KEY,JSON.stringify(g)); };
  const submit = () => {
    if(!form.title.trim()) return;
    const ms = form.milestones||[];
    const prog = ms.length ? Math.round(ms.filter(m=>m.done).length/ms.length*100) : Math.min(100,Math.max(0,parseInt(form.progress)||0));
    if(editId) { save(goals.map(g=>g.id===editId?{...g,...form,progress:prog}:g)); setEditId(null); }
    else save([...goals,{id:Date.now(),...form,progress:prog,periodType:getPeriodType(),periodValue:periodVal,created:now.toISOString()}]);
    setForm(blankForm()); setNewMilestone(''); setShowForm(false);
  };
  const remove = id => { const g=goals.find(x=>x.id===id); if(g) addToTrash('goal',g.title,g,KEY); save(goals.filter(g=>g.id!==id)); };
  const updateProgress = (id,val) => save(goals.map(g=>g.id===id?{...g,progress:val}:g));
  const startEdit = g => { setEditId(g.id); setForm({title:g.title,description:g.description||'',targetDate:g.targetDate||'',category:g.category||'',progress:g.progress,periodType:g.periodType||getPeriodType(),periodValue:g.periodValue||periodVal,milestones:g.milestones||[]}); setNewMilestone(''); setShowForm(true); };

  const toggleMilestone = (goalId, msId) => {
    const updated = goals.map(g => {
      if(g.id!==goalId) return g;
      const ms = (g.milestones||[]).map(m=>m.id===msId?{...m,done:!m.done}:m);
      const prog = ms.length ? Math.round(ms.filter(m=>m.done).length/ms.length*100) : g.progress;
      return {...g, milestones:ms, progress:prog};
    });
    save(updated);
  };

  if(sub==='Recently Deleted') return <TrashPanel type="goal" />;

  const filtered = goals.filter(g=>{
    const pt = g.periodType||'yearly';
    if(sub==='Yearly') {
      if(pt==='yearly') return (g.periodValue||String(curYear))===String(selYear);
      if(pt==='quarterly') return (g.periodValue||'').startsWith(String(selYear)+'-Q');
      if(pt==='monthly') return (g.periodValue||'').startsWith(String(selYear)+'-');
      return false;
    }
    if(sub==='Quarterly') {
      if(pt==='quarterly') return g.periodValue===getPeriodValue(selYear,selQ,selMonth);
      if(pt==='monthly') {
        const parts=(g.periodValue||'').split('-');
        const gy=parseInt(parts[0]), gm=parseInt(parts[1]);
        return gy===selYear && Math.ceil(gm/3)===selQ;
      }
      return false;
    }
    if(sub==='Monthly') return pt==='monthly' && g.periodValue===getPeriodValue(selYear,selQ,selMonth);
    return true;
  });
  // Sort: own-period goals first, then sub-period goals by their date
  filtered.sort((a,b)=>{
    const aPrimary = a.periodType===getPeriodType()?0:1;
    const bPrimary = b.periodType===getPeriodType()?0:1;
    if(aPrimary!==bPrimary) return aPrimary-bPrimary;
    return (a.periodValue||'').localeCompare(b.periodValue||'');
  });

  const total=filtered.length, completed=filtered.filter(g=>g.progress===100).length;
  const avgProg = total ? Math.round(filtered.reduce((s,g)=>s+g.progress,0)/total) : 0;
  const byCategory = {};
  filtered.forEach(g=>{ const cat=g.category||'Uncategorized'; if(!byCategory[cat]) byCategory[cat]=[]; byCategory[cat].push(g); });

  const PeriodSelector = () => {
    const btnSt = active => ({ padding:'6px 15px', borderRadius:20, fontSize:12.5, background:active?C.rose:`${C.pink}50`, color:active?'#fff':C.rose, border:`0.5px solid ${active?C.rose:C.border}`, cursor:'pointer', transition:'all 0.14s' });
    const navBtnSt = { padding:'5px 10px', borderRadius:10, background:'transparent', border:`0.5px solid ${C.border}`, color:C.textMuted, cursor:'pointer', fontSize:13 };
    if(sub==='Yearly') return (
      <div style={{ display:'flex', gap:6, marginBottom:18, alignItems:'center' }}>
        <button onClick={()=>setSelYear(y=>y-1)} style={navBtnSt}>‹</button>
        {[curYear-1,curYear,curYear+1].map(y=><button key={y} onClick={()=>setSelYear(y)} style={btnSt(selYear===y)}>{y}</button>)}
        <button onClick={()=>setSelYear(y=>y+1)} style={navBtnSt}>›</button>
      </div>
    );
    if(sub==='Quarterly') return (
      <div style={{ display:'flex', gap:6, marginBottom:18, alignItems:'center', flexWrap:'wrap' }}>
        {[1,2,3,4].map(q=><button key={q} onClick={()=>setSelQ(q)} style={btnSt(selQ===q)}>Q{q}</button>)}
        <button onClick={()=>setSelYear(y=>y-1)} style={navBtnSt}>‹</button>
        <span style={{ fontSize:12.5, color:C.textLight, display:'flex', alignItems:'center' }}>{selYear}</span>
        <button onClick={()=>setSelYear(y=>y+1)} style={navBtnSt}>›</button>
      </div>
    );
    return (
      <div style={{ display:'flex', gap:4, marginBottom:18, alignItems:'center', flexWrap:'wrap' }}>
        <button onClick={()=>{ if(selMonth===0){setSelMonth(11);setSelYear(y=>y-1);}else setSelMonth(m=>m-1); }} style={navBtnSt}>‹</button>
        {MONTHS3.map((m,i)=><button key={m} onClick={()=>setSelMonth(i)} style={{...btnSt(selMonth===i),padding:'5px 10px',fontSize:11.5}}>{m}</button>)}
        <button onClick={()=>{ if(selMonth===11){setSelMonth(0);setSelYear(y=>y+1);}else setSelMonth(m=>m+1); }} style={navBtnSt}>›</button>
        <span style={{ fontSize:12.5, color:C.textLight, marginLeft:4 }}>{selYear}</span>
      </div>
    );
  };

  const [allTasks, setAllTasks] = useState(()=>JSON.parse(localStorage.getItem('nylaos_tasks')||'[]'));
  const toggleGoalTask = (taskId) => {
    const nowDone = !allTasks.find(t=>t.id===taskId)?.done;
    const updated = allTasks.map(t=>t.id===taskId?{...t,done:nowDone,completedDate:nowDone?toDateKey():null}:t);
    setAllTasks(updated);
    localStorage.setItem('nylaos_tasks', JSON.stringify(updated));
    // Auto-update goal progress based on linked task completion
    const linkedForGoal = (gid) => updated.filter(t=>t.goalId===gid);
    goals.forEach(g => {
      const linked = linkedForGoal(g.id);
      if (linked.length > 0) {
        const prog = Math.round(linked.filter(t=>t.done).length / linked.length * 100);
        save(goals.map(x=>x.id===g.id?{...x,progress:prog}:x));
      }
    });
  };

  const renderGoalCard = g => {
    const daysLeft = g.targetDate ? Math.ceil((new Date(g.targetDate+'T23:59:59')-new Date())/86400000) : null;
    const catColor = GOAL_CAT_COLORS[g.category]||C.pink;
    const linkedTasks = allTasks.filter(t=>t.goalId===g.id);
    return (
      <Card key={g.id} style={{ padding:'16px 18px', marginBottom:8 }}>
        <div style={{ display:'flex', alignItems:'flex-start', gap:12 }}>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:5, flexWrap:'wrap' }}>
              <div style={{ fontSize:14, fontWeight:500, color:C.text }}>{g.title}</div>
              {g.category && <span style={{ fontSize:11, padding:'2px 8px', borderRadius:10, background:catColor+'80', color:C.roseDark }}>{g.category}</span>}
              {g.progress===100 && <span style={{ fontSize:11, padding:'2px 8px', borderRadius:10, background:'#d4edda', color:'#2E7D32' }}>✓ Complete</span>}
              {g.periodType!==getPeriodType() && g.periodValue && (() => {
                let label = g.periodValue;
                if(g.periodType==='monthly') { const parts=g.periodValue.split('-'); label=MONTHS3[parseInt(parts[1])-1]+(sub==='Yearly'?' '+parts[0]:''); }
                else if(g.periodType==='quarterly') { label=g.periodValue.split('-')[1]; }
                return <span style={{ fontSize:10, padding:'2px 7px', borderRadius:10, background:`${C.lavender}60`, color:C.roseDark, fontWeight:500 }}>{label}</span>;
              })()}
            </div>
            {g.description && <div style={{ fontSize:12.5, color:C.textLight, lineHeight:1.5, marginBottom:8 }}>{g.description}</div>}
            <div style={{ marginBottom:4 }}>
              <div style={{ display:'flex', justifyContent:'space-between', marginBottom:3 }}>
                <span style={{ fontSize:11, color:C.textMuted }}>Progress</span>
                <span style={{ fontSize:11, fontWeight:600, color:C.rose }}>{g.progress}%</span>
              </div>
              <div style={{ height:6, borderRadius:3, background:`${C.pink}50`, overflow:'hidden' }}>
                <div style={{ height:'100%', borderRadius:3, background:g.progress===100?'#66bb6a':C.rose, width:`${g.progress}%`, transition:'width 0.35s' }}/>
              </div>
              <input type="range" min={0} max={100} value={g.progress} onChange={e=>updateProgress(g.id,parseInt(e.target.value))} style={{ width:'100%', marginTop:4, accentColor:C.rose }}/>
            </div>
            {daysLeft!==null && <div style={{ fontSize:11, color:daysLeft<0?C.rose:daysLeft<=7?'#e87e3e':C.textMuted }}>📅 {daysLeft<0?`${Math.abs(daysLeft)}d overdue`:daysLeft===0?'Due today':`${daysLeft} days left`}</div>}
            {(g.milestones||[]).length > 0 && (
              <div style={{ marginTop:12, paddingTop:10, borderTop:`0.5px solid ${C.border}` }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:6, fontWeight:500, letterSpacing:0.5, textTransform:'uppercase' }}>
                  Milestones · {(g.milestones||[]).filter(m=>m.done).length}/{(g.milestones||[]).length}
                </div>
                {(g.milestones||[]).map(m=>(
                  <div key={m.id} onClick={()=>toggleMilestone(g.id,m.id)} style={{ display:'flex', alignItems:'center', gap:8, padding:'4px 0', cursor:'pointer' }}>
                    <div style={{ width:14, height:14, borderRadius:4, flexShrink:0, border:`1.5px solid ${m.done?C.rose:C.accent}`, background:m.done?C.rose:'transparent', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}>
                      {m.done&&<Ico d={icons.check} size={9} stroke="#fff"/>}
                    </div>
                    <span style={{ fontSize:12.5, color:m.done?C.textMuted:C.text, textDecoration:m.done?'line-through':'none', lineHeight:1.4, flex:1 }}>{m.text}</span>
                  </div>
                ))}
              </div>
            )}
            {linkedTasks.length > 0 && (
              <div style={{ marginTop:12, paddingTop:10, borderTop:`0.5px solid ${C.border}` }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:6, fontWeight:500 }}>
                  LINKED TASKS · {linkedTasks.filter(t=>t.done).length}/{linkedTasks.length} done
                </div>
                {linkedTasks.map(t=>(
                  <div key={t.id} onClick={()=>toggleGoalTask(t.id)} style={{ display:'flex', alignItems:'center', gap:8, padding:'4px 0', cursor:'pointer' }}>
                    <div style={{ width:14, height:14, borderRadius:4, flexShrink:0, border:`1.5px solid ${t.done?C.rose:C.accent}`, background:t.done?C.rose:'transparent', display:'flex', alignItems:'center', justifyContent:'center' }}>
                      {t.done && <Ico d={icons.check} size={9} stroke="#fff" />}
                    </div>
                    <span style={{ fontSize:12.5, color:t.done?C.textMuted:C.text, textDecoration:t.done?'line-through':'none', lineHeight:1.4 }}>{t.text}</span>
                    {t.calendarDate && <span style={{ fontSize:10, color:C.textMuted, marginLeft:'auto', flexShrink:0 }}>📅 {t.calendarDate}</span>}
                  </div>
                ))}
              </div>
            )}
          </div>
          <div style={{ display:'flex', gap:5, flexShrink:0 }}>
            <button onClick={()=>startEdit(g)} style={{ padding:'4px 10px', borderRadius:7, background:`${C.accent}20`, border:`0.5px solid ${C.border}`, color:C.text, fontSize:11.5, cursor:'pointer' }}>Edit</button>
            <button onClick={()=>remove(g.id)} style={{ background:'none', border:'none', cursor:'pointer', color:C.textMuted, fontSize:18, padding:'0 2px', opacity:0.6, lineHeight:1 }}
              onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=0.6}>×</button>
          </div>
        </div>
      </Card>
    );
  };

  return (
    <div className="fade-in" style={{ maxWidth:700 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16 }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:21, color:C.rose }}>Goals</div>
        <button onClick={()=>{ setShowForm(s=>!s); setEditId(null); setForm(blankForm()); }} style={{ padding:'8px 18px', borderRadius:12, background:C.rose, color:'#fff', border:'none', fontSize:13, fontWeight:500, cursor:'pointer' }}>+ New Goal</button>
      </div>

      <PeriodSelector />

      {total>0 && (
        <Card style={{ marginBottom:16, padding:'14px 20px', display:'flex', gap:24, alignItems:'center' }}>
          <div style={{ textAlign:'center' }}>
            <div style={{ fontSize:22, fontWeight:600, color:C.rose }}>{total}</div>
            <div style={{ fontSize:10.5, color:C.textMuted, letterSpacing:0.4, textTransform:'uppercase' }}>Total</div>
          </div>
          <div style={{ textAlign:'center' }}>
            <div style={{ fontSize:22, fontWeight:600, color:'#66bb6a' }}>{completed}</div>
            <div style={{ fontSize:10.5, color:C.textMuted, letterSpacing:0.4, textTransform:'uppercase' }}>Done</div>
          </div>
          <div style={{ flex:1 }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5 }}>
              <span style={{ fontSize:12, color:C.textLight }}>Overall Progress</span>
              <span style={{ fontSize:12, fontWeight:600, color:C.rose }}>{avgProg}%</span>
            </div>
            <div style={{ height:8, borderRadius:4, background:`${C.pink}40` }}>
              <div style={{ height:'100%', borderRadius:4, background:C.rose, width:`${avgProg}%`, transition:'width 0.35s' }}/>
            </div>
          </div>
        </Card>
      )}

      {showForm && (
        <Card style={{ marginBottom:16, background:`${C.lavLight}60` }}>
          <SectionHeading>{editId?'Edit Goal':'New Goal'}</SectionHeading>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            <InlineInput value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Goal title" style={{ width:'100%' }}/>
            <TextArea value={form.description} height={70} placeholder="Describe your goal..." onChange={e=>setForm(f=>({...f,description:e.target.value}))}/>
            <div style={{ display:'flex', gap:10 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:11.5, color:C.textLight, marginBottom:4 }}>Target Date</div>
                <input type="date" value={form.targetDate} onChange={e=>setForm(f=>({...f,targetDate:e.target.value}))} style={{ width:'100%', padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:13 }}/>
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:11.5, color:C.textLight, marginBottom:4 }}>Category</div>
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} style={{ width:'100%', padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:13 }}>
                  <option value="">No category</option>
                  {GOAL_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div>
              <div style={{ fontSize:11.5, color:C.textLight, marginBottom:6 }}>Milestones {form.milestones.length>0&&<span style={{color:C.textMuted}}>({form.milestones.filter(m=>m.done).length}/{form.milestones.length} done)</span>}</div>
              {form.milestones.map(m=>(
                <div key={m.id} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                  <div onClick={()=>setForm(f=>({...f,milestones:f.milestones.map(x=>x.id===m.id?{...x,done:!x.done}:x)}))}
                    style={{width:14,height:14,borderRadius:4,flexShrink:0,border:`1.5px solid ${m.done?C.rose:C.accent}`,background:m.done?C.rose:'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {m.done&&<Ico d={icons.check} size={9} stroke="#fff"/>}
                  </div>
                  <span style={{flex:1,fontSize:12.5,color:m.done?C.textMuted:C.text,textDecoration:m.done?'line-through':'none'}}>{m.text}</span>
                  <button onClick={()=>setForm(f=>({...f,milestones:f.milestones.filter(x=>x.id!==m.id)}))} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:15,lineHeight:1,padding:'0 2px'}}>×</button>
                </div>
              ))}
              <div style={{display:'flex',gap:6,marginTop:4}}>
                <input value={newMilestone} onChange={e=>setNewMilestone(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter'&&newMilestone.trim()){setForm(f=>({...f,milestones:[...f.milestones,{id:Date.now(),text:newMilestone.trim(),done:false}]}));setNewMilestone('');}}}
                  placeholder="Add a milestone, press Enter…" style={{flex:1,padding:'7px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12.5,outline:'none'}}/>
                <button onClick={()=>{if(newMilestone.trim()){setForm(f=>({...f,milestones:[...f.milestones,{id:Date.now(),text:newMilestone.trim(),done:false}]}));setNewMilestone('');}}}
                  style={{padding:'7px 12px',borderRadius:8,background:`${C.pink}50`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:12,cursor:'pointer'}}>+</button>
              </div>
            </div>
            <div>
              <div style={{ fontSize:11.5, color:C.textLight, marginBottom:4 }}>
                {form.milestones.length>0 ? `Progress — auto-calculated from milestones (${Math.round(form.milestones.filter(m=>m.done).length/form.milestones.length*100)}%)` : `Initial Progress — ${form.progress}%`}
              </div>
              <input type="range" min={0} max={100} value={form.milestones.length>0?Math.round(form.milestones.filter(m=>m.done).length/form.milestones.length*100):form.progress} disabled={form.milestones.length>0} onChange={e=>setForm(f=>({...f,progress:parseInt(e.target.value)}))} style={{ width:'100%', accentColor:C.rose, opacity:form.milestones.length>0?0.5:1 }}/>
            </div>
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
              <button onClick={()=>{setShowForm(false);setEditId(null);}} style={{ padding:'7px 14px', borderRadius:10, background:`${C.pink}50`, border:`0.5px solid ${C.border}`, color:C.rose, fontSize:12.5, cursor:'pointer' }}>Cancel</button>
              <button onClick={submit} style={{ padding:'7px 18px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:12.5, cursor:'pointer' }}>{editId?'Update':'Create'}</button>
            </div>
          </div>
        </Card>
      )}

      {Object.keys(byCategory).length>0 ? (
        Object.entries(byCategory).map(([cat,catGoals])=>(
          <div key={cat} style={{ marginBottom:20 }}>
            <div style={{ fontSize:10.5, fontWeight:600, color:C.textMuted, letterSpacing:0.8, textTransform:'uppercase', marginBottom:8, paddingLeft:2 }}>{cat}</div>
            {catGoals.map(renderGoalCard)}
          </div>
        ))
      ) : (
        <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'28px 4px' }}>No goals for this period yet — hit "+ New Goal" to start.</div>
      )}

      {(sub==='Quarterly'||sub==='Monthly') && (
        <Card style={{ marginTop:24 }}>
          <SectionHeading>Reflection & Review</SectionHeading>
          <div style={{ fontSize:12, color:C.textLight, marginBottom:10 }}>
            {sub==='Quarterly'?`Q${selQ} ${selYear} — What did you accomplish? What will you do differently?`:`${MONTHS[selMonth]} ${selYear} — How did this month go? What are you proud of?`}
          </div>
          <TextArea value={reflection} height={100} placeholder="Write your reflection here..."
            onChange={e=>{ setReflection(e.target.value); localStorage.setItem(reflKey,e.target.value); }}/>
        </Card>
      )}

      {sub==='Yearly' && (
        <Card style={{ marginTop:24 }}>
          <SectionHeading>Year Theme & Reflection</SectionHeading>
          <ReflectionArea storageKey={`nylaos_reflection_year_${selYear}`} placeholder={`What is your theme or intention for ${selYear}? What do you want to create, become, or achieve?`} height={110} />
        </Card>
      )}
    </div>
  );
};

const ReflectionArea = ({ storageKey, placeholder, height=100 }) => {
  const [val, setVal] = useState(()=>localStorage.getItem(storageKey)||'');
  return <TextArea value={val} height={height} placeholder={placeholder} onChange={e=>{ setVal(e.target.value); localStorage.setItem(storageKey,e.target.value); }}/>;
};

        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {[['code','Code','80px'],['name','Course Name','1 1 200px'],['semester','Semester','100px']].map(([field,ph,w])=>(
            <input key={field} value={form[field]} onChange={e=>setForm(f=>({...f,[field]:e.target.value}))} placeholder={ph}
              style={{ flex:w, minWidth:w.includes('px')?w:undefined, padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>

            {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n} cr</option>)}

            {Object.keys(GRADE_POINTS).map(g=><option key={g} value={g}>{g}</option>)}

      {courses.length===0

            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:500, color:C.rose }}>{c.name}</div>
              <div style={{ fontSize:12, color:C.textLight }}>{c.code}{c.semester?` · ${c.semester}`:''} · {c.credits} credits</div>
            </div>
            <button onClick={()=>save(courses.filter(x=>x.id!==c.id))} style={{ background:'none', border:'none', cursor:'pointer', color:C.textMuted, fontSize:18, opacity:0.6 }}>×</button>
          </Card>
        ))
      }
    </div>
  );
};

const AssignmentTracker = () => {
  const key = 'nylaos_assignments';
  const coursesKey = 'nylaos_courses';
  const [assignments, setAssignments] = useState(()=>JSON.parse(localStorage.getItem(key)||'[]'));
  const courses = JSON.parse(localStorage.getItem(coursesKey)||'[]');
  const [form, setForm] = useState({title:'',course:'',dueDate:'',priority:'medium',status:'pending'});
  const save = a => { setAssignments(a); localStorage.setItem(key,JSON.stringify(a)); };
  const add = () => {
    if (!form.title.trim()) return;
    save([...assignments,{id:Date.now(),...form}]);
    setForm({title:'',course:'',dueDate:'',priority:'medium',status:'pending'});
  };
  const toggle = id => save(assignments.map(a=>a.id===id?{...a,status:a.status==='completed'?'pending':'completed'}:a));
  const priorityColor = p => p==='high'?C.rose:p==='medium'?'#F4A261':'#4CAF77';
  const upcoming = assignments.filter(a=>a.status!=='completed').sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  const done = assignments.filter(a=>a.status==='completed');
  return (
    <div className="fade-in" style={{ maxWidth:680 }}>
      <PageTitle>Assignments</PageTitle>
      <Card style={{ marginBottom:16, padding:'14px 16px' }}>
        <SectionHeading>Add Assignment</SectionHeading>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Assignment title"
            style={{ flex:'1 1 200px', padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
          <select value={form.course} onChange={e=>setForm(f=>({...f,course:e.target.value}))}
            style={{ flex:'1 1 120px', padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}>
            <option value="">Course</option>
            {courses.map(c=><option key={c.id} value={c.code||c.name}>{c.code||c.name}</option>)}
          </select>
          <input type="date" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}
            style={{ padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
          <select value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}
            style={{ padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}>
            <option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
          </select>
          <button onClick={add} style={{ padding:'8px 18px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>Add</button>
        </div>
      </Card>
      {upcoming.length===0&&done.length===0
        ? <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'16px 4px' }}>No assignments yet. You\'re free! 🎉</div>
        : null}
      {upcoming.map(a=>{
        const overdue = a.dueDate && new Date(a.dueDate+'T23:59:59') < new Date();
        const daysUntil = a.dueDate ? Math.ceil((new Date(a.dueDate+'T23:59:59')-new Date())/86400000) : null;
        return (
          <Card key={a.id} style={{ marginBottom:8, padding:'12px 16px', display:'flex', alignItems:'center', gap:12 }}>
            <Checkbox checked={false} onChange={()=>toggle(a.id)} />
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13.5, fontWeight:500, color:C.rose }}>{a.title}</div>
              <div style={{ fontSize:12, color:C.textLight, marginTop:2 }}>
                {a.course && <span>{a.course} · </span>}
                {a.dueDate && <span style={{ color: overdue?C.rose:daysUntil<=2?'#F4A261':C.textLight }}>
                  {overdue?'Overdue':daysUntil===0?'Due today':daysUntil===1?'Due tomorrow':`Due in ${daysUntil} days`}
                </span>}
              </div>
            </div>

const GPACalculator = () => {
  const key = 'nylaos_gpa_entries';
  const [entries, setEntries] = useState(()=>JSON.parse(localStorage.getItem(key)||'[]'));
  const [form, setForm] = useState({course:'',credits:'3',grade:'A'});
  const save = e => { setEntries(e); localStorage.setItem(key,JSON.stringify(e)); };
  const add = () => {
    if (!form.course.trim()) return;
    save([...entries,{id:Date.now(),...form,credits:parseInt(form.credits)||3,points:GRADE_POINTS[form.grade]??0}]);
    setForm({course:'',credits:'3',grade:'A'});
  };
  const validEntries = entries.filter(e=>e.points!=null);
  const totalCredits = validEntries.reduce((s,e)=>s+e.credits,0);
  const totalPoints = validEntries.reduce((s,e)=>s+e.points*e.credits,0);
  const gpa = totalCredits>0 ? (totalPoints/totalCredits).toFixed(2) : '—';
  const gpaColor = parseFloat(gpa)>=3.7?'#4CAF77':parseFloat(gpa)>=3.0?C.accent:C.rose;
  return (
    <div className="fade-in" style={{ maxWidth:580 }}>
      <PageTitle>GPA Calculator</PageTitle>
      <Card style={{ textAlign:'center', marginBottom:16, background:C.gradA, padding:'24px' }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:48, color:gpaColor, fontWeight:600 }}>{gpa}</div>
        <div style={{ fontSize:13, color:C.textLight, marginTop:4 }}>Cumulative GPA · {totalCredits} credit hours</div>
      </Card>
      <Card style={{ marginBottom:14, padding:'14px 16px' }}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={form.course} onChange={e=>setForm(f=>({...f,course:e.target.value}))} placeholder="Course name"
            style={{ flex:'1 1 160px', padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
          <select value={form.credits} onChange={e=>setForm(f=>({...f,credits:e.target.value}))}
            style={{ padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}>
            {[1,2,3,4,5,6].map(n=><option key={n} value={n}>{n} cr</option>)}
          </select>
          <select value={form.grade} onChange={e=>setForm(f=>({...f,grade:e.target.value}))}
            style={{ padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}>
            {Object.keys(GRADE_POINTS).map(g=><option key={g} value={g}>{g} ({GRADE_POINTS[g]??'—'})</option>)}
          </select>
          <button onClick={add} style={{ padding:'8px 18px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>Add</button>
        </div>
      </Card>
      <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
        {entries.map(e=>(
          <Card key={e.id} style={{ padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ width:36, height:36, borderRadius:9, background:`${C.lavender}80`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13, fontWeight:600, color:C.rose, flexShrink:0 }}>{e.grade}</div>
            <span style={{ flex:1, fontSize:13.5, color:C.text }}>{e.course}</span>
            <span style={{ fontSize:12, color:C.textLight }}>{e.credits} cr</span>
            <span style={{ fontSize:13, fontWeight:500, color:C.rose }}>{e.points?.toFixed(1)}</span>
            <button onClick={()=>save(entries.filter(x=>x.id!==e.id))} style={{ background:'none', border:'none', cursor:'pointer', color:C.textMuted, fontSize:18, opacity:0.6 }}>×</button>
          </Card>
        ))}
        {entries.length===0 && <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'12px 4px' }}>Add courses to calculate your GPA.</div>}
      </div>
    </div>
  );
};

    if(!input.trim()||loading) return;
    const key=localStorage.getItem('nylaos_api_key');
    if(!key){alert('Add your API key in Settings → API Keys first');return;}
    if(!sessionId.current) sessionId.current=Date.now();

      execAgentCmd(reply);

          </div>
        </Card>
      )}

            onDelete={!isDefault(a)?()=>save(agents.filter(x=>x.id!==a.id)):null}/>
        ))}
      </div>
    </div>
  );
};

/* ── Notifications ──────────────────────────────────────────────── */
const NotificationsPanel = () => {
  const key = 'nylaos_notif';
  const [prefs, setPrefs] = useState(() => JSON.parse(localStorage.getItem(key) || '{"enabled":false,"time":"08:00","include":["tasks","goals","calendar"],"digest":""}'));
  const [permission, setPermission] = useState(() => (typeof Notification !== 'undefined' ? Notification.permission : 'denied'));
  const [digest, setDigest] = useState('');
  const [copied, setCopied] = useState(false);

  const save = p => { setPrefs(p); localStorage.setItem(key, JSON.stringify(p)); };
  const toggle = field => save({...prefs, [field]: !prefs[field]});

  const requestPermission = async () => {
    if(typeof Notification === 'undefined') return;
    const result = await Notification.requestPermission();
    setPermission(result);
  };

  // Build morning digest text
  const buildDigest = () => {
    const tasks  = JSON.parse(localStorage.getItem('nylaos_tasks')||'[]').filter(t=>!t.done);
    const goals  = JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
    const userName = JSON.parse(localStorage.getItem('nylaos_profile')||'{"name":"Nyla"}').name || 'Nyla';
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

    let lines = [`Good morning, ${userName}! ✦ ${dateStr}`, ''];

    if(tasks.length > 0) {
      lines.push('📋 Tasks for today:');
      tasks.slice(0,8).forEach(t => lines.push(`  • ${t.text}`));
      if(tasks.length > 8) lines.push(`  + ${tasks.length-8} more`);
      lines.push('');
    } else {
      lines.push('✅ No pending tasks — your day is clear!', '');
    }

    const todayGoals = goals.filter(g => g.progress < 100).slice(0,3);
    if(todayGoals.length > 0) {
      lines.push('🎯 Active goals:');
      todayGoals.forEach(g => lines.push(`  • ${g.title} (${g.progress}%)`));
      lines.push('');
    }

    // Calendar events today
    const todayKey = `nylaos_events_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const events = JSON.parse(localStorage.getItem(todayKey)||'[]');
    if(events.length > 0) {
      lines.push("📅 Today's schedule:");
      events.forEach(e => lines.push(`  ${e.time ? e.time+' — ' : ''}${e.label}`));
      lines.push('');
    }

    lines.push('You got this. Make it count. 💫');
    return lines.join('\n');
  };

  const previewDigest = () => setDigest(buildDigest());

  const copyDigest = () => {
    navigator.clipboard.writeText(buildDigest()).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  };

  // Schedule browser notification at set time (fires when tab is open)
  useEffect(() => {
    if(!prefs.enabled || permission !== 'granted') return;
    const [h, m] = (prefs.time || '08:00').split(':').map(Number);
    const now = new Date();
    const target = new Date(now);
    target.setHours(h, m, 0, 0);
    if(target <= now) target.setDate(target.getDate() + 1);
    const delay = target - now;
    const timer = setTimeout(() => {
      const body = buildDigest().split('\n').slice(2, 7).join('\n');
      new Notification('Good morning ✦', { body, icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">✦</text></svg>' });
    }, delay);
    return () => clearTimeout(timer);
  }, [prefs.enabled, prefs.time, permission]);

  const INCLUDE_OPTS = [{id:'tasks',label:'Tasks'},{id:'goals',label:'Goals'},{id:'calendar',label:'Calendar'}];

  const pillSt = active => ({
    padding:'6px 14px', borderRadius:20, fontSize:12.5, cursor:'pointer', fontFamily:'inherit',
    background: active ? C.rose : 'transparent',
    color: active ? '#fff' : C.textLight,
    border: `1px solid ${active ? C.rose : C.border}`,
    transition:'all 0.14s',
  });

  return (
    <div className="fade-in" style={{ maxWidth:520 }}>
      <PageTitle>Notifications</PageTitle>

      {/* Browser notification permission */}
      <Card style={{ marginBottom:14 }}>
        <SectionHeading>Browser Notifications</SectionHeading>
        <div style={{ fontSize:13, color:C.textLight, lineHeight:1.7, marginBottom:12 }}>
          Get a pop-up notification in Chrome at your chosen time — shows your tasks, goals, and schedule. Works whenever the dashboard is open.
        </div>
        {permission === 'granted' ? (
          <div style={{ fontSize:13, color:'#4CAF77', fontWeight:500 }}>✓ Notifications are allowed</div>
        ) : permission === 'denied' ? (
          <div style={{ fontSize:13, color:C.rose }}>⚠ Blocked — go to Chrome Settings → Site Settings → Notifications to allow file:// sites</div>
        ) : (
          <button onClick={requestPermission}
            style={{ padding:'9px 20px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>
            Enable Notifications
          </button>
        )}
      </Card>

      {/* Morning digest settings */}
      <Card style={{ marginBottom:14 }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <SectionHeading style={{ marginBottom:0 }}>Morning Digest</SectionHeading>
          <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
            <div onClick={()=>save({...prefs,enabled:!prefs.enabled})}
              style={{ width:38, height:22, borderRadius:11, background:prefs.enabled?C.rose:C.border,
                position:'relative', transition:'background 0.2s', cursor:'pointer' }}>
              <div style={{ position:'absolute', top:3, left:prefs.enabled?18:3, width:16, height:16,
                borderRadius:'50%', background:'#fff', transition:'left 0.2s', boxShadow:'0 1px 4px rgba(0,0,0,0.2)' }}/>
            </div>
            <span style={{ fontSize:12.5, color:prefs.enabled?C.rose:C.textMuted }}>
              {prefs.enabled ? 'On' : 'Off'}
            </span>
          </label>
        </div>

        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:14 }}>
          <span style={{ fontSize:13, color:C.textLight }}>Send at</span>
          <input type="time" value={prefs.time || '08:00'} onChange={e=>save({...prefs,time:e.target.value})}
            style={{ padding:'7px 12px', borderRadius:10, border:`1px solid ${C.border}`, background:C.pinkLight,
              color:C.rose, fontSize:13, fontFamily:'inherit', cursor:'pointer' }}/>
        </div>

        <div style={{ marginBottom:6 }}>
          <span style={{ fontSize:12.5, color:C.textLight, display:'block', marginBottom:8 }}>Include in digest:</span>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            {INCLUDE_OPTS.map(o => {
              const active = (prefs.include || []).includes(o.id);
              return (
                <button key={o.id} style={pillSt(active)} onClick={()=>{
                  const inc = prefs.include || [];
                  save({...prefs, include: active ? inc.filter(x=>x!==o.id) : [...inc, o.id]});
                }}>{o.label}</button>
              );
            })}
          </div>
        </div>
      </Card>

      {/* Morning digest preview */}
      <Card>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <SectionHeading style={{ marginBottom:0 }}>Your Morning Text</SectionHeading>
          <div style={{ display:'flex', gap:8 }}>
            <button onClick={previewDigest}
              style={{ fontSize:12, padding:'5px 12px', borderRadius:20, background:'transparent', color:C.rose, border:`1px solid ${C.rose}`, cursor:'pointer', fontFamily:'inherit' }}>
              Preview
            </button>
            <button onClick={copyDigest}
              style={{ fontSize:12, padding:'5px 12px', borderRadius:20, background:C.rose, color:'#fff', border:'none', cursor:'pointer', fontFamily:'inherit' }}>
              {copied ? '✓ Copied!' : 'Copy'}
            </button>
          </div>
        </div>
        <div style={{ fontSize:12.5, color:C.textMuted, marginBottom:10, lineHeight:1.6 }}>
          Every morning when you open the dashboard you'll see a browser notification. You can also <strong style={{color:C.textLight}}>Copy</strong> the digest and paste it into iMessage, WhatsApp, or anywhere else.
        </div>
        {digest ? (
          <pre style={{ fontSize:12.5, color:C.text, lineHeight:1.8, whiteSpace:'pre-wrap', fontFamily:'inherit',
            background:C.pinkLight, borderRadius:10, padding:'12px 14px', border:`0.5px solid ${C.border}` }}>
            {digest}
          </pre>
        ) : (
          <div style={{ fontSize:13, color:C.textMuted, fontStyle:'italic' }}>
            Click Preview to see what your morning digest looks like →
          </div>
        )}
      </Card>
    </div>
  );
};

/* ── Backup & Restore ───────────────────────────────────────────── */
const BackupPanel = () => {
  const importRef = useRef(null);
  const [restoreMsg, setRestoreMsg] = useState('');

  const exportData = () => {
    const data = {};
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      // Exclude the auto-backup key itself — it would just be nested redundant data
      if(k && k.startsWith('nylaos_') && k !== 'nylaos_auto_bak') data[k] = localStorage.getItem(k);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `nyla-os-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const restoreFromData = (data) => {
    let count = 0;
    Object.entries(data).forEach(([k,v]) => {
      if(k.startsWith('nylaos_') && k !== '__savedAt' && k !== 'nylaos_auto_bak'){
        localStorage.setItem(k, v); count++;
      }
    });
    return count;
  };

  const importData = (file) => {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        const count = restoreFromData(data);
        setRestoreMsg(`✓ Restored ${count} items. Reload the page to see your data.`);
      } catch(err) {
        setRestoreMsg("⚠ Could not read backup file — make sure it's a valid Nyla OS backup.");
      }
    };
    reader.readAsText(file);
  };

  const restoreAutoBackup = () => {
    try {
      const raw = localStorage.getItem('nylaos_auto_bak');
      if (!raw) { setRestoreMsg("⚠ No auto-backup found."); return; }
      const data = JSON.parse(raw);
      const count = restoreFromData(data);
      setRestoreMsg(`✓ Restored ${count} items from last session backup. Reload to see your data.`);
    } catch {
      setRestoreMsg("⚠ Auto-backup could not be read.");
    }
  };

  const autoBackup = (() => {
    try { return JSON.parse(localStorage.getItem('nylaos_auto_bak') || 'null'); } catch { return null; }
  })();
  const autoBackupDate = autoBackup?.__savedAt
    ? new Date(autoBackup.__savedAt).toLocaleString()
    : null;

  const keyCount = Array.from({length:localStorage.length},(_,i)=>localStorage.key(i))
    .filter(k=>k&&k.startsWith('nylaos_')&&k!=='nylaos_auto_bak').length;

  const msgStyle = ok => ({ marginTop:12, fontSize:13,
    color: ok ? '#4CAF77' : '#E07050', padding:'10px 14px', borderRadius:10,
    background: ok ? '#4CAF7715' : '#E0705015',
    border:`0.5px solid ${ok?'#4CAF77':'#E07050'}` });

  return (
    <div className="fade-in" style={{ maxWidth:500 }}>
      <PageTitle>Backup & Restore</PageTitle>

      {/* Auto-backup status */}
      {autoBackupDate && (
        <Card style={{ marginBottom:14, background: C.lavLight }}>
          <SectionHeading>Auto-Backup</SectionHeading>
          <div style={{ fontSize:13, color:C.textLight, lineHeight:1.7, marginBottom:12 }}>
            Nyla OS automatically snapshots your data every time the page loads, so a code update can never erase your information. Your last snapshot was saved on <strong>{autoBackupDate}</strong>.
          </div>
          <button onClick={restoreAutoBackup}
            style={{ padding:'8px 18px', borderRadius:10, background:'transparent', color:C.accent,
              border:`1.5px solid ${C.accent}`, fontSize:13, cursor:'pointer', fontFamily:'inherit', fontWeight:500 }}>
            ↩ Restore from last session
          </button>
          {restoreMsg && restoreMsg.includes('session') && (
            <div style={msgStyle(restoreMsg.startsWith('✓'))}>{restoreMsg}</div>
          )}
        </Card>
      )}

      <Card style={{ marginBottom:14 }}>
        <SectionHeading>Export Your Data</SectionHeading>
        <div style={{ fontSize:13, color:C.textLight, lineHeight:1.7, marginBottom:14 }}>
          Download all your Nyla OS data — tasks, calendar, notes, goals, business info — as a JSON file. Keep it somewhere safe so you can restore it any time.
        </div>
        <div style={{ fontSize:12, color:C.textMuted, marginBottom:14 }}>
          {keyCount} data {keyCount===1?'record':'records'} currently stored
        </div>
        <button onClick={exportData}
          style={{ padding:'10px 22px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13.5, cursor:'pointer', fontFamily:'inherit', fontWeight:500 }}>
          ⬇ Download Backup
        </button>
      </Card>

      <Card>
        <SectionHeading>Restore From Backup</SectionHeading>
        <div style={{ fontSize:13, color:C.textLight, lineHeight:1.7, marginBottom:14 }}>
          Upload a previously downloaded backup file to restore your data. This will merge the backup with any existing data.
        </div>
        <input ref={importRef} type="file" accept=".json" style={{ display:'none' }}
          onChange={e=>{ importData(e.target.files[0]); e.target.value=''; }}/>
        <button onClick={()=>importRef.current&&importRef.current.click()}
          style={{ padding:'10px 22px', borderRadius:10, background:'transparent', color:C.rose, border:`1.5px solid ${C.rose}`, fontSize:13.5, cursor:'pointer', fontFamily:'inherit', fontWeight:500 }}>
          ⬆ Restore From File
        </button>
        {restoreMsg && !restoreMsg.includes('session') && (
          <div style={msgStyle(restoreMsg.startsWith('✓'))}>{restoreMsg}</div>
        )}
      </Card>
    </div>
  );
};

/* ── Settings ───────────────────────────────────────────────────── */
const ChatHistoryPanel = () => {
  const [history, setHistory] = useState(()=>JSON.parse(localStorage.getItem('nylaos_chat_history')||'[]'));
  const [expanded, setExpanded] = useState(null);

  const deleteSession = id => {
    const updated = history.filter(h=>h.id!==id);
    setHistory(updated);
    localStorage.setItem('nylaos_chat_history', JSON.stringify(updated));
    if (expanded===id) setExpanded(null);
  };
  const clearAll = () => {
    if (!window.confirm('Delete all chat history?')) return;

/* ── Agent Memory / Cross-Chat Context ─────────────────────────── */
const buildAgentContext = (agentName = null) => {
  try {
    const history = JSON.parse(localStorage.getItem('nylaos_chat_history') || '[]');
    const tasks   = JSON.parse(localStorage.getItem('nylaos_tasks')        || '[]');
    const goals   = JSON.parse(localStorage.getItem('nylaos_goals')        || '[]');
    const profile = JSON.parse(localStorage.getItem('nylaos_profile')      || '{"name":"Nyla"}');
    const today   = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});

    const pending = tasks.filter(t=>!t.done&&t.source!=='calendar').slice(0,6).map(t=>t.text);
    const activeGoals = goals.slice(0,5).map(g=>`${g.title} (${g.progress}%)`);

    // Pull last 3 sessions from ANY agent/chat (cross-reference)
    const sessions = history
      .filter(s=>s.msgs&&s.msgs.some(m=>m.role==='user'))
      .slice(0,3);

    const stripCmd = s => s.replace(/\[CMD:\{[\s\S]*?\}\]/g,'').trim();

    let ctx = `\n\n--- NYLA'S CONTEXT (${today}) ---`;
    ctx += `\nName: ${profile.name||'Nyla'}`;
    if (pending.length)     ctx += `\nPending tasks: ${pending.join(' · ')}`;
    if (activeGoals.length) ctx += `\nActive goals: ${activeGoals.join(' · ')}`;

    if (sessions.length) {
      ctx += '\n\nMemory from recent conversations:';
      sessions.forEach(sess => {
        const d = new Date(sess.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        ctx += `\n[${d} – ${sess.label}]`;
        // last 4 messages (2 exchanges)
        sess.msgs.slice(-4).forEach(m => {
          const who = m.role==='user' ? 'Nyla' : sess.label;
          const txt = stripCmd(m.text||'').slice(0,140);
          if (txt) ctx += `\n  ${who}: ${txt}`;
        });
      });
    }
    ctx += '\n--- END CONTEXT ---\n';
    return ctx;
  } catch(e) { return ''; }
};

/* ── Shared Agent Command Executor ─────────────────────────────── */
const AGENT_CMD_DOCS = `

You can take direct action in Nyla's dashboard. When she asks you to create or update something, respond conversationally then include ONE command block at the END:
- Add task:              [CMD:{"action":"addTask","text":"task text"}]
- Complete task:         [CMD:{"action":"completeTask","text":"partial task name"}]
- Add goal:              [CMD:{"action":"addGoal","title":"goal title","category":"Personal|Business|Health|Financial|Creative|Spiritual|Education","periodType":"monthly|quarterly|yearly","periodValue":"YYYY-MM or YYYY-QN or YYYY","targetDate":"YYYY-MM-DD"}]
- Update goal progress:  [CMD:{"action":"updateGoalProgress","title":"goal title","progress":50}]
- Add single event:      [CMD:{"action":"addEvent","date":"YYYY-MM-DD","text":"event description"}]
- Add recurring event:   [CMD:{"action":"addRecurringEvent","startDate":"YYYY-MM-DD","text":"event description","frequency":"daily|weekly|biweekly|monthly","count":12}]
- Add note:              [CMD:{"action":"addNote","folder":"All Notes","name":"page title","content":"note content"}]
- Create notebook:       [CMD:{"action":"createNotebook","name":"notebook folder name"}]

For recurring events: frequency is daily/weekly/biweekly/monthly; count defaults to 26 (weekly), 12 (monthly), 14 (daily). Max 100 occurrences.
Only include ONE command per response, and only when actually performing the action.`;

const execAgentCmd = text => {
  const match = text.match(/\[CMD:(\{[\s\S]*?\})\]/);
  if (!match) return;
  try {
    const cmd = JSON.parse(match[1]);
    if (cmd.action==='addTask') {
      const t=JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
      t.push({id:Date.now(),text:cmd.text,done:false,created:new Date().toISOString()});
      localStorage.setItem('nylaos_tasks',JSON.stringify(t));
    } else if (cmd.action==='completeTask') {
      const t=JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
      const q=(cmd.text||'').toLowerCase();
      localStorage.setItem('nylaos_tasks',JSON.stringify(t.map(x=>x.text.toLowerCase().includes(q)?{...x,done:true}:x)));
    } else if (cmd.action==='addGoal') {
      const now=new Date();
      const g=JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
      const pt=cmd.periodType||'monthly';
      const pv=cmd.periodValue||`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      g.push({id:Date.now(),title:cmd.title,description:cmd.description||'',targetDate:cmd.targetDate||'',category:cmd.category||'',progress:0,periodType:pt,periodValue:pv,created:now.toISOString()});
      localStorage.setItem('nylaos_goals',JSON.stringify(g));
    } else if (cmd.action==='updateGoalProgress') {
      const g=JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
      const q=(cmd.title||'').toLowerCase();
      localStorage.setItem('nylaos_goals',JSON.stringify(g.map(x=>x.title.toLowerCase().includes(q)?{...x,progress:Math.min(100,Math.max(0,parseInt(cmd.progress)||0))}:x)));
    } else if (cmd.action==='addEvent') {
      const e=JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      e.push({id:Date.now(),date:cmd.date,text:cmd.text});
      localStorage.setItem('nylaos_events',JSON.stringify(e));
    } else if (cmd.action==='addRecurringEvent') {
      const e=JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      const freq=cmd.frequency||'weekly';
      const defaultCounts={daily:14,weekly:26,biweekly:13,monthly:12};
      const count=Math.min(Math.max(1,parseInt(cmd.count)||defaultCounts[freq]||12),100);
      const groupId=Date.now();
      const start=new Date(cmd.startDate);
      if(isNaN(start.getTime())) throw new Error('Invalid startDate');
      for(let i=0;i<count;i++){
        const d=new Date(start);
        if(freq==='daily')      d.setDate(d.getDate()+i);
        else if(freq==='weekly') d.setDate(d.getDate()+i*7);
        else if(freq==='biweekly') d.setDate(d.getDate()+i*14);
        else if(freq==='monthly')  d.setMonth(d.getMonth()+i);
        const dateStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        e.push({id:groupId+i,date:dateStr,text:cmd.text,recurringGroupId:groupId});
      }
      localStorage.setItem('nylaos_events',JSON.stringify(e));
    } else if (cmd.action==='addNote') {
      const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
      const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
      const folder=folders.find(f=>f.name===(cmd.folder||'All Notes'));
      pages.push({id:Date.now(),name:cmd.name||'New Note',folderId:folder?folder.id:1,content:cmd.content||'',created:new Date().toISOString(),updated:new Date().toISOString()});
      localStorage.setItem('nylaos_nb_pages',JSON.stringify(pages));
    } else if (cmd.action==='createNotebook') {
      const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
      folders.push({id:Date.now(),name:cmd.name||'New Notebook',created:new Date().toISOString()});
      localStorage.setItem('nylaos_nb_folders',JSON.stringify(folders));
    }
  } catch(e) { console.error('Agent CMD error',e); }
};

/* ── Floating AI Chat ───────────────────────────────────────────── */
const FLOAT_SYSTEM = `You are Nyla's personal dashboard assistant — warm, wise, and efficient. You help manage her tasks, goals, calendar, and notes. Always be warm and concise.${AGENT_CMD_DOCS}`;

const FloatingChat = () => {
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([{role:'assistant',text:'Hi Nyla ✦ I\'m here to help — ask me anything or say "add task..." to update your dashboard directly.'}]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const sessionId = useRef(null);
  const endRef = useRef(null);
  useEffect(()=>{ if(open||fullscreen) endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading,open,fullscreen]);
  useEffect(()=>{ window._openFloatingChat=()=>setOpen(true); return ()=>{ delete window._openFloatingChat; }; },[]);

  const send = async () => {
    if (!input.trim()||loading) return;
    const apiKey=localStorage.getItem('nylaos_api_key');
    if (!apiKey) { setMsgs(m=>[...m,{role:'assistant',text:'Please add your API key in Settings → API Keys first.'}]); return; }
    if(!sessionId.current) sessionId.current=Date.now();
    const userText=input.trim();
    const history=[...msgs,{role:'user',text:userText}];
    setMsgs(history); setInput(''); setLoading(true);
    try {
      const floatSystem=FLOAT_SYSTEM+buildAgentContext(null);
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:800,system:floatSystem,messages:history.map(m=>({role:m.role,content:m.text}))}),
      });
      const data=await res.json();
      const reply=data.content?.[0]?.text||'Sorry, I had trouble with that.';
      const updated=[...history,{role:'assistant',text:reply}];
      setMsgs(updated);
      execAgentCmd(reply);
      saveChatSession(sessionId.current,'Quick Chat','float',updated);
    } catch(e) {
      setMsgs(m=>[...m,{role:'assistant',text:'⚠️ Connection issue. Check your API key in Settings.'}]);
    } finally { setLoading(false); }
  };

  const renderMsgs = () => (<>
    {msgs.map((m,i)=>(
      <div key={i} style={{ display:'flex', justifyContent:m.role==='user'?'flex-end':'flex-start' }}>
        <div style={{ maxWidth:'86%', padding:'9px 13px', borderRadius:14, fontSize:12.5, lineHeight:1.65,
          background:m.role==='user'?C.rose:`${C.lavender}CC`, color:m.role==='user'?'#fff':C.rose,
          borderBottomRightRadius:m.role==='user'?3:14, borderBottomLeftRadius:m.role==='assistant'?3:14, whiteSpace:'pre-wrap',
        }}>{m.text.replace(/\[CMD:\{[\s\S]*?\}\]/,'').trim()}</div>
      </div>
    ))}
    {loading && <div style={{ display:'flex' }}><div style={{ padding:'9px 14px', borderRadius:14, background:`${C.lavender}CC`, borderBottomLeftRadius:3, fontSize:12.5, color:C.textLight }}>✦ thinking...</div></div>}
    <div ref={endRef}/>
  </>);

  const renderInput = () => (
    <div style={{ padding:'10px 12px', borderTop:`0.5px solid ${C.border}`, display:'flex', gap:8, flexShrink:0 }}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} disabled={loading}
        placeholder="Ask anything or give a command..."
        style={{ flex:1, padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:12.5 }}/>
      <button onClick={send} disabled={loading||!input.trim()} style={{ padding:'8px 14px', borderRadius:10, background:loading?C.textMuted:C.rose, color:'#fff', border:'none', fontSize:14, cursor:'pointer' }}>↑</button>
    </div>
  );

  if (fullscreen) return (
    <div style={{ position:'fixed', inset:0, zIndex:9999, background:C.cream, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 16px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', gap:9, background:C.sidebarBg, flexShrink:0 }}>
        <div style={{ width:30,height:30,borderRadius:9,background:C.gradA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontFamily:"'DM Serif Display',serif",fontWeight:600,color:C.rose }}>N</div>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:12.5, fontWeight:500, color:C.rose }}>Nyla AI</div>
          <div style={{ fontSize:10.5, color:C.textMuted }}>Dashboard assistant</div>
        </div>
        <button onClick={()=>setFullscreen(false)} style={{ background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:20,lineHeight:1 }}>✕</button>
      </div>
      <div style={{ flex:1, overflowY:'auto', padding:'12px 14px', display:'flex', flexDirection:'column', gap:8 }}>{renderMsgs()}</div>
      {renderInput()}
    </div>
  );

  return (
    <div style={{ position:'fixed', bottom:24, right:24, zIndex:1000, display:'flex', flexDirection:'column', alignItems:'flex-end' }}>
      {open && (
        <div style={{ width:340, height:460, background:C.cream, borderRadius:20, boxShadow:`0 12px 40px ${C.pink}70,0 2px 12px rgba(0,0,0,0.08)`, border:`0.5px solid ${C.border}`, display:'flex', flexDirection:'column', marginBottom:12, overflow:'hidden' }}>
          <div style={{ padding:'12px 16px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', gap:9, background:C.sidebarBg, flexShrink:0 }}>
            <div style={{ width:30,height:30,borderRadius:9,background:C.gradA,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontFamily:"'DM Serif Display',serif",fontWeight:600,color:C.rose }}>N</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:12.5, fontWeight:500, color:C.rose }}>Nyla AI</div>
              <div style={{ fontSize:10.5, color:C.textMuted }}>Dashboard assistant</div>
            </div>

          {renderInput()}

        width:54, height:54, borderRadius:'50%', background:open?C.roseDark:C.rose,

          })}
        </div>
      </div>
    </div>
  );
};

/* ── Mobile Bottom Nav ──────────────────────────────────────────── */
const MobileBottomNav = ({ activeNav, onNavSelect }) => {
  const [showMore, setShowMore] = useState(false);
  const isInMore = !PRIMARY_NAV.includes(activeNav);
  const navBtn = (id, label, icon) => {
    const active = activeNav===id;
    return (
      <button key={id} onClick={()=>{ onNavSelect(id); setShowMore(false); }} style={{
        display:'flex', flexDirection:'column', alignItems:'center', gap:3,
        background:'none', border:'none', cursor:'pointer', padding:'6px 10px', flex:1,
      }}>
        <Ico d={icons[icon||id]} size={21} active={active} />
        <span style={{ fontSize:9.5, color: active ? C.rose : C.textMuted, fontWeight: active?600:400 }}>{label}</span>
      </button>
    );
  };
  const activeMoreItem = isInMore ? NAV.find(n=>n.id===activeNav) : null;
  return (
    <>
      {showMore && <MobileMoreMenu activeNav={activeNav} onNavSelect={onNavSelect} onClose={()=>setShowMore(false)} />}
      <div style={{ height:58, background:C.sidebarBg, borderTop:`0.5px solid ${C.border}`,
        display:'flex', alignItems:'center', justifyContent:'space-around',
        flexShrink:0, zIndex:30, paddingBottom:'env(safe-area-inset-bottom,0px)' }}>
        {PRIMARY_NAV.map(id => navBtn(id, NAV.find(n=>n.id===id)?.label, id))}
        <button onClick={()=>setShowMore(s=>!s)} style={{
          display:'flex', flexDirection:'column', alignItems:'center', gap:3,
          background:'none', border:'none', cursor:'pointer', padding:'6px 10px', flex:1,
        }}>
          <Ico d={icons[activeMoreItem?.id||'settings']} size={21} active={showMore||isInMore} />
          <span style={{ fontSize:9.5, color: showMore||isInMore ? C.rose : C.textMuted, fontWeight: showMore||isInMore?600:400 }}>
            {activeMoreItem ? activeMoreItem.label : 'More'}
          </span>
        </button>
      </div>
    </>
  );
};

/* ── Mobile Sub-Nav Tabs ────────────────────────────────────────── */
const MobileSubTabs = ({ navItem, activeSub, onSubSelect }) => {
  if (!navItem || !navItem.sub || navItem.sub.length <= 1) return null;
  return (
    <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:10, marginBottom:4,
      scrollbarWidth:'none', WebkitOverflowScrolling:'touch' }}>
      {navItem.sub.map(s => (
        <button key={s} onClick={()=>onSubSelect(s)} style={{
          padding:'6px 14px', borderRadius:20, border:`0.5px solid ${activeSub===s ? C.rose : C.border}`,
          background: activeSub===s ? C.rose : C.pinkLight, color: activeSub===s ? '#fff' : C.rose,
          fontSize:12, fontWeight: activeSub===s ? 600 : 400, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
        }}>{s}</button>
      ))}
    </div>
  );
};

/* ── Quick Add FAB ──────────────────────────────────────────────── */
const QuickAddFAB = ({ onNavigate }) => {
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState(null); // 'task','note','event','ai',null
  const [val, setVal] = useState('');
  const [aiReply, setAiReply] = useState('');
  const [aiLoading, setAiLoading] = useState(false);
  const ref = useRef(null);
  useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h); return ()=>document.removeEventListener('mousedown',h);
  },[open]);
  const submit = async () => {
    if(!val.trim()) return;
    if(mode==='task'){
      const t=JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
      t.push({id:Date.now(),text:val.trim(),done:false,created:new Date().toISOString()});
      localStorage.setItem('nylaos_tasks',JSON.stringify(t));
      toast('Task added','success',1500);
    } else if(mode==='event'){
      const e=JSON.parse(localStorage.getItem('nylaos_events')||'[]');
      e.push({id:Date.now(),date:toDateKey(),text:val.trim()});
      localStorage.setItem('nylaos_events',JSON.stringify(e));
      toast('Event added to today','success',1500);
    } else if(mode==='note'){
      const p=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
      p.push({id:Date.now(),name:val.trim(),folderId:1,content:'<p><br></p>',created:new Date().toISOString(),updated:new Date().toISOString()});
      localStorage.setItem('nylaos_nb_pages',JSON.stringify(p));
      toast('Note created','success',1500);
    } else if(mode==='ai'){
      const apiKey=localStorage.getItem('nylaos_api_key');
      if(!apiKey){ toast('Add API key in Settings first','error'); setVal(''); return; }
      setAiLoading(true);
      try{
        const res=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
          body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:600,system:'You are Nyla\'s quick AI assistant. Be concise and helpful. Max 2-3 sentences.',messages:[{role:'user',content:val.trim()}]}),
        });
        const data=await res.json();
        setAiReply(data.content?.[0]?.text||'Sorry, I had trouble.');
      }catch(e){ setAiReply('Connection error.'); }
      setAiLoading(false); setVal(''); return;
    }
    setVal(''); setMode(null); setOpen(false);
  };
  const actions = [
    { key:'task', icon:'✓', label:'Task', color:C.rose },
    { key:'note', icon:'📝', label:'Note', color:C.accent },
    { key:'event', icon:'📅', label:'Event', color:'#4285f4' },
    { key:'ai', icon:'✦', label:'AI Chat', color:C.roseDark },
  ];
  return (
    <div ref={ref} style={{position:'fixed',bottom:24,left:24,zIndex:999,display:'flex',flexDirection:'column-reverse',alignItems:'flex-start',gap:8}}>
      <button onClick={()=>{setOpen(o=>!o);setMode(null);setVal('');}} style={{
        width:48,height:48,borderRadius:'50%',background:C.rose,border:'none',color:'#fff',fontSize:24,cursor:'pointer',
        boxShadow:`0 4px 18px ${C.rose}70`,display:'flex',alignItems:'center',justifyContent:'center',
        transition:'all 0.2s',transform:open?'rotate(45deg)':'none',
      }}>+</button>
      {open && !mode && (
        <div style={{display:'flex',flexDirection:'column',gap:6,animation:'toastIn 0.2s ease'}}>
          {actions.map(a=>(
            <button key={a.key} onClick={()=>{
              setMode(a.key);
            }} style={{
              display:'flex',alignItems:'center',gap:10,padding:'8px 16px',borderRadius:12,
              background:C.card,border:`0.5px solid ${C.border}`,cursor:'pointer',
              boxShadow:`0 4px 14px rgba(0,0,0,0.08)`,transition:'all 0.15s',
            }} onMouseEnter={e=>e.currentTarget.style.transform='translateX(4px)'} onMouseLeave={e=>e.currentTarget.style.transform='none'}>
              <span style={{width:28,height:28,borderRadius:8,background:a.color,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:600}}>{a.icon}</span>
              <span style={{fontSize:12.5,color:C.text,fontWeight:500}}>{a.label}</span>
            </button>
          ))}
        </div>
      )}
      {open && mode && (
        <div style={{padding:'12px 14px',borderRadius:14,background:C.card,border:`0.5px solid ${C.border}`,boxShadow:`0 6px 20px rgba(0,0,0,0.1)`,width:mode==='ai'?320:260,animation:'toastIn 0.2s ease'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <div style={{fontSize:11,color:C.textMuted,fontWeight:600,textTransform:'uppercase',letterSpacing:0.5}}>
              {mode==='ai'?'Ask AI ✦':`Quick ${mode}`}
            </div>
            <button onClick={()=>{setMode(null);setAiReply('');}} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14,lineHeight:1}}>×</button>
          </div>
          {aiReply && mode==='ai' && (
            <div style={{padding:'8px 12px',borderRadius:10,background:`${C.lavender}60`,color:C.text,fontSize:12.5,lineHeight:1.6,marginBottom:8,whiteSpace:'pre-wrap'}}>{aiReply}</div>
          )}
          {aiLoading && mode==='ai' && (
            <div style={{padding:'8px 12px',borderRadius:10,background:`${C.lavender}60`,color:C.textMuted,fontSize:12.5,marginBottom:8}}>✦ thinking...</div>
          )}
          <div style={{display:'flex',gap:6}}>
            <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit();if(e.key==='Escape'){setMode(null);setAiReply('');}}}
              placeholder={mode==='task'?'What needs doing?':mode==='note'?'Note title...':mode==='ai'?'Ask anything...':'Event description...'}
              style={{flex:1,padding:'8px 12px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12.5,fontFamily:'inherit'}}/>
            <button onClick={submit} disabled={aiLoading} style={{padding:'8px 14px',borderRadius:8,background:aiLoading?C.textMuted:C.rose,color:'#fff',border:'none',fontSize:12,cursor:'pointer'}}>{mode==='ai'?'↑':'Add'}</button>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── App ────────────────────────────────────────────────────────── */
const App = () => {
  const isMobile = useIsMobile();
  const [activeNav, setActiveNav] = useState('home');
  const [activeSub, setActiveSub] = useState('Overview');
  const [secCollapsed, setSecCollapsed] = useState(() => window.innerWidth < 700);
  const [bizExtras, setBizExtras] = useState(()=>JSON.parse(localStorage.getItem('nylaos_extra_ventures')||'[]'));
  const [trashedVentures, setTrashedVentures] = useState(()=>JSON.parse(localStorage.getItem('nylaos_trashed_ventures')||'[]'));

  // Auto-collapse secondary sidebar when switching to mobile
  useEffect(() => { if (isMobile) setSecCollapsed(true); }, [isMobile]);

  const addBiz = name => {
    const trimmed = name.trim();
    if (!trimmed) return;
    const allActive = [...VENTURES, ...bizExtras].filter(b=>!trashedVentures.includes(b));
    if (allActive.includes(trimmed)) { setActiveSub(trimmed); return; }
    const u = [...bizExtras, trimmed];
    setBizExtras(u);
    localStorage.setItem('nylaos_extra_ventures', JSON.stringify(u));
    setActiveSub(trimmed);
  };

  const deleteBiz = name => {
    addToTrash('business', name, { name }, null);
    const tv = [...trashedVentures, name];
    setTrashedVentures(tv);
    localStorage.setItem('nylaos_trashed_ventures', JSON.stringify(tv));
    const remaining = [...VENTURES, ...bizExtras].filter(b=>!tv.includes(b));
    setActiveSub(remaining[0]||'Recently Deleted');
  };

  const restoreBiz = name => {
    const tv = trashedVentures.filter(b=>b!==name);
    setTrashedVentures(tv);
    localStorage.setItem('nylaos_trashed_ventures', JSON.stringify(tv));
    if (!VENTURES.includes(name) && !bizExtras.includes(name)) {
      const u = [...bizExtras, name];
      setBizExtras(u);
      localStorage.setItem('nylaos_extra_ventures', JSON.stringify(u));
    }
    setActiveSub(name);
  };

  const allActiveVentures = [...VENTURES, ...bizExtras].filter(b=>!trashedVentures.includes(b));
  const baseNav = NAV.find(n=>n.id===activeNav);
  const navItem = (activeNav==='business' && baseNav)
    ? { ...baseNav, sub: [...allActiveVentures, 'Recently Deleted'] }
    : baseNav;

  const handleNavSelect = id => {
    setActiveNav(id);
    setActiveSub(NAV.find(n=>n.id===id)?.sub[0]||'');
  };

  const isNotebook = activeNav === 'notebook';
  const isFullWidth = activeNav === 'notebook' || activeNav === 'ideas';
  const mainPadding = isNotebook ? '0' : isMobile ? '16px 14px 20px' : '28px 32px';

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden', background:(()=>{
      const WALLPAPERS = {gradient1:'linear-gradient(135deg,#fce4ec,#f3e5f5,#e8eaf6)',gradient2:'linear-gradient(135deg,#e0f2f1,#e1f5fe,#ede7f6)',gradient3:'linear-gradient(135deg,#fce4ec,#fff3e0,#fce4ec)',gradient4:'linear-gradient(135deg,#1a0a2e,#2d1450,#120820)',gradient5:'linear-gradient(135deg,#1b3a2d,#0d2818,#2a4a3a)'};
      if(_ap.wallpaperUrl) return `url(${_ap.wallpaperUrl}) center/cover fixed`;
      if(_ap.wallpaper&&WALLPAPERS[_ap.wallpaper]) return WALLPAPERS[_ap.wallpaper];
      return C.cream;
    })() }}>
      <TopBar />
      <div style={{ display:'flex', flex:1, overflow:'hidden' }}>
        {!isMobile && (
          <LeftSidebar activeNav={activeNav} onNavSelect={handleNavSelect}
            secCollapsed={secCollapsed} onToggleSec={()=>setSecCollapsed(c=>!c)} />
        )}
        {!isMobile && !isFullWidth && (
          <SecondarySidebar navItem={navItem} activeSub={activeSub} onSubSelect={setActiveSub}
            onAdd={activeNav==='business'?addBiz:null}
            onDelete={activeNav==='business'?deleteBiz:null}
            collapsed={secCollapsed} />
        )}
        <main style={{ flex:1, overflowY:'auto', padding: mainPadding, background:C.cream,
          overflow: isNotebook ? 'hidden' : 'auto' }}>
          {isMobile && !isNotebook && (
            <MobileSubTabs navItem={navItem} activeSub={activeSub} onSubSelect={setActiveSub} />
          )}
          <MainContent navId={activeNav} sub={activeSub} onRestoreBiz={restoreBiz} />
        </main>
      </div>
      {isMobile && <MobileBottomNav activeNav={activeNav} onNavSelect={handleNavSelect} />}
      <QuickAddFAB onNavigate={(nav, sub) => { setActiveNav(nav); if (sub) setActiveSub(sub); }} />
      <ToastContainer />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
