/* ── PDF IndexedDB Storage ──────────────────────────────────────── */
const pdfDb = (() => {
  let _db = null;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open('nylaos_pdf_store', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('pdfs');
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = rej;
  });
  return {
    save: async (key, blob) => {
      const d = await open();
      return new Promise((res, rej) => { const tx=d.transaction('pdfs','readwrite'); tx.objectStore('pdfs').put(blob,key); tx.oncomplete=res; tx.onerror=rej; });
    },
    load: async (key) => {
      const d = await open();
      return new Promise((res, rej) => { const req=d.transaction('pdfs','readonly').objectStore('pdfs').get(key); req.onsuccess=e=>res(e.target.result); req.onerror=rej; });
    },
  };
})();

const loadPdfsInElement = async (el) => {
  const refs = el.querySelectorAll('[data-pdf-key]');
  for (const ref of refs) {
    const key = ref.getAttribute('data-pdf-key');
    const name = ref.getAttribute('data-pdf-name') || 'PDF';
    try {
      const blob = await pdfDb.load(key);
      if (blob) {
        const url = URL.createObjectURL(blob);
        ref.innerHTML = `<p style="font-size:12px;color:#9c7090;margin:0 0 6px 0;padding:0">📄 ${name}</p><iframe src="${url}" width="100%" height="720" style="border:none;border-radius:10px;display:block;box-shadow:0 2px 12px rgba(0,0,0,0.08)"></iframe>`;
      } else {
        ref.innerHTML = `<p style="font-size:12px;color:#c4607a;margin:0">📄 ${name} — PDF not found. Please re-upload.</p>`;
      }
    } catch(e) { console.error('PDF load error', e); }
  }
};

/* ── Rich Text Editor (module-level to avoid remount) ───────────── */
const RichEditorComponent = ({ pageId, initialContent, onUpdate, onMount }) => {
  const ref = useRef(null);
  const [pastePrompt, setPastePrompt] = useState(null); // {html, plain, x, y}

  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = initialContent || '<p><br></p>';
      onMount(ref.current);
      ref.current.focus();
      loadPdfsInElement(ref.current);
    }
  }, []);

  const handlePaste = (e) => {
    const html = e.clipboardData.getData('text/html');
    const plain = e.clipboardData.getData('text/plain');
    // Only intercept if there's actual rich content (not just plain text)
    if (!html || html.replace(/<[^>]+>/g,'').trim() === plain.trim()) return;
    e.preventDefault();
    // Position the prompt near the cursor
    const sel = window.getSelection();
    let x = 120, y = 80;
    if (sel && sel.rangeCount) {
      const r = sel.getRangeAt(0).getBoundingClientRect();
      const er = ref.current.getBoundingClientRect();
      x = Math.max(0, r.left - er.left);
      y = Math.max(0, r.top - er.top + 24);
    }
    setPastePrompt({ html, plain, x, y });
  };

  const commitPaste = (useFormatting) => {
    if (!pastePrompt) return;
    ref.current.focus();
    if (useFormatting) {
      document.execCommand('insertHTML', false, pastePrompt.html);
    } else {
      // Strip HTML — paste clean plain text
      const text = pastePrompt.plain.replace(/\n{2,}/g,'\n').replace(/\n/g,'<br>');
      document.execCommand('insertHTML', false, text);
    }
    if (ref.current) onUpdate(ref.current.innerHTML);
    setPastePrompt(null);
  };

  return (
    <div style={{ flex:1, overflowY:'auto', position:'relative', display:'flex', flexDirection:'column' }}>
      {pastePrompt && (
        <div style={{ position:'absolute', left: Math.min(pastePrompt.x, 260), top: pastePrompt.y, zIndex:100,
          background:'#fff', border:'0.5px solid #e8c8d8', borderRadius:12, boxShadow:'0 4px 20px #c4607a18',
          padding:'10px 14px', display:'flex', flexDirection:'column', gap:7, minWidth:210 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'#a03c5a', letterSpacing:0.3, marginBottom:2 }}>How would you like to paste?</div>
          <button onMouseDown={e=>{e.preventDefault();commitPaste(true);}}
            style={{ padding:'7px 12px', borderRadius:8, background:'#f5e8ef', border:'0.5px solid #e8c8d8', color:'#7a2040', fontSize:12, cursor:'pointer', textAlign:'left', fontWeight:500 }}>
            ✦ Keep formatting
          </button>
          <button onMouseDown={e=>{e.preventDefault();commitPaste(false);}}
            style={{ padding:'7px 12px', borderRadius:8, background:'transparent', border:'0.5px solid #e8c8d8', color:'#7a4060', fontSize:12, cursor:'pointer', textAlign:'left' }}>
            Aa Plain text only
          </button>
          <button onMouseDown={e=>{e.preventDefault();setPastePrompt(null);}}
            style={{ fontSize:10.5, color:'#b090a0', background:'none', border:'none', cursor:'pointer', textAlign:'left', padding:'2px 0' }}>Cancel</button>
        </div>
      )}
      <div ref={ref} contentEditable suppressContentEditableWarning className="rich-editor"
        onInput={() => { if(ref.current) onUpdate(ref.current.innerHTML); }}
        onPaste={handlePaste}
        style={{ flex:1, overflowY:'auto', padding:'28px 36px', outline:'none', fontSize:14.5, lineHeight:1.9, color:'#401828', minHeight:300, fontFamily:"'DM Sans',sans-serif" }}
      />
    </div>
  );
};

/* ── Notebook helpers (module-level so they're always in scope) ── */
const nbDescFids = (folders, fid) => {
  const result=[fid]; const queue=[fid];
  while(queue.length){ const c=queue.shift(); folders.filter(f=>f.parentId===c).forEach(f=>{result.push(f.id);queue.push(f.id);}); }
  return result;
};

/* ── Note Graph (force-directed) ────────────────────────────────── */
const NoteGraph = ({ pages, folders, activePid, onSelectPage }) => {
  const canvasRef = useRef(null);
  const activePidRef = useRef(activePid);
  const tooltipRef = useRef(null);
  useEffect(()=>{ activePidRef.current=activePid; },[activePid]);

  // Palette for folder clusters — soft, distinct
  const FOLDER_PALETTE = ['#c4607a','#9080d8','#5aab8c','#d4842a','#6aaccc','#b86aaa','#7a9a40','#cc5060'];
  const folderColorMap = {};
  (folders||[]).forEach((f,i)=>{ folderColorMap[f.id]=FOLDER_PALETTE[i%FOLDER_PALETTE.length]; });

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas||!pages.length) return;
    const resize=()=>{ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); };
    canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
    const W=()=>canvas.width, H=()=>canvas.height;
    const ctx=canvas.getContext('2d');

    // Build edges first so we can size nodes by degree
    const edgeSet=new Set();
    const edges=[];
    pages.forEach(p=>{
      const text=(p.content||'').replace(/<[^>]+>/g,' ');
      const re=/\[\[([^\]]+)\]\]/g; let m;
      while((m=re.exec(text))!==null){
        const target=pages.find(x=>x.name.toLowerCase()===m[1].toLowerCase());
        if(target&&target.id!==p.id){
          const key=[p.id,target.id].sort().join('-');
          if(!edgeSet.has(key)){ edgeSet.add(key); edges.push({s:p.id,t:target.id}); }
        }
      }
      // Auto-link pages in the same folder that share hashtags
      const tagRe=/#([\w-]+)/g; const tags=[];
      while((m=tagRe.exec(text))!==null) tags.push(m[1].toLowerCase());
      if(tags.length){
        pages.filter(q=>q.id!==p.id&&q.folderId===p.folderId).forEach(q=>{
          const qt=(q.content||'').replace(/<[^>]+>/g,' ');
          const hasSameTag=tags.some(t=>qt.toLowerCase().includes('#'+t));
          if(hasSameTag){
            const key=[p.id,q.id].sort().join('-');
            if(!edgeSet.has(key)){ edgeSet.add(key); edges.push({s:p.id,t:q.id}); }
          }
        });
      }
    });

    const degreeMap={};
    pages.forEach(p=>{ degreeMap[p.id]=0; });
    edges.forEach(e=>{ degreeMap[e.s]=(degreeMap[e.s]||0)+1; degreeMap[e.t]=(degreeMap[e.t]||0)+1; });

    // Build nodes — initial positions clustered loosely by folder
    const folderIds=[...new Set(pages.map(p=>p.folderId))];
    const nodes=pages.map(p=>{
      const fi=folderIds.indexOf(p.folderId);
      const angle=(fi/Math.max(folderIds.length,1))*Math.PI*2;
      const spread=0.28;
      return {
        id:p.id, name:p.name, folderId:p.folderId,
        x:W()/2+Math.cos(angle)*W()*spread+(Math.random()-0.5)*80,
        y:H()/2+Math.sin(angle)*H()*spread+(Math.random()-0.5)*80,
        vx:0, vy:0
      };
    });
    const nodeMap={};
    nodes.forEach(n=>nodeMap[n.id]=n);

    let animId, hoverId=null;
    const CREAM='#fdfaf7', LAVENDER='#d4c0f0';

    const draw=()=>{
      const cw=canvas.width, ch=canvas.height;
      ctx.fillStyle=CREAM; ctx.fillRect(0,0,cw,ch);
      // Grid dots
      ctx.fillStyle='#e8d8e040';
      for(let gx=0;gx<cw;gx+=28) for(let gy=0;gy<ch;gy+=28){
        ctx.beginPath(); ctx.arc(gx,gy,1,0,Math.PI*2); ctx.fill();
      }
      // Edges
      edges.forEach(e=>{
        const a=nodeMap[e.s],b=nodeMap[e.t]; if(!a||!b) return;
        const isHighlit=hoverId&&(e.s===hoverId||e.t===hoverId);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=isHighlit?`${LAVENDER}ff`:`${LAVENDER}70`;
        ctx.lineWidth=isHighlit?2:1.2; ctx.stroke();
      });
      // Nodes
      const curActive=activePidRef.current;
      nodes.forEach(n=>{
        const isActive=n.id===curActive;
        const isHover=n.id===hoverId;
        const deg=degreeMap[n.id]||0;
        const r=Math.max(6,Math.min(14, 7+deg*1.8))+(isActive?3:0);
        const color=folderColorMap[n.folderId]||'#9080d8';
        if(isActive||isHover){
          ctx.beginPath(); ctx.arc(n.x,n.y,r+7,0,Math.PI*2);
          ctx.fillStyle=color+'30'; ctx.fill();
        }
        const grad=ctx.createRadialGradient(n.x-r*0.3,n.y-r*0.3,1,n.x,n.y,r);
        grad.addColorStop(0,color+'ff');
        grad.addColorStop(1,color+'99');
        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
        ctx.strokeStyle=isActive?color:'#fff8';
        ctx.lineWidth=isActive?2:1; ctx.stroke();
        // Label
        const showLabel=isActive||isHover||deg>=2||nodes.length<=12;
        if(showLabel){
          const label=n.name.length>16?n.name.slice(0,15)+'…':n.name;
          ctx.font=`${isActive||isHover?600:400} ${isActive?11:10}px DM Sans,sans-serif`;
          ctx.textAlign='center';
          ctx.fillStyle='#3a1828ee';
          ctx.fillText(label,n.x,n.y-r-5);
        }
      });
      // Legend (folder → color)
      const legendFolders=(folders||[]).filter(f=>pages.some(p=>p.folderId===f.id));
      let lx=14, ly=14;
      legendFolders.forEach(f=>{
        const col=folderColorMap[f.id]||'#9080d8';
        ctx.beginPath(); ctx.arc(lx+5,ly+5,5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
        ctx.font='500 10px DM Sans,sans-serif'; ctx.textAlign='left';
        ctx.fillStyle='#5a2a40cc';
        ctx.fillText(f.name,lx+13,ly+9);
        lx+=ctx.measureText(f.name).width+30;
        if(lx>canvas.width-80){ lx=14; ly+=18; }
      });
    };

    const tick=()=>{
      const cw=canvas.width, ch=canvas.height;
      nodes.forEach((a,i)=>{
        nodes.forEach((b,j)=>{ if(j<=i) return;
          const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          const f=Math.min(6000/(d*d),80);
          a.vx-=dx/d*f; a.vy-=dy/d*f; b.vx+=dx/d*f; b.vy+=dy/d*f;
        });
      });
      edges.forEach(e=>{
        const a=nodeMap[e.s],b=nodeMap[e.t]; if(!a||!b) return;
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        const f=(d-120)*0.032;
        a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
      });
      // Same-folder soft attraction
      nodes.forEach((a,i)=>{
        nodes.forEach((b,j)=>{ if(j<=i||a.folderId!==b.folderId) return;
          const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d>160){ const f=(d-160)*0.008; a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f; }
        });
      });
      nodes.forEach(n=>{
        n.vx+=(cw/2-n.x)*0.005; n.vy+=(ch/2-n.y)*0.005;
        n.vx*=0.82; n.vy*=0.82;
        n.x=Math.max(40,Math.min(cw-40,n.x+n.vx));
        n.y=Math.max(40,Math.min(ch-40,n.y+n.vy));
      });
      draw();
      animId=requestAnimationFrame(tick);
    };
    tick();

    const getHit=e=>{
      const rect=canvas.getBoundingClientRect();
      const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
      const mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
      return nodes.find(n=>Math.sqrt((n.x-mx)**2+(n.y-my)**2)<20);
    };
    const onClick=e=>{ const hit=getHit(e); if(hit) onSelectPage(hit.id); };
    const onMove=e=>{
      const hit=getHit(e);
      const newHover=hit?hit.id:null;
      if(newHover!==hoverId){ hoverId=newHover; canvas.style.cursor=newHover?'pointer':'default'; }
      // tooltip
      const tip=tooltipRef.current;
      if(tip){
        if(hit){ const rect=canvas.getBoundingClientRect(); tip.style.left=(e.clientX-rect.left+10)+'px'; tip.style.top=(e.clientY-rect.top-28)+'px'; tip.textContent=hit.name; tip.style.opacity=1; }
        else tip.style.opacity=0;
      }
    };
    const onLeave=()=>{ hoverId=null; if(tooltipRef.current) tooltipRef.current.style.opacity=0; };
    canvas.addEventListener('click',onClick);
    canvas.addEventListener('mousemove',onMove);
    canvas.addEventListener('mouseleave',onLeave);
    window.addEventListener('resize',resize);
    return()=>{ cancelAnimationFrame(animId); canvas.removeEventListener('click',onClick); canvas.removeEventListener('mousemove',onMove); canvas.removeEventListener('mouseleave',onLeave); window.removeEventListener('resize',resize); };
  },[pages.length, pages.map(p=>p.id+p.name+p.folderId).join(',')]);

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#fdfaf7',minWidth:0,position:'relative'}}>
      <div style={{padding:'10px 18px',borderBottom:`0.5px solid ${C.border}`,display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <span style={{fontFamily:"'DM Serif Display',serif",fontSize:15,color:C.rose}}>Graph View</span>
        <span style={{fontSize:11,color:C.textMuted}}>{pages.length} notes · nodes sized by connections · colors by notebook</span>
      </div>
      <div style={{position:'relative',flex:1,minHeight:0}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}}/>
        <div ref={tooltipRef} style={{position:'absolute',pointerEvents:'none',background:'#3a1828ee',color:'#fff',fontSize:11,padding:'4px 9px',borderRadius:7,opacity:0,transition:'opacity 0.1s',whiteSpace:'nowrap',zIndex:10}}/>
      </div>
    </div>
  );
};

const IdeaBank = () => {

  const saveCats = c => { setCustomCats(c); localStorage.setItem(CK,JSON.stringify(c)); };

/* ── Notebook (Obsidian-style) ──────────────────────────────────── */
const NotebookPanel = ({ sub }) => {
  const FK = 'nylaos_nb_folders', PK = 'nylaos_nb_pages';
  const DEFAULT_FOLDERS = [
    {id:1,name:'All Notes',icon:'📝',parentId:null},
    {id:2,name:'Journal',  icon:'📖',parentId:null},
    {id:3,name:'Ideas',    icon:'💡',parentId:null},
    {id:4,name:'Bookmarks',icon:'🔖',parentId:null},
  ];
  const [folders, setFolders] = useState(()=>{ const s=localStorage.getItem(FK); return s?JSON.parse(s):DEFAULT_FOLDERS; });
  const [pages, setPages] = useState(()=>JSON.parse(localStorage.getItem(PK)||'[]'));
  const [activeFid, setActiveFid] = useState(()=>{ const f=DEFAULT_FOLDERS.find(f=>f.name===sub); return f?f.id:1; });
  const [activePid, setActivePid] = useState(null);
  const [newFolderName, setNewFolderName] = useState('');
  const [newFolderParentId, setNewFolderParentId] = useState(null);
  const [showNewFolder, setShowNewFolder] = useState(false);
  const [expandedFids, setExpandedFids] = useState(()=>new Set([1,2,3,4]));
  const [hoverFid, setHoverFid] = useState(null);
  const [hoverPid, setHoverPid] = useState(null);
  const [moveMenuPid, setMoveMenuPid] = useState(null);
  const [showGraph, setShowGraph] = useState(false);
  const [tagFilter, setTagFilter] = useState('');
  const [searchQ, setSearchQ] = useState('');
  const [showSearch, setShowSearch] = useState(false);
  const [editingPgId, setEditingPgId] = useState(null);
  const [editingPgName, setEditingPgName] = useState('');
  const [editingFid, setEditingFid] = useState(null);
  const [editingFolderName, setEditingFolderName] = useState('');
  const [headerTitle, setHeaderTitle] = useState('');
  const [headerEditing, setHeaderEditing] = useState(false);
  const [fmt, setFmt] = useState({bold:false,italic:false,underline:false,strike:false});
  const [nbFileLinked, setNbFileLinked] = useState(()=>!!window._nbFileHandle);
  const editorDomRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(()=>{ const f=folders.find(f=>f.name===sub); if(f) setActiveFid(f.id); },[sub]);
  useEffect(()=>{ const id=setInterval(()=>setNbFileLinked(!!window._nbFileHandle),1000); return()=>clearInterval(id); },[]);
  useEffect(()=>{ const p=pages.find(p=>p.id===activePid); if(p) setHeaderTitle(p.name); },[activePid]);
  useEffect(()=>{
    const onSel = () => {
      try { setFmt({bold:document.queryCommandState('bold'),italic:document.queryCommandState('italic'),underline:document.queryCommandState('underline'),strike:document.queryCommandState('strikeThrough')}); } catch(e){}
    };
    document.addEventListener('selectionchange', onSel);
    return () => document.removeEventListener('selectionchange', onSel);
  }, []);

  const saveFolders = f => { setFolders(f); localStorage.setItem(FK,JSON.stringify(f)); };
  const savePages   = p => { setPages(p);   localStorage.setItem(PK,JSON.stringify(p)); };
  // Stale-closure-safe: always reads the latest pages from localStorage before updating
  const updateContent = html => {
    if(!activePid) return;
    setPages(prev => {
      const updated = prev.map(p=>p.id===activePid?{...p,content:html,updated:new Date().toISOString()}:p);
      localStorage.setItem(PK,JSON.stringify(updated));
      return updated;
    });
  };

  const activePage = pages.find(p=>p.id===activePid);
  const stripHtml = h => (h||'').replace(/<[^>]+>/g,' ');
  const getTags = c => (stripHtml(c).match(/#[a-zA-Z]\w*/g)||[]);
  const allTags = [...new Set(pages.flatMap(p=>getTags(p.content)))];
  const getDescFids = (fid) => nbDescFids(folders, fid);
  const displayPages = searchQ
    ? pages.filter(p=>p.name.toLowerCase().includes(searchQ.toLowerCase())||stripHtml(p.content).toLowerCase().includes(searchQ.toLowerCase()))
    : tagFilter ? pages.filter(p=>getTags(p.content).includes(tagFilter))
    : activeFid===1 ? pages
    : pages.filter(p=>getDescFids(activeFid).includes(p.folderId));

  const exec = (cmd, val=null) => {
    document.execCommand(cmd, false, val);
    if(editorDomRef.current) { editorDomRef.current.focus(); updateContent(editorDomRef.current.innerHTML); }
  };

  const addPage = () => {
    const pg = {id:Date.now(),name:'Untitled',folderId:activeFid,content:'',created:new Date().toISOString(),updated:new Date().toISOString()};
    savePages([...pages,pg]); setActivePid(pg.id); setHeaderTitle('Untitled');
    setEditingPgId(pg.id); setEditingPgName('Untitled');
  };

  const addDailyNote = () => {
    const key = new Date().toISOString().split('T')[0];
    const name = `Daily · ${key}`;
    const existing = pages.find(p=>p.name===name);
    if(existing){ setActiveFid(2); setActivePid(existing.id); setHeaderTitle(existing.name); return; }
    const pg = {id:Date.now(),name,folderId:2,content:`<h2>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><p><br></p>`,created:new Date().toISOString(),updated:new Date().toISOString()};

  const NB_TEMPLATES = {

  const addFromTemplate = (templateName) => {
    const pg = {id:Date.now(),name:templateName,folderId:activeFid,content:NB_TEMPLATES[templateName],created:new Date().toISOString(),updated:new Date().toISOString()};

  const [showTemplates, setShowTemplates] = useState(false);

  const uploadFiles = async (files) => {
    const mdToHtml = (text) => {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
      const lines = text.split('\n'); const out = []; let inList = false;
      for (const line of lines) {
        const t = line.trim();
        if (t.startsWith('### ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h3>${inline(esc(t.slice(4)))}</h3>`); }
        else if (t.startsWith('## ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h2>${inline(esc(t.slice(3)))}</h2>`); }
        else if (t.startsWith('# ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h1>${inline(esc(t.slice(2)))}</h1>`); }
        else if (t.startsWith('- ')||t.startsWith('* ')) { if(!inList){out.push('<ul>');inList=true;} out.push(`<li>${inline(esc(t.slice(2)))}</li>`); }
        else if (t==='') { if(inList){out.push('</ul>');inList=false;} out.push('<p><br></p>'); }
        else { if(inList){out.push('</ul>');inList=false;} out.push(`<p>${inline(esc(line))}</p>`); }
      }
      if(inList) out.push('</ul>');
      return out.join('')||'<p><br></p>';
    };
    const newPages = []; const base = Date.now();
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const name = file.name.replace(/\.[^/.]+$/, '');
      let content = '';
      if (file.type === 'application/pdf') {
        try {
          const pdfKey = `pdf_${Date.now()}_${i}`;
          await pdfDb.save(pdfKey, file);
          content = `<div contenteditable="false" data-pdf-key="${pdfKey}" data-pdf-name="${file.name}" style="margin:12px 0;user-select:none;border-radius:10px;overflow:hidden;border:0.5px solid #f0d0dc"><div style="padding:8px 14px;background:#faf5f8;font-size:12px;color:#9c7090">📄 ${file.name} — loading...</div></div><p><br></p>`;
        } catch(e) {
          content = `<p><em>📄 Could not save PDF: <strong>${file.name}</strong></em></p><p><br></p>`;
        }
      } else {
        try {
          const text = await file.text();
          content = file.name.endsWith('.md')
            ? mdToHtml(text)
            : text.split('\n\n').map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('') || '<p><br></p>';
        } catch(e) { content = `<p><em>Imported: ${file.name}</em></p><p><br></p>`; }
      }
      newPages.push({id:base+i,name,folderId:activeFid,content,created:new Date().toISOString(),updated:new Date().toISOString()});
    }
    if (newPages.length > 0) {
      savePages([...pages,...newPages]);
      const last = newPages[newPages.length-1];
      setActivePid(last.id); setHeaderTitle(last.name);
    }
  };

    <div className="fade-in" style={{display:'flex',height:'calc(100vh - 60px)',overflow:'hidden',borderTop:`0.5px solid ${C.border}`}}>

      {/* ── Left sidebar ── */}
      <div style={{width:210,background:panelBg,borderRight:`0.5px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden',flexShrink:0}}>

        {/* Top actions */}
        <div style={{padding:'10px 10px 6px',borderBottom:`0.5px solid ${C.border}`,display:'flex',gap:4}}>
          <button onClick={addDailyNote} style={{flex:1,padding:'5px 8px',borderRadius:8,background:`${C.lavender}70`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:11,cursor:'pointer',textAlign:'left',fontWeight:500}}>📅 Daily Note</button>
          <button onClick={()=>{setShowSearch(s=>!s);setSearchQ('');}} style={{padding:'5px 8px',borderRadius:8,background:showSearch?C.accent:'transparent',border:`0.5px solid ${C.border}`,color:showSearch?'#fff':C.textMuted,fontSize:12,cursor:'pointer'}} title="Search notes">🔍</button>
          <button onClick={()=>setShowTemplates(s=>!s)} style={{padding:'5px 8px',borderRadius:8,background:showTemplates?C.accent:'transparent',border:`0.5px solid ${C.border}`,color:showTemplates?'#fff':C.textMuted,fontSize:12,cursor:'pointer'}} title="New from template">📋</button>
          <button onClick={()=>fileInputRef.current&&fileInputRef.current.click()} style={{padding:'5px 8px',borderRadius:8,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:12,cursor:'pointer'}} title="Upload file(s) to notebook">📎</button>
          <input ref={fileInputRef} type="file" multiple accept=".txt,.md,.pdf,.csv,.doc,.docx" style={{display:'none'}} onChange={e=>{if(e.target.files?.length)uploadFiles(Array.from(e.target.files));e.target.value='';}}/>
          <button onClick={()=>setShowGraph(g=>!g)} style={{padding:'5px 8px',borderRadius:8,background:showGraph?C.rose:'transparent',border:`0.5px solid ${C.border}`,color:showGraph?'#fff':C.textMuted,fontSize:13,cursor:'pointer',lineHeight:1}} title="Graph view">⬡</button>
        </div>

        {showSearch && (
          <div style={{padding:'6px 10px',borderBottom:`0.5px solid ${C.border}`}}>
            <input autoFocus value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Search notes..."
              style={{width:'100%',padding:'5px 9px',borderRadius:7,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
          </div>
        )}

        {showTemplates && (
          <div style={{padding:'6px 10px',borderBottom:`0.5px solid ${C.border}`}}>
            <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:4}}>Templates</div>
            {Object.keys(NB_TEMPLATES).map(name=>(
              <button key={name} onClick={()=>{addFromTemplate(name);setShowTemplates(false);}}
                style={{display:'block',width:'100%',padding:'5px 8px',borderRadius:7,textAlign:'left',background:'transparent',border:'none',color:C.text,fontSize:11.5,cursor:'pointer',marginBottom:2}}
                onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}50`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                {name}
              </button>
            ))}
          </div>
        )}

        {/* Folders — recursive tree */}
        <div style={{padding:'6px 8px',borderBottom:`0.5px solid ${C.border}`,overflowY:'auto',maxHeight:'45%'}}>
          <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:4,paddingLeft:2}}>Folders</div>
          {(()=>{
            const renderNode=(folder,depth)=>{
              const children=folders.filter(f=>f.parentId===folder.id);
              const isExpanded=expandedFids.has(folder.id);
              const isActive=activeFid===folder.id&&!tagFilter&&!searchQ;
              const pCount=folder.id===1?pages.length:getDescFids(folder.id).reduce((acc,fid)=>acc+pages.filter(p=>p.folderId===fid).length,0);
              return React.createElement(React.Fragment,{key:folder.id},
                React.createElement('div',{
                  style:{display:'flex',alignItems:'center',marginBottom:1,paddingLeft:depth*12},
                  onMouseEnter:()=>setHoverFid(folder.id),
                  onMouseLeave:()=>setHoverFid(null)
                },
                  /* expand toggle */
                  React.createElement('button',{
                    onClick:()=>{const ns=new Set(expandedFids);ns.has(folder.id)?ns.delete(folder.id):ns.add(folder.id);setExpandedFids(ns);},
                    style:{width:14,height:14,border:'none',background:'none',cursor:children.length?'pointer':'default',color:C.textMuted,fontSize:8,padding:0,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',opacity:children.length?1:0}
                  }, isExpanded?'▾':'▸'),
                  /* folder label */
                  editingFid===folder.id
                    ? React.createElement('input',{autoFocus:true,value:editingFolderName,onChange:e=>setEditingFolderName(e.target.value),
                        onKeyDown:e=>{if(e.key==='Enter')saveFolderName(folder.id,editingFolderName);if(e.key==='Escape')setEditingFid(null);},
                        onBlur:()=>saveFolderName(folder.id,editingFolderName),
                        style:{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11.5,fontFamily:'inherit'}})
                    : React.createElement('button',{
                        onClick:()=>{setActiveFid(folder.id);setTagFilter('');setSearchQ('');setShowSearch(false);setActivePid(null);},
                        onDoubleClick:()=>{setEditingFid(folder.id);setEditingFolderName(folder.name);},
                        style:{display:'flex',alignItems:'center',gap:5,flex:1,padding:'4px 6px',borderRadius:7,textAlign:'left',background:isActive?`${C.pink}80`:'transparent',border:`0.5px solid ${isActive?C.border:'transparent'}`,color:C.text,fontSize:12,cursor:'pointer'}
                      },
                      React.createElement('span',{style:{fontSize:12}},''+folder.icon),
                      React.createElement('span',{style:{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},folder.name),
                      React.createElement('span',{style:{fontSize:9.5,color:C.textMuted,flexShrink:0}},pCount)
                    ),
                  /* add-subfolder btn (hover, not All Notes) */
                  hoverFid===folder.id&&folder.id!==1&&React.createElement('button',{
                    onClick:()=>{setNewFolderParentId(folder.id);setShowNewFolder(true);setExpandedFids(s=>{const ns=new Set(s);ns.add(folder.id);return ns;});},
                    title:'New subfolder',
                    style:{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:13,padding:'0 3px',flexShrink:0,lineHeight:1},
                    onMouseEnter:e=>e.currentTarget.style.color=C.rose,
                    onMouseLeave:e=>e.currentTarget.style.color=C.textMuted
                  },'+'),
                  /* delete folder btn (hover, not All Notes) */
                  hoverFid===folder.id&&folder.id!==1&&React.createElement('button',{
                    onClick:()=>deleteFolder(folder.id),
                    title:'Delete folder',
                    style:{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:12,padding:'0 3px',flexShrink:0,lineHeight:1},
                    onMouseEnter:e=>e.currentTarget.style.color='#e05',
                    onMouseLeave:e=>e.currentTarget.style.color=C.textMuted
                  },'🗑')
                ),
                /* inline subfolder input */
                showNewFolder&&newFolderParentId===folder.id&&React.createElement('div',{
                  style:{display:'flex',gap:3,marginTop:2,paddingLeft:depth*12+26}
                },
                  React.createElement('input',{autoFocus:true,value:newFolderName,onChange:e=>setNewFolderName(e.target.value),
                    onKeyDown:e=>{if(e.key==='Enter')addFolder();if(e.key==='Escape'){setShowNewFolder(false);setNewFolderParentId(null);}},
                    placeholder:'Folder name',
                    style:{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11,fontFamily:'inherit'}}),
                  React.createElement('button',{onClick:addFolder,style:{background:C.rose,border:'none',borderRadius:6,color:'#fff',padding:'3px 7px',cursor:'pointer',fontSize:11}},'✓')
                ),
                /* recurse into children */
                isExpanded&&children.map(child=>renderNode(child,depth+1))
              );
            };
            const allNotes=folders.find(f=>f.id===1);
            const topLevel=folders.filter(f=>f.id!==1&&!f.parentId);
            return [
              allNotes&&renderNode(allNotes,0),
              ...topLevel.map(f=>renderNode(f,0))
            ];
          })()}
          {/* Top-level new folder input */}
          {showNewFolder&&newFolderParentId===null?(
            <div style={{display:'flex',gap:3,marginTop:4}}>
              <input autoFocus value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')addFolder();if(e.key==='Escape'){setShowNewFolder(false);setNewFolderParentId(null);}}}
                placeholder="Folder name"
                style={{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11.5,fontFamily:'inherit'}}/>
              <button onClick={addFolder} style={{background:C.rose,border:'none',borderRadius:6,color:'#fff',padding:'3px 7px',cursor:'pointer',fontSize:12}}>✓</button>
            </div>
          ):(
            <button onClick={()=>{setShowNewFolder(true);setNewFolderParentId(null);}}
              style={{width:'100%',padding:'4px 8px',borderRadius:7,background:'transparent',border:`0.5px dashed ${C.border}`,color:C.textMuted,fontSize:11,cursor:'pointer',marginTop:3,textAlign:'left'}}>+ New Folder</button>
          )}
        </div>

        {/* Pages */}
        <div style={{flex:1,overflowY:'auto',padding:'8px 10px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
            <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase'}}>
              {searchQ?'Search':tagFilter?`#${tagFilter.slice(1)}`:'Pages'}
            </div>
            <button onClick={addPage} style={{background:C.rose,border:'none',borderRadius:5,color:'#fff',width:18,height:18,cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>+</button>
          </div>
          {(tagFilter||searchQ)&&<button onClick={()=>{setTagFilter('');setSearchQ('');}} style={{width:'100%',padding:'2px',borderRadius:5,background:'transparent',border:'none',color:C.accent,fontSize:10.5,cursor:'pointer',textAlign:'left',marginBottom:4}}>✕ clear</button>}
          {displayPages.length===0&&<div style={{fontSize:11.5,color:C.textMuted,fontStyle:'italic',padding:'6px 0'}}>No pages yet.</div>}
          {displayPages.map(p=>{
            const dAgo=Math.floor((Date.now()-new Date(p.updated||p.created).getTime())/86400000);
            const when=dAgo===0?'today':dAgo===1?'yesterday':`${dAgo}d ago`;
            const isHovered=hoverPid===p.id;
            const moveFolders=folders.filter(f=>f.id!==p.folderId);
            return (
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:2,marginBottom:1,position:'relative'}}
                onMouseEnter={()=>setHoverPid(p.id)} onMouseLeave={()=>{setHoverPid(null);setMoveMenuPid(null);}}>
                {editingPgId===p.id?(
                  <input autoFocus value={editingPgName} onChange={e=>setEditingPgName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')savePgName(p.id,editingPgName);if(e.key==='Escape')setEditingPgId(null);}}
                    onBlur={()=>savePgName(p.id,editingPgName)}
                    style={{flex:1,padding:'4px 7px',borderRadius:7,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
                ):(
                  <button onClick={()=>setActivePid(p.id)} onDoubleClick={()=>{setEditingPgId(p.id);setEditingPgName(p.name);}}
                    style={{flex:1,padding:'5px 8px',borderRadius:7,textAlign:'left',background:activePid===p.id?`${C.lavender}80`:'transparent',border:`0.5px solid ${activePid===p.id?C.border:'transparent'}`,color:C.text,fontSize:11.5,cursor:'pointer'}}>
                    <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                    <div style={{fontSize:9.5,color:C.textMuted,marginTop:1}}>{when}</div>
                  </button>
                )}
                {isHovered&&!editingPgId&&(<>
                  <button onClick={e=>{e.stopPropagation();setMoveMenuPid(moveMenuPid===p.id?null:p.id);}} title="Move to folder"
                    style={{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:11,flexShrink:0,lineHeight:1,padding:'1px 2px'}}
                    onMouseEnter={e=>e.currentTarget.style.color=C.rose} onMouseLeave={e=>e.currentTarget.style.color=C.textMuted}>📁</button>
                  <button onClick={()=>deletePage(p.id)} title="Delete page"
                    style={{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:12,flexShrink:0,lineHeight:1,padding:'1px 2px'}}
                    onMouseEnter={e=>e.currentTarget.style.color='#e04060'} onMouseLeave={e=>e.currentTarget.style.color=C.textMuted}>🗑</button>
                </>)}
                {moveMenuPid===p.id&&(
                  <div style={{position:'absolute',right:0,top:'100%',zIndex:200,background:C.cream,border:`0.5px solid ${C.border}`,borderRadius:10,padding:'5px 0',boxShadow:`0 6px 20px ${C.pink}60`,minWidth:160}}
                    onMouseLeave={()=>setMoveMenuPid(null)}>
                    <div style={{fontSize:10,color:C.textMuted,padding:'3px 12px 5px',letterSpacing:0.5,textTransform:'uppercase',fontWeight:600}}>Move to</div>
                    {moveFolders.map(f=>(
                      <button key={f.id} onClick={()=>movePage(p.id,f.id)}
                        style={{width:'100%',padding:'6px 12px',background:'none',border:'none',textAlign:'left',fontSize:12,color:C.text,cursor:'pointer',display:'flex',alignItems:'center',gap:7}}
                        onMouseEnter={e=>e.currentTarget.style.background=C.pinkLight}
                        onMouseLeave={e=>e.currentTarget.style.background='none'}>
                        <span>{f.icon||'📁'}</span><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</span>
                      </button>
                    ))}
                    {moveFolders.length===0&&<div style={{padding:'6px 12px',fontSize:11.5,color:C.textMuted,fontStyle:'italic'}}>No other folders</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>

        {/* Tags */}
        {allTags.length>0&&(
          <div style={{padding:'8px 10px',borderTop:`0.5px solid ${C.border}`,flexShrink:0}}>
            <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:4}}>Tags</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
              {allTags.slice(0,14).map(tag=>(
                <button key={tag} onClick={()=>{setTagFilter(tagFilter===tag?'':tag);setSearchQ('');}}
                  style={{padding:'2px 7px',borderRadius:10,fontSize:10.5,cursor:'pointer',background:tagFilter===tag?C.rose:`${C.lavender}50`,color:tagFilter===tag?'#fff':C.accent,border:`0.5px solid ${tagFilter===tag?C.rose:C.border}`}}>{tag}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* ── Right editor area ── */}
      <div style={{flex:1,display:'flex',flexDirection:'column',background:C.cream,minWidth:0}}>
        {showGraph ? (
          <NoteGraph pages={pages} folders={folders} activePid={activePid} onSelectPage={id=>{setActivePid(id);setShowGraph(false);}}/>
        ) : activePage ? (
          <>
            {/* Title bar */}
            <div style={{padding:'10px 18px',borderBottom:`0.5px solid ${C.border}`,display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
              {headerEditing ? (
                <input autoFocus value={headerTitle} onChange={e=>setHeaderTitle(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')saveHeaderTitle();if(e.key==='Escape')setHeaderEditing(false);}}
                  onBlur={saveHeaderTitle}
                  style={{flex:1,fontSize:15,fontWeight:600,color:C.rose,background:'transparent',border:'none',borderBottom:`1.5px solid ${C.rose}`,outline:'none',padding:'2px 0',fontFamily:"'DM Serif Display',serif"}}/>
              ):(
                <div onClick={()=>{setHeaderEditing(true);setHeaderTitle(activePage.name);}}
                  style={{flex:1,fontSize:15,fontWeight:600,color:C.rose,cursor:'text',fontFamily:"'DM Serif Display',serif"}}>{activePage.name}</div>
              )}
              <span style={{fontSize:10.5,color:C.textMuted,flexShrink:0}}>{wc} words</span>
              {tags.map(t=><span key={t} onClick={()=>setTagFilter(tagFilter===t?'':t)} style={{fontSize:10.5,padding:'2px 8px',borderRadius:10,background:`${C.lavender}70`,color:C.accent,cursor:'pointer',flexShrink:0}}>{t}</span>)}
              <button onClick={exportPDF} title="Print / Export this page as PDF" style={{padding:'4px 11px',borderRadius:8,background:`${C.lavender}60`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:11,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:5}}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Page
              </button>
              <button onClick={exportNotebookPDF} title="Print / Export entire notebook as PDF" style={{padding:'4px 11px',borderRadius:8,background:`${C.rose}18`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:11,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:5}}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Notebook
              </button>
              <button onClick={()=>window._exportToGoogleDrive()} title="Export notebooks and open Google Drive" style={{padding:'4px 11px',borderRadius:8,background:'rgba(66,133,244,0.08)',border:'0.5px solid rgba(66,133,244,0.33)',color:'#4285f4',fontSize:11,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:4}}>
                {"☁️ Drive"}
              </button>
              {nbFileLinked?(
                <button onClick={()=>{window.unlinkNotebookFile();setNbFileLinked(false);}} title="Auto-saving to local file — click to unlink" style={{padding:'4px 11px',borderRadius:8,background:`#68c97a22`,border:`0.5px solid #68c97a66`,color:'#3a8a4a',fontSize:11,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:4}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:'#68c97a',display:'inline-block'}}/>
                  Saving to file
                </button>
              ):(
                <button onClick={()=>window.pickNotebookFile().then(()=>setNbFileLinked(!!window._nbFileHandle))} title="Auto-save notebook to a file on your computer" style={{padding:'4px 11px',borderRadius:8,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:11,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:4}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  Save to file
                </button>
              )}
            </div>

            {/* ── Formatting toolbar — row 1: text style ── */}
            <div style={{padding:'4px 10px',borderBottom:`0.5px solid ${C.border}`,display:'flex',alignItems:'center',gap:2,flexWrap:'nowrap',background:panelBg,flexShrink:0,overflowX:'auto'}}>
              <TBtn cmd="undo" label="↩" title="Undo (Ctrl+Z)"/>
              <TBtn cmd="redo" label="↪" title="Redo (Ctrl+Y)"/>
              <Sep/>
              <TBtnBlock tag="h1" label="H1"/>
              <TBtnBlock tag="h2" label="H2"/>
              <TBtnBlock tag="h3" label="H3"/>
              <TBtnBlock tag="p" label="¶"/>
              <Sep/>
              <TBtn cmd="bold" label="B" title="Bold (Ctrl+B)" active={fmt.bold} style={{fontWeight:700}}/>
              <TBtn cmd="italic" label="I" title="Italic (Ctrl+I)" active={fmt.italic} style={{fontStyle:'italic'}}/>
              <TBtn cmd="underline" label="U" title="Underline (Ctrl+U)" active={fmt.underline} style={{textDecoration:'underline'}}/>
              <TBtn cmd="strikeThrough" label="S" title="Strikethrough" active={fmt.strike} style={{textDecoration:'line-through'}}/>
              <Sep/>
              <select onChange={e=>exec('fontName',e.target.value)} defaultValue="DM Sans"
                style={{padding:'3px 5px',borderRadius:7,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11,cursor:'pointer',maxWidth:80}}>
                <option value="DM Sans">DM Sans</option>
                <option value="DM Serif Display">Serif</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Mono</option>
                <option value="Arial">Arial</option>
              </select>
              <Sep/>
              <button onMouseDown={e=>{e.preventDefault();exec('insertUnorderedList');}} title="Bullet list" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:14}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>•</button>
              <button onMouseDown={e=>{e.preventDefault();exec('insertOrderedList');}} title="Numbered list" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>1.</button>
              <Sep/>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyLeft');}} title="Align left" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>≡</button>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyCenter');}} title="Center" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>⊟</button>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyRight');}} title="Align right" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>⇥</button>
              <Sep/>

const CycleWheel = ({ cycleDay }) => {
  const cx=100,cy=100,r=72,sw=20;
  const segments = [
    {name:'Menstrual', a1:0,    a2:(5/28)*360,  color:'#E57373'},
    {name:'Follicular',a1:(5/28)*360, a2:(13/28)*360, color:'#9C6FD6'},
    {name:'Ovulation', a1:(13/28)*360,a2:(16/28)*360, color:'#F48FB1'},
    {name:'Luteal',    a1:(16/28)*360,a2:360,         color:'#64B5F6'},
  ];
  const dotAngle = ((cycleDay-1)/28)*360;
  const dotPos = polarToCartesian(cx,cy,r,dotAngle);
  return (
    <svg viewBox="0 0 200 200" width={200} height={200} style={{ display:'block', margin:'0 auto' }}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={`${C.border}`} strokeWidth={sw}/>
      {segments.map(seg=>(
        <path key={seg.name} d={arcPath(cx,cy,r,seg.a1,seg.a2)}
          fill="none" stroke={seg.color} strokeWidth={sw} strokeLinecap="butt"/>
      ))}
      <circle cx={dotPos.x} cy={dotPos.y} r={9} fill="white" stroke={C.rose} strokeWidth={2}/>
      <text x={cx} y={cy-8} textAnchor="middle" style={{ fontFamily:"'DM Serif Display',serif", fontSize:28, fill:C.rose, fontWeight:600 }}>{cycleDay}</text>
      <text x={cx} y={cy+14} textAnchor="middle" style={{ fontSize:11, fill:C.textLight }}>day of cycle</text>
    </svg>
  );
};

const PeriodOverview = () => {
  const [startDate, setStartDate] = useState(()=>localStorage.getItem('nylaos_cycleStartDate')||'');
  const cycle = startDate ? getCycleForDate(new Date()) : null;
  const save = v => { setStartDate(v); localStorage.setItem('nylaos_cycleStartDate',v); };
  const nextPeriod = () => {
    if (!startDate) return null;
    const start = new Date(startDate);
    const diff = Math.floor((new Date()-start)/86400000);
    const daysLeft = 28 - (((diff%28)+28)%28);
    return daysLeft;
  };
  const daysLeft = nextPeriod();
  return (
    <div className="fade-in" style={{ maxWidth:500 }}>
      <PageTitle>Cycle Overview</PageTitle>
      <Card style={{ marginBottom:16 }}>
        <SectionHeading>Cycle Start Date</SectionHeading>

          padding:'9px 13px', borderRadius:10, border:`0.5px solid ${C.border}`,

        }}/>
        {!startDate && <div style={{ marginTop:10, fontSize:13, color:C.textMuted }}>Set your last period start date to unlock cycle tracking.</div>}

      {cycle && (
        <>
          <div style={{ display:'flex', justifyContent:'center', marginBottom:16 }}>
            <CycleWheel cycleDay={cycle.day} />

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>

              <div style={{ fontSize:11, color:C.textLight, marginBottom:4 }}>Current Phase</div>
              <div style={{ fontSize:16, fontWeight:600, color:cycle.color }}>{cycle.name}</div>
              <div style={{ fontSize:12, color:C.textLight, marginTop:2 }}>{cycle.label}</div>
            </Card>

const SYMPTOMS = ['Cramping','Bloating','Headache','Fatigue','Mood swings','Cravings','Tender breasts','Backache','Nausea','Insomnia','Acne','Spotting'];

const SymptomTracker = () => {
  const key = 'nylaos_symptoms';
  const [log, setLog] = useState(()=>JSON.parse(localStorage.getItem(key)||'[]'));
  const today = new Date().toDateString();
  const todayLog = log.find(l=>l.date===today) || { date:today, symptoms:[] };
  const toggle = symptom => {
    const has = todayLog.symptoms.includes(symptom);
    const updated = { ...todayLog, symptoms: has ? todayLog.symptoms.filter(s=>s!==symptom) : [...todayLog.symptoms, symptom] };
    const newLog = log.filter(l=>l.date!==today).concat(updated);
    setLog(newLog); localStorage.setItem(key,JSON.stringify(newLog));
  };
  return (
    <div className="fade-in" style={{ maxWidth:560 }}>
      <PageTitle>Symptoms</PageTitle>
      <Card style={{ marginBottom:16 }}>
        <SectionHeading>Today — {new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</SectionHeading>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
          {SYMPTOMS.map(s=>{
            const active = todayLog.symptoms.includes(s);
            return (
              <button key={s} onClick={()=>toggle(s)} style={{
                padding:'7px 14px', borderRadius:20, cursor:'pointer', fontSize:13, transition:'all 0.15s',
                background: active ? C.rose : `${C.pink}50`,
                color: active ? '#fff' : C.rose,
                border:`0.5px solid ${active ? C.rose : C.border}`,
              }}>{s}</button>
            );
          })}
        </div>
      </Card>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {log.slice().reverse().slice(0,7).filter(l=>l.symptoms.length>0).map(l=>(
          <Card key={l.date} style={{ padding:'12px 16px' }}>
            <div style={{ fontSize:12, color:C.textMuted, marginBottom:6 }}>{l.date}</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>

          </Card>
        ))}
      </div>
    </div>
  );
};

/* ── Finance Tracker (reusable) ─────────────────────────────────── */
const FinanceTracker = ({ namespace='global' }) => {
  const key = `nylaos_finance_${namespace}`;
  const [entries, setEntries] = useState(()=>JSON.parse(localStorage.getItem(key)||'[]'));
  const [form, setForm] = useState({label:'',amount:'',type:'income',category:''});
  const save = e => { setEntries(e); localStorage.setItem(key,JSON.stringify(e)); };
  const add = () => {
    if (!form.label||!form.amount) return;
    save([...entries,{id:Date.now(),...form,amount:parseFloat(form.amount)}]);
    setForm({label:'',amount:'',type:'income',category:''});
  };
  const income  = entries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const expense = entries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const fmt = n=>'$'+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});

  const byMonth = {};
  entries.forEach(e => {
    const d = new Date(e.id);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!byMonth[k]) byMonth[k] = {income:0,expense:0,label:MONTHS3[d.getMonth()]};
    if (e.type==='income') byMonth[k].income += e.amount;
    else byMonth[k].expense += e.amount;
  });
  const chartMonths = Object.keys(byMonth).sort().slice(-6);
  const maxVal = chartMonths.length > 0 ? Math.max(...chartMonths.flatMap(m=>[byMonth[m].income,byMonth[m].expense]),1) : 1;

  return (
    <div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12, marginBottom:16 }}>
        {[{label:'Revenue',val:income,color:'#4CAF77'},{label:'Expenses',val:expense,color:C.rose},{label:'Net',val:income-expense,color:income-expense>=0?'#4CAF77':C.rose}].map(({label,val,color})=>(
          <Card key={label} style={{ padding:'14px 16px', textAlign:'center' }}>
            <div style={{ fontSize:11, color:C.textLight, marginBottom:4 }}>{label}</div>
            <div style={{ fontSize:18, fontWeight:600, color }}>{fmt(val)}</div>
          </Card>
        ))}
      </div>
      {chartMonths.length > 1 && (
        <Card style={{ marginBottom:14, padding:'14px 16px' }}>
          <SectionHeading>Revenue vs Expenses</SectionHeading>
          <svg width="100%" viewBox="0 0 380 100" preserveAspectRatio="xMidYMid meet" style={{ overflow:'visible', display:'block' }}>
            {chartMonths.map((m,i) => {
              const slotW = 380/chartMonths.length;
              const barW = Math.floor(slotW*0.33);
              const x = i*slotW + slotW*0.1;
              const ih = Math.round((byMonth[m].income/maxVal)*72);
              const eh = Math.round((byMonth[m].expense/maxVal)*72);
              return (
                <g key={m}>
                  <rect x={x} y={72-ih} width={barW} height={Math.max(ih,2)} fill="#4CAF77" rx={2} opacity={0.85}/>
                  <rect x={x+barW+3} y={72-eh} width={barW} height={Math.max(eh,2)} fill={C.rose} rx={2} opacity={0.75}/>
                  <text x={x+barW} y={88} textAnchor="middle" style={{fontSize:8,fill:C.textMuted}}>{byMonth[m].label}</text>
                </g>
              );
            })}
            <line x1={0} y1={72} x2={380} y2={72} stroke={C.border} strokeWidth={0.5}/>
          </svg>
          <div style={{ display:'flex', gap:16, marginTop:4 }}>
            {[['#4CAF77',1,'Revenue'],[C.rose,0.75,'Expenses']].map(([color,op,label])=>(
              <div key={label} style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color:C.textMuted }}>
                <div style={{ width:10, height:10, borderRadius:2, background:color, opacity:op }}/>{label}
              </div>
            ))}
          </div>
        </Card>
      )}
      <Card style={{ marginBottom:14, padding:'14px 16px' }}>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={form.label} onChange={e=>setForm(f=>({...f,label:e.target.value}))} placeholder="Description"
            style={{ flex:'1 1 140px', padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
          <input value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="Amount" type="number"
            style={{ width:110, padding:'8px 12px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
          <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}
            style={{ padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13, cursor:'pointer' }}>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <button onClick={add} style={{ padding:'8px 18px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>Add</button>
        </div>
      </Card>
      <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
        {entries.slice().reverse().map(e=>(
          <Card key={e.id} style={{ padding:'10px 14px', display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ width:8, height:8, borderRadius:'50%', flexShrink:0, background:e.type==='income'?'#4CAF77':C.rose }}/>
            <span style={{ flex:1, fontSize:13.5, color:C.text }}>{e.label}</span>
            <span style={{ fontSize:13.5, fontWeight:500, color:e.type==='income'?'#4CAF77':C.rose }}>{e.type==='income'?'+':'-'}{fmt(e.amount)}</span>
            <button onClick={()=>save(entries.filter(x=>x.id!==e.id))} style={{ background:'none', border:'none', cursor:'pointer', color:C.textMuted, fontSize:18 }}>×</button>
          </Card>
        ))}
        {entries.length===0 && <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'12px 4px' }}>No entries yet.</div>}
      </div>
    </div>
  );
};

const BrandPanel = ({ venture }) => {
  const key = `nylaos_brand_${sanitize(venture)}`;

  const fileInputRef = React.useRef(null);
  const save = b => { setBrand(b); localStorage.setItem(key,JSON.stringify(b)); };

  const addImages = (files) => {
    const arr = Array.from(files);
    arr.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const src = e.target.result;
        const id = Date.now() + Math.random();
        setBrand(prev => {
          const updated = {...prev, moodImages:[...(prev.moodImages||[]), {id, src}]};
          localStorage.setItem(key, JSON.stringify(updated));
          return updated;
        });
      };
      reader.readAsDataURL(file);
    });
  };

    e.preventDefault();
    addImages(e.dataTransfer.files);

    <div>

      <Card style={{ marginBottom:14 }}>
        <SectionHeading>Content Pillars</SectionHeading>
        <div style={{ display:'flex', gap:10 }}>
          {[0,1,2].map(i=>(
            <input key={i} value={(brand.pillars||['','',''])[i]||''}
              onChange={e=>{ const p=[...((brand.pillars||['','','']))]; p[i]=e.target.value; save({...brand,pillars:p}); }}

const VentureOverview = ({ venture }) => {
  const notesKey = `nylaos_venture_overview_${sanitize(venture)}`;
  const vdKey = `nylaos_vd_${sanitize(venture)}`;
  const ns = sanitize(venture);

  const defaults = VENTURE_DATA[venture] || { emoji:'💼', status:'Active', statusColor:C.rose, pillar:'Business', progress:0, description:'Your venture workspace.', mission:'', vision:'', offerings:[] };

  // Load saved edits merged over defaults
  const [vd, setVd] = useState(() => {
    const saved = JSON.parse(localStorage.getItem(vdKey)||'null');
    return saved ? {...defaults, ...saved} : {...defaults};
  });
  const [notes, setNotes] = useState(()=>localStorage.getItem(notesKey)||'');
  const [editingOffering, setEditingOffering] = useState(null);

  const saveVd = (field, value) => {
    setVd(prev => {
      const updated = {...prev, [field]:value};
      localStorage.setItem(vdKey, JSON.stringify(updated));
      return updated;
    });
  };

  const finEntries = JSON.parse(localStorage.getItem(`nylaos_finance_${ns}`)||'[]');
  const tasks = JSON.parse(localStorage.getItem(`nylaos_tasks_${ns}`)||'[]');
  const revenue = finEntries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const expenses = finEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const tasksDone = tasks.filter(t=>t.done).length;
  const tasksTotal = tasks.length;
  const taskScore = tasksTotal > 0 ? Math.round((tasksDone/tasksTotal)*100) : null;
  const finScore = revenue > 0 ? Math.min(100,Math.max(0,Math.round(((revenue-expenses)/revenue)*100+50))) : null;
  const scores = [finScore, taskScore].filter(s=>s!==null);
  const healthScore = scores.length > 0 ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const healthColor = healthScore===null?C.textMuted:healthScore>=70?'#4CAF77':healthScore>=40?'#F4A261':C.rose;
  const fmt = n=>'$'+n.toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});
  const CIRC = 2*Math.PI*32;

  const statusColors = { Active:'#4CAF77', Planning:'#9080d8', Research:'#80b4dc', Launch:'#F4A261' };
  const sc = statusColors[vd.status] || vd.statusColor;

  const inputBase = { border:'none', background:'transparent', fontFamily:'inherit', outline:'none', width:'100%' };

  return (
    <div>
      {/* Header hero card */}
      <Card style={{ background:`linear-gradient(135deg,${C.pink}35,${C.lavender}35)`, marginBottom:14 }}>
        <div style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
          {/* Emoji — click to edit */}
          <div style={{ position:'relative', flexShrink:0 }}>
            <input value={vd.emoji||''} onChange={e=>saveVd('emoji',e.target.value)}
              style={{ ...inputBase, fontSize:32, width:48, textAlign:'center', cursor:'text', lineHeight:1 }}
              title="Click to change emoji"/>
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:6 }}>
              <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:20, color:C.rose, fontWeight:400 }}>{venture}</div>
              {/* Status dropdown */}
              <select value={vd.status||'Active'} onChange={e=>saveVd('status',e.target.value)}
                style={{ fontSize:10.5, fontWeight:600, padding:'2px 9px', borderRadius:20,
                  background:`${sc}22`, color:sc, border:`1px solid ${sc}50`, letterSpacing:0.3,
                  fontFamily:'inherit', cursor:'pointer', appearance:'none', WebkitAppearance:'none' }}>
                {['Active','Planning','Research','Launch'].map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            {/* Pillar — editable */}
            <input value={vd.pillar||''} onChange={e=>saveVd('pillar',e.target.value)}
              placeholder="Business pillar..."
              style={{ ...inputBase, fontSize:11.5, color:C.accent, fontWeight:500, marginBottom:5 }}/>
            {/* Description — editable */}
            <textarea value={vd.description||''} onChange={e=>saveVd('description',e.target.value)}
              placeholder="Short description of this venture..."
              style={{ ...inputBase, fontSize:13, color:C.textLight, resize:'none', lineHeight:1.65, minHeight:38 }}/>
          </div>
          {/* Health score ring */}
          <div style={{ textAlign:'center', flexShrink:0 }}>
            <div style={{ fontSize:9.5, color:C.textMuted, fontWeight:600, letterSpacing:0.5, textTransform:'uppercase', marginBottom:4 }}>Health</div>
            <svg viewBox="0 0 72 72" width={62} height={62}>
              <circle cx={36} cy={36} r={32} fill="none" stroke={`${C.border}`} strokeWidth={8}/>
              {healthScore!==null && (
                <circle cx={36} cy={36} r={32} fill="none" stroke={healthColor} strokeWidth={8}
                  strokeDasharray={CIRC} strokeDashoffset={CIRC*(1-(healthScore/100))}
                  strokeLinecap="round" transform="rotate(-90 36 36)" style={{transition:'stroke-dashoffset 0.6s ease'}}/>
              )}
              <text x={36} y={41} textAnchor="middle" style={{fontSize:healthScore!==null?15:10,fill:healthScore!==null?healthColor:C.textMuted,fontWeight:700}}>{healthScore!==null?healthScore:'—'}</text>
            </svg>
          </div>
        </div>

        {/* Financial metrics row */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8, marginTop:14 }}>
          {[
            {label:'Revenue', value:fmt(revenue), color:'#4CAF77'},
            {label:'Expenses', value:fmt(expenses), color:C.rose},
            {label:'Net', value:fmt(revenue-expenses), color:revenue-expenses>=0?'#4CAF77':C.rose},
          ].map(({label,value,color})=>(
            <div key={label} style={{ background:'rgba(255,255,255,0.65)', borderRadius:10, padding:'10px 12px', textAlign:'center' }}>
              <div style={{ fontSize:9.5, color:C.textMuted, marginBottom:2 }}>{label}</div>
              <div style={{ fontSize:13.5, fontWeight:600, color }}>{value}</div>

          ))}
        </div>
      </Card>

      {/* Mission & Vision — fully editable */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
        <Card>
          <SectionHeading>Mission</SectionHeading>
          <textarea value={vd.mission||''} onChange={e=>saveVd('mission',e.target.value)}

        </Card>
        <Card>
          <SectionHeading>Vision</SectionHeading>
          <textarea value={vd.vision||''} onChange={e=>saveVd('vision',e.target.value)}
            placeholder="Add your vision statement..."
            style={{ ...inputBase, fontSize:13.5, color:C.text, lineHeight:1.75, fontStyle:'italic', resize:'none', minHeight:72 }}/>
        </Card>
      </div>

      {/* Offerings — editable list */}
      <Card style={{ marginBottom:12 }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <SectionHeading style={{ marginBottom:0 }}>Key Offerings</SectionHeading>
          <button onClick={()=>{ const o=[...(vd.offerings||[]),'New offering']; saveVd('offerings',o); setEditingOffering(o.length-1); }}
            style={{ fontSize:11.5, padding:'3px 10px', borderRadius:20, background:C.rose, color:'#fff', border:'none', cursor:'pointer', fontFamily:'inherit' }}>+ Add</button>
        </div>
        {(vd.offerings||[]).length === 0 && (
          <div style={{ fontSize:13, color:C.textMuted, fontStyle:'italic' }}>No offerings yet — click + Add to start</div>
        )}
        <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
          {(vd.offerings||[]).map((o,i)=>(
            <div key={i} style={{ display:'flex', alignItems:'center', gap:4, background:`${C.lavender}50`, borderRadius:20, border:`0.5px solid ${C.border}`, padding:'3px 8px 3px 12px' }}>
              {editingOffering===i ? (
                <input autoFocus value={o} onChange={e=>{ const arr=[...(vd.offerings||[])]; arr[i]=e.target.value; saveVd('offerings',arr); }}
                  onBlur={()=>setEditingOffering(null)} onKeyDown={e=>e.key==='Enter'&&setEditingOffering(null)}
                  style={{ ...inputBase, fontSize:12, color:C.accent, width:Math.max(60, o.length*7.5), minWidth:60 }}/>
              ) : (
                <span onClick={()=>setEditingOffering(i)} style={{ fontSize:12, color:C.accent, cursor:'text' }}>✦ {o}</span>
              )}
              <button onClick={()=>{ const arr=(vd.offerings||[]).filter((_,j)=>j!==i); saveVd('offerings',arr); if(editingOffering===i) setEditingOffering(null); }}
                style={{ background:'none', border:'none', color:C.textMuted, cursor:'pointer', fontSize:12, lineHeight:1, padding:'0 2px' }}>✕</button>
            </div>
          ))}
        </div>
      </Card>

      {/* Launch progress — editable slider */}
      <Card style={{ marginBottom:12, padding:'14px 16px' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:7 }}>
          <span style={{ fontSize:12.5, color:C.textLight }}>Launch Progress</span>
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <input type="number" min={0} max={100} value={vd.progress||0}
              onChange={e=>saveVd('progress',Math.min(100,Math.max(0,parseInt(e.target.value)||0)))}
              style={{ width:44, padding:'2px 4px', borderRadius:6, border:`0.5px solid ${C.border}`, fontSize:12, fontWeight:600, color:sc, textAlign:'center', fontFamily:'inherit', background:'transparent' }}/>
            <span style={{ fontSize:12, color:sc }}>%</span>
          </div>
        </div>
        <input type="range" min={0} max={100} value={vd.progress||0}
          onChange={e=>saveVd('progress',parseInt(e.target.value))}
          style={{ width:'100%', accentColor:sc, cursor:'pointer' }}/>
        {tasksTotal > 0 && (
          <>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:10, marginBottom:5 }}>
              <span style={{ fontSize:12.5, color:C.textLight }}>Task Completion</span>
              <span style={{ fontSize:12, fontWeight:600, color:C.rose }}>{tasksDone}/{tasksTotal}</span>
            </div>
            <div style={{ height:6, borderRadius:3, background:`${C.pink}50`, overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:3, background:C.rose, width:`${taskScore}%`, transition:'width 0.35s' }}/>
            </div>
          </>
        )}
      </Card>

      {/* Notes */}
      <Card>
        <SectionHeading>My Notes & Ideas</SectionHeading>
        <textarea value={notes} onChange={e=>{setNotes(e.target.value);localStorage.setItem(notesKey,e.target.value);}}
          placeholder="Current status, next steps, ideas, blockers..."
          style={{ width:'100%', height:160, resize:'none', border:'none', padding:'4px 0', fontSize:14, lineHeight:1.8, color:C.rose, background:'transparent', fontFamily:'inherit', outline:'none' }}/>
      </Card>
    </div>
  );
};

const BusinessPlanEditor = ({ storageKey, title }) => {
  const KEY = `nylaos_note_${storageKey}`;
  const [content, setContent] = useState(()=>localStorage.getItem(KEY)||'');
  const [fmt, setFmt] = useState({bold:false,italic:false,underline:false,strike:false});
  const editorRef = useRef(null);

  useEffect(()=>{

/* ── Chat History Helper ────────────────────────────────────────── */
const saveChatSession = (id, label, type, msgs) => {
  if (!msgs || !msgs.some(m=>m.role==='user')) return;
  const all = JSON.parse(localStorage.getItem('nylaos_chat_history')||'[]');
  const idx = all.findIndex(h=>h.id===id);
  const sess = {id, label, type, date:new Date().toISOString(), msgs};
  if (idx>=0) all[idx]=sess; else all.unshift(sess);
  localStorage.setItem('nylaos_chat_history', JSON.stringify(all.slice(0,200)));
};

/* ── Cosmic Chat (shared AI panel) ─────────────────────────────── */
const CosmicChat = ({ systemPrompt, placeholder, label='Cosmic' }) => {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const sessionId = useRef(null);
  const endRef = useRef(null);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,loading,fullscreen]);

  const send = async () => {
    if (!input.trim() || loading) return;
    const apiKey = localStorage.getItem('nylaos_api_key');
    if (!apiKey) { setMsgs(m=>[...m,{role:'assistant',text:'Please add your Anthropic API key in Settings → API Keys to unlock cosmic AI readings.'}]); return; }
    if (!sessionId.current) sessionId.current = Date.now();
    const userText = input.trim();
    const history = [...msgs, {role:'user', text:userText}];
    setMsgs(history); setInput(''); setLoading(true);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:900,system:systemPrompt,messages:history.map(m=>({role:m.role,content:m.text}))}),
      });
      const data = await res.json();
      const reply = data.content?.[0]?.text || 'I couldn\'t get a response — please try again.';
      const updated = [...history, {role:'assistant',text:reply}];
      setMsgs(updated);
      saveChatSession(sessionId.current, label, 'cosmic', updated);
    } catch(e) {
      setMsgs(m=>[...m,{role:'assistant',text:'⚠️ Connection issue. Check your API key in Settings → API Keys.'}]);
    } finally { setLoading(false); }
  };

  const renderMsgs = () => (<>
    {msgs.length===0 && <div style={{ fontSize:13, color:C.textMuted, fontStyle:'italic', padding:'16px 0' }}>Ask anything — your chart, a transit, what a placement means for you...</div>}

      <div key={i} style={{ display:'flex', justifyContent:m.role==='user'?'flex-end':'flex-start' }}>
        <div style={{ maxWidth:'88%', padding:'10px 14px', borderRadius:14, fontSize:13, lineHeight:1.7,
          background:m.role==='user'?C.rose:`${C.lavender}DD`, color:m.role==='user'?'#fff':C.rose,
          borderBottomRightRadius:m.role==='user'?3:14, borderBottomLeftRadius:m.role==='assistant'?3:14, whiteSpace:'pre-wrap',
        }}>{m.text}</div>
      </div>
    ))}
    {loading && <div style={{ display:'flex' }}><div style={{ padding:'10px 14px', borderRadius:14, background:`${C.lavender}DD`, borderBottomLeftRadius:3, fontSize:13, color:C.textLight }}>✦ reading the stars...</div></div>}
    <div ref={endRef}/>
  </>);

  const renderInput = () => (
    <div style={{ display:'flex', gap:8 }}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} disabled={loading}
        placeholder={placeholder||'Ask a cosmic question...'}
        style={{ flex:1, padding:'10px 14px', borderRadius:12, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.rose, fontSize:13 }}/>
      <button onClick={send} disabled={loading||!input.trim()} style={{ padding:'10px 20px', borderRadius:12, background:loading?C.textMuted:C.rose, color:'#fff', border:'none', fontSize:15, cursor:'pointer' }}>↑</button>
    </div>
  );

  if (fullscreen) return (
    <div style={{ position:'fixed', inset:0, zIndex:9998, background:C.cream, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 20px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', background:C.sidebarBg, flexShrink:0 }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:16, color:C.rose }}>✦ {label}</div>
        <button onClick={()=>setFullscreen(false)} style={{ background:'none', border:'none', fontSize:20, color:C.textMuted, cursor:'pointer', lineHeight:1 }}>✕</button>
      </div>
      <div style={{ flex:1, overflowY:'auto', padding:20, display:'flex', flexDirection:'column', gap:8 }}>{renderMsgs()}</div>
      <div style={{ padding:'12px 20px', borderTop:`0.5px solid ${C.border}`, background:C.cream }}>{renderInput()}</div>
    </div>
  );

  return (
    <Card style={{ marginTop:20 }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
        <SectionHeading style={{ marginBottom:0 }}>✦ Ask the Cosmos</SectionHeading>
        <button onClick={()=>setFullscreen(true)} title="Fullscreen" style={{ background:'none', border:`0.5px solid ${C.border}`, borderRadius:7, padding:'3px 9px', fontSize:13, color:C.textMuted, cursor:'pointer' }}>⤢</button>
      </div>
      <div style={{ height:300, overflowY:'auto', display:'flex', flexDirection:'column', gap:8, marginBottom:12, padding:'4px 0' }}>{renderMsgs()}</div>
      {renderInput()}
    </Card>
  );
};

const reduceNum = n => {
  let s = parseInt(n);
  while (s > 9 && s !== 11 && s !== 22 && s !== 33) {
    s = String(s).split('').reduce((a,d)=>a+parseInt(d),0);
  }
  return s;
};

const getCurrentSeason = () => {
  const now = new Date(); const m=now.getMonth()+1, d=now.getDate();
  const signs = [
    {sign:'Capricorn',from:[12,22],to:[1,19]},{sign:'Aquarius',from:[1,20],to:[2,18]},
    {sign:'Pisces',from:[2,19],to:[3,20]},{sign:'Aries',from:[3,21],to:[4,19]},
    {sign:'Taurus',from:[4,20],to:[5,20]},{sign:'Gemini',from:[5,21],to:[6,20]},
    {sign:'Cancer',from:[6,21],to:[7,22]},{sign:'Leo',from:[7,23],to:[8,22]},
    {sign:'Virgo',from:[8,23],to:[9,22]},{sign:'Libra',from:[9,23],to:[10,22]},
    {sign:'Scorpio',from:[10,23],to:[11,21]},{sign:'Sagittarius',from:[11,22],to:[12,21]},
  ];
  const inRange = (fm,to,cm,cd) => {
    const afterStart = cm>fm[0]||(cm===fm[0]&&cd>=fm[1]);
    const beforeEnd  = cm<to[0]||(cm===to[0]&&cd<=to[1]);
    return afterStart && beforeEnd;
  };
  return signs.find(s=>inRange(s.from,s.to,m,d))?.sign || 'Gemini';
};
