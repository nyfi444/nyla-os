  const anytime = mine.filter(t=>!t.done && !t.calendarDate).slice(0,3);
  const taskTotal = dueNow.length + doneToday.length;
  const taskPct = taskTotal ? Math.round(doneToday.length/taskTotal*100) : 0;
  const toggleTask = id => {
    const { list, nowDone } = toggleTaskIn(tasks, id);
    saveTasks(list);
    if (nowDone) toast('Done ✓','success',1100);
  };
  const addToday = () => {
    if (!newTask.trim()) return;
    saveTasks([...tasks, { id:Date.now(), text:newTask.trim(), done:false, calendarDate:today, created:new Date().toISOString() }]);
    setNewTask('');
  };
  const toggleHabit = id => {
    const k = `${id}_${today}`; const nl = { ...habitLog, [k]: !habitLog[k] };
    setHabitLog(nl); localStorage.setItem('nylaos_habit_log', JSON.stringify(nl));
  };
  const habitsDone = habits.filter(h=>habitLog[`${h.id}_${today}`]).length;

  const events = [
    ...JSON.parse(localStorage.getItem('nylaos_events')||'[]').filter(e=>e.date===today).map(e=>({ id:'e'+e.id, text:e.text, time:e.time })),
    ...tasks.filter(t=>t.source==='calendar' && t.calendarDate===today).map(t=>({ id:'c'+t.id, text:t.text, time:t.time, done:t.done })),
  ].sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const goals = JSON.parse(localStorage.getItem('nylaos_goals')||'[]').filter(g=>(g.progress||0)<100)
    .sort((a,b)=>(a.targetDate||'9999').localeCompare(b.targetDate||'9999')).slice(0,4);

  const h = new Date().getHours();
  const greeting = h<5?'Still up':h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const heroBg = _dk
    ? 'radial-gradient(120% 140% at 0% 0%, #3a1f33 0%, #231a2e 55%, #1a1424 100%)'
    : `radial-gradient(120% 160% at 0% 0%, ${C.pink} 0%, ${C.lavLight} 55%, ${C.cream} 100%)`;

  const fieldCard = (label, value, set, storeKey, placeholder) => (
    <Card className="card-hover">
      <HomeLabel>{label}</HomeLabel>
      <TextArea value={value} height={96} placeholder={placeholder} style={{ background:'transparent', border:'none', padding:0 }}
        onChange={e=>{ set(e.target.value); localStorage.setItem(storeKey, e.target.value); }} />
    </Card>
  );

  return (
    <div className="fade-in" style={{ maxWidth:980 }}>
      <QuickLinksBar />

      {/* Hero */}
      <div style={{ position:'relative', overflow:'hidden', borderRadius:26, padding: isMobile?'24px 22px':'32px 36px', marginBottom:16, background:heroBg, border:`0.5px solid ${C.border}` }}>
        <div className="hero-orb" style={{ position:'absolute', right:-60, top:-80, width:280, height:280, borderRadius:'50%', background:`radial-gradient(circle, ${C.rose}35, transparent 65%)` }}/>
        <div className="hero-orb" style={{ position:'absolute', right:120, bottom:-120, width:220, height:220, borderRadius:'50%', background:`radial-gradient(circle, ${C.accent}30, transparent 65%)`, animationDelay:'-4s' }}/>
        <div style={{ position:'relative' }}>
          <div style={{ fontSize:12, color:C.textLight, letterSpacing:1.2, textTransform:'uppercase', marginBottom:6 }}>
            {new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
          </div>
          <div style={{ fontFamily:"'DM Serif Display',serif", fontSize: isMobile?30:42, lineHeight:1.05, color:C.rose, marginBottom:12 }}>{greeting}, {userName}<span style={{ color:C.accent }}> ✦</span></div>
          {todayAffirm && <div style={{ fontFamily:"'DM Serif Display',serif", fontStyle:'italic', fontSize: isMobile?15:17, color:C.roseDark, opacity:.85, maxWidth:560, lineHeight:1.5, marginBottom:18 }}>“{todayAffirm}”</div>}
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <span className="glass-chip">{moon.emoji} {moon.label}</span>
            <span className="glass-chip" onClick={()=>go('cosmic','Numerology')} style={{ cursor:'pointer' }}>✧ Personal Day {pDay} · {NUM_INFO[pDay]?.theme||''}</span>
            {cycle && <span className="glass-chip" onClick={()=>go('period','Cycle Overview')} style={{ cursor:'pointer', color:cycle.color }}>● {cycle.name} · Day {cycle.day}</span>}
            <span className="glass-chip">{taskTotal ? `${doneToday.length}/${taskTotal} tasks done` : 'Nothing due today'}</span>
          </div>
        </div>
      </div>

      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1.35fr 1fr', gap:16 }}>
        {/* Today's tasks */}
        <Card style={{ gridRow: isMobile?'auto':'span 2' }}>
          <HomeLabel action={<LinkBtn onClick={()=>go('tasks','Today')}>Open Tasks →</LinkBtn>}>Today</HomeLabel>
          <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:14 }}>
            <div style={{ width:54, height:54, borderRadius:'50%', background:`conic-gradient(${C.rose} ${taskPct*3.6}deg, ${C.pink}70 0)`, display:'grid', placeItems:'center', flexShrink:0 }}>
              <div style={{ width:43, height:43, borderRadius:'50%', background:C.card, display:'grid', placeItems:'center', fontSize:12, fontWeight:600, color:C.rose }}>{taskPct}%</div>
            </div>
            <div style={{ fontSize:13, color:C.textLight, lineHeight:1.5 }}>
              {taskTotal===0 ? 'Your slate is clear — today is yours to design.' : taskPct===100 ? 'Everything due today is done. ✨' : `${dueNow.length} left${dueNow.some(t=>t.calendarDate<today)?' (some carried over)':''}`}
            </div>
          </div>
          <div style={{ display:'flex', gap:8, marginBottom:12, padding:'4px 4px 4px 12px', borderRadius:14, background:C.pinkLight, border:`0.5px solid ${C.border}` }}>
            <input value={newTask} onChange={e=>setNewTask(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addToday()} placeholder="Add to today…"
              style={{ flex:1, border:'none', background:'transparent', color:C.text, fontSize:13.5, fontFamily:'inherit' }}/>
            <VoiceButton size={32} onText={t=>setNewTask(v=>(v?v+' ':'')+t)}/>
            <button onClick={addToday} style={{ padding:'6px 14px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:12.5, cursor:'pointer' }}>Add</button>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
            {[...dueNow, ...doneToday].slice(0,9).map(t=>{
              const due = prettyDue(t.calendarDate);
              return (
                <div key={t.id} style={{ display:'flex', alignItems:'center', gap:11, padding:'8px 4px', borderBottom:`0.5px solid ${C.border}80` }}>
                  <Checkbox size={18} checked={t.done} onChange={()=>toggleTask(t.id)}/>
                  <span style={{ flex:1, fontSize:13.5, color:t.done?C.textMuted:C.text, textDecoration:t.done?'line-through':'none', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{t.text}</span>
                  {due && due.tone==='overdue' && !t.done && <span style={{ fontSize:10, color:'#d05a5a' }}>{due.label}</span>}
                  {t.venture && <span style={{ fontSize:10, color:C.textMuted }}>💼</span>}
                </div>
              );
            })}
            {taskTotal===0 && anytime.length>0 && (
              <>
                <div style={{ fontSize:11.5, color:C.textMuted, margin:'6px 2px' }}>From your anytime list:</div>
                {anytime.map(t=>(
                  <div key={t.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'6px 4px' }}>
                    <span style={{ flex:1, fontSize:13, color:C.textLight }}>{t.text}</span>
                    <button onClick={()=>saveTasks(tasks.map(x=>x.id===t.id?{...x,calendarDate:today}:x))} style={{ fontSize:11, padding:'3px 10px', borderRadius:20, border:`0.5px solid ${C.border}`, background:'transparent', color:C.rose, cursor:'pointer' }}>☀ Today</button>
                  </div>
                ))}
              </>
            )}
          </div>
        </Card>

        {/* Schedule */}
        <Card>
          <HomeLabel action={<LinkBtn onClick={()=>go('calendar','Daily')}>Calendar →</LinkBtn>}>Schedule</HomeLabel>
          {events.length===0
            ? <div style={{ fontSize:13, color:C.textMuted, fontStyle:'italic' }}>Nothing on the calendar today.</div>
            : events.slice(0,5).map(e=>(
                <div key={e.id} style={{ display:'flex', gap:12, alignItems:'baseline', padding:'6px 0' }}>
                  <span style={{ fontSize:11.5, color:C.accent, minWidth:52, fontVariantNumeric:'tabular-nums' }}>{e.time ? new Date(`2000-01-01T${e.time}`).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : 'All day'}</span>
                  <span style={{ fontSize:13, color:e.done?C.textMuted:C.text, textDecoration:e.done?'line-through':'none' }}>{e.text}</span>
                </div>
              ))}
        </Card>

        {/* Habits */}
        <Card>
          <HomeLabel action={<LinkBtn onClick={()=>go('lists','Habits')}>Habits →</LinkBtn>}>Habits · {habitsDone}/{habits.length}</HomeLabel>
          <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
            {habits.map(hb=>{
              const on = !!habitLog[`${hb.id}_${today}`];
              return <button key={hb.id} onClick={()=>toggleHabit(hb.id)} style={{ padding:'7px 12px', borderRadius:20, fontSize:12.5, cursor:'pointer', fontFamily:'inherit', border:`0.5px solid ${on?C.rose:C.border}`, background:on?`linear-gradient(135deg, ${C.rose}, ${C.accent})`:'transparent', color:on?'#fff':C.text, transition:'all .15s' }}>{on?'✓ ':''}{hb.name}</button>;
            })}
          </div>
        </Card>
      </div>

      {/* Goals */}
      {goals.length>0 && (
        <Card style={{ marginTop:16 }}>
          <HomeLabel action={<LinkBtn onClick={()=>go('goals','Overview')}>All goals →</LinkBtn>}>Goals in motion</HomeLabel>
          <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(auto-fit,minmax(200px,1fr))', gap:14 }}>
            {goals.map(g=>(
              <div key={g.id}>
                <div style={{ display:'flex', justifyContent:'space-between', gap:8, marginBottom:6 }}>
                  <span style={{ fontSize:13, color:C.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{g.title}</span>
                  <span style={{ fontSize:12, color:C.rose, fontWeight:600 }}>{g.progress||0}%</span>
                </div>
                <div style={{ height:7, borderRadius:4, background:`${C.pink}70`, overflow:'hidden' }}>
                  <div style={{ height:'100%', width:`${g.progress||0}%`, borderRadius:4, background:`linear-gradient(90deg, ${C.accent}, ${C.rose})`, transition:'width .4s' }}/>
                </div>
                <div style={{ fontSize:10.5, color:C.textMuted, marginTop:4 }}>{g.venture?`💼 ${g.venture}`:g.category||''}{g.targetDate?` · by ${new Date(g.targetDate+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`:''}</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(3,1fr)', gap:16, marginTop:16 }}>
        {fieldCard("Today's intention", intention, setIntention, 'nylaos_intention_'+dayKey, 'What are you calling in today?')}
        {fieldCard("Main focus", dailyFocus, setDailyFocus, 'nylaos_focus_'+dayKey, 'The one thing that makes today a win…')}
        {fieldCard("Gratitude", gratitude, setGratitude, 'nylaos_gratitude_'+dayKey, 'Three things I’m grateful for…')}
      </div>

      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1fr 1fr', gap:16, marginTop:16 }}>
        <Card style={{ background:`linear-gradient(135deg,${C.lavender}70,${C.pink}45)`, border:'none' }}>
          <HomeLabel action={<LinkBtn onClick={()=>setEditAffirms(e=>!e)}>{editAffirms?'Done':'Edit'}</LinkBtn>}>Affirmations</HomeLabel>
          {!editAffirms ? (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {affirmations.slice(0,4).map((a,i)=><div key={i} style={{ fontSize:13, color:C.roseDark, fontFamily:"'DM Serif Display',serif", fontStyle:'italic', lineHeight:1.55 }}>✧ {a}</div>)}
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {affirmations.map((a,i)=>(
                <div key={i} style={{ display:'flex', gap:6, alignItems:'center' }}>
                  <input value={a} onChange={e=>{ const arr=[...affirmations]; arr[i]=e.target.value; saveAffirmations(arr); }}
                    style={{ flex:1, padding:'6px 10px', borderRadius:8, border:`0.5px solid ${C.border}`, fontSize:13, background:C.card, color:C.text, fontFamily:'inherit' }}/>
                  <button onClick={()=>saveAffirmations(affirmations.filter((_,j)=>j!==i))} style={{ background:'none', border:'none', color:C.textMuted, cursor:'pointer', fontSize:14 }}>✕</button>
                </div>
              ))}
              <button onClick={()=>saveAffirmations([...affirmations,'New affirmation…'])} style={{ marginTop:4, fontSize:12, padding:'5px 12px', borderRadius:20, background:C.rose, color:'#fff', border:'none', cursor:'pointer', alignSelf:'flex-start' }}>+ Add</button>
            </div>
          )}
        </Card>
        <Card>
          <HomeLabel>Quick note</HomeLabel>
          <TextArea value={note} height={120} placeholder="What's on your mind right now…" style={{ background:'transparent', border:'none', padding:0 }}
            onChange={e=>{ setNote(e.target.value); localStorage.setItem('nylaos_quicknote',e.target.value); }} />
        </Card>
      </div>
    </div>
  );
};

/* ── Focus Mode ─────────────────────────────────────────────────────
   Counts down to an end time (not by ticking), so it stays right if the
   tab sleeps. Finished focus sessions are logged to nylaos_focus_sessions. */
const FOCUS_PRESETS = [
  { key:'pomodoro', label:'Pomodoro', focus:25, brk:5, long:15 },
  { key:'deep',     label:'Deep work', focus:50, brk:10, long:20 },
  { key:'quick',    label:'Quick',     focus:15, brk:3, long:10 },
];
const chime = () => {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f,i)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0, ctx.currentTime+i*0.18); g.gain.linearRampToValueAtTime(0.18, ctx.currentTime+i*0.18+0.02); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.18+0.9);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+i*0.18); o.stop(ctx.currentTime+i*0.18+1); });
  } catch(e) {}
};
const FocusMode = () => {
  const isMobile = useIsMobile();
  const [presetKey, setPresetKey] = useState(()=>localStorage.getItem('nylaos_focus_preset')||'pomodoro');
  const preset = FOCUS_PRESETS.find(p=>p.key===presetKey) || FOCUS_PRESETS[0];
  const [mode, setMode] = useState('focus'); // focus | break | long
  const minutesFor = m => m==='focus' ? preset.focus : m==='long' ? preset.long : preset.brk;
  const [remaining, setRemaining] = useState(preset.focus*60);
  const [endAt, setEndAt] = useState(null);
  const [round, setRound] = useState(0);
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem('nylaos_tasks')||'[]'));
  const [taskId, setTaskId] = useState(null);
  const [sessions, setSessions] = useState(()=>JSON.parse(localStorage.getItem('nylaos_focus_sessions')||'[]'));
  const [sound, setSound] = useState(true);
  const running = endAt !== null;
  const today = toDateKey();

  useEffect(()=>{ if (!running) setRemaining(minutesFor(mode)*60); },[presetKey, mode]);
  useEffect(()=>{
    if (!running) { document.title = 'Nyla OS ✦'; return; }
    const tick = () => {
      const left = Math.max(0, Math.round((endAt - Date.now())/1000));
      setRemaining(left);
      document.title = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')} · ${mode==='focus'?'Focus':'Break'}`;
      if (left <= 0) finish();
    };
    tick(); const t = setInterval(tick, 500);
    return ()=>clearInterval(t);
  },[endAt]);
  useEffect(()=>()=>{ document.title = 'Nyla OS ✦'; },[]);

  const finish = () => {
    setEndAt(null);
    if (sound) chime();
    if (mode==='focus') {
      const s = [...sessions, { id:Date.now(), date:today, minutes:preset.focus, taskId }];
      setSessions(s); localStorage.setItem('nylaos_focus_sessions', JSON.stringify(s));
      const nextRound = round+1; setRound(nextRound);
      const next = nextRound % 4 === 0 ? 'long' : 'break';
      setMode(next); setRemaining(minutesFor(next)*60);
      toast(`Focus session done ✨ ${next==='long'?'Take a long break':'Take a short break'}`,'success',3000);
      try { if (Notification?.permission==='granted') new Notification('Focus session done ✨', { body:'Time for a break.' }); } catch(e) {}
    } else {
      setMode('focus'); setRemaining(preset.focus*60);
      toast('Break’s over — ready when you are','info',2500);
      try { if (Notification?.permission==='granted') new Notification('Break’s over', { body:'Ready for another focus session?' }); } catch(e) {}
    }
  };
  const start = () => { try { if (window.Notification && Notification.permission==='default') Notification.requestPermission(); } catch(e) {} setEndAt(Date.now() + remaining*1000); };
  const pause = () => setEndAt(null);
  const reset = () => { setEndAt(null); setRemaining(minutesFor(mode)*60); };
  const switchMode = m => { setEndAt(null); setMode(m); setRemaining(minutesFor(m)*60); };
  const total = minutesFor(mode)*60; const pct = 1 - remaining/total;
  const mm = String(Math.floor(remaining/60)).padStart(2,'0'), ss = String(remaining%60).padStart(2,'0');
  const open = tasks.filter(t=>t.source!=='calendar' && !t.done).sort((a,b)=>(a.calendarDate||'9999').localeCompare(b.calendarDate||'9999'));
  const focusTask = tasks.find(t=>t.id===taskId);
  const todayMin = sessions.filter(s=>s.date===today).reduce((a,s)=>a+s.minutes,0);
  const week = Array.from({length:7},(_,i)=>{ const k = addDaysKey(i-6); return { label:keyToDate(k).toLocaleDateString('en-US',{weekday:'long'}), short:DAYS3[keyToDate(k).getDay()], value: sessions.filter(s=>s.date===k).reduce((a,s)=>a+s.minutes,0) }; });
  const ring = 250, R = 110, circ = 2*Math.PI*R;
  const modeColor = mode==='focus' ? C.rose : '#4f9d8a';
  return (
    <div className="fade-in" style={{ maxWidth:960 }}>
      <PageTitle subtitle={`${todayMin} minutes focused today · ${sessions.filter(s=>s.date===today).length} session${sessions.filter(s=>s.date===today).length===1?'':'s'}`}
        right={<div style={{ display:'flex', gap:6 }}>{FOCUS_PRESETS.map(p=><Pill key={p.key} active={presetKey===p.key} onClick={()=>{ if(running) return; setPresetKey(p.key); localStorage.setItem('nylaos_focus_preset',p.key); }}>{p.label} {p.focus}m</Pill>)}</div>}>Focus Mode</PageTitle>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'minmax(0,1.2fr) minmax(0,1fr)', gap:16 }}>
        <Card style={{ textAlign:'center', padding:'26px 20px', background: running ? `radial-gradient(circle at 50% 40%, ${modeColor}18, ${C.card} 70%)` : C.card }}>
          <div style={{ display:'inline-flex', gap:4, padding:4, borderRadius:20, background:C.pinkLight, marginBottom:18 }}>
            {[['focus','Focus'],['break','Short break'],['long','Long break']].map(([k,l])=><button key={k} onClick={()=>switchMode(k)} style={{ padding:'6px 14px', borderRadius:16, border:'none', fontSize:12.5, cursor:'pointer', background: mode===k?C.card:'transparent', color: mode===k?C.text:C.textMuted, boxShadow: mode===k?'0 2px 8px rgba(0,0,0,.06)':'none' }}>{l}</button>)}
          </div>
          <svg width={ring} height={ring} style={{ display:'block', margin:'0 auto' }}>
            <circle cx={ring/2} cy={ring/2} r={R} fill="none" stroke={`${C.pink}90`} strokeWidth={10}/>
            <circle cx={ring/2} cy={ring/2} r={R} fill="none" stroke={modeColor} strokeWidth={10} strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} transform={`rotate(-90 ${ring/2} ${ring/2})`} style={{ transition:'stroke-dashoffset .5s linear' }}/>
            <text x="50%" y="47%" textAnchor="middle" dominantBaseline="central" style={{ fontFamily:"'DM Serif Display',serif", fontSize:56, fill:C.text }}>{mm}:{ss}</text>
            <text x="50%" y="64%" textAnchor="middle" style={{ fontSize:12, fill:C.textMuted, letterSpacing:1.5 }}>{mode==='focus'?`SESSION ${round%4+1} OF 4`:'BREATHE'}</text>
          </svg>
          {focusTask && <div style={{ fontSize:14, color:C.text, margin:'10px auto 0', maxWidth:360 }}>Focusing on <b>{focusTask.text}</b></div>}
          <div style={{ display:'flex', gap:10, justifyContent:'center', marginTop:18 }}>
            <button onClick={running?pause:start} style={{ padding:'13px 40px', borderRadius:30, border:'none', fontSize:15, fontWeight:600, cursor:'pointer', color:'#fff', background:`linear-gradient(135deg, ${modeColor}, ${mode==='focus'?C.accent:'#5b8ed6'})`, boxShadow:`0 10px 26px ${modeColor}40` }}>{running?'Pause':remaining<total?'Resume':'Start'}</button>
            <button onClick={reset} style={{ padding:'13px 20px', borderRadius:30, border:`0.5px solid ${C.border}`, background:C.card, color:C.text, fontSize:14, cursor:'pointer' }}>Reset</button>
            <button onClick={finish} title="Skip to the next session" style={{ padding:'13px 16px', borderRadius:30, border:`0.5px solid ${C.border}`, background:C.card, color:C.textMuted, fontSize:14, cursor:'pointer' }}>⏭</button>
          </div>
          <label style={{ display:'inline-flex', alignItems:'center', gap:6, marginTop:14, fontSize:12, color:C.textMuted, cursor:'pointer' }}><input type="checkbox" checked={sound} onChange={e=>setSound(e.target.checked)} style={{ accentColor:C.rose }}/> Chime when time's up</label>
        </Card>
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <Card>
            <SectionHeading>What are you working on?</SectionHeading>
            {open.length===0 && <div style={{ fontSize:12.5, color:C.textMuted }}>No open tasks — just focus.</div>}
            <div style={{ maxHeight:230, overflowY:'auto' }}>
              {open.slice(0,12).map(t=>{ const on = taskId===t.id; return (
                <div key={t.id} onClick={()=>setTaskId(on?null:t.id)} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:12, cursor:'pointer', background: on?`${C.rose}14`:'transparent', border:`0.5px solid ${on?C.rose+'60':'transparent'}` }}>
                  <Checkbox size={17} checked={false} onChange={e=>{ e.stopPropagation(); const next = toggleTaskIn(tasks, t.id).list; setTasks(next); localStorage.setItem('nylaos_tasks', JSON.stringify(next)); if(taskId===t.id) setTaskId(null); toast('Done ✓','success',1000); }}/>
                  <span style={{ flex:1, fontSize:13, color:C.text }}>{t.text}</span>
                  {t.calendarDate && <span style={{ fontSize:10.5, color:C.textMuted }}>{prettyDue(t.calendarDate)?.label}</span>}
                </div>
              ); })}
            </div>
          </Card>
          <Card>
            <SectionHeading>Focus this week</SectionHeading>
            <BarChart data={week} height={110} valueFmt={v=>`${v} min`}/>

};

// One-time move of old nylaos_day_items into nylaos_tasks (kept from the old calendar).
(() => { try {

  const existing = JSON.parse(localStorage.getItem('nylaos_tasks')||'[]'); const ids = new Set(existing.map(t=>String(t.id)));
  const moved = old.filter(i=>!ids.has(String(i.id))).map(i=>({ id:i.id, text:i.text, done:i.done||false, calendarDate:i.dateKey, time:i.time||null, created:new Date().toISOString() }));
  if (moved.length) localStorage.setItem('nylaos_tasks', JSON.stringify([...existing, ...moved]));
  localStorage.removeItem('nylaos_day_items');
} catch(e) {} })();

/* ── Calendar ───────────────────────────────────────────────────────
   One view over three kinds of things: events (nylaos_events), schedule
   items added on the calendar (tasks with source 'calendar', which can be
   checked off), and dated tasks from Tasks. */
const EVENT_COLORS = [
  { key:'rose', color:'#c4607a' }, { key:'lavender', color:'#9080d8' }, { key:'sky', color:'#5b8ed6' },
  { key:'sage', color:'#4f9d8a' }, { key:'gold', color:'#c4904a' }, { key:'berry', color:'#a8467a' },
];
const eventColor = key => (EVENT_COLORS.find(c=>c.key===key)||EVENT_COLORS[0]).color;
const fmtTime = t => { if (!t) return ''; const [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; const hh = h%12||12; return m ? `${hh}:${String(m).padStart(2,'0')} ${ap}` : `${hh} ${ap}`; };
const timeToMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+(m||0); };
const keyToDate = k => new Date(k+'T12:00:00');

const useCalendarData = () => {
  const [events, setEvents] = useState(()=>JSON.parse(localStorage.getItem('nylaos_events')||'[]'));
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem('nylaos_tasks')||'[]'));
  const saveEvents = e => { setEvents(e); localStorage.setItem('nylaos_events', JSON.stringify(e)); };
  const saveTasks = t => { setTasks(t); localStorage.setItem('nylaos_tasks', JSON.stringify(t)); };
  const byDay = React.useMemo(()=>{
    const map = {};
    const push = (k, item) => { if (!k) return; (map[k]=map[k]||[]).push(item); };
    events.forEach(e => push(e.date, { kind:'event', id:e.id, text:e.text, time:e.time||null, endTime:e.endTime||null, location:e.location, color:eventColor(e.color), series:e.recurringGroupId, raw:e }));
    tasks.forEach(t => {
      if (t.source==='calendar') push(t.calendarDate, { kind:'schedule', id:t.id, text:t.text, time:t.time||null, endTime:t.endTime||null, done:t.done, color:eventColor(t.color||'lavender'), series:t.recurGroup, raw:t });
      else if (t.calendarDate) push(t.calendarDate, { kind:'task', id:t.id, text:t.text, time:t.time||null, done:t.done, color:C.accent, raw:t });
    });
    Object.values(map).forEach(list => list.sort((a,b)=> (a.kind==='task')-(b.kind==='task') || (timeToMin(a.time)??-1)-(timeToMin(b.time)??-1)));
    return map;
  },[events, tasks]);
  const toggle = item => {
    if (item.kind==='event') return;
    if (item.kind==='task') { saveTasks(toggleTaskIn(tasks, item.id).list); return; }
    saveTasks(tasks.map(t=>t.id===item.id?{...t,done:!t.done,completedDate:!t.done?toDateKey():null}:t));
  };
  return { events, tasks, byDay, saveEvents, saveTasks, toggle };
};

const EventEditor = ({ initial, data, onClose }) => {
  const isNew = !initial.id;
  const kind = initial.kind || 'event';
  const src = initial.raw || {};
  const [form, setForm] = useState(()=>({
    text: src.text||'', date: src.date||src.calendarDate||initial.date||toDateKey(), time: src.time||initial.time||'', endTime: src.endTime||'',
    location: src.location||'', color: src.color||'rose', notes: src.notes||'', repeat:'', until:'',
  }));
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  const save = () => {
    if (!form.text.trim()) { toast('Give it a name','error'); return; }
    if (kind==='task') { data.saveTasks(data.tasks.map(t=>t.id===src.id?{...t,text:form.text.trim(),calendarDate:form.date,time:form.time||null}:t)); onClose(); return; }
    if (kind==='schedule') { data.saveTasks(data.tasks.map(t=>t.id===src.id?{...t,text:form.text.trim(),calendarDate:form.date,time:form.time||null,endTime:form.endTime||null,color:form.color,notes:form.notes}:t)); onClose(); return; }
    const base = { text:form.text.trim(), time:form.time||null, endTime:form.endTime||null, location:form.location.trim(), color:form.color, notes:form.notes };
    if (!isNew) { data.saveEvents(data.events.map(e=>e.id===src.id?{...e,...base,date:form.date}:e)); onClose(); toast('Event updated','success',1200); return; }
    if (form.repeat && form.until && form.until>form.date) {
      const groupId = Date.now(); const out = []; let d = keyToDate(form.date); let i = 0;
      while (toDateKey(d) <= form.until && i < 400) {
        const k = toDateKey(d);
        if (form.repeat!=='weekdays' || (d.getDay()>0 && d.getDay()<6)) out.push({ id:groupId+i, date:k, ...base, recurringGroupId:groupId });
        if (form.repeat==='daily'||form.repeat==='weekdays') d.setDate(d.getDate()+1);
        else if (form.repeat==='weekly') d.setDate(d.getDate()+7);
        else if (form.repeat==='biweekly') d.setDate(d.getDate()+14);
        else d.setMonth(d.getMonth()+1);
        i++;
      }
      data.saveEvents([...data.events, ...out]); toast(`${out.length} events added`,'success',1500);
    } else {
      data.saveEvents([...data.events, { id:Date.now(), date:form.date, ...base }]); toast('Event added','success',1200);
    }
    onClose();
  };
  const del = (all) => {
    if (kind==='event') {
      const gone = all ? data.events.filter(e=>e.recurringGroupId===src.recurringGroupId && e.date>=src.date) : [src];
      gone.forEach(e=>addToTrash('calendar_event', e.text, e, 'nylaos_events'));
      data.saveEvents(data.events.filter(e=>!gone.some(g=>g.id===e.id)));
    } else {
      const gone = all ? data.tasks.filter(t=>t.recurGroup===src.recurGroup && t.calendarDate>=src.calendarDate) : [src];
      gone.forEach(t=>addToTrash('task', t.text, t, 'nylaos_tasks'));
      data.saveTasks(data.tasks.filter(t=>!gone.some(g=>g.id===t.id)));
    }
    toast('Moved to Recently Deleted','info',1500); onClose();
  };
  const series = src.recurringGroupId || src.recurGroup;
  return (
    <Modal onClose={onClose} width={520}>
      <div style={{ padding:'18px 22px 6px', display:'flex', alignItems:'center', gap:10 }}>
        <span style={{ width:12, height:12, borderRadius:4, background:eventColor(form.color) }}/>
        <input autoFocus={isNew} value={form.text} onChange={e=>set('text',e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()} placeholder={kind==='task'?'Task':'Event name'}
          style={{ flex:1, border:'none', background:'transparent', fontFamily:"'DM Serif Display',serif", fontSize:22, color:C.rose }}/>
        <button onClick={onClose} style={{ background:'none', border:'none', fontSize:20, color:C.textMuted, cursor:'pointer' }}>✕</button>
      </div>
      <div style={{ padding:'8px 22px 4px', fontSize:11, color:C.textMuted }}>{kind==='task'?'A task from your task list':kind==='schedule'?'Calendar item you can check off':isNew?'New event':'Event'}{series?' · part of a repeating series':''}</div>
      <div style={{ padding:'10px 22px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10 }}>
        <div style={{ gridColumn:'1 / -1' }}><FieldLabel>Date</FieldLabel><input type="date" value={form.date} onChange={e=>set('date',e.target.value)} style={socialField}/></div>
        <div><FieldLabel>Starts</FieldLabel><input type="time" value={form.time} onChange={e=>set('time',e.target.value)} style={socialField}/></div>
        {kind!=='task' && <div><FieldLabel>Ends</FieldLabel><input type="time" value={form.endTime} onChange={e=>set('endTime',e.target.value)} style={socialField}/></div>}
        {kind!=='task' && <div><FieldLabel>Color</FieldLabel>
          <div style={{ display:'flex', gap:5, paddingTop:6 }}>{EVENT_COLORS.map(c=><button key={c.key} onClick={()=>set('color',c.key)} aria-label={c.key} style={{ width:20, height:20, borderRadius:'50%', background:c.color, border: form.color===c.key?`2px solid ${C.text}`:'2px solid transparent', cursor:'pointer' }}/>)}</div>
        </div>}
        {kind==='event' && <div style={{ gridColumn:'1 / -1' }}><FieldLabel>Location</FieldLabel><input value={form.location} onChange={e=>set('location',e.target.value)} placeholder="Where?" style={socialField}/></div>}
        {kind==='event' && isNew && <>
          <div style={{ gridColumn:'span 2' }}><FieldLabel>Repeat</FieldLabel>
            <select value={form.repeat} onChange={e=>set('repeat',e.target.value)} style={socialField}>
              <option value="">Doesn't repeat</option><option value="daily">Every day</option><option value="weekdays">Every weekday</option><option value="weekly">Every week</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Every month</option>
            </select></div>
          {form.repeat && <div><FieldLabel>Until</FieldLabel><input type="date" value={form.until} min={form.date} onChange={e=>set('until',e.target.value)} style={socialField}/></div>}
        </>}
        {kind!=='task' && <div style={{ gridColumn:'1 / -1' }}><FieldLabel>Notes</FieldLabel><textarea value={form.notes} onChange={e=>set('notes',e.target.value)} rows={2} style={{ ...socialField, resize:'vertical' }}/></div>}
      </div>
      <div style={{ padding:'12px 22px 18px', display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
        {!isNew && <button onClick={()=>del(false)} style={{ fontSize:12.5, color:'#d05a5a', background:'none', border:'none', cursor:'pointer' }}>Delete{series?' this one':''}</button>}
        {!isNew && series && <button onClick={()=>del(true)} style={{ fontSize:12.5, color:'#d05a5a', background:'none', border:'none', cursor:'pointer' }}>Delete this & following</button>}
        <div style={{ flex:1 }}/>
        <button onClick={onClose} style={{ padding:'9px 18px', borderRadius:20, background:'transparent', color:C.textMuted, border:`0.5px solid ${C.border}`, fontSize:13, cursor:'pointer' }}>Cancel</button>
        <button onClick={save} style={{ padding:'9px 22px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>{isNew?'Add':'Save'}</button>
      </div>
    </Modal>
  );
};

const CalendarPanel = ({ sub }) => {
  const isMobile = useIsMobile();
  const roomy = useMinWidth(1240); // room for the day panel beside the grid
  const data = useCalendarData();
  useAstronomy(); // exact moon phases once it loads
  const todayKey = toDateKey();
  // A day picked in another view (or in search) opens here after the view switch remounts the panel.
  const [cursor, setCursor] = useState(()=>{ const k = window._calendarFocus; return k ? keyToDate(k) : new Date(); });
  const [selected, setSelected] = useState(()=>{ const k = window._calendarFocus; window._calendarFocus = null; return k || todayKey; });
  const [editing, setEditing] = useState(null);
  const open = item => setEditing(item);
  const addAt = defaults => setEditing({ ...defaults });
  const editor = editing && <EventEditor initial={editing} data={data} onClose={()=>setEditing(null)}/>;
  if (sub==='Recently Deleted') return <TrashPanel type="calendar_event" />;

  const y = cursor.getFullYear(), m = cursor.getMonth();
  const shift = (unit, n) => { const d = new Date(cursor); if (unit==='m') d.setMonth(d.getMonth()+n, 1); else if (unit==='y') d.setFullYear(d.getFullYear()+n); else d.setDate(d.getDate()+n); setCursor(d); };
  const Header = ({ title, unit, step=1, right }) => (
    <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:16 }}>
      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize: isMobile?24:30, color:C.rose, marginRight:'auto' }}>{title}</div>
      {right}
      <button onClick={()=>{ setCursor(new Date()); setSelected(todayKey); }} style={{ padding:'7px 14px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.card, color:C.text, fontSize:12.5, cursor:'pointer' }}>Today</button>
      {[[-1,'‹'],[1,'›']].map(([d,l])=><button key={d} onClick={()=>shift(unit, d*step)} aria-label={d<0?'Previous':'Next'} style={{ width:34, height:34, borderRadius:'50%', border:`0.5px solid ${C.border}`, background:C.card, color:C.rose, fontSize:18, cursor:'pointer' }}>{l}</button>)}
      <button onClick={()=>addAt({ date:selected||todayKey })} style={{ padding:'8px 16px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>+ Event</button>
    </div>
  );

  /* ── Month ── */
  if (sub==='Monthly' || !sub) {
    const startPad = new Date(y,m,1).getDay();
    const dim = new Date(y,m+1,0).getDate();
    const cells = Array.from({ length: Math.ceil((startPad+dim)/7)*7 }, (_,i)=>{ const d = new Date(y,m,i-startPad+1); return { key:toDateKey(d), d, inMonth:d.getMonth()===m }; });
    return (
      <div className="fade-in" style={{ maxWidth:1180 }}>
        <Header title={`${MONTHS[m]} ${y}`} unit="m"/>
        <div style={{ display:'grid', gridTemplateColumns: roomy?'minmax(0,1fr) 300px':'1fr', gap:16, alignItems:'start' }}>
          <Card style={{ padding: isMobile?8:12 }}>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,minmax(0,1fr))', gap: isMobile?2:5 }}>
              {DAYS.map(d=><div key={d} style={{ fontSize:10.5, color:C.textMuted, textAlign:'center', textTransform:'uppercase', letterSpacing:.8, padding:'4px 0 6px' }}>{isMobile?d[0]:d}</div>)}
              {cells.map(({key,d,inMonth})=>{
                const items = data.byDay[key]||[]; const isToday = key===todayKey; const isSel = key===selected;
                const cycle = getCycleForDate(d);
                return (
                  <div key={key} onClick={()=>setSelected(key)} onDoubleClick={()=>addAt({ date:key })}
                    style={{ minHeight: isMobile?54:108, padding: isMobile?'4px 3px':'6px 6px 4px', borderRadius: isMobile?10:14, cursor:'pointer', position:'relative', overflow:'hidden',
                      background: isSel ? `${C.rose}12` : inMonth ? C.card : 'transparent', border:`0.5px solid ${isSel?C.rose+'70':inMonth?C.border:'transparent'}`, opacity: inMonth?1:.45, transition:'background .15s' }}>
                    {cycle && inMonth && <div style={{ position:'absolute', top:0, left:0, right:0, height:2.5, background:cycle.color, opacity:.55 }}/>}
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:3 }}>
                      <span style={{ width:24, height:24, borderRadius:'50%', display:'grid', placeItems:'center', fontSize:12.5, fontWeight:isToday?700:500,
                        background: isToday?`linear-gradient(135deg, ${C.rose}, ${C.accent})`:'transparent', color: isToday?'#fff':C.text }}>{d.getDate()}</span>
                      {!isMobile && ['New Moon','Full Moon'].includes(getMoonForDate(d).label) && <span style={{ fontSize:10 }} title={getMoonForDate(d).label}>{getMoonForDate(d).emoji}</span>}

        </div>
        {editor}
      </div>
    );
  }

  /* ── Week & Day time grid ── */
  if (sub==='Weekly' || sub==='Daily') {
    const HOUR_H = 46, START = 6, END = 24;
    const days = sub==='Daily' ? [new Date(cursor)] : Array.from({length:7},(_,i)=>{ const d = new Date(cursor); d.setDate(d.getDate()-d.getDay()+i); return d; });

    const now = new Date(); const nowMin = now.getHours()*60+now.getMinutes();
    const lanes = list => { const out = []; const ends = []; list.forEach(it=>{ const s = timeToMin(it.time); const e = Math.max(s+30, timeToMin(it.endTime) ?? s+60); let lane = ends.findIndex(x=>x<=s); if (lane<0) { lane = ends.length; ends.push(e); } else ends[lane] = e; out.push({ it, s, e, lane }); }); return { out, n: Math.max(1, ends.length) }; };

      <Card style={{ padding:0, overflow:'hidden' }}>

              <div>{Array.from({length:END-START},(_,h)=><div key={h} style={{ height:HOUR_H, fontSize:10, color:C.textMuted, textAlign:'right', paddingRight:8, transform:'translateY(-6px)' }}>{h===0?'':fmtTime(`${START+h}:00`)}</div>)}</div>
              {days.map((d,i)=>{ const k = keys[i]; const { out, n } = lanes((data.byDay[k]||[]).filter(it=>it.time && timeToMin(it.time)>=START*60)); return (

                  {k===todayKey && nowMin>=START*60 && <div style={{ position:'absolute', left:0, right:0, top:(nowMin-START*60)/60*HOUR_H, height:2, background:C.rose, zIndex:2 }}><span style={{ position:'absolute', left:-4, top:-3, width:8, height:8, borderRadius:'50%', background:C.rose }}/></div>}
                  {out.map(({it,s,e,lane})=>(
                    <div key={it.kind+it.id} onClick={()=>open(it)} title={it.text}
                      style={{ position:'absolute', top:(s-START*60)/60*HOUR_H+1, height:Math.max(20,(e-s)/60*HOUR_H-2), left:`calc(${lane/n*100}% + 2px)`, width:`calc(${100/n}% - 4px)`,
                        borderRadius:8, padding:'3px 6px', background:`${it.color}26`, borderLeft:`3px solid ${it.color}`, color:C.text, fontSize:11, overflow:'hidden', cursor:'pointer', zIndex:1 }}>
                      <div style={{ fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', textDecoration:it.done?'line-through':'none' }}>{it.text}</div>
                      <div style={{ color:C.textMuted, fontSize:10 }}>{fmtTime(it.time)}{it.endTime?` – ${fmtTime(it.endTime)}`:''}{it.location?` · ${it.location}`:''}</div>
                    </div>
                  ))}

              ); })}
            </div>
          </div>
        </div>
      </Card>
    );
    return (
      <div className="fade-in" style={{ maxWidth:1180 }}>
        <Header title={title} unit="d" step={sub==='Daily'?1:7}/>

          ? <div style={{ display:'grid', gridTemplateColumns: roomy?'minmax(0,1fr) 300px':'1fr', gap:16, alignItems:'start' }}>{grid}<DayDrawer dateKey={toDateKey(cursor)} data={data} onOpen={open} onAdd={addAt}/></div>

  /* ── Agenda ── */
  if (sub==='Agenda') {
    const days = Array.from({length:45},(_,i)=>addDaysKey(i)).filter(k=>(data.byDay[k]||[]).length);

/* ── Trash / Soft Delete ────────────────────────────────────────── */
const TRASH_KEY = 'nylaos_trash';
const getTrash = () => JSON.parse(localStorage.getItem(TRASH_KEY)||'[]');
const saveTrash = items => localStorage.setItem(TRASH_KEY, JSON.stringify(items));
const addToTrash = (type, name, data, storageKey) => {
  const item = { id:Date.now(), type, name, data, storageKey, deletedAt:new Date().toISOString() };
  saveTrash([item, ...getTrash()]);
};
const restoreTrashItem = id => {
  const trash = getTrash();
  const item = trash.find(t=>t.id===id);
  if (!item) return null;
  if (item.storageKey) {
    const current = JSON.parse(localStorage.getItem(item.storageKey)||'[]');
    localStorage.setItem(item.storageKey, JSON.stringify([item.data, ...current]));
  }
  saveTrash(trash.filter(t=>t.id!==id));
  return item;
};
const permanentDelete = id => saveTrash(getTrash().filter(t=>t.id!==id));

const TrashPanel = ({ type, onRestoreBusiness, onRestore }) => {
  const [trash, setTrash] = useState(()=>getTrash());
  const types = Array.isArray(type) ? type : type ? [type] : null;
  const filtered = types ? trash.filter(t=>types.includes(t.type)) : trash;
  const refresh = () => setTrash(getTrash());
  const handleRestore = item => {
    if (item.type==='business' && onRestoreBusiness) {
      onRestoreBusiness(item.data.name);
      permanentDelete(item.id);
    } else {
      const restored = restoreTrashItem(item.id);
      if (onRestore) onRestore(restored);
    }
    refresh();
  };
  const handleDelete = id => { permanentDelete(id); refresh(); };
  const typeLabel = { task:'Task', goal:'Goal', business:'Business', notebook_page:'Note', idea:'Idea', calendar_event:'Calendar Event', course:'Course', assignment:'Assignment', habit:'Habit', bucket_item:'Bucket List Item', project:'Project', social_account:'Social Account', social_content:'Content Item', book:'Book' };
  return (
    <div className="fade-in" style={{ maxWidth:620 }}>
      <PageTitle>Recently Deleted</PageTitle>
      {filtered.length===0 && <div style={{ fontSize:13.5, color:C.textMuted, fontStyle:'italic', padding:'28px 4px' }}>Nothing deleted recently — your trash is empty.</div>}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {filtered.map(item=>{
          const daysAgo = Math.floor((Date.now()-new Date(item.deletedAt).getTime())/86400000);
          const whenStr = daysAgo===0?'Today':daysAgo===1?'Yesterday':`${daysAgo} days ago`;
          return (
            <Card key={item.id} style={{ padding:'12px 16px' }}>
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13.5, color:C.text }}>{item.name}</div>
                  <div style={{ fontSize:11.5, color:C.textMuted, marginTop:3 }}>{typeLabel[item.type]||item.type} · Deleted {whenStr}</div>
                </div>
                <button onClick={()=>handleRestore(item)} style={{ padding:'6px 14px', borderRadius:8, background:`${C.accent}25`, border:`0.5px solid ${C.border}`, color:C.text, fontSize:12, cursor:'pointer' }}>Restore</button>
                <button onClick={()=>{ if(window.confirm(`Permanently delete "${item.name}"? This cannot be undone.`)) handleDelete(item.id); }} style={{ padding:'6px 14px', borderRadius:8, background:'none', border:`0.5px solid ${C.border}`, color:C.textMuted, fontSize:12, cursor:'pointer' }}>Delete forever</button>
              </div>
            </Card>
          );
        })}
      </div>
      {filtered.length>0 && (
        <div style={{ marginTop:20, fontSize:12.5, color:C.textMuted }}>
          Items stay here until you delete them permanently — nothing is removed automatically ·{' '}
          <button onClick={()=>{ if(window.confirm(`Permanently delete all ${filtered.length} item(s) in this view? This cannot be undone.`)){ filtered.forEach(t=>permanentDelete(t.id)); refresh(); } }} style={{ background:'none', border:'none', cursor:'pointer', color:C.rose, fontSize:12.5, textDecoration:'underline' }}>Delete all permanently</button>
        </div>
      )}
    </div>
  );
};

/* ── To Do List board ────────────────────────────────────────────────
   The same tasks as everywhere else, laid out as To do / In progress /
   Done. Drag a card between columns; status shows up on the task lists. */
const TASK_STATUS = [
  { key:'todo',     label:'To do',       icon:'○', tone:()=>C.textLight },
  { key:'progress', label:'In progress', icon:'◐', tone:()=>C.accent },
  { key:'done',     label:'Done',        icon:'✓', tone:()=>'#3f9a6a' },
];
const taskStatusKey = t => t.done ? 'done' : t.status==='progress' ? 'progress' : 'todo';
const withTaskStatus = (list, id, key) => {
  const t = list.find(x=>x.id===id); if (!t) return list;
  if (key==='done') return t.done ? list : toggleTaskIn(list, id).list.map(x=>x.id===id?{...x,status:null}:x);
  const base = t.done ? toggleTaskIn(list, id).list : list;
  return base.map(x=>x.id===id?{...x,done:false,completedDate:null,status:key==='progress'?'progress':null}:x);
};

const ToDoBoard = () => {
  const KEY = 'nylaos_tasks';
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(KEY)||'[]'));
  const [input, setInput] = useState('');
  const [when, setWhen] = useState(null);
  const [dragId, setDragId] = useState(null);
  const [over, setOver] = useState(null);
  const [showAllDone, setShowAllDone] = useState(false);
  const goals = JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
  const isMobile = useIsMobile();
  const save = t => { setTasks(t); localStorage.setItem(KEY, JSON.stringify(t)); };
  const add = (status='todo') => {
    if (!input.trim()) return;
    save([...tasks, { id:Date.now(), text:input.trim(), done:false, status: status==='progress'?'progress':null, calendarDate:when, created:new Date().toISOString() }]);
    setInput('');
  };
  const move = (id, key) => { save(withTaskStatus(tasks, id, key)); if (key==='done') toast('Done ✓','success',1100); };
  const remove = id => { const t = tasks.find(x=>x.id===id); if (t) addToTrash('task', t.text, t, KEY); save(tasks.filter(x=>x.id!==id)); };
  const mine = tasks.filter(t=>t.source!=='calendar');
  const weekAgo = addDaysKey(-7);
  const cols = TASK_STATUS.map(s => {
    let items = mine.filter(t=>taskStatusKey(t)===s.key);
    if (s.key==='done') { items = items.sort((a,b)=>(b.completedDate||'').localeCompare(a.completedDate||'')); if (!showAllDone) items = items.filter(t=>(t.completedDate||'')>=weekAgo); }
    else items = items.sort((a,b)=>(a.calendarDate||'9999').localeCompare(b.calendarDate||'9999'));
    return { ...s, items };
  });
  return (
    <div className="fade-in">
      <PageTitle subtitle="Drag tasks between columns — they stay in sync with Today, Upcoming and All Tasks">To Do List</PageTitle>
      <Card style={{ padding:'12px 14px', marginBottom:18, maxWidth:760 }}>
        <div style={{ display:'flex', gap:8, marginBottom:10 }}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Add to your to do list…"
            style={{ flex:1, padding:'9px 4px', border:'none', background:'transparent', color:C.text, fontSize:15, fontFamily:'inherit' }}/>
          <VoiceButton onText={t=>setInput(v=>(v?v+' ':'')+t)}/>
          <button onClick={()=>add()} disabled={!input.trim()} style={{ padding:'9px 18px', borderRadius:12, background:input.trim()?C.rose:`${C.rose}55`, color:'#fff', border:'none', fontSize:13.5, cursor:'pointer' }}>Add</button>
        </div>
        <WhenPicker value={when} onChange={setWhen}/>
      </Card>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(3, minmax(0,1fr))', gap:14, alignItems:'start' }}>
        {cols.map(col=>(
          <div key={col.key} onDragOver={e=>{ e.preventDefault(); setOver(col.key); }} onDragLeave={()=>setOver(null)}
            onDrop={()=>{ if (dragId) move(dragId, col.key); setDragId(null); setOver(null); }}
            style={{ borderRadius:20, padding:12, minHeight:isMobile?120:420, transition:'background .15s',
              background: over===col.key ? `${C.rose}14` : col.key==='done' ? `${C.lavender}30` : `${C.pink}40`, border:`0.5px solid ${over===col.key?C.rose:C.border}` }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, padding:'2px 6px 10px' }}>
              <span style={{ color:col.tone(), fontSize:14 }}>{col.icon}</span>
              <span style={{ fontSize:12, fontWeight:600, letterSpacing:.7, textTransform:'uppercase', color:C.text }}>{col.label}</span>
              <span style={{ fontSize:11, padding:'1px 8px', borderRadius:10, background:`${C.accent}22`, color:C.text }}>{col.items.length}</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {col.items.map(t=>(
                <div key={t.id} draggable onDragStart={()=>setDragId(t.id)} onDragEnd={()=>{ setDragId(null); setOver(null); }} style={{ cursor:'grab', opacity: dragId===t.id?.5:1 }}>
                  <TaskRow t={t} goals={goals} onToggle={()=>move(t.id, t.done?'todo':'done')} onUpdate={p=>save(tasks.map(x=>x.id===t.id?{...x,...p}:x))} onRemove={()=>remove(t.id)}
                    onStatus={k=>move(t.id,k)} hideStatus/>
                </div>
              ))}
              {col.items.length===0 && <div style={{ fontSize:12, color:C.textMuted, textAlign:'center', padding:'22px 8px', border:`1px dashed ${C.border}`, borderRadius:14 }}>{col.key==='done'?'Finished tasks land here':'Drop tasks here'}</div>}
              {col.key==='done' && mine.some(t=>t.done && (t.completedDate||'')<weekAgo) && (
                <button onClick={()=>setShowAllDone(v=>!v)} style={{ fontSize:11.5, color:C.rose, background:'none', border:'none', cursor:'pointer', padding:6 }}>{showAllDone?'Show last 7 days only':'Show older done tasks'}</button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ── Habit Tracker ─────────────────────────────────────────────────── */
/* ── Habits ─────────────────────────────────────────────────────────
   Log stays `${habitId}_${YYYY-MM-DD}` in nylaos_habit_log. A habit can
   be scheduled for certain weekdays; days it isn't due never break a
   streak. */
const DEFAULT_HABITS = ['💧 Water','🏋️ Exercise','📖 Read','🧘 Meditate','📝 Journal'];
const HABIT_COLORS = ['#c4607a','#9080d8','#5b8ed6','#4f9d8a','#c4904a','#a8467a'];
const habitDue = (h, d) => !h.days || !h.days.length || h.days.includes(d.getDay());
const habitStats = (h, log) => {
  const done = d => !!log[`${h.id}_${toDateKey(d)}`];
  const day = n => { const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-n); return d; };
  let streak = 0; for (let i = done(day(0)) ? 0 : 1; i < 800; i++) { const d = day(i); if (!habitDue(h,d)) continue; if (done(d)) streak++; else break; }
  let best = 0, run = 0; for (let i = 365; i >= 0; i--) { const d = day(i); if (!habitDue(h,d)) continue; if (done(d)) { run++; best = Math.max(best, run); } else run = 0; }
  let due = 0, hit = 0; for (let i = 0; i < 30; i++) { const d = day(i); if (!habitDue(h,d)) continue; due++; if (done(d)) hit++; }
  return { streak, best: Math.max(best, streak), rate: due ? Math.round(hit/due*100) : 0 };
};

const HabitTracker = () => {
  const HK = 'nylaos_habits';
  const isMobile = useIsMobile();
  const [habits, setHabits] = useState(()=>JSON.parse(localStorage.getItem(HK)||'null')||DEFAULT_HABITS.map((h,i)=>({id:i+1,name:h})));
  const [log, setLog] = useState(()=>JSON.parse(localStorage.getItem('nylaos_habit_log')||'{}'));
  const [newHabit, setNewHabit] = useState('');
  const [editing, setEditing] = useState(null);
  const [view, setView] = useState('today');
  const saveHabits = h => { setHabits(h); localStorage.setItem(HK,JSON.stringify(h)); };
  const saveLog = l => { setLog(l); localStorage.setItem('nylaos_habit_log',JSON.stringify(l)); };
  const today = new Date(); const todayKey = toDateKey();
  const toggle = (id, key=todayKey) => { const k = `${id}_${key}`; const nl = { ...log, [k]: !log[k] }; if (!nl[k]) delete nl[k]; saveLog(nl); };
  const addHabit = () => { if(!newHabit.trim()) return; saveHabits([...habits,{ id:Date.now(), name:newHabit.trim(), color:HABIT_COLORS[habits.length%HABIT_COLORS.length] }]); setNewHabit(''); };
  const removeHabit = h => { addToTrash('habit', h.name, h, HK); saveHabits(habits.filter(x=>x.id!==h.id)); setEditing(null); };
  const dueToday = habits.filter(h=>habitDue(h,today));
  const doneToday = dueToday.filter(h=>log[`${h.id}_${todayKey}`]).length;
  const pct = dueToday.length ? Math.round(doneToday/dueToday.length*100) : 0;
  const week = Array.from({length:7},(_,i)=>{ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-6+i); return d; });
  const split = h => { const m = h.name.match(/^(\p{Extended_Pictographic}️?|\S{1,2}(?=\s))\s+(.*)$/u); return m ? [m[1], m[2]] : ['✦', h.name]; };

  return (
    <div className="fade-in" style={{ maxWidth:980 }}>
      <PageTitle subtitle={dueToday.length ? `${doneToday} of ${dueToday.length} done today` : 'Nothing scheduled today'}
        right={<div style={{ display:'flex', gap:6 }}>{[['today','Today'],['history','History']].map(([k,l])=><Pill key={k} active={view===k} onClick={()=>setView(k)}>{l}</Pill>)}</div>}>Habits</PageTitle>

      {view==='today' && <>
        <Card style={{ display:'flex', alignItems:'center', gap:18, marginBottom:16, background:C.gradA, border:'none', padding:'18px 22px' }}>
          <ProgressRing pct={pct} size={66} stroke={6}/>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:21, color:C.rose }}>{pct===100 && dueToday.length ? 'Every habit done today ✨' : pct>=50 ? 'Over halfway there' : 'Small steps, every day'}</div>
            <div style={{ display:'flex', gap:6, marginTop:8 }}>
              {week.map(d=>{ const due = habits.filter(h=>habitDue(h,d)); const n = due.filter(h=>log[`${h.id}_${toDateKey(d)}`]).length; const p = due.length ? n/due.length : 0; const isT = toDateKey(d)===todayKey; return (
                <div key={toDateKey(d)} title={`${d.toLocaleDateString('en-US',{weekday:'long'})}: ${n}/${due.length}`} style={{ textAlign:'center' }}>
                  <div style={{ width:26, height:26, borderRadius:8, background: p ? `${C.rose}${Math.round(40+p*215).toString(16).padStart(2,'0')}` : C.card, border:`0.5px solid ${isT?C.rose:C.border}` }}/>
                  <div style={{ fontSize:9.5, color:isT?C.rose:C.textMuted, marginTop:2 }}>{DAYS3[d.getDay()]}</div>
                </div>
              ); })}
            </div>
          </div>
        </Card>
        <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(auto-fill,minmax(280px,1fr))', gap:12 }}>

                </div>

                <div style={{ display:'flex', gap:4, marginTop:10 }}>

                    <button key={k} onClick={()=>toggle(h.id,k)} title={`${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}${dueD?'':' (not due)'}`}

                  ); })}

          <Card style={{ padding:'14px 16px', borderStyle:'dashed', display:'flex', alignItems:'center', gap:8 }}>
            <input value={newHabit} onChange={e=>setNewHabit(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addHabit()} placeholder="🌸 New habit — emoji first looks best"
              style={{ flex:1, minWidth:0, border:'none', background:'transparent', color:C.text, fontSize:13.5, fontFamily:'inherit' }}/>
            <button onClick={addHabit} style={{ padding:'7px 14px', borderRadius:10, background:C.rose, color:'#fff', border:'none', fontSize:12.5, cursor:'pointer' }}>Add</button>
          </Card>
        </div>
      </>}

      {view==='history' && (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {habits.map(h=>{
            const col = h.color||C.rose; const [emoji, name] = split(h); const st = habitStats(h, log);
            const weeks = 12; const start = new Date(); start.setHours(12,0,0,0); start.setDate(start.getDate() - start.getDay() - (weeks-1)*7);
            return (
              <Card key={h.id} style={{ padding:'14px 16px' }}>

                  <span style={{ fontSize:11.5, color:C.textLight }}>🔥 {st.streak} · 🏆 {st.best} · {st.rate}% last 30 days</span>
                </div>
                <div style={{ overflowX:'auto' }}>
                  <div style={{ display:'grid', gridTemplateRows:'repeat(7, 13px)', gridAutoFlow:'column', gridAutoColumns:'13px', gap:3, width:'max-content' }}>

                      <button key={i} onClick={()=>toggle(h.id,k)} title={`${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}${hit?' ✓':''}`}

                <button key={d} onClick={()=>{ const cur = all ? [0,1,2,3,4,5,6] : editing.days; const next = on ? cur.filter(x=>x!==i) : [...cur,i].sort(); setEditing({...editing, days: next.length===7?[]:next }); }}

            <div style={{ display:'flex', gap:8, marginBottom:18 }}>{HABIT_COLORS.map(c=><button key={c} onClick={()=>setEditing({...editing,color:c})} aria-label={c} style={{ width:26, height:26, borderRadius:'50%', background:c, border: (editing.color||C.rose)===c?`2px solid ${C.text}`:'2px solid transparent', cursor:'pointer' }}/>)}</div>

              <button onClick={()=>setEditing(null)} style={{ padding:'8px 16px', borderRadius:20, background:'transparent', color:C.textMuted, border:`0.5px solid ${C.border}`, cursor:'pointer' }}>Cancel</button>
              <button onClick={()=>{ if(!editing.name.trim()) return; saveHabits(habits.map(x=>x.id===editing.id?{...editing, name:editing.name.trim()}:x)); setEditing(null); }} style={{ padding:'8px 20px', borderRadius:20, background:C.rose, color:'#fff', border:'none', cursor:'pointer' }}>Save</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

/* ── Bucket List ───────────────────────────────────────────────── */
const BUCKET_LEVELS = [
  {key:'free',label:'Free & Easy',emoji:'🌿',color:'#34a853',desc:'Costs nothing, do it this week'},
  {key:'money',label:'Costs Money',emoji:'💸',color:'#4285f4',desc:'Save up or treat yourself'},
  {key:'big',label:'Life-Changing',emoji:'🌍',color:'#9080d8',desc:'Big moves, major milestones'},
  {key:'absurd',label:'Absurd',emoji:'🦈',color:'#ea4335',desc:'Wildly ambitious, why not'},
];
const BucketList = () => {
  const BK='nylaos_bucket_list';
  const [items, setItems] = useState(()=>JSON.parse(localStorage.getItem(BK)||'[]'));
  const [input, setInput] = useState('');
  const [level, setLevel] = useState('free');
  const [filter, setFilter] = useState('all');
  const save = i => { setItems(i); localStorage.setItem(BK,JSON.stringify(i)); };
  const add = () => { if(!input.trim()) return; save([...items,{id:Date.now(),text:input.trim(),level,done:false,created:new Date().toISOString()}]); setInput(''); };
  const toggle = id => {
    const item=items.find(i=>i.id===id);
    const nowDone=!item?.done;
    save(items.map(i=>i.id===id?{...i,done:nowDone,completedDate:nowDone?new Date().toISOString():null}:i));
    if(nowDone) toast('Bucket list item checked off! 🎉','success');
  };
  const remove = id => {
    const it = items.find(x=>x.id===id);
    if (it) addToTrash('bucket_item', it.text, it, BK);
    save(items.filter(x=>x.id!==id));
  };
  const filtered = filter==='all'?items:filter==='done'?items.filter(i=>i.done):items.filter(i=>i.level===filter&&!i.done);
  const doneCount = items.filter(i=>i.done).length;
  return (
    <div className="fade-in" style={{maxWidth:620}}>
      <PageTitle>Bucket List</PageTitle>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <div style={{fontSize:28,fontFamily:"'DM Serif Display',serif",color:C.rose}}>{doneCount}</div>
        <div><div style={{fontSize:11,color:C.textMuted}}>of {items.length} completed</div>
          <div style={{width:120,height:5,borderRadius:3,background:`${C.pink}60`,marginTop:3}}><div style={{width:`${items.length?doneCount/items.length*100:0}%`,height:'100%',borderRadius:3,background:C.rose,transition:'width 0.3s'}}/></div>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Something you want to do before you die..." onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:1}}/>
        <select value={level} onChange={e=>setLevel(e.target.value)} style={{padding:'8px 10px',borderRadius:10,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}>
          {BUCKET_LEVELS.map(l=><option key={l.key} value={l.key}>{l.emoji} {l.label}</option>)}
        </select>
        <button onClick={add} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Add</button>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        <button onClick={()=>setFilter('all')} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter==='all'?C.rose:C.border}`,background:filter==='all'?C.rose:'transparent',color:filter==='all'?'#fff':C.textMuted,cursor:'pointer'}}>All ({items.length})</button>
        {BUCKET_LEVELS.map(l=>{const c=items.filter(i=>i.level===l.key&&!i.done).length; return(
          <button key={l.key} onClick={()=>setFilter(l.key)} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter===l.key?l.color:C.border}`,background:filter===l.key?l.color+'20':'transparent',color:filter===l.key?l.color:C.textMuted,cursor:'pointer'}}>{l.emoji} {l.label} ({c})</button>
        );})}
        <button onClick={()=>setFilter('done')} style={{padding:'4px 12px',borderRadius:20,fontSize:11,border:`1px solid ${filter==='done'?'#34a853':C.border}`,background:filter==='done'?'#34a85320':'transparent',color:filter==='done'?'#34a853':C.textMuted,cursor:'pointer'}}>✓ Done ({doneCount})</button>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {filtered.map(item=>{
          const lv=BUCKET_LEVELS.find(l=>l.key===item.level)||BUCKET_LEVELS[0];
          return (
            <Card key={item.id} className="card-hover" style={{padding:'12px 16px',borderLeft:`3px solid ${lv.color}`,opacity:item.done?0.6:1}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <button onClick={()=>toggle(item.id)} style={{width:22,height:22,borderRadius:6,border:`1.5px solid ${lv.color}`,background:item.done?lv.color:'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:12,color:'#fff',animation:item.done?'checkPop 0.3s ease':'none'}}>{item.done?'✓':''}</button>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,color:item.done?C.textMuted:C.text,textDecoration:item.done?'line-through':'none'}}>{item.text}</div>
                  <div style={{display:'flex',gap:6,marginTop:4}}>
                    <span style={{fontSize:10,padding:'2px 8px',borderRadius:8,background:lv.color+'18',color:lv.color}}>{lv.emoji} {lv.label}</span>
                    {item.done&&item.completedDate&&<span style={{fontSize:10,color:C.textMuted}}>✓ {new Date(item.completedDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>}
                  </div>
                </div>
                <button onClick={()=>remove(item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:16,opacity:0.5}}>×</button>
              </div>
            </Card>
          );
        })}
        {filtered.length===0&&<div style={{fontSize:13,color:C.textMuted,fontStyle:'italic',padding:20,textAlign:'center'}}>Nothing here yet. What do you want to do before you die?</div>}
      </div>
    </div>
  );
};

/* ── Event Planner ─────────────────────────────────────────────── */
const EventPlanner = () => {
  const EK='nylaos_events_planner';
  const [events, setEvents] = useState(()=>JSON.parse(localStorage.getItem(EK)||'[]'));
  const [activeId, setActiveId] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [newName, setNewName] = useState('');
  const [newType, setNewType] = useState('party');
  const save = e => { setEvents(e); localStorage.setItem(EK,JSON.stringify(e)); };
  const TYPES = [{key:'party',emoji:'🎉'},{key:'launch',emoji:'🚀'},{key:'trip',emoji:'✈️'},{key:'move',emoji:'📦'},{key:'meeting',emoji:'💼'},{key:'other',emoji:'📋'}];
  const SECTIONS = ['Timeline','Budget','Guest List','Supplies','Notes'];
  const addEvent = () => {
    if(!newName.trim()) return;
    const ev={id:Date.now(),name:newName.trim(),type:newType,date:'',sections:Object.fromEntries(SECTIONS.map(s=>[s,''])),created:new Date().toISOString()};
    save([ev,...events]); setActiveId(ev.id); setNewName(''); setShowNew(false); toast('Event created','success',1500);
  };
  const updateEvent = (id, field, val) => save(events.map(e=>e.id===id?{...e,[field]:val}:e));
  const updateSection = (id, section, val) => save(events.map(e=>e.id===id?{...e,sections:{...e.sections,[section]:val}}:e));
  const removeEvent = id => {
    const ev = events.find(e=>e.id===id);
    if (ev) addToTrash('calendar_event', ev.name, ev, EK);
    save(events.filter(e=>e.id!==id));
    if(activeId===id) setActiveId(null);
  };
  const active = events.find(e=>e.id===activeId);

  return (
    <div className="fade-in" style={{maxWidth:720}}>
      <PageTitle>Event Planner</PageTitle>
      <div style={{display:'flex',gap:16}}>
        {/* Event list */}
        <div style={{width:200,flexShrink:0}}>
          <button onClick={()=>setShowNew(true)} style={{width:'100%',padding:'8px 12px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:12.5,cursor:'pointer',marginBottom:10}}>+ New Event</button>
          {showNew&&(
            <Card style={{padding:'10px 12px',marginBottom:8}}>
              <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Event name..." onKeyDown={e=>e.key==='Enter'&&addEvent()}
                style={{width:'100%',padding:'6px 8px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit',marginBottom:6}}/>
              <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6}}>
                {TYPES.map(t=><button key={t.key} onClick={()=>setNewType(t.key)} style={{padding:'3px 8px',borderRadius:6,fontSize:11,border:`0.5px solid ${newType===t.key?C.rose:C.border}`,background:newType===t.key?`${C.rose}20`:'transparent',color:C.text,cursor:'pointer'}}>{t.emoji}</button>)}
              </div>
              <button onClick={addEvent} style={{padding:'5px 14px',borderRadius:6,background:C.rose,color:'#fff',border:'none',fontSize:11,cursor:'pointer'}}>Create</button>
            </Card>
          )}
          {events.map(ev=>(
            <button key={ev.id} onClick={()=>setActiveId(ev.id)} style={{width:'100%',padding:'8px 10px',borderRadius:8,textAlign:'left',marginBottom:4,
              background:activeId===ev.id?`${C.pink}80`:'transparent',border:`0.5px solid ${activeId===ev.id?C.border:'transparent'}`,color:C.text,fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
              <span>{TYPES.find(t=>t.key===ev.type)?.emoji||'📋'}</span><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.name}</span>
            </button>
          ))}
          {events.length===0&&!showNew&&<div style={{fontSize:11,color:C.textMuted,fontStyle:'italic',padding:8}}>No events planned yet</div>}
        </div>

        {/* Active event detail */}
        {active?(
          <div style={{flex:1}}>
            <Card style={{padding:'20px 24px'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.rose}}>{TYPES.find(t=>t.key===active.type)?.emoji} {active.name}</div>
                <button onClick={()=>removeEvent(active.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>🗑</button>
              </div>
              <div style={{marginBottom:16}}>
                <span style={{fontSize:11,color:C.textMuted}}>Date: </span>
                <input type="date" value={active.date||''} onChange={e=>updateEvent(active.id,'date',e.target.value)}
                  style={{padding:'5px 10px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}/>
              </div>
              {SECTIONS.map(section=>(
                <div key={section} style={{marginBottom:14}}>
                  <div style={{fontSize:11,fontWeight:600,color:C.rose,textTransform:'uppercase',letterSpacing:0.5,marginBottom:4}}>{section}</div>
                  <textarea value={active.sections[section]||''} onChange={e=>updateSection(active.id,section,e.target.value)}
                    placeholder={section==='Budget'?'Total budget: $___\nVenue: $___\nFood: $___':section==='Guest List'?'Name — RSVP status\n':section==='Timeline'?'1 month before:\n2 weeks before:\n1 week before:\nDay of:':section==='Supplies'?'- \n- \n- ':'Notes, links, ideas...'}
                    style={{width:'100%',height:section==='Notes'?80:60,padding:'8px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit',resize:'vertical',lineHeight:1.6}}/>
                </div>
              ))}
            </Card>
          </div>
        ):(
          <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:C.textMuted,fontSize:13,fontStyle:'italic'}}>Select or create an event</div>
        )}
      </div>
    </div>
  );
};

/* ── Pros & Cons ───────────────────────────────────────────────── */
const ProsConsMaker = () => {
  const PK='nylaos_proscons';
  const [decisions, setDecisions] = useState(()=>JSON.parse(localStorage.getItem(PK)||'[]'));
  const [activeId, setActiveId] = useState(null);
  const [newQ, setNewQ] = useState('');
  const save = d => { setDecisions(d); localStorage.setItem(PK,JSON.stringify(d)); };
  const addDecision = () => { if(!newQ.trim()) return; const d={id:Date.now(),question:newQ.trim(),pros:[],cons:[],resolved:false,verdict:'',created:new Date().toISOString()}; save([d,...decisions]); setActiveId(d.id); setNewQ(''); };
  const addItem = (id, side) => { save(decisions.map(d=>d.id===id?{...d,[side]:[...d[side],{id:Date.now(),text:'',weight:2}]}:d)); };
  const setWeight = (decId, side, itemId, weight) => { save(decisions.map(d=>d.id===decId?{...d,[side]:d[side].map(i=>i.id===itemId?{...i,weight}:i)}:d)); };
  const score = d => { const p = d.pros.filter(i=>i.text.trim()).reduce((s,i)=>s+(i.weight||1),0), c = d.cons.filter(i=>i.text.trim()).reduce((s,i)=>s+(i.weight||1),0); return { p, c, lean: p+c ? Math.round(p/(p+c)*100) : 50 }; };
  // Called as a function so the inputs beside it keep focus.
  const weightDots = (value, onChange, color) => (
    <span style={{ display:'inline-flex', gap:3, flexShrink:0 }} title="How much does this matter?">
      {[1,2,3].map(n=><button key={n} onClick={()=>onChange(n)} aria-label={`Weight ${n}`} style={{ width:10, height:10, borderRadius:'50%', padding:0, border:`1px solid ${color}`, background:(value||1)>=n?color:'transparent', cursor:'pointer' }}/>)}
    </span>
  );
  const updateItem = (decId, side, itemId, text) => { save(decisions.map(d=>d.id===decId?{...d,[side]:d[side].map(i=>i.id===itemId?{...i,text}:i)}:d)); };
  const removeItem = (decId, side, itemId) => { save(decisions.map(d=>d.id===decId?{...d,[side]:d[side].filter(i=>i.id!==itemId)}:d)); };
  const resolve = (id, verdict) => { save(decisions.map(d=>d.id===id?{...d,resolved:true,verdict}:d)); toast('Decision made ✓','success'); };
  const active = decisions.find(d=>d.id===activeId);

  return (
    <div className="fade-in" style={{maxWidth:700}}>
      <PageTitle>Pros & Cons</PageTitle>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <InlineInput value={newQ} onChange={e=>setNewQ(e.target.value)} placeholder="What are you deciding? e.g. 'Should I take this job?'" onKeyDown={e=>e.key==='Enter'&&addDecision()} style={{flex:1}}/>
        <button onClick={addDecision} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>New Decision</button>
      </div>

      {/* Past decisions */}
      {decisions.length>0&&!active&&(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {decisions.map(d=>(
            <Card key={d.id} className="card-hover" onClick={()=>setActiveId(d.id)} style={{padding:'12px 16px',cursor:'pointer',opacity:d.resolved?0.7:1}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:16}}>{d.resolved?'✅':'🤔'}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,color:C.text,fontWeight:500}}>{d.question}</div>
                  <div style={{fontSize:11,color:C.textMuted,marginTop:2}}>{d.pros.length} pros · {d.cons.length} cons{d.resolved?` · Verdict: ${d.verdict}`:''}</div>
                </div>
                <span style={{fontSize:10,color:C.textMuted}}>{new Date(d.created).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* Active decision */}
      {active&&(
        <div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
            <button onClick={()=>setActiveId(null)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:14}}>←</button>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.rose,flex:1}}>{active.question}</div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:14}}>
            {/* Pros */}
            <Card style={{padding:'16px 18px',borderTop:`3px solid #34a853`}}>
              <div style={{fontSize:13,fontWeight:600,color:'#34a853',marginBottom:10}}>Pros ({active.pros.length})</div>
              {active.pros.map(item=>(
                <div key={item.id} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                  <span style={{color:'#34a853',fontSize:12}}>+</span>
                  <input value={item.text} onChange={e=>updateItem(active.id,'pros',item.id,e.target.value)} placeholder="Why yes..."
                    style={{flex:1,minWidth:0,padding:'7px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12.5,fontFamily:'inherit'}}/>
                  {weightDots(item.weight, w=>setWeight(active.id,'pros',item.id,w), '#34a853')}
                  <button onClick={()=>removeItem(active.id,'pros',item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>×</button>
                </div>
              ))}
              <button onClick={()=>addItem(active.id,'pros')} style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:'#34a85315',border:'none',color:'#34a853',cursor:'pointer',marginTop:4}}>+ Add pro</button>
            </Card>
            {/* Cons */}
            <Card style={{padding:'16px 18px',borderTop:`3px solid #ea4335`}}>
              <div style={{fontSize:13,fontWeight:600,color:'#ea4335',marginBottom:10}}>Cons ({active.cons.length})</div>
              {active.cons.map(item=>(
                <div key={item.id} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                  <span style={{color:'#ea4335',fontSize:12}}>−</span>
                  <input value={item.text} onChange={e=>updateItem(active.id,'cons',item.id,e.target.value)} placeholder="Why not..."
                    style={{flex:1,minWidth:0,padding:'7px 10px',borderRadius:8,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12.5,fontFamily:'inherit'}}/>
                  {weightDots(item.weight, w=>setWeight(active.id,'cons',item.id,w), '#ea4335')}
                  <button onClick={()=>removeItem(active.id,'cons',item.id)} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>×</button>
                </div>
              ))}
              <button onClick={()=>addItem(active.id,'cons')} style={{fontSize:11,padding:'4px 10px',borderRadius:6,background:'#ea433515',border:'none',color:'#ea4335',cursor:'pointer',marginTop:4}}>+ Add con</button>
            </Card>
          </div>
          {(()=>{ const sc = score(active); if (!sc.p && !sc.c) return null; return (
            <Card style={{ marginTop:14, padding:'14px 18px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:12, color:C.textLight, marginBottom:6 }}><span>Pros {sc.p}</span><span>Weighted balance</span><span>Cons {sc.c}</span></div>

              <div style={{ fontSize:13, color:C.text, marginTop:8, textAlign:'center' }}>{sc.lean>=60?'Leaning yes — the pros carry more weight.':sc.lean<=40?'Leaning no — the cons carry more weight.':'Pretty even — trust your gut on this one.'}</div>
            </Card>
          ); })()}
          {!active.resolved&&(
            <div style={{display:'flex',gap:8,marginTop:16,justifyContent:'center',flexWrap:'wrap'}}>
              <button onClick={()=>resolve(active.id,'Yes — do it')} style={{padding:'10px 24px',borderRadius:10,background:'#34a853',color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>✓ Yes, do it</button>
              <button onClick={()=>resolve(active.id,'No — pass')} style={{padding:'10px 24px',borderRadius:10,background:'#ea4335',color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>✕ No, pass</button>
              <button onClick={()=>resolve(active.id,'Need more info')} style={{padding:'10px 24px',borderRadius:10,background:C.accent,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>? Need more info</button>
            </div>
