    setExpandedFids(s=>{ const ns=new Set(s); ns.add(targetFolderId); return ns; });
  };

  const deleteFolder = id => {
    const folder = folders.find(f=>f.id===id);
    if (!folder) return;
    const allFids = [id, ...getDescFids(id)];
    const affectedPages = pages.filter(p=>allFids.includes(p.folderId));
    const msg = affectedPages.length > 0
      ? `Delete "${folder.name}" and its ${affectedPages.length} note${affectedPages.length!==1?'s':''}? This cannot be undone.`
      : `Delete folder "${folder.name}"?`;
    if (!window.confirm(msg)) return;
    saveFolders(folders.filter(f=>!allFids.includes(f.id)));
    savePages(pages.filter(p=>!allFids.includes(p.folderId)));
    if (allFids.includes(activeFid)) setActiveFid(1);
    if (affectedPages.some(p=>p.id===activePid)) { setActivePid(null); setHeaderEditing(false); }
  };

  const addFolder = () => {
    if(!newFolderName.trim()) return;
    const f={id:Date.now(),name:newFolderName.trim(),icon:'📁',parentId:newFolderParentId};
    saveFolders([...folders,f]); setActiveFid(f.id); setNewFolderName(''); setShowNewFolder(false);
    setNewFolderParentId(null);
    if(newFolderParentId) setExpandedFids(s=>{const ns=new Set(s);ns.add(newFolderParentId);return ns;});
  };

  const savePgName = (id,name) => { const n=name.trim()||'Untitled'; savePages(pages.map(p=>p.id===id?{...p,name:n}:p)); setEditingPgId(null); if(activePid===id) setHeaderTitle(n); };
  const saveFolderName = (id,name) => { saveFolders(folders.map(f=>f.id===id?{...f,name:name.trim()||'Folder'}:f)); setEditingFid(null); };
  const saveHeaderTitle = () => { if(!activePid) return; const n=headerTitle.trim()||'Untitled'; savePages(pages.map(p=>p.id===activePid?{...p,name:n}:p)); setHeaderEditing(false); };

  const pdfStyles = `
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap');

    /* ─── force all colors/backgrounds to print ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }

    /* ─── page geometry ─── */
    @page {
      size: Letter;
      margin: 0.9in 1.1in 0.85in 1.1in;
    }
    /* running footer via @page — page number on every sheet */
    @page { @bottom-right { content: counter(page); font-family: 'DM Sans', sans-serif; font-size: 9pt; color: #c4a0b0; } }

    /* ─── prevent widows, orphans, mid-element cuts ─── */
    body {
      orphans: 4;
      widows: 4;
    }
    p, li {
      orphans: 3;
      widows: 3;
    }
    h1, h2, h3, h4, h5, h6 {
      page-break-after: avoid;
      break-after: avoid;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    blockquote, pre, table, figure, .nyla-cover {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    tr { page-break-inside: avoid; break-inside: avoid; }
    li { page-break-inside: avoid; break-inside: avoid; }

    /* ─── base ─── */
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #1a0e16;
      font-family: 'DM Sans', Georgia, sans-serif;
      font-size: 11.5pt;
      line-height: 1.85;
      font-weight: 300;
    }

    /* ─── page header stripe — prints via background on first element ─── */
    .nyla-stripe {
      display: block;
      height: 4pt;
      background: linear-gradient(90deg, #c4607a 0%, #d8a0c0 55%, #9070c8 100%);
      margin: -0.9in -1.1in 0;  /* bleed to page edge */
      margin-bottom: 36pt;
    }

    /* ─── cover block ─── */
    .nyla-cover {
      margin-bottom: 36pt;
      padding-bottom: 22pt;
      border-bottom: 0.75pt solid #e0c0d0;
    }
    .nyla-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5pt;
      font-weight: 500;
      letter-spacing: 3pt;
      text-transform: uppercase;
      color: #c4607a;
      margin: 0 0 10pt;
    }
    .nyla-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 30pt;
      font-weight: 300;
      color: #1a0e16;
      line-height: 1.15;
      margin: 0 0 10pt;
      letter-spacing: -0.3pt;
    }
    .nyla-meta {
      font-size: 8.5pt;
      color: #a08090;
      letter-spacing: 0.3pt;
    }
    .nyla-meta-sep { margin: 0 6pt; color: #e0c0d0; }

    /* ─── body content ─── */
    .nyla-body {
      color: #1a0e16;
    }
    .nyla-body h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22pt;
      font-weight: 400;
      color: #1a0e16;
      margin: 28pt 0 10pt;
      padding-bottom: 6pt;
      border-bottom: 0.5pt solid #e0c0d0;
      letter-spacing: -0.2pt;
    }
    .nyla-body h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16pt;
      font-weight: 400;
      font-style: italic;
      color: #3a1828;
      margin: 22pt 0 8pt;
    }
    .nyla-body h3 {
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5pt;
      font-weight: 500;
      letter-spacing: 2.5pt;
      text-transform: uppercase;
      color: #c4607a;
      margin: 18pt 0 6pt;
    }
    .nyla-body p {
      margin: 0 0 10pt;
      hyphens: auto;
      -webkit-hyphens: auto;
    }
    .nyla-body ul, .nyla-body ol {
      padding-left: 18pt;
      margin: 6pt 0 12pt;
    }
    .nyla-body li {
      margin-bottom: 4pt;
    }
    .nyla-body li::marker { color: #c4607a; }
    .nyla-body strong { font-weight: 500; color: #1a0e16; }
    .nyla-body em { font-style: italic; }

    .nyla-body blockquote {
      margin: 18pt 0;
      padding: 12pt 18pt;
      border-left: 2pt solid #c4607a;
      color: #4a2038;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13pt;
      font-weight: 300;
      background: #fdf6f9;
    }
    .nyla-body code {
      font-family: 'Courier New', monospace;
      font-size: 9.5pt;
      background: #fdf0f5;
      border: 0.5pt solid #f0d0dc;
      padding: 1pt 4pt;
      color: #a03c5a;
      border-radius: 2pt;
    }
    .nyla-body pre {
      font-family: 'Courier New', monospace;
      font-size: 9.5pt;
      background: #fdf0f5;
      border: 0.5pt solid #ecc8d8;
      padding: 12pt 14pt;
      margin: 12pt 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .nyla-body hr {
      border: none;
      margin: 28pt 0;
      text-align: center;
      overflow: visible;
    }
    .nyla-body hr::after {
      content: '✦  ·  ✦  ·  ✦';
      font-size: 8pt;
      color: #d4a0b8;
      letter-spacing: 4pt;
    }
    .nyla-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10pt;
      margin: 14pt 0;
    }
    .nyla-body th {
      font-family: 'DM Sans', sans-serif;
      font-size: 7pt;
      font-weight: 500;
      letter-spacing: 1.5pt;
      text-transform: uppercase;
      color: #7a3050;
      padding: 7pt 10pt;
      border-bottom: 1pt solid #e0b0c8;
      text-align: left;
      background: #faf0f5;
    }
    .nyla-body td {
      padding: 7pt 10pt;
      border-bottom: 0.5pt solid #f0e0e8;
      vertical-align: top;
    }
    .nyla-body tr:last-child td { border-bottom: none; }

    /* ─── footer ─── */
    .nyla-footer {
      margin-top: 48pt;
      padding-top: 10pt;
      border-top: 0.5pt solid #e8d0dc;
      font-family: 'DM Sans', sans-serif;
      font-size: 7.5pt;
      letter-spacing: 1pt;
      text-transform: uppercase;
      color: #c0a0b0;
      display: flex;
      justify-content: space-between;
    }

    /* ─── notebook cover page ─── */
    .nyla-cover-page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 56pt;
    }
    .nyla-cover-page .cp-eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 7pt;
      letter-spacing: 4pt;
      text-transform: uppercase;
      color: #c4607a;
      margin-bottom: 20pt;
    }
    .nyla-cover-page .cp-rule {
      width: 36pt;
      height: 1.5pt;
      background: #c4607a;
      margin-bottom: 20pt;
    }
    .nyla-cover-page .cp-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52pt;
      font-weight: 300;
      color: #1a0e16;
      line-height: 1.05;
      margin: 0 0 20pt;
      letter-spacing: -1pt;
    }
    .nyla-cover-page .cp-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 9pt;
      color: #a08090;
      letter-spacing: 0.5pt;
      font-weight: 300;
    }

    .nyla-page-break { page-break-after: always; break-after: page; }
  `;

  const buildPageHtml = (page, folder, idx, total) => {
    const dateStr = new Date(page.updated||page.created).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    const wc = stripHtml(page.content||'').split(/\s+/).filter(Boolean).length;
    const pageBreak = (idx < total - 1) ? '<div class="nyla-page-break"></div>' : '';
    const stripeOnly = idx === 0 ? '<div class="nyla-stripe"></div>' : '';
    return `
      ${stripeOnly}
      <div class="nyla-cover">
        <p class="nyla-label">${folder?.name||'Notebook'}</p>
        <h1 class="nyla-title">${page.name}</h1>
        <p class="nyla-meta">
          ${dateStr}<span class="nyla-meta-sep">·</span>${wc} words
        </p>
      </div>
      <div class="nyla-body">${page.content||'<p style="color:#c0a0b0;font-style:italic;font-family:\'Cormorant Garamond\',serif;">No content yet.</p>'}</div>
      <div class="nyla-footer">
        <span>${folder?.name||'Notebook'} &nbsp;·&nbsp; ${page.name}</span>
        <span>nyla os</span>
      </div>
      ${pageBreak}
    `;
  };

  const exportPDF = () => {
    if(!activePage) return;
    const folder = folders.find(f=>f.id===activePage.folderId);
    const w = window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>${activePage.name}</title><style>${pdfStyles}</style></head><body>${buildPageHtml(activePage,folder,0,1)}</body></html>`);
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };
  };

  const exportNotebookPDF = () => {
    if(!activePage) return;
    const folder = folders.find(f=>f.id===activePage.folderId);
    const notebookPages = pages.filter(p=>p.folderId===activePage.folderId);
    if(!notebookPages.length) return;
    const notebookTitle = folder?.name || 'Notebook';
    const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    const coverHtml = `
      <div class="nyla-stripe"></div>
      <div class="nyla-cover-page">
        <p class="cp-eyebrow">nyla os &nbsp;·&nbsp; notebook</p>
        <div class="cp-rule"></div>
        <h1 class="cp-title">${notebookTitle}</h1>
        <p class="cp-sub">${today} &nbsp;·&nbsp; ${notebookPages.length} page${notebookPages.length!==1?'s':''}</p>
      </div>
      <div class="nyla-page-break"></div>
    `;
    const pagesHtml = notebookPages.map((p,i)=>buildPageHtml(p,folder,i,notebookPages.length)).join('');
    const w = window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>${notebookTitle}</title><style>${pdfStyles}</style></head><body>${coverHtml}${pagesHtml}</body></html>`);
    w.document.close();
    w.onload = () => { w.focus(); w.print(); };
  };

  const backlinks = activePage ? pages.filter(p=>p.id!==activePid&&(p.content||'').includes(`[[${activePage.name}]]`)) : [];
  const wc = stripHtml(activePage?.content||'').split(/\s+/).filter(Boolean).length;
  const tags = getTags(activePage?.content||'');

  const TBtn = ({cmd,val=null,label,title:t,active,style:s={}}) => (
    <button onMouseDown={e=>{e.preventDefault();exec(cmd,val);}} title={t||label}
      style={{padding:'3px 8px',borderRadius:6,border:'none',cursor:'pointer',fontSize:12.5,lineHeight:1.5,background:active?C.rose:'transparent',color:active?'#fff':C.text,fontWeight:cmd==='bold'?700:400,fontStyle:cmd==='italic'?'italic':'normal',...s}}
      onMouseEnter={e=>{if(!active)e.currentTarget.style.background=`${C.pink}70`;}}
      onMouseLeave={e=>{if(!active)e.currentTarget.style.background='transparent';}}>{label}</button>
  );
  const TBtnBlock = ({tag,label}) => (
    <button onMouseDown={e=>{e.preventDefault();exec('formatBlock',tag);}} title={`Format as ${tag}`}
      style={{padding:'3px 8px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11.5,background:'transparent',color:C.text,fontWeight:600}}
      onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>{label}</button>
  );
  const Sep = () => <div style={{width:1,height:18,background:C.border,flexShrink:0,margin:'0 2px'}}/>;

  const panelBg = C.secondaryBg;
  return (
    <div className="fade-in" style={{display:'flex',height:'100%',overflow:'hidden'}}>

      {/* ── Left sidebar ── */}
      <div style={{width:210,background:panelBg,borderRight:`0.5px solid ${C.border}`,display:'flex',flexDirection:'column',overflow:'hidden',flexShrink:0}}>

        {/* Top actions */}
        <div style={{padding:'10px 10px 6px',borderBottom:`0.5px solid ${C.border}`,display:'flex',gap:4}}>
          <button onClick={addDailyNote} style={{flex:1,padding:'5px 8px',borderRadius:8,background:`${C.lavender}70`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:11,cursor:'pointer',textAlign:'left',fontWeight:500}}>📅 Daily Note</button>
          <button onClick={()=>{setShowSearch(s=>!s);setSearchQ('');}} style={{padding:'5px 8px',borderRadius:8,background:showSearch?C.accent:'transparent',border:`0.5px solid ${C.border}`,color:showSearch?'#fff':C.textMuted,fontSize:12,cursor:'pointer'}} title="Search notes">🔍</button>
          <button onClick={()=>setShowTemplates(s=>!s)} style={{padding:'5px 8px',borderRadius:8,background:showTemplates?C.accent:'transparent',border:`0.5px solid ${C.border}`,color:showTemplates?'#fff':C.textMuted,fontSize:12,cursor:'pointer'}} title="New from template">📋</button>
          <button onClick={()=>fileInputRef.current&&fileInputRef.current.click()} style={{padding:'5px 8px',borderRadius:8,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:12,cursor:'pointer'}} title="Upload file(s) to notebook">📎</button>
          <input ref={fileInputRef} type="file" multiple accept=".txt,.md,.pdf,.csv,.doc,.docx" style={{display:'none'}} onChange={e=>{if(e.target.files?.length)uploadFiles(Array.from(e.target.files));e.target.value='';}}/>
          <button onClick={()=>setShowGraph(g=>!g)} style={{padding:'5px 8px',borderRadius:8,background:showGraph?C.rose:'transparent',border:`0.5px solid ${C.border}`,color:showGraph?'#fff':C.textMuted,fontSize:13,cursor:'pointer',lineHeight:1}} title="Graph view">⬡</button>
        </div>

        {showSearch && (
          <div style={{padding:'6px 10px',borderBottom:`0.5px solid ${C.border}`}}>
            <input autoFocus value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Search notes..."
              style={{width:'100%',padding:'5px 9px',borderRadius:7,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>
          </div>
        )}

        {showTemplates && (
          <div style={{padding:'6px 10px',borderBottom:`0.5px solid ${C.border}`}}>
            <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:4}}>Templates</div>
            {Object.keys(NB_TEMPLATES).map(name=>(
              <button key={name} onClick={()=>{addFromTemplate(name);setShowTemplates(false);}}
                style={{display:'block',width:'100%',padding:'5px 8px',borderRadius:7,textAlign:'left',background:'transparent',border:'none',color:C.text,fontSize:11.5,cursor:'pointer',marginBottom:2}}
                onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}50`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                {name}
              </button>
            ))}
          </div>
        )}

        {/* Folders — recursive tree */}
        <div style={{padding:'6px 8px',borderBottom:`0.5px solid ${C.border}`,overflowY:'auto',maxHeight:'45%'}}>
          <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:4,paddingLeft:2}}>Folders</div>
          {(()=>{
            const renderNode=(folder,depth)=>{
              const children=folders.filter(f=>f.parentId===folder.id);
              const isExpanded=expandedFids.has(folder.id);
              const isActive=activeFid===folder.id&&!tagFilter&&!searchQ;
              const pCount=folder.id===1?pages.length:getDescFids(folder.id).reduce((acc,fid)=>acc+pages.filter(p=>p.folderId===fid).length,0);
              return React.createElement(React.Fragment,{key:folder.id},
                React.createElement('div',{
                  style:{display:'flex',alignItems:'center',marginBottom:1,paddingLeft:depth*12},
                  onMouseEnter:()=>setHoverFid(folder.id),
                  onMouseLeave:()=>setHoverFid(null)
                },
                  /* expand toggle */
                  React.createElement('button',{
                    onClick:()=>{const ns=new Set(expandedFids);ns.has(folder.id)?ns.delete(folder.id):ns.add(folder.id);setExpandedFids(ns);},
                    style:{width:14,height:14,border:'none',background:'none',cursor:children.length?'pointer':'default',color:C.textMuted,fontSize:8,padding:0,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',opacity:children.length?1:0}
                  }, isExpanded?'▾':'▸'),
                  /* folder label */
                  editingFid===folder.id
                    ? React.createElement('input',{autoFocus:true,value:editingFolderName,onChange:e=>setEditingFolderName(e.target.value),
                        onKeyDown:e=>{if(e.key==='Enter')saveFolderName(folder.id,editingFolderName);if(e.key==='Escape')setEditingFid(null);},
                        onBlur:()=>saveFolderName(folder.id,editingFolderName),
                        style:{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11.5,fontFamily:'inherit'}})
                    : React.createElement('button',{
                        onClick:()=>{setActiveFid(folder.id);setTagFilter('');setSearchQ('');setShowSearch(false);setActivePid(null);},
                        onDoubleClick:()=>{setEditingFid(folder.id);setEditingFolderName(folder.name);},
                        style:{display:'flex',alignItems:'center',gap:5,flex:1,padding:'4px 6px',borderRadius:7,textAlign:'left',background:isActive?`${C.pink}80`:'transparent',border:`0.5px solid ${isActive?C.border:'transparent'}`,color:C.text,fontSize:12,cursor:'pointer'}
                      },
                      React.createElement('span',{style:{fontSize:12}},''+folder.icon),
                      React.createElement('span',{style:{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},folder.name),
                      React.createElement('span',{style:{fontSize:9.5,color:C.textMuted,flexShrink:0}},pCount)
                    ),
                  /* add-subfolder btn (hover, not All Notes) */
                  hoverFid===folder.id&&folder.id!==1&&React.createElement('button',{
                    onClick:()=>{setNewFolderParentId(folder.id);setShowNewFolder(true);setExpandedFids(s=>{const ns=new Set(s);ns.add(folder.id);return ns;});},
                    title:'New subfolder',
                    style:{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:13,padding:'0 3px',flexShrink:0,lineHeight:1},
                    onMouseEnter:e=>e.currentTarget.style.color=C.rose,
                    onMouseLeave:e=>e.currentTarget.style.color=C.textMuted
                  },'+'),
                  /* delete folder btn (hover, not All Notes) */
                  hoverFid===folder.id&&folder.id!==1&&React.createElement('button',{
                    onClick:()=>deleteFolder(folder.id),
                    title:'Delete folder',
                    style:{background:'none',border:'none',cursor:'pointer',color:C.textMuted,fontSize:12,padding:'0 3px',flexShrink:0,lineHeight:1},
                    onMouseEnter:e=>e.currentTarget.style.color='#e05',
                    onMouseLeave:e=>e.currentTarget.style.color=C.textMuted
                  },'🗑')
                ),
                /* inline subfolder input */
                showNewFolder&&newFolderParentId===folder.id&&React.createElement('div',{
                  style:{display:'flex',gap:3,marginTop:2,paddingLeft:depth*12+26}
                },
                  React.createElement('input',{autoFocus:true,value:newFolderName,onChange:e=>setNewFolderName(e.target.value),
                    onKeyDown:e=>{if(e.key==='Enter')addFolder();if(e.key==='Escape'){setShowNewFolder(false);setNewFolderParentId(null);}},
                    placeholder:'Folder name',
                    style:{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11,fontFamily:'inherit'}}),
                  React.createElement('button',{onClick:addFolder,style:{background:C.rose,border:'none',borderRadius:6,color:'#fff',padding:'3px 7px',cursor:'pointer',fontSize:11}},'✓')
                ),
                /* recurse into children */
                isExpanded&&children.map(child=>renderNode(child,depth+1))
              );
            };
            const allNotes=folders.find(f=>f.id===1);
            const topLevel=folders.filter(f=>f.id!==1&&!f.parentId);
            return [
              allNotes&&renderNode(allNotes,0),
              ...topLevel.map(f=>renderNode(f,0))
            ];
          })()}
          {/* Top-level new folder input */}
          {showNewFolder&&newFolderParentId===null?(
            <div style={{display:'flex',gap:3,marginTop:4}}>
              <input autoFocus value={newFolderName} onChange={e=>setNewFolderName(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter')addFolder();if(e.key==='Escape'){setShowNewFolder(false);setNewFolderParentId(null);}}}
                placeholder="Folder name"
                style={{flex:1,padding:'3px 6px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:11.5,fontFamily:'inherit'}}/>
              <button onClick={addFolder} style={{background:C.rose,border:'none',borderRadius:6,color:'#fff',padding:'3px 7px',cursor:'pointer',fontSize:12}}>✓</button>
            </div>
          ):(
            <button onClick={()=>{setShowNewFolder(true);setNewFolderParentId(null);}}
              style={{width:'100%',padding:'4px 8px',borderRadius:7,background:'transparent',border:`0.5px dashed ${C.border}`,color:C.textMuted,fontSize:11,cursor:'pointer',marginTop:3,textAlign:'left'}}>+ New Folder</button>

            const isHovered=hoverPid===p.id;

                onMouseEnter={()=>setHoverPid(p.id)} onMouseLeave={()=>{setHoverPid(null);setMoveMenuPid(null);}}>

                  <input autoFocus value={editingPgName} onChange={e=>setEditingPgName(e.target.value)}

                    style={{flex:1,padding:'4px 7px',borderRadius:7,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.text,fontSize:12,fontFamily:'inherit'}}/>

                  </div>
                )}
              </div>
            );
          })}

        {/* Tags */}
        {allTags.length>0&&(

      {/* ── Right editor area ── */}

        {showGraph ? (

              ):(

                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

              <TBtnBlock tag="h3" label="H3"/>

              <button onMouseDown={e=>{e.preventDefault();exec('insertOrderedList');}} title="Numbered list" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>1.</button>
              <Sep/>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyLeft');}} title="Align left" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>≡</button>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyCenter');}} title="Center" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>⊟</button>
              <button onMouseDown={e=>{e.preventDefault();exec('justifyRight');}} title="Align right" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.text,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>⇥</button>
              <Sep/>
              <button onMouseDown={e=>{e.preventDefault();exec('formatBlock','blockquote');}} title="Blockquote" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.textMuted,fontSize:13,fontStyle:'italic'}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>❝</button>
              <button onMouseDown={e=>{e.preventDefault();exec('insertHorizontalRule');}} title="Divider" style={{padding:'3px 7px',borderRadius:6,border:'none',cursor:'pointer',background:'transparent',color:C.textMuted,fontSize:12}} onMouseEnter={e=>e.currentTarget.style.background=`${C.pink}70`} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>—</button>
            </div>

            {/* ── Formatting toolbar — row 2: size + color (always visible) ── */}
            <div style={{padding:'5px 10px',borderBottom:`0.5px solid ${C.border}`,display:'flex',alignItems:'center',gap:8,background:`${C.lavLight}80`,flexShrink:0,flexWrap:'wrap'}}>
              {/* Font size presets */}
              <div style={{display:'flex',alignItems:'center',gap:3}}>
                <span style={{fontSize:9.5,color:C.textMuted,fontWeight:600,letterSpacing:0.5,textTransform:'uppercase',marginRight:2}}>Size</span>
                {[['XS','1'],['S','2'],['M','3'],['L','4'],['XL','5'],['2X','6'],['3X','7']].map(([lbl,val])=>(
                  <button key={val} onMouseDown={e=>{e.preventDefault();exec('fontSize',val);}}
                    style={{padding:'2px 7px',borderRadius:6,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.roseDark,fontSize:10.5,cursor:'pointer',fontWeight:500,lineHeight:1.6}}
                    onMouseEnter={e=>e.currentTarget.style.background=C.pink} onMouseLeave={e=>e.currentTarget.style.background=C.pinkLight}>{lbl}</button>
                ))}
              </div>
              <div style={{width:1,height:18,background:C.border,flexShrink:0}}/>
              {/* Text color */}
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{fontSize:9.5,color:C.textMuted,fontWeight:600,letterSpacing:0.5,textTransform:'uppercase'}}>Color</span>
                {['#1a0e16','#c4607a','#7a3090','#1a6090','#1a8050','#c47a20'].map(col=>(
                  <button key={col} onMouseDown={e=>{e.preventDefault();exec('foreColor',col);}} title={col}
                    style={{width:18,height:18,borderRadius:4,background:col,border:`1.5px solid #fff`,cursor:'pointer',flexShrink:0,boxShadow:'0 0 0 0.5px #d0b0c040'}}/>
                ))}
                <ColorWheelPicker value={customTextColor} onChange={col=>{ setCustomTextColor(col); exec('foreColor',col); }}
                  trigger={c=>(
                    <div title="Custom text color" style={{width:18,height:18,borderRadius:4,background:'linear-gradient(135deg,#c4607a,#9080d8,#5aab8c)',border:'1.5px solid #fff',cursor:'pointer',flexShrink:0,boxShadow:`0 0 0 0.5px #d0b0c040, inset 0 0 0 5px ${c}`}}/>
                  )}/>
              </div>
              <div style={{width:1,height:18,background:C.border,flexShrink:0}}/>
              {/* Highlight swatches */}
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{fontSize:9.5,color:C.textMuted,fontWeight:600,letterSpacing:0.5,textTransform:'uppercase'}}>Highlight</span>
                {[['#fce4ec','Rose'],['#f3e5f5','Lavender'],['#fff9c4','Yellow'],['#e8f5e9','Mint'],['#e3f2fd','Sky'],['#fff3e0','Peach'],['transparent','None']].map(([col,name])=>(
                  <button key={col} onMouseDown={e=>{e.preventDefault();exec('hiliteColor',col);}} title={name}
                    style={{width:18,height:18,borderRadius:4,background:col==='transparent'?'#fff':col,border:`1.5px solid ${col==='transparent'?C.border:'#fff'}`,cursor:'pointer',flexShrink:0,boxShadow:'0 0 0 0.5px #d0b0c040',fontSize:10,display:'flex',alignItems:'center',justifyContent:'center',color:C.textMuted}}>{col==='transparent'?'✕':''}</button>
                ))}
                <ColorWheelPicker value={customHiliteColor} onChange={col=>{ setCustomHiliteColor(col); exec('hiliteColor',col); }}
                  trigger={c=>(
                    <div title="Custom highlight color" style={{width:18,height:18,borderRadius:4,background:'linear-gradient(135deg,#fce4ec,#fff9c4,#e8f5e9)',border:'1.5px solid #fff',cursor:'pointer',flexShrink:0,boxShadow:`0 0 0 0.5px #d0b0c040, inset 0 0 0 5px ${c}`}}/>
                  )}/>
              </div>
            </div>

            {/* Rich text editor — key=activePid forces remount on page switch */}
            <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
              <RichEditorComponent key={activePid} pageId={activePid} initialContent={activePage.content||''}
                onUpdate={updateContent} onMount={el=>editorDomRef.current=el}/>
            </div>

            {/* Backlinks */}
            {backlinks.length>0&&(
              <div style={{padding:'8px 16px',borderTop:`0.5px solid ${C.border}`,background:panelBg,flexShrink:0}}>
                <div style={{fontSize:9.5,color:C.textMuted,fontWeight:700,letterSpacing:0.8,textTransform:'uppercase',marginBottom:5}}>Linked from</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                  {backlinks.map(p=>(
                    <button key={p.id} onClick={()=>setActivePid(p.id)} style={{padding:'3px 10px',borderRadius:10,background:`${C.lavender}60`,border:`0.5px solid ${C.border}`,color:C.accent,fontSize:11,cursor:'pointer'}}>📎 {p.name}</button>
                  ))}
                </div>
              </div>
            )}
          </>
        ):(
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:14,color:C.textMuted}}>
            <div style={{fontSize:42}}>📝</div>
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:18,color:C.rose}}>Your notes live here</div>
            <div style={{fontSize:13,color:C.textMuted}}>Select a note or start fresh</div>
            <div style={{display:'flex',gap:10}}>
              <button onClick={addDailyNote} style={{padding:'9px 20px',borderRadius:10,background:`${C.lavender}70`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:13,cursor:'pointer'}}>📅 Daily Note</button>
              <button onClick={addPage} style={{padding:'9px 20px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>+ New Page</button>
              <button onClick={()=>fileInputRef.current&&fileInputRef.current.click()} style={{padding:'9px 20px',borderRadius:10,background:`${C.lavender}70`,border:`0.5px solid ${C.border}`,color:C.rose,fontSize:13,cursor:'pointer'}}>📎 Upload File</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

  const [days, setDaysState] = useState(()=>JSON.parse(localStorage.getItem(CYCLE_DAYS_KEY)||'{}'));
  const savePeriods = list => {
    const sorted = [...list].sort((a,b)=>a.start.localeCompare(b.start));
    setPeriodsState(sorted); localStorage.setItem(PERIODS_KEY, JSON.stringify(sorted));
    const last = sorted[sorted.length-1]; if (last) localStorage.setItem('nylaos_cycleStartDate', last.start); else localStorage.removeItem('nylaos_cycleStartDate');
  };
  const saveDay = (k, patch) => { const next = { ...days, [k]: { ...(days[k]||{}), ...patch } }; setDaysState(next); localStorage.setItem(CYCLE_DAYS_KEY, JSON.stringify(next)); };
  return { periods, days, savePeriods, saveDay, stats: cycleStats(periods) };
};
const periodPredictions = (periods, stats) => {
  if (!periods.length) return null;
  const today = toDateKey();
  const last = periods[periods.length-1];
  const since = dayDiff(last.start, today);
  const late = since >= stats.cycleLength && since < stats.cycleLength + 10 ? since - stats.cycleLength + 1 : 0;
  let next = addDaysKey(stats.cycleLength, last.start);
  while (!late && next < today && dayDiff(last.start, next) < 800) next = addDaysKey(stats.cycleLength, next);
  if (late) next = today;
  const ovulation = addDaysKey(-14, next);
  return { next, ovulation, fertileStart:addDaysKey(-5, ovulation), fertileEnd:addDaysKey(1, ovulation), pmsStart:addDaysKey(-5, next),
    daysUntil: dayDiff(today, next), late, stale: since >= stats.cycleLength + 10, onPeriod: last.start<=today && (!last.end ? dayDiff(last.start,today) < stats.periodLength+3 : last.end>=today) };
};

const CycleWheel = ({ cycle, periodLength=5 }) => {
  const cx=110, cy=110, r=84, sw=18;
  const phases = cyclePhasesFor(cycle.cycleLength, periodLength);
  const deg = d => (d-1)/cycle.cycleLength*360;
  const dot = polarToCartesian(cx,cy,r,deg(Math.min(cycle.day, cycle.cycleLength))+180/cycle.cycleLength);
  return (
    <svg viewBox="0 0 220 220" width={220} height={220} style={{ display:'block', margin:'0 auto' }}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.border} strokeWidth={sw}/>
      {phases.map(p=><path key={p.name} d={arcPath(cx,cy,r,deg(p.day1)+1,deg(p.day2+1)-1)} fill="none" stroke={p.color} strokeWidth={sw} strokeLinecap="round" opacity={p.name===cycle.name?1:.45}/>)}
      <circle cx={dot.x} cy={dot.y} r={11} fill={C.card} stroke={cycle.color} strokeWidth={3}/>
      <text x={cx} y={cy-12} textAnchor="middle" style={{ fontSize:11, fill:C.textMuted, letterSpacing:1 }}>DAY</text>
      <text x={cx} y={cy+18} textAnchor="middle" style={{ fontFamily:"'DM Serif Display',serif", fontSize:44, fill:C.rose }}>{cycle.day}</text>
      <text x={cx} y={cy+38} textAnchor="middle" style={{ fontSize:11, fill:C.textLight }}>of {cycle.cycleLength}</text>
    </svg>
  );
};

  const ongoing = last && !last.end && dayDiff(last.start, today) <= 10;
  const startPeriod = (k=today) => { if (P.periods.some(p=>p.start===k)) return; P.savePeriods([...P.periods, { id:Date.now(), start:k }]); P.saveDay(k, { flow: P.days[k]?.flow||'medium' }); toast('Period logged 🩸 predictions updated','success',1800); };

// A tiny store hook: state that mirrors a localStorage key.
const useStored = (key, fallback) => {
  const [val, setVal] = useState(()=>{ const s = localStorage.getItem(key); return s ? JSON.parse(s) : (typeof fallback==='function'?fallback():fallback); });
  const save = v => { const next = typeof v==='function' ? v(val) : v; setVal(next); localStorage.setItem(key, JSON.stringify(next)); };
  return [val, save];
};

const fmtNum = n => { n = Number(n)||0; return n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M' : n>=1e4 ? Math.round(n/1e3)+'K' : n>=1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(Math.round(n)); };
const postInteractions = p => { const m = p.metrics||{}; return (+m.likes||0)+(+m.comments||0)+(+m.shares||0)+(+m.saves||0); };
const postEngagement = (p, accounts) => {
  const m = p.metrics||{}; const inter = postInteractions(p);
  if (!inter) return null;
  if (+m.views) return inter / +m.views * 100;
  const acct = accounts.find(a=>a.platform===p.platform);
  return acct && acct.followers ? inter / acct.followers * 100 : null;
};
const weekStartKey = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return toDateKey(x); };
const followerSeries = a => {
  const hist = [...(a.history||[])].sort((x,y)=>x.date.localeCompare(y.date));
  if (!hist.length || hist[hist.length-1].followers !== a.followers) hist.push({ date:toDateKey(), followers:a.followers||0 });
  return hist;
};
const growthSince = (a, days) => {
  const s = followerSeries(a); const cutoff = addDaysKey(-days);
  const base = [...s].reverse().find(h=>h.date<=cutoff) || s[0];
  return (a.followers||0) - (base?.followers||0);
};

    setEditing(null); toast('Saved','success',1200);
  };
  const remove = item => { addToTrash('social_content', item.title, item, SOCIAL_CONTENT_KEY); setItems(items.filter(x=>x.id!==item.id)); setEditing(null); toast('Moved to Recently Deleted','info',1500); };

  const editor = editing && <SocialContentEditor initial={editing} onClose={()=>setEditing(null)} onSave={upsert} onDelete={editing.id?()=>remove(editing):null}/>;
  return { items, setItems, editing, setEditing, upsert, remove, patch, editor };
};

  const totalFollowers = accounts.reduce((s,a)=>s+(a.followers||0),0);
  const growth30 = accounts.reduce((s,a)=>s+growthSince(a,30),0);
  const posted = items.filter(i=>i.status==='Posted');
  const monthKey = today.slice(0,7);
  const postedThisMonth = posted.filter(i=>(i.date||'').startsWith(monthKey)).length;
  const monthlyGoal = accounts.reduce((s,a)=>s+(+a.postsPerWeek||0),0) * 4;
  const engs = posted.map(p=>postEngagement(p,accounts)).filter(v=>v!==null);
  const avgEng = engs.length ? engs.reduce((a,b)=>a+b,0)/engs.length : null;
  const earned = deals.filter(d=>d.status==='Paid').reduce((s,d)=>s+(+d.rate||0),0);
  const pending = deals.filter(d=>!['Paid','Lost'].includes(d.status)).reduce((s,d)=>s+(+d.rate||0),0);
  let streak = 0; { let wk = weekStartKey(new Date()); const weeks = new Set(posted.map(p=>weekStartKey(new Date((p.date||today)+'T00:00'))));
    if (!weeks.has(wk)) wk = addDaysKey(-7, wk);
    while (weeks.has(wk)) { streak++; wk = addDaysKey(-7, wk); } }
  const week = Array.from({length:7},(_,i)=>{ const k = addDaysKey(i); return { k, d:new Date(k+'T00:00'), posts: items.filter(p=>p.date===k) }; });
  const overdue = items.filter(p=>p.status!=='Posted' && p.status!=='Idea' && p.date && p.date<today);
  const top = [...posted].map(p=>({ p, e:postEngagement(p,accounts) })).filter(x=>x.e!==null).sort((a,b)=>b.e-a.e).slice(0,3);

        <StatTile icon="📅" label="Posted this month" value={postedThisMonth} sub={monthlyGoal?`Goal ${monthlyGoal} · ${Math.round(postedThisMonth/monthlyGoal*100)}%`:'Set weekly goals on accounts'} color={C.accent}/>
        <StatTile icon="💬" label="Avg engagement" value={avgEng===null?'—':`${avgEng.toFixed(1)}%`} sub={engs.length?`across ${engs.length} posts with results`:'Log results on posted content'} color="#5b8ed6"/>
        <StatTile icon="🔥" label="Posting streak" value={`${streak} wk${streak===1?'':'s'}`} sub={deals.length?`$${fmtNum(earned)} earned · $${fmtNum(pending)} pending`:'Weeks in a row with a post'} color="#c4904a"/>
      </div>

      <Card style={{ marginBottom:14 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
          <SectionHeading style={{ marginBottom:0 }}>Next 7 days</SectionHeading>
          <button onClick={()=>go('Content Calendar')} style={{ fontSize:12, color:C.rose, background:'none', border:'none', cursor:'pointer' }}>Calendar →</button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns: isMobile?'repeat(7,minmax(86px,1fr))':'repeat(7,1fr)', gap:8, overflowX:'auto' }}>
          {week.map(({k,d,posts},i)=>(
            <div key={k} onClick={()=>setEditing({ date:k })} style={{ minHeight:110, padding:'8px', borderRadius:14, cursor:'pointer', background: i===0?`${C.rose}10`:`${C.lavender}30`, border:`0.5px solid ${i===0?C.rose+'50':C.border}` }}>
              <div style={{ fontSize:10.5, color:C.textMuted, textTransform:'uppercase', letterSpacing:.6 }}>{d.toLocaleDateString('en-US',{weekday:'short'})}</div>
              <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:18, color:C.rose, marginBottom:6 }}>{d.getDate()}</div>
              {posts.map(p=>{ const st = CONTENT_STATUSES.find(s=>s.id===p.status)||CONTENT_STATUSES[0]; return (
                <div key={p.id} onClick={e=>{ e.stopPropagation(); setEditing(p); }} title={p.title} style={{ fontSize:10.5, padding:'3px 6px', borderRadius:6, marginBottom:3, background:C.card, borderLeft:`3px solid ${st.color}`, color:C.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{platformInfo(p.platform).emoji} {p.title}</div>
              ); })}
            </div>

      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1fr 1fr', gap:14, marginBottom:14 }}>

          </div>

          {accounts.map(a=>{ const p = platformInfo(a.platform); const g = growthSince(a,30); const goalPct = a.goalFollowers ? Math.min(100, Math.round((a.followers||0)/a.goalFollowers*100)) : null; return (
            <div key={a.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 0', borderBottom:`0.5px solid ${C.border}70` }}>
              <span style={{ width:32, height:32, borderRadius:10, display:'grid', placeItems:'center', background:`${p.color}18`, fontSize:15 }}>{p.emoji}</span>

              </div>
            </div>

        </Card>

const SocialIdeaCoach = ({ compact=false, onAdded }) => {
  const [busy, setBusy] = useState(false);
  const [ideas, setIdeas] = useState([]);
  const [focus, setFocus] = useState('');
  const run = async () => {
    const accounts = JSON.parse(localStorage.getItem(SOCIAL_ACCOUNTS_KEY)||'[]');
    const content = JSON.parse(localStorage.getItem(SOCIAL_CONTENT_KEY)||'[]');
    const pillars = JSON.parse(localStorage.getItem(SOCIAL_PILLARS_KEY)||'null') || DEFAULT_PILLARS;
    const accts = JSON.parse(localStorage.getItem(SOCIAL_ACCOUNTS_KEY)||'[]');
    const recent = content.slice(0,25).map(c=>`- [${c.status}] ${platformInfo(c.platform).label} ${c.format||''}: ${c.title}${postEngagement(c,accts)!==null?` (${postEngagement(c,accts).toFixed(1)}% eng)`:''}`).join('\n');
    setBusy(true);
    try {
      const text = await callClaude({ system:'You are a creative, data-minded content strategist for Nyla, a young Black woman entrepreneur and creator. Reply ONLY with a JSON array — no fences — of 6 objects: {"title": short post idea, "platform": one of instagram|tiktok|youtube|pinterest|twitter|facebook|linkedin|threads, "format": short format name, "pillar": one of the given pillars, "hook": opening line}.',
        messages:[{ role:'user', content:`Accounts: ${accounts.map(a=>`${platformInfo(a.platform).label} ${a.handle} (${a.followers||0} followers)`).join(', ')||'none added yet'}\nPillars: ${pillars.map(p=>p.name).join(', ')}\nRecent content:\n${recent||'none yet'}\n${focus?`Focus on: ${focus}`:''}\nGive 6 fresh ideas that build on what's working and fill gaps.` }], maxTokens:6000, effort:'medium' });
      const arr = JSON.parse((text.match(/\[[\s\S]*\]/)||['[]'])[0]);
      setIdeas(arr);
    } catch(e) { toast(e.message.includes('JSON')?'Couldn’t read the ideas — try again':e.message,'error',3500); }
    setBusy(false);
  };
  const keep = idea => {
    const list = JSON.parse(localStorage.getItem(SOCIAL_IDEAS_KEY)||'[]');
    localStorage.setItem(SOCIAL_IDEAS_KEY, JSON.stringify([{ id:Date.now()+Math.random(), text:idea.title, hook:idea.hook, platform:idea.platform, format:idea.format, pillar:idea.pillar, created:new Date().toISOString() }, ...list]));
    setIdeas(ids=>ids.filter(x=>x!==idea)); toast('Saved to your idea bank','success',1300); onAdded && onAdded();
  };
  return (
    <Card style={{ background:`linear-gradient(135deg, ${C.lavender}70, ${C.pink}40)`, border:'none' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
        <div style={{ flex:1, minWidth:200 }}>
          <SectionHeading style={{ marginBottom:2 }}>✦ Content coach</SectionHeading>
          <div style={{ fontSize:12, color:C.textLight }}>Fresh ideas based on your accounts, pillars and what's performing.</div>
        </div>
        <input value={focus} onChange={e=>setFocus(e.target.value)} placeholder="Optional focus — e.g. launch week" style={{ ...socialField, width:220, background:C.card }}/>
        <button onClick={run} disabled={busy} style={{ padding:'9px 18px', borderRadius:20, background:C.rose, color:'#fff', border:'none', fontSize:13, cursor:'pointer' }}>{busy?'Thinking…':'Get ideas'}</button>
      </div>
      {ideas.length>0 && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(230px,1fr))', gap:8, marginTop:14 }}>
          {ideas.map((idea,i)=>(
            <div key={i} style={{ padding:'11px 12px', borderRadius:14, background:C.card, border:`0.5px solid ${C.border}` }}>
              <div style={{ fontSize:10.5, color:C.textMuted, marginBottom:3 }}>{platformInfo(idea.platform).emoji} {platformInfo(idea.platform).label} · {idea.format} · {idea.pillar}</div>
              <div style={{ fontSize:13, color:C.text, fontWeight:500, marginBottom:4 }}>{idea.title}</div>
              {idea.hook && <div style={{ fontSize:11.5, color:C.textLight, fontStyle:'italic', marginBottom:8 }}>“{idea.hook}”</div>}
              <button onClick={()=>keep(idea)} style={{ fontSize:11.5, color:C.rose, background:'none', border:`0.5px solid ${C.border}`, borderRadius:20, padding:'3px 10px', cursor:'pointer' }}>+ Save idea</button>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
};

      {platformInfo(p.platform).emoji} {p.time?`${p.time} `:''}{p.title}

        {view==='month' && <>
          <button onClick={()=>setCursor(new Date(y,m-1,1))} style={{ ...socialField, width:'auto', padding:'6px 12px', cursor:'pointer' }}>‹</button>
          <span style={{ fontFamily:"'DM Serif Display',serif", fontSize:18, color:C.rose, minWidth:150, textAlign:'center' }}>{MONTHS[m]} {y}</span>
          <button onClick={()=>setCursor(new Date(y,m+1,1))} style={{ ...socialField, width:'auto', padding:'6px 12px', cursor:'pointer' }}>›</button>

        {CONTENT_STATUSES.map(s=><span key={s.id} style={{ fontSize:11, color:C.textLight }}><span style={{ display:'inline-block', width:9, height:9, borderRadius:3, background:s.color, marginRight:5, verticalAlign:'middle' }}/>{s.id}</span>)}

            {cells.map((k,i)=>{

              return (
                <div key={i} onClick={()=>k&&setEditing({ date:k })}
                  onDragOver={e=>{ if(k){ e.preventDefault(); } }}

                  style={{ minHeight:104, padding:6, borderRadius:10, background: !k?'transparent': k===today?`${C.rose}10`:`${C.lavender}28`, border: k?`0.5px solid ${k===today?C.rose+'60':C.border}`:'none', cursor:k?'pointer':'default' }}>
                  {k && <div style={{ fontSize:12, fontWeight:k===today?700:500, color:k===today?C.rose:C.textLight, marginBottom:4 }}>{Number(k.slice(8))}</div>}

const SocialAnalyticsPanel = () => {
  const accounts = JSON.parse(localStorage.getItem(SOCIAL_ACCOUNTS_KEY)||'[]');
  const items = JSON.parse(localStorage.getItem(SOCIAL_CONTENT_KEY)||'[]');
  const isMobile = useIsMobile();
  const posted = items.filter(i=>i.status==='Posted' && i.date);
  const weeks = Array.from({length:12},(_,i)=>{ const k = weekStartKey(new Date(addDaysKey(-7*(11-i))+'T00:00')); const d = new Date(k+'T00:00');
    return { label:`Week of ${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`, short:`${d.getMonth()+1}/${d.getDate()}`, value: posted.filter(p=>weekStartKey(new Date(p.date+'T00:00'))===k).length }; });
  const withEng = posted.map(p=>({ p, e:postEngagement(p,accounts) })).filter(x=>x.e!==null);
  const groupAvg = keyFn => {
    const g = {}; withEng.forEach(({p,e})=>{ const k = keyFn(p)||'—'; (g[k]=g[k]||[]).push(e); });
    return Object.entries(g).map(([label,v])=>({ label, value:v.reduce((a,b)=>a+b,0)/v.length, note:`${v.length} post${v.length===1?'':'s'}` })).sort((a,b)=>b.value-a.value);
  };
  const weekday = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>{ const v = withEng.filter(({p})=>(new Date(p.date+'T00:00').getDay()+6)%7===i).map(x=>x.e); return { label:d, value: v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0 }; });
  const views = posted.reduce((s,p)=>s+(+p.metrics?.views||0),0);
  const inter = posted.reduce((s,p)=>s+postInteractions(p),0);
  const follows = posted.reduce((s,p)=>s+(+p.metrics?.follows||0),0);
  const best = [...withEng].sort((a,b)=>b.e-a.e).slice(0,5);
  const bestDay = weekday.reduce((a,b)=>b.value>a.value?b:a, weekday[0]);
  return (
    <div className="fade-in" style={{ maxWidth:1000 }}>
      <PageTitle subtitle="From results you log on posted content">Analytics</PageTitle>
      {posted.length===0 && <div style={{ marginBottom:14 }}><EmptyState icon="📈" title="No posted content yet" text="Mark posts as Posted and add views, likes, comments, shares and saves — charts fill in here."/></div>}
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr 1fr':'repeat(4,1fr)', gap:12, marginBottom:14 }}>
        <StatTile label="Posts published" value={posted.length} sub="all time"/>
        <StatTile label="Total views" value={fmtNum(views)} color={C.accent}/>
        <StatTile label="Interactions" value={fmtNum(inter)} sub="likes, comments, shares, saves" color="#5b8ed6"/>
        <StatTile label="Follows from posts" value={fmtNum(follows)} color="#c4904a"/>
      </div>
      <Card style={{ marginBottom:14 }}>
        <SectionHeading>Posts per week</SectionHeading>
        <BarChart data={weeks} valueFmt={v=>`${v} post${v===1?'':'s'}`}/>
      </Card>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1fr 1fr', gap:14, marginBottom:14 }}>
        <Card><SectionHeading>Engagement by format</SectionHeading><HBars rows={groupAvg(p=>p.format)} valueFmt={v=>`${v.toFixed(1)}%`} empty="Log results to compare formats."/></Card>
        <Card><SectionHeading>Engagement by platform</SectionHeading><HBars rows={groupAvg(p=>platformInfo(p.platform).label)} valueFmt={v=>`${v.toFixed(1)}%`} color={C.accent} empty="Log results to compare platforms."/></Card>
        <Card><SectionHeading>Engagement by pillar</SectionHeading><HBars rows={groupAvg(p=>p.pillar)} valueFmt={v=>`${v.toFixed(1)}%`} color="#5b8ed6" empty="Tag posts with a pillar to compare."/></Card>
        <Card>
          <SectionHeading>Best day to post</SectionHeading>
          <BarChart data={weekday} height={120} valueFmt={v=>`${v.toFixed(1)}% avg engagement`} color="#c4904a"/>
          {withEng.length>2 && <div style={{ fontSize:12, color:C.textLight, marginTop:10 }}>Your posts do best on <b>{bestDay.label}</b> so far.</div>}
        </Card>
      </div>
      <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'1fr 1fr', gap:14 }}>
        <Card>
          <SectionHeading>Top posts</SectionHeading>
          {best.length===0 ? <div style={{ fontSize:12.5, color:C.textMuted }}>Nothing measured yet.</div> : best.map(({p,e},i)=>(
            <div key={p.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:`0.5px solid ${C.border}70` }}>
              <span style={{ fontFamily:"'DM Serif Display',serif", fontSize:17, color:C.rose, width:18 }}>{i+1}</span>
              <span>{platformInfo(p.platform).emoji}</span>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, color:C.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.title}</div>
                <div style={{ fontSize:11, color:C.textMuted }}>{p.format||'Post'} · {fmtNum(p.metrics?.views||0)} views · {fmtNum(postInteractions(p))} interactions</div>
              </div>
              <span style={{ fontSize:12.5, fontWeight:600, color:C.text }}>{e.toFixed(1)}%</span>
            </div>
          ))}
        </Card>
        <Card>
          <SectionHeading>Follower growth</SectionHeading>
          {accounts.length===0 ? <div style={{ fontSize:12.5, color:C.textMuted }}>Add accounts and log counts over time.</div> : accounts.map(a=>{ const s = followerSeries(a); const first = s[0]?.followers||0; const pct = first ? ((a.followers||0)-first)/first*100 : 0; return (
            <div key={a.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:`0.5px solid ${C.border}70` }}>
              <span>{platformInfo(a.platform).emoji}</span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13, color:C.text }}>{a.handle}</div><div style={{ fontSize:11, color:C.textMuted }}>{s.length} check-in{s.length===1?'':'s'} since {new Date(s[0].date+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
              <Sparkline values={s.map(h=>h.followers)} width={90} height={28}/>
              <span style={{ fontSize:12, fontWeight:600, color:pct>0?'#3f9a6a':pct<0?'#d05a5a':C.textMuted, width:52, textAlign:'right' }}>{pct>=0?'+':''}{pct.toFixed(1)}%</span>
            </div>
          ); })}
        </Card>
      </div>
    </div>
  );
};

const saveChatSession = (id, label, type, msgs) => {
  if (!msgs || !msgs.some(m=>m.role==='user')) return;
  const all = JSON.parse(localStorage.getItem('nylaos_chat_history')||'[]');
  const idx = all.findIndex(h=>h.id===id);
  const sess = {id, label, type, date:new Date().toISOString(), msgs};

};

const NatalWheel = ({ size=380 }) => {
  const cx = size/2, cy = size/2;
  const R = size/2 - 6, RS = R - 30, RH = RS - 8, RP = RH - 26, RA = RP - 30;
  const ang = lon => (180 + norm360(lon) - NATAL.asc) * Math.PI/180;

  const planets = [...NATAL.planets].sort((a,b)=>norm360(a.lon)-norm360(b.lon));
  // Spread glyphs that would sit on top of each other.
  const placed = []; planets.forEach(p => { let l = p.lon; const prev = placed[placed.length-1]; if (prev && norm360(l-prev.show) < 9) l = prev.show + 9; placed.push({ ...p, show:l }); });
  const fg = _dk ? '#f0e0e8' : '#4a2436', faint = _dk ? 'rgba(255,255,255,.14)' : 'rgba(64,24,40,.12)';
  const aspects = NATAL_ASPECTS.filter(x=>x.asp.name!=='conjunction' && !['ASC','MC'].includes(x.a.name) && !['ASC','MC'].includes(x.b.name));
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{ maxWidth:size, display:'block', margin:'0 auto' }} role="img" aria-label="Natal chart wheel">
      <defs>
        <radialGradient id="wheelBg" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor={_dk?'#2a1d33':'#fff'} /><stop offset="100%" stopColor={_dk?'#1d1524':'#f7eef5'} /></radialGradient>
      </defs>
      <circle cx={cx} cy={cy} r={R} fill="url(#wheelBg)" stroke={faint}/>
      {SIGNS.map((s,i)=>{
        const a1 = i*30, a2 = a1+30;
        const [x1,y1]=pt(R,a1),[x2,y2]=pt(R,a2),[x3,y3]=pt(RS,a2),[x4,y4]=pt(RS,a1);
        const [gx,gy]=pt((R+RS)/2, a1+15);
        return (
          <g key={s}>
            <path d={`M${x1},${y1} A${R},${R} 0 0 0 ${x2},${y2} L${x3},${y3} A${RS},${RS} 0 0 1 ${x4},${y4} Z`} fill={`${ELEMENT_COLOR[SIGN_ELEMENT[i]]}${_dk?'2a':'1c'}`} stroke={faint}/>
            <text x={gx} y={gy} textAnchor="middle" dominantBaseline="central" fontSize={size*0.042} fill={ELEMENT_COLOR[SIGN_ELEMENT[i]]}>{SIGN_GLYPH[i]}</text>
          </g>
        );

      <circle cx={cx} cy={cy} r={RA} fill={_dk?'rgba(0,0,0,.15)':'rgba(255,255,255,.7)'} stroke={faint}/>
      {Array.from({length:72},(_,i)=>line(RS, RS-(i%6===0?7:3), i*5, { key:'t'+i, stroke:faint }))}
      {NATAL.cusps.map((c,i)=>{
        const angular = i%3===0;
        const next = NATAL.cusps[(i+1)%12]; const mid = c + norm360(next-c)/2;
        const [nx,ny] = pt(RA+11, mid);
        return (
          <g key={'h'+i}>
            {line(RS, angular?RA-18:RA, c, { stroke: angular ? C.rose : faint, strokeWidth: angular?1.6:0.8 })}
            <text x={nx} y={ny} textAnchor="middle" dominantBaseline="central" fontSize={size*0.024} fill={C.textMuted}>{i+1}</text>
          </g>

      })}
      {aspects.map((x,i)=>{

        return <line key={'a'+i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={ASPECT_TONE_COLOR[x.asp.tone]} strokeOpacity={Math.max(.25, .8 - x.orb/10)} strokeWidth={x.orb<2?1.4:0.9} strokeDasharray={x.asp.tone==='adjust'?'3 3':undefined}/>;
      })}
      {placed.map(p=>{
        const [x,y] = pt((RH+RP)/2, p.show);

            {line(RH, RH-5, p.lon, { stroke:fg, strokeWidth:1 })}

const CosmicChat = ({ systemPrompt, placeholder, label='Cosmic' }) => {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [fullscreen, setFullscreen] = useState(false);
  const att = useAttachments();
  const sessionId = useRef(null);
  const endRef = useRef(null);
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth', block:'nearest'}); },[msgs,loading,fullscreen]);

  const send = async (preset) => {
    const userText = (preset ?? input).trim();
    if ((!userText && !att.items.length) || loading) return;
    if (!sessionId.current) sessionId.current = Date.now();
    const ids = att.take();
    const history = [...msgs, {role:'user', text:userText, photos: ids.length?ids:undefined}];
    setMsgs(history); setInput(''); setLoading(true);
    try {
      const reply = await callClaude({ system:systemPrompt, messages: await messagesWithPhotos(history), maxTokens:12000, effort:'medium' });
      const updated = [...history, {role:'assistant',text:reply}];
      setMsgs(updated);
      saveChatSession(sessionId.current, label, 'cosmic', updated);
    } catch(e) {
      setMsgs(m=>[...m,{role:'assistant',text:`⚠️ ${e.message}`}]);
    } finally { setLoading(false); }
  };
  const starters = {
    Astrology:['What are my biggest themes this year?','Explain my Mars square Saturn','Best timing for a launch this fall?'],
    'Human Design':['How do I use my Sacral in daily life?','What does 3/5 mean for my career?','How should I make big decisions?'],
    Numerology:['What does Personal Year 8 ask of me?','How do my 5 and 8 work together?','What is karmic lesson 8?'],
    'Matrix of Destiny':['Explain my karmic tail 15-20-5','How do I activate my money line?','What does center 10 mean for me?'],
    Astrocartography:['Where should I travel for love?','Is New York good for my career?','What do my Los Angeles lines say?'],
  }[label] || [];

  const body = (height) => (
    <>
      <div style={{ height, flex: height?undefined:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:10, padding:'14px 16px' }}>
        {msgs.length===0 && (
          <div>
            <div style={{ fontSize:13, color:C.textMuted, marginBottom:10 }}>Ask anything — it knows your exact chart. You can attach a screenshot or a reading too.</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
              {starters.map(q=><button key={q} onClick={()=>send(q)} style={{ padding:'6px 12px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.card, color:C.text, fontSize:12, cursor:'pointer' }}>{q}</button>)}
            </div>
          </div>
        )}
        {msgs.map((m,i)=><Bubble key={i} m={m}/>)}
        {loading && <TypingDots label="reading the stars"/>}
        <div ref={endRef}/>
      </div>
      <ChatComposer value={input} onChange={setInput} onSend={()=>send()} loading={loading} att={att} placeholder={placeholder||'Ask a cosmic question…'}/>
    </>
  );

  if (fullscreen) return (
    <div style={{ position:'fixed', inset:0, zIndex:9998, background:C.cream, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'12px 20px', borderBottom:`0.5px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between', background:C.sidebarBg, flexShrink:0 }}>
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:17, color:C.rose }}>✦ {label}</div>
        <button onClick={()=>setFullscreen(false)} style={{ background:'none', border:'none', fontSize:20, color:C.textMuted, cursor:'pointer', lineHeight:1 }}>✕</button>
      </div>
      <div style={{ flex:1, display:'flex', flexDirection:'column', maxWidth:820, width:'100%', margin:'0 auto', minHeight:0 }}>{body(null)}</div>
    </div>
  );

  return (
    <Card style={{ marginTop:20, padding:0, overflow:'hidden' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 16px 0' }}>
        <SectionHeading style={{ marginBottom:0 }}>✦ Ask about your {label.toLowerCase()}</SectionHeading>
        <button onClick={()=>setFullscreen(true)} title="Fullscreen" style={{ background:'none', border:`0.5px solid ${C.border}`, borderRadius:8, padding:'3px 9px', fontSize:13, color:C.textMuted, cursor:'pointer' }}>⤢</button>
      </div>
      {body(320)}
    </Card>
  );
};

const reduceNum = n => {
  let s = parseInt(n);
  while (s > 9 && s !== 11 && s !== 22 && s !== 33) {
    s = String(s).split('').reduce((a,d)=>a+parseInt(d),0);
  }
  return s;
};

  const m=reduceNum(BIRTH_MONTH), d=reduceNum(BIRTH_DAY), y=reduceNum(String(BIRTH_YEAR).split('').reduce((a,x)=>a+parseInt(x),0));
  return reduceNum(m+d+y);
})();

const getCurrentSeason = () => {
  const now = new Date(); const m=now.getMonth()+1, d=now.getDate();
  const signs = [
    {sign:'Capricorn',from:[12,22],to:[1,19]},{sign:'Aquarius',from:[1,20],to:[2,18]},
    {sign:'Pisces',from:[2,19],to:[3,20]},{sign:'Aries',from:[3,21],to:[4,19]},
    {sign:'Taurus',from:[4,20],to:[5,20]},{sign:'Gemini',from:[5,21],to:[6,20]},
    {sign:'Cancer',from:[6,21],to:[7,22]},{sign:'Leo',from:[7,23],to:[8,22]},
    {sign:'Virgo',from:[8,23],to:[9,22]},{sign:'Libra',from:[9,23],to:[10,22]},
    {sign:'Scorpio',from:[10,23],to:[11,21]},{sign:'Sagittarius',from:[11,22],to:[12,21]},
  ];
  const inRange = (fm,to,cm,cd) => {
    const afterStart = cm>fm[0]||(cm===fm[0]&&cd>=fm[1]);
    const beforeEnd  = cm<to[0]||(cm===to[0]&&cd<=to[1]);
    return afterStart && beforeEnd;
  };
  return signs.find(s=>inRange(s.from,s.to,m,d))?.sign || 'Gemini';
};

const elementBalance = () => {
  const pts = [...NATAL.planets.filter(p=>!['North Node','Lilith'].includes(p.name)), { name:'ASC', lon:NATAL.asc }];
  const el = { Fire:[], Earth:[], Air:[], Water:[] }, md = { Cardinal:[], Fixed:[], Mutable:[] };
  pts.forEach(p => { el[SIGN_ELEMENT[signIdx(p.lon)]].push(p.name); md[SIGN_MODE[signIdx(p.lon)]].push(p.name); });
  return { el, md, total: pts.length };
};

  const pGates = new Set(Object.values(P).map(v=>v[0])), dGates = new Set(Object.values(D).map(v=>v[0]));
  const all = new Set([...pGates, ...dGates]);
  const channels = HD_CHANNELS.filter(([a,b])=>all.has(a)&&all.has(b)).map(([a,b,name])=>({ a, b, name, ca:HD_GATE_CENTER[a], cb:HD_GATE_CENTER[b] }));
  const defined = new Set(channels.flatMap(c=>[c.ca,c.cb]));
  const adj = {}; channels.forEach(c=>{ (adj[c.ca]=adj[c.ca]||new Set()).add(c.cb); (adj[c.cb]=adj[c.cb]||new Set()).add(c.ca); });
  const reach = start => { const seen=new Set([start]); const st=[start]; while(st.length){ const x=st.pop(); (adj[x]||[]).forEach(y=>{ if(!seen.has(y)){ seen.add(y); st.push(y); } }); } return seen; };
  const connected = (a,b) => defined.has(a) && reach(a).has(b);
  const motorToThroat = ['Heart','Solar Plexus','Root','Sacral'].some(m=>connected(m,'Throat'));
  const type = defined.has('Sacral') ? (motorToThroat?'Manifesting Generator':'Generator')

  let left = new Set(defined), parts = 0; while(left.size){ const r=reach([...left][0]); r.forEach(x=>left.delete(x)); parts++; }
  const definition = ['No Definition','Single Definition','Split Definition','Triple Split','Quadruple Split'][parts];
  const profile = `${P.Sun[1]}/${D.Sun[1]}`;
  return { P, D, pGates, dGates, all, channels, defined, type, authority, definition, profile,

const BodyGraph = ({ size=320 }) => {
  const W = 300, H = 460;
  const pos = { Head:[150,40], Ajna:[150,110], Throat:[150,182], G:[150,258], Heart:[210,280], Sacral:[150,352], Spleen:[56,340], 'Solar Plexus':[244,340], Root:[150,425] };
  const pairKey = (a,b) => [a,b].sort().join('|');
  const pairCount = {}; HD_CHANNELS.forEach(([a,b])=>{ const k=pairKey(HD_GATE_CENTER[a],HD_GATE_CENTER[b]); pairCount[k]=(pairCount[k]||0)+1; });
  const pairSeen = {};
  const gateColor = g => HD.pGates.has(g) && HD.dGates.has(g) ? 'both' : HD.pGates.has(g) ? 'p' : HD.dGates.has(g) ? 'd' : null;
  const pCol = _dk ? '#f3e6f7' : '#2a1a2a', dCol = '#d0506a';
  const shape = (name) => {
    const [x,y] = pos[name]; const on = HD.defined.has(name);
    const fill = on ? { Head:'#f4d77a', Ajna:'#8bc49a', Throat:'#b88a5e', G:'#f4d77a', Heart:'#e06f6f', Sacral:'#e06f6f', Spleen:'#b88a5e', 'Solar Plexus':'#b88a5e', Root:'#b88a5e' }[name] : (_dk?'#2a2030':'#fff');
    const st = { fill, stroke: on ? 'rgba(0,0,0,.35)' : (_dk?'#6b5870':'#cdb8c6'), strokeWidth:1.2 };
    const s = 26;
    if (name==='Head') return <polygon key={name} points={`${x},${y-s} ${x+s},${y+s*0.7} ${x-s},${y+s*0.7}`} {...st}/>;
    if (name==='Ajna') return <polygon key={name} points={`${x-s},${y-s*0.7} ${x+s},${y-s*0.7} ${x},${y+s}`} {...st}/>;
    if (name==='G') return <polygon key={name} points={`${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}`} {...st}/>;
    if (name==='Heart') return <polygon key={name} points={`${x-14},${y+10} ${x+14},${y+10} ${x+4},${y-16}`} {...st}/>;
    if (name==='Spleen') return <polygon key={name} points={`${x-s},${y-s} ${x+s*0.9},${y} ${x-s},${y+s}`} {...st}/>;
    if (name==='Solar Plexus') return <polygon key={name} points={`${x+s},${y-s} ${x-s*0.9},${y} ${x+s},${y+s}`} {...st}/>;
    return <rect key={name} x={x-s*0.85} y={y-s*0.85} width={s*1.7} height={s*1.7} rx={5} {...st}/>;
  };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxWidth:size, display:'block', margin:'0 auto' }} role="img" aria-label="Human Design bodygraph">
      {HD_CHANNELS.map(([a,b])=>{
        const ca = HD_GATE_CENTER[a], cb = HD_GATE_CENTER[b]; const k = pairKey(ca,cb);
        const idx = pairSeen[k] = (pairSeen[k]===undefined?0:pairSeen[k]+1);
        const n = pairCount[k]; const off = (idx-(n-1)/2)*9;
        const [x1,y1]=pos[ca], [x2,y2]=pos[cb]; const len = Math.hypot(x2-x1,y2-y1)||1;
        const ox = -(y2-y1)/len*off, oy = (x2-x1)/len*off;
        const mx = (x1+x2)/2+ox, my = (y1+y2)/2+oy;
        const seg = (fx,fy,tx,ty,g,key) => {
          const c = gateColor(g); const base = <line key={key+'b'} x1={fx} y1={fy} x2={tx} y2={ty} stroke={_dk?'#3b2f42':'#eadde6'} strokeWidth="6" strokeLinecap="round"/>;

        };
        return <g key={`${a}-${b}`}>{seg(x1+ox,y1+oy,mx,my,a,`${a}-${b}a`)}{seg(mx,my,x2+ox,y2+oy,b,`${a}-${b}b`)}</g>;
      })}
      {Object.keys(pos).map(shape)}
    </svg>
  );
};

const wrap180 = x => ((x+540)%360)-180;
const acgLineLon = (p, angle, lat) => {
  const mc = wrap180(p.ra - NATAL.gst);
  if (angle==='MC') return mc;
  if (angle==='IC') return wrap180(mc+180);
  const cosH = -Math.tan(lat*Math.PI/180) * Math.tan(p.dec*Math.PI/180);
  if (Math.abs(cosH) > 1) return null;
  const H = Math.acos(cosH)*180/Math.PI;
  return wrap180(angle==='AC' ? mc - H : mc + H);
};
const acgNearby = (lat, lon, maxKm=750) => {
  const out = [];
  ACG_PLANETS.forEach(name => { const p = natalP(name); ['AC','DC','MC','IC'].forEach(angle => {
    const l = acgLineLon(p, angle, lat); if (l===null) return;
    const km = Math.abs(wrap180(lon - l)) * 111.32 * Math.cos(lat*Math.PI/180);
    if (km <= maxKm) out.push({ planet:name, angle, km });
  }); });
  return out.sort((a,b)=>a.km-b.km);
};

const loadLand = () => {
  if (!_landPromise) _landPromise = (async () => {
    if (!window.topojson) await new Promise((res, rej) => { const s=document.createElement('script'); s.src=TOPO_SRC; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    const topo = await (await fetch(LAND_SRC)).json();
    return window.topojson.feature(topo, topo.objects.land);

  return _landPromise;
};

const GOAL_CATEGORIES = ['Personal','Business','Health','Financial','Creative','Spiritual','Education'];
const GOAL_CAT_COLORS = {
  Personal:'#F2C4CE', Business:'#E8E0F5', Health:'#C8E6C9',
  Financial:'#FFF9C4', Creative:'#FFE0B2', Spiritual:'#E1BEE7', Education:'#B3E5FC',
};
const GOAL_CAT_INK = { Personal:'#c4607a', Business:'#7b5ea7', Health:'#4f9d8a', Financial:'#b08a2e', Creative:'#d0843e', Spiritual:'#9a5bb0', Education:'#4a8ec4' };
const GOAL_CAT_EMOJI = { Personal:'✦', Business:'💼', Health:'🌿', Financial:'💰', Creative:'🎨', Spiritual:'🔮', Education:'📚' };

// Progress comes from milestones if there are any. Otherwise a percentage you
// set by hand wins (older goals with a saved % count as hand-set); failing that,
// linked tasks fill it in.
const goalIsManual = g => !(g.milestones||[]).length && (g.manualProgress===true || (g.manualProgress===undefined && (g.progress||0)>0));
const goalProgress = (g, tasks) => {
  const ms = g.milestones||[];
  if (ms.length) return Math.round(ms.filter(m=>m.done).length/ms.length*100);
  if (goalIsManual(g)) return Math.max(0, Math.min(100, g.progress||0));
  const linked = tasks.filter(t=>t.goalId===g.id);
  if (linked.length) return Math.round(linked.filter(t=>t.done).length/linked.length*100);
  return Math.max(0, Math.min(100, g.progress||0));
};
const goalPeriodLabel = g => {
  const pt = g.periodType||'yearly', v = g.periodValue||'';
  if (pt==='monthly') { const [yy,mm] = v.split('-'); return `${MONTHS[parseInt(mm)-1]||''} ${yy||''}`.trim(); }
  if (pt==='quarterly') { const [yy,q] = v.split('-'); return `${q} ${yy}`; }
  return v || String(new Date().getFullYear());
};

const ProgressRing = ({ pct, size=54, stroke=5, color }) => {
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{ flexShrink:0 }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={`${C.pink}90`} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct>=100?'#4f9d8a':(color||C.rose)} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c*(1-pct/100)} transform={`rotate(-90 ${size/2} ${size/2})`} style={{ transition:'stroke-dashoffset .5s' }}/>
      <text x="50%" y="50%" textAnchor="middle" dominantBaseline="central" fontSize={size*0.25} fontWeight="600" fill={C.text}>{pct>=100?'✓':`${pct}%`}</text>
    </svg>
  );
};
