  var asApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;


/* ── Talking to Claude ───────────────────────────────────────────────
   Every AI feature goes through callClaude, so the model lives in one
   place. Claude Opus 5 thinks before it answers, and its reply can start
   with a thinking block, so we read the text blocks rather than
   content[0]. Sonnet 5 is plenty for chat, captions and readings and costs
   well under half of Opus 5. If AI_MODEL is ever switched to Opus 5 or
   Fable, server-side fallbacks retry a declined request on another model;
   if an account rejects that option, we retry once without it. */
const AI_MODEL = 'claude-sonnet-5';
const callClaude = async ({ system, messages, maxTokens=8000, effort='medium' }) => {
  const key = localStorage.getItem('nylaos_api_key');
  if (!key) throw new Error('Add your Anthropic API key in Settings → API Keys first.');
  const send = async (withFallback) => {
    const headers = { 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' };
    const body = { model:AI_MODEL, max_tokens:maxTokens, system, messages, output_config:{ effort } };
    if (withFallback) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
    return fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers, body:JSON.stringify(body) });
  };
  // Server-side fallbacks only apply to the Opus 5 / Fable tier.
  const fallbackCapable = /opus-5|fable/.test(AI_MODEL);
  let res = await send(fallbackCapable);
  if (fallbackCapable && res.status === 400) {
    const err = await res.clone().json().catch(()=>({}));
    if (/fallback|beta/i.test(err.error?.message||'')) res = await send(false);
  }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) {
    const msg = data.error?.message || `HTTP ${res.status}`;
    if (res.status===401) throw new Error('That API key was rejected — check it in Settings → API Keys.');
    if (res.status===429) throw new Error('Rate limited for a moment — try again in a few seconds.');
    throw new Error(msg);
  }
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  if (data.stop_reason === 'refusal' && !text) throw new Error('Claude declined to answer that one.');
  return text || '(no reply)';
};

/* ── Toast Notification System ─────────────────────────────────────── */
let _toastListeners = [];
const toast = (message, type='success', duration=2800) => {
  const id = Date.now() + Math.random();
  _toastListeners.forEach(fn => fn({ id, message, type, duration }));
};
const ToastContainer = () => {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    const handler = t => {
      setToasts(prev => [...prev, { ...t, exiting: false }]);
      setTimeout(() => setToasts(prev => prev.map(x => x.id === t.id ? { ...x, exiting: true } : x)), t.duration - 400);
      setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t.id)), t.duration);
    };
    _toastListeners.push(handler);
    return () => { _toastListeners = _toastListeners.filter(fn => fn !== handler); };
  }, []);
  if (!toasts.length) return null;
  const icons = { success: '✓', error: '✕', info: '✦', sync: '↻' };
  const colors = { success: '#3a8a4a', error: '#c44060', info: '#9080d8', sync: '#4285f4' };
  return React.createElement('div', { style: { position: 'fixed', bottom: 90, left: '50%', transform: 'translateX(-50%)', zIndex: 10000, display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'center', pointerEvents: 'none' } },
    toasts.map(t => React.createElement('div', { key: t.id, style: {
      padding: '10px 20px', borderRadius: 14, background: _dk ? '#2a1e28' : '#fffcfd',
      border: `0.5px solid ${colors[t.type]}40`, boxShadow: `0 6px 24px ${colors[t.type]}30, 0 2px 8px rgba(0,0,0,0.08)`,
      display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, color: _dk ? '#f0e0e8' : '#401828',
      animation: t.exiting ? 'toastOut 0.35s ease forwards' : 'toastIn 0.3s ease', pointerEvents: 'auto',
    } },
      React.createElement('span', { style: { width: 22, height: 22, borderRadius: '50%', background: colors[t.type], color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, flexShrink: 0 } }, icons[t.type]),
      t.message
    ))
  );
};

/* ── Firebase Cross-Device Sync ──────────────────────────────────────
   Fill in FB_CONFIG with your Firebase project details to enable sync.
   Steps: console.firebase.google.com → New project → Add web app →
   Copy config below. Then enable Firestore + Google Sign-In in Firebase.
──────────────────────────────────────────────────────────────────── */
const FB_CONFIG = {
  apiKey:            "AIzaSyCJPO5JqrILVHivCUkRp0uSmljgDGVBEDA",
  authDomain:        "nyla-os.firebaseapp.com",
  projectId:         "nyla-os",
  storageBucket:     "nyla-os.firebasestorage.app",
  messagingSenderId: "437157047081",
  appId:             "1:437157047081:web:67210561739a85d0f8a538"
};

// Raw localStorage.setItem (before our interception, used internally)
const _rawLS = localStorage.setItem.bind(localStorage);
let _fbAuth=null, _fbDb=null, _fbUser=null, _syncTimer=null;
const _syncSubs=new Set();
let _syncState={status:'idle',user:null};
const _setSyncState=s=>{_syncState=s;_syncSubs.forEach(fn=>fn(s));};
// Prevents double-reload when _cloudLoad and onSnapshot both fire on sign-in
let _reloadPending=false;
// True whenever this device has local writes that haven't been confirmed pushed to the cloud yet.
// Used to avoid silently overwriting in-progress local edits with an older/racing remote save, and
// persisted to localStorage (via _rawLS, so it doesn't re-trigger itself) so a refresh/reopen can
// tell whether the previous session ended before its changes finished syncing to the cloud.
let _dirty = localStorage.getItem('nylaos_dirty_flag')==='true';
const _setDirty = v => { _dirty=v; _rawLS('nylaos_dirty_flag', v?'true':'false'); };
let _pendingConflict=null; // {snapshot, savedAt, user} — set instead of auto-applying when local is dirty

const useSyncStatus=()=>{
  const [s,setS]=React.useState(_syncState);
  React.useEffect(()=>{_syncSubs.add(setS);return()=>_syncSubs.delete(setS);},[]);
  return s;
};

const useOnlineStatus=()=>{
  const [online,setOnline]=React.useState(navigator.onLine);
  React.useEffect(()=>{
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener('online',on); window.addEventListener('offline',off);
    return ()=>{window.removeEventListener('online',on);window.removeEventListener('offline',off);};
  },[]);
  return online;
};

async function _cloudLoad(force){
  if(!_fbUser||!_fbDb) return;
  _setSyncState({status:'syncing',user:_fbUser});
  try{
    const doc=await _fbDb.collection('nylaos').doc(_fbUser.uid).get();
    if(doc.exists){
      const {snapshot,savedAt}=doc.data();
      const localTs=parseInt(localStorage.getItem('nylaos_cloud_ts')||'0');
      if(snapshot&&savedAt>localTs){ _maybeApplyOrConflict(snapshot,savedAt,_fbUser,force); return; }
    }
    _setSyncState({status:'synced',user:_fbUser});
  }catch(e){console.warn('Cloud load:',e);_setSyncState({status:'error',user:_fbUser});}
}

// Guards against silently overwriting local edits that haven't been pushed yet.
// If this device has unsynced local changes (_dirty) and isn't explicitly forcing
// a pull, surface a Conflict state instead of blindly applying the remote snapshot
// and reloading — that silent-overwrite path was a real cause of "notes disappearing".
function _maybeApplyOrConflict(snapshot, savedAt, user, force){
  if(!force && _dirty){
    _pendingConflict={snapshot,savedAt,user};
    _setSyncState({status:'conflict',user});
    if(typeof toast==='function') toast('Sync conflict — another device has changes. Click "Conflict" (top right) before editing more.','error',6000);
    return;
  }
  _applyCloudSnapshot(snapshot,savedAt,user);
}

function _applyCloudSnapshot(snapshot, savedAt, user){
  if(_reloadPending) return;
  const data=JSON.parse(snapshot);
  Object.entries(data).forEach(([k,v])=>{
    if(!k.startsWith('nylaos_')||k==='nylaos_cloud_ts') return;
    // Moodboard pins and the local auto-backup never leave this device (see _buildSyncSnapshot) —
    // never let a pull overwrite the local copy, including any stale one from before this fix.
    if(k==='nylaos_moodboard'||k==='nylaos_auto_bak') return;
    // Brand mood images are stripped before upload, so the incoming value has an empty moodImages —
    // merge back in whatever this device already has instead of wiping it.
    if(k.startsWith('nylaos_brand_')){
      try{
        const incoming=JSON.parse(v);
        const localRaw=localStorage.getItem(k);
        const local=localRaw?JSON.parse(localRaw):{};
        _rawLS(k, JSON.stringify({...incoming, moodImages:local.moodImages||[]}));
        return;
      }catch(e){}
    }
    _rawLS(k,v);
  });
  _rawLS('nylaos_cloud_ts',String(savedAt));
  _setDirty(false); _pendingConflict=null;
  _setSyncState({status:'synced',user});
  _reloadPending=true;
  window.location.reload();
}

// Conflict resolution: user explicitly chooses which version wins.
function resolveConflictKeepLocal(){
  if(!_pendingConflict) return;
  _pendingConflict=null;
  cloudSave();
}
function resolveConflictUseCloud(){
  if(!_pendingConflict) return;
  const {snapshot,savedAt,user}=_pendingConflict;
  _applyCloudSnapshot(snapshot,savedAt,user);
}

// Firestore hard-caps a document at ~1,048,487 bytes. Moodboard pins and Brand mood-board
// images are stored as base64 data URLs directly in localStorage, so a handful of photos can
// easily blow past that on their own. Both are excluded/stripped from what gets synced (see
// _buildSyncSnapshot and _applyCloudSnapshot) so they stay device-local instead of blocking
// sync of everything else — the size check below is just a safety net for anything else huge.
const _FIRESTORE_DOC_LIMIT = 900000; // safety margin under the real ~1,048,487 byte cap
let _lastSyncFailReason = null; // avoid re-toasting the same diagnosis on every keystroke-triggered retry

// Builds the outgoing sync payload, leaving heavy base64 images (Moodboard pins, Brand mood
// images) out of what's uploaded — they never leave this device. _applyCloudSnapshot mirrors
// this by never letting a pull overwrite local images with the (necessarily empty) synced copy.
function _buildSyncSnapshot(){
  const snap={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith('nylaos_')||k==='nylaos_cloud_ts') continue;
    // nylaos_auto_bak is itself a full snapshot of everything else, taken on every page load —
    // including it would roughly double the payload and drag in stale copies of old images.
    if(k==='nylaos_moodboard'||k==='nylaos_auto_bak') continue;
    if(k.startsWith('nylaos_brand_')){
      try{
        const b=JSON.parse(localStorage.getItem(k));
        if(b&&b.moodImages&&b.moodImages.length){ snap[k]=JSON.stringify({...b,moodImages:[]}); continue; }
      }catch(e){}
    }
    snap[k]=localStorage.getItem(k);
  }
  return snap;
}

async function cloudSave(){
  if(!_fbUser||!_fbDb) return;
  // Never push while a conflict is unresolved — the local copy is known-stale relative to
  // the cloud at this point, so an auto-save here would silently bury the other device's
  // changes under stale data the instant this device makes any further edit.
  if(_pendingConflict){ _setSyncState({status:'conflict',user:_fbUser}); return; }
  _setSyncState({status:'syncing',user:_fbUser});
  try{
    const snap=_buildSyncSnapshot();
    const snapshot=JSON.stringify(snap);
    const sizeBytes=new Blob([snapshot]).size;
    if(sizeBytes>_FIRESTORE_DOC_LIMIT){
      _setSyncState({status:'error',user:_fbUser});
      const reason='oversize';
      if(_lastSyncFailReason!==reason && typeof toast==='function'){
        toast(`Sync failed — your data (${(sizeBytes/1024/1024).toFixed(1)}MB) is too large for cloud sync, even with images excluded. Try trimming Notebook pages or Tasks.`,'error',6000);
      }
      _lastSyncFailReason=reason;
      return;
    }
    const savedAt=Date.now();
    await _fbDb.collection('nylaos').doc(_fbUser.uid).set({
      snapshot,savedAt,email:_fbUser.email||''
    });
    _rawLS('nylaos_cloud_ts',String(savedAt));
    _setDirty(false);
    _setSyncState({status:'synced',user:_fbUser});
    _lastSyncFailReason=null;
    if(typeof toast==='function') toast('Synced to cloud','sync',2000);
  }catch(e){
    console.warn('Cloud save:',e);
    _setSyncState({status:'error',user:_fbUser});
    const reason=e&&e.code?e.code:'unknown';
    if(_lastSyncFailReason!==reason && typeof toast==='function'){
      toast(e&&e.code==='permission-denied' ? 'Sync failed — signed out or not authorized. Try signing in again.'
        : e&&e.code==='resource-exhausted' ? 'Sync failed — your data is too large for cloud sync.'
        : `Sync failed${e&&e.message?': '+e.message:''}`, 'error', 5000);
    }
    _lastSyncFailReason=reason;
  }
}

// Intercept all localStorage writes → auto-sync 2.5s after last change
let _nbFileTimer=null, _vaultTimer=null;
localStorage.setItem=function(key,value){
  _rawLS(key,value);
  if(key&&key.startsWith('nylaos_')&&key!=='nylaos_cloud_ts'&&key!=='nylaos_dirty_flag'){
    _setDirty(true);
    if(_fbUser){
      if(_syncTimer) clearTimeout(_syncTimer);
      _syncTimer=setTimeout(cloudSave,2500);
    }
  }
  if(key==='nylaos_nb_pages'){
    if(_nbFileTimer) clearTimeout(_nbFileTimer);
    _nbFileTimer=setTimeout(_writeNotebookFile,1500);
    if(window._backupNotebooks) window._backupNotebooks();
  }
  // Notebook, ideas and goals are the three things that get written out as
  // Obsidian notes, so any of them changing schedules a quiet vault sync.
  if(key==='nylaos_nb_pages'||key==='nylaos_nb_folders'||key==='nylaos_ideas'||key==='nylaos_goals'){
    if(_vaultTimer) clearTimeout(_vaultTimer);
    _vaultTimer=setTimeout(()=>{ if(window.Vault&&window.Vault.linked()) window.Vault.syncAll({quiet:true}); },6000);
  }
};

/* ── Local file auto-save for Notebook ─────────────────────────── */
(function(){
  const _idbOpen=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('nylaos_prefs',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
  const _idbGet=async k=>{const db=await _idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const r=t.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e.target.error);});};
  const _idbSet=async(k,v)=>{const db=await _idbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=e=>rej(e.target.error);});};

  window._nbFileHandle=null;

  // Load stored handle on boot and verify permission is still granted
  _idbGet('nb_file_handle').then(async h=>{
    if(!h) return;
    try{
      const p=await h.queryPermission({mode:'readwrite'});
      if(p==='granted') window._nbFileHandle=h;
    }catch(e){}
  });

  window.pickNotebookFile=async()=>{
    if(!window.showSaveFilePicker){alert('Auto-save requires Chrome or Edge.');return;}
    try{
      const h=await window.showSaveFilePicker({
        suggestedName:'nyla os notebooks.md',
        types:[{description:'Markdown',accept:{'text/markdown':['.md']}},{description:'Text file',accept:{'text/plain':['.txt']}}]
      });
      window._nbFileHandle=h;
      await _idbSet('nb_file_handle',h);
      await _writeNotebookFile();
    }catch(e){if(e.name!=='AbortError')console.warn('Notebook file pick:',e);}
  };

  window.unlinkNotebookFile=async()=>{
    window._nbFileHandle=null;
    try{await _idbSet('nb_file_handle',null);}catch(e){}
  };
})();

/* ── Obsidian vault bridge ───────────────────────────────────────────
   Nyla OS writes durable thinking into an Obsidian vault folder and reads
   notes back out as context for the AI. The browser can only touch a folder
   the user hands it: showDirectoryPicker returns a handle, which persists in
   IndexedDB so the link survives reloads. Chrome/Edge desktop only.

   Everything Nyla OS writes lives under ONE folder (VAULT_OUT) so the sync
   can clean up after itself without ever touching a note she wrote herself. */
const VAULT_OUT = '06 From Nyla OS';

(function(){
  const _vOpen=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('nylaos_prefs',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
  const _vGet=async k=>{const db=await _vOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readonly');const r=t.objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e.target.error);});};
  const _vSet=async(k,v)=>{const db=await _vOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=e=>rej(e.target.error);});};

  const SKIP_DIRS=new Set(['.obsidian','.trash','.git','node_modules','.smart-env']);

  // Obsidian forbids these in file names; a note titled "Q4: plan / v2" must
  // still round-trip to something openable.
  const safeName = s => String(s||'').replace(/[\\/:#^\[\]|?*<>"]+/g,'-').replace(/\s+/g,' ').replace(/^[.\s]+|[.\s]+$/g,'').slice(0,80) || 'Untitled';
  const ymd = d => { const t=d?new Date(d):new Date(); return isNaN(t)?'':`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };

  /* Some notebook pages are a keyring — "API Keys", "Passwords". Writing those
     into the vault puts live credentials in plaintext inside iCloud, where they
     sync to every signed-in device and ride along in any backup or screenshot
     of the vault. The page stays in Nyla OS; it just never crosses over.
     Matched on the title, and on the shape of a real key in the body, because
     a page called "Setup notes" can hold one just as easily. */
  // "logins" is anchored: a page called "Logins" is a keyring, but "Login flow
  // design" is a design note and was getting held back with it.
  const SECRET_TITLE = /\b(api ?keys?|passwords?|passcodes?|credentials?|secrets?|seed phrase|recovery codes?)\b/i;
  const SECRET_TITLE_EXACT = /^\s*(my )?logins?\s*$/i;
  const SECRET_BODY  = /\b(sk-ant-[A-Za-z0-9_-]{8}|sk_live_[A-Za-z0-9]{8}|sk_test_[A-Za-z0-9]{8}|rk_live_[A-Za-z0-9]{8}|AIza[A-Za-z0-9_-]{20}|ghp_[A-Za-z0-9]{20}|xox[baprs]-[A-Za-z0-9-]{10}|-----BEGIN [A-Z ]*PRIVATE KEY-----)/;
  const holdsSecrets = (name, body) => SECRET_TITLE.test(String(name||'')) || SECRET_TITLE_EXACT.test(String(name||'')) || SECRET_BODY.test(String(body||''));

  /* Notebook pages are contenteditable HTML. Stripping to plain text (what the
     old single-file export did) threw away every heading, list and link, so
     this keeps the structure as real markdown instead. */
  function vaultHtmlToMd(html){
    const root=document.createElement('div');
    root.innerHTML=String(html||'');
    root.querySelectorAll('script,style').forEach(n=>n.remove());
    const inline=node=>Array.from(node.childNodes).map(n=>{
      if(n.nodeType===3) return n.textContent.replace(/\s+/g,' ');
      if(n.nodeType!==1) return '';
      const tag=n.tagName.toLowerCase();
      if(tag==='br') return '\n';
      if(tag==='input') return n.type==='checkbox'?(n.checked?'[x] ':'[ ] '):'';
      if(tag==='img') return n.getAttribute('src')&&!/^data:/.test(n.getAttribute('src'))?`![](${n.getAttribute('src')})`:'';
      const inner=inline(n);
      if(tag==='strong'||tag==='b') return inner.trim()?`**${inner.trim()}**`:'';
      if(tag==='em'||tag==='i') return inner.trim()?`*${inner.trim()}*`:'';
      if(tag==='s'||tag==='strike'||tag==='del') return inner.trim()?`~~${inner.trim()}~~`:'';
      if(tag==='code') return '`'+n.textContent+'`';
      if(tag==='a'&&/^https?:/.test(n.getAttribute('href')||'')) return `[${inner.trim()||n.getAttribute('href')}](${n.getAttribute('href')})`;
      return inner;
    }).join('');
    const out=[];
    const INLINE=new Set(['br','strong','b','em','i','code','a','span','u','s','strike','del','small','sup','sub','font','input','img','label']);
    const walk=node=>{
      let buf='';
      const flush=()=>{const t=buf.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').trim();if(t)out.push(t);buf='';};
      Array.from(node.childNodes).forEach(n=>{
        if(n.nodeType===3){buf+=n.textContent.replace(/\s+/g,' ');return;}
        if(n.nodeType!==1) return;
        const tag=n.tagName.toLowerCase();
        if(INLINE.has(tag)){buf+=inline({childNodes:[n]});return;}
        flush();
        if(/^h[1-6]$/.test(tag)){const t=inline(n).trim();if(t)out.push('#'.repeat(+tag[1])+' '+t);return;}
        if(tag==='p'||tag==='div'){const t=inline(n).replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n').trim();
          // A div holding block children (a list, a table) has to recurse, not flatten.
          if(Array.from(n.children).some(c=>!INLINE.has(c.tagName.toLowerCase()))){walk(n);return;}
          if(t)out.push(t);return;}
        if(tag==='ul'||tag==='ol'){out.push(Array.from(n.children).filter(li=>li.tagName==='LI').map((li,k)=>{
          const t=inline(li).trim();
          const box=/^\[[ x]\] /.test(t)?'':'';
          return `${tag==='ol'?(k+1)+'.':'-'} ${box}${t}`;
        }).join('\n'));return;}
        if(tag==='li'){out.push('- '+inline(n).trim());return;}
        if(tag==='table'){
          const rows=Array.from(n.querySelectorAll('tr')).map(tr=>Array.from(tr.children).map(td=>inline(td).trim().replace(/\|/g,'/')));
          if(rows.length) out.push([`| ${rows[0].join(' | ')} |`,`| ${rows[0].map(()=>'---').join(' | ')} |`,...rows.slice(1).map(r=>`| ${r.join(' | ')} |`)].join('\n'));
          return;}
        if(tag==='hr'){out.push('---');return;}
        if(tag==='blockquote'){out.push(inline(n).trim().split('\n').map(l=>'> '+l).join('\n'));return;}
        if(tag==='pre'){out.push('```\n'+n.textContent+'\n```');return;}
        walk(n);
      });
      flush();
    };
    walk(root);
    return out.join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
  }

  const Vault = {
    handle: null,
    name: '',
    busy: false,
    lastError: '',

    supported(){ return typeof window.showDirectoryPicker==='function'; },
    linked(){ return !!Vault.handle; },

    async pick(){
      if(!Vault.supported()){ Vault.lastError='Linking a vault folder needs Chrome or Edge on a computer.'; return false; }
      try{
        const h=await window.showDirectoryPicker({mode:'readwrite',id:'nylaos-vault'});
        Vault.handle=h; Vault.name=h.name;
        await _vSet('vault_dir_handle',h);
        localStorage.setItem('nylaos_vault_name',h.name);
        window.dispatchEvent(new CustomEvent('vault-changed'));
        return true;
      }catch(e){ if(e.name!=='AbortError'){ Vault.lastError=e.message||String(e); } return false; }
    },

    async unlink(){
      Vault.handle=null; Vault.name='';
      try{ await _vSet('vault_dir_handle',null); }catch(e){}
      localStorage.removeItem('nylaos_vault_name');
      window.dispatchEvent(new CustomEvent('vault-changed'));
    },

    // Permission can lapse between sessions; ask again rather than failing silently.
    async ready(interactive=false){
      if(!Vault.handle) return false;
      try{
        let p=await Vault.handle.queryPermission({mode:'readwrite'});
        if(p!=='granted'&&interactive) p=await Vault.handle.requestPermission({mode:'readwrite'});
        return p==='granted';
      }catch(e){ return false; }
    },

    async dir(path,create=false){
      let d=Vault.handle;
      for(const seg of String(path||'').split('/').filter(Boolean)) d=await d.getDirectoryHandle(seg,{create});
      return d;
    },

    async write(relPath,text){
      const parts=relPath.split('/');
      const file=parts.pop();
      const d=await Vault.dir(parts.join('/'),true);
      const fh=await d.getFileHandle(file,{create:true});
      const w=await fh.createWritable();
      await w.write(text);
      await w.close();
    },

    async read(relPath){
      const parts=relPath.split('/');
      const file=parts.pop();
      const d=await Vault.dir(parts.join('/'),false);
      const fh=await d.getFileHandle(file);
      return (await fh.getFile()).text();
    },

    async remove(relPath){
      try{
        const parts=relPath.split('/');
        const file=parts.pop();
        const d=await Vault.dir(parts.join('/'),false);
        await d.removeEntry(file);
      }catch(e){}
    },

    /* Walk the whole vault once and keep a light index in memory. Contents are
       read lazily — a vault of a few hundred notes is fine, and the cap stops a
       huge one from locking the page up. */
    _index: null,
    async index(force){
      if(Vault._index&&!force) return Vault._index;
      if(!await Vault.ready()) return [];
      const out=[];
      const walk=async(dir,prefix,depth)=>{
        if(depth>8||out.length>2000) return;
        for await (const [name,h] of dir.entries()){
          if(name.startsWith('.')||SKIP_DIRS.has(name)) continue;
          const rel=prefix?`${prefix}/${name}`:name;
          if(h.kind==='directory'){ await walk(h,rel,depth+1); }
          else if(/\.md$/i.test(name)){
            let size=0,mtime=0;
            try{ const f=await h.getFile(); size=f.size; mtime=f.lastModified; }catch(e){}
            out.push({path:rel,name:name.replace(/\.md$/i,''),dir:prefix||'',size,mtime});
          }
        }
      };
      try{ await walk(Vault.handle,'',0); }catch(e){ Vault.lastError=e.message||String(e); }
      out.sort((a,b)=>a.path.localeCompare(b.path));
      Vault._index=out;
      localStorage.setItem('nylaos_vault_index',JSON.stringify({at:Date.now(),count:out.length}));
      return out;
    },

    async search(q,limit=40){
      const needle=String(q||'').toLowerCase().trim();
      if(!needle) return [];
      const idx=await Vault.index();
      const hits=[];
      for(const n of idx){
        if(hits.length>=limit) break;
        const inTitle=n.name.toLowerCase().includes(needle)||n.dir.toLowerCase().includes(needle);
        let snippet='';
        if(n.size<400000){
          try{
            // Frontmatter sits at the top of every note, so a naive snippet around
            // the first hit shows tags and dates instead of the sentence she wants.
            const txt=(await Vault.read(n.path)).replace(/^---\n[\s\S]*?\n---\n?/,'');
            const i=txt.toLowerCase().indexOf(needle);
            if(i>=0) snippet=txt.slice(Math.max(0,i-90),i+150).replace(/\s+/g,' ').trim();
            if(i<0&&!inTitle) continue;
          }catch(e){ if(!inTitle) continue; }
        } else if(!inTitle) continue;
        hits.push({...n,snippet});
      }
      return hits;
    },

    /* Notes Nyla pins are cached in localStorage so buildAgentContext — which is
       synchronous — can reach them without waiting on the disk. */
    pins(){ try{ return JSON.parse(localStorage.getItem('nylaos_vault_pins')||'[]'); }catch(e){ return []; } },
    isPinned(p){ return Vault.pins().includes(p); },
    async pin(path){
      const pins=Vault.pins().filter(p=>p!==path);
      pins.unshift(path);
      const kept=pins.slice(0,10);
      localStorage.setItem('nylaos_vault_pins',JSON.stringify(kept));
      await Vault.refreshPinCache();
      window.dispatchEvent(new CustomEvent('vault-changed'));
    },
    async unpin(path){
      localStorage.setItem('nylaos_vault_pins',JSON.stringify(Vault.pins().filter(p=>p!==path)));
      await Vault.refreshPinCache();
      window.dispatchEvent(new CustomEvent('vault-changed'));
    },
    async refreshPinCache(){
      if(!await Vault.ready()) return;
      const cache={};
      for(const p of Vault.pins()){
        try{ cache[p]=(await Vault.read(p)).slice(0,4000); }catch(e){}
      }
      localStorage.setItem('nylaos_vault_pin_cache',JSON.stringify(cache));
    },
    pinCache(){ try{ return JSON.parse(localStorage.getItem('nylaos_vault_pin_cache')||'{}'); }catch(e){ return {}; } },

    /* ── Writing Nyla OS content out as notes ───────────────────── */
    manifest(){ try{ return JSON.parse(localStorage.getItem('nylaos_vault_manifest')||'[]'); }catch(e){ return []; } },

    async syncAll(opts){
      const quiet=opts&&opts.quiet;
      if(Vault.busy) return null;
      if(!await Vault.ready(!quiet)) return null;
      Vault.busy=true;
      const written=[];
      try{
        const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
        const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
        const fname={};
        folders.forEach(f=>{ fname[f.id]=safeName(f.name); });
        const used=new Set();

        let heldBack=0;
        for(const p of pages){
          const rawBody=_htmlToText(p.content||'');
          if(holdsSecrets(p.name,rawBody)){ heldBack++; continue; }
          const folder=fname[p.folderId]||'Unfiled';
          let base=safeName(p.name||'Untitled');
          let rel=`${VAULT_OUT}/Notebook/${folder}/${base}.md`;
          // Two pages can share a title; keep both instead of overwriting one.
          let n=2;
          while(used.has(rel)){ rel=`${VAULT_OUT}/Notebook/${folder}/${base} ${n++}.md`; }
          used.add(rel);
          const body=vaultHtmlToMd(p.content||'');
          const md=`---\ntags: [nyla-os, notebook]\nsource: nyla-os\nfolder: ${folder}\nupdated: ${ymd(p.updated)||ymd()}\n---\n\n# ${p.name||'Untitled'}\n\n${body}\n`;
          await Vault.write(rel,md);
          written.push(rel);
        }

        const ideas=JSON.parse(localStorage.getItem('nylaos_ideas')||'[]');
        if(ideas.length){
          const cats={};
          ideas.forEach(i=>{ const c=i.category||'uncategorised'; (cats[c]=cats[c]||[]).push(i); });
          let md=`---\ntags: [nyla-os, ideas]\nsource: nyla-os\nupdated: ${ymd()}\n---\n\n# Idea Bank\n\nCaptured in Nyla OS. Anything here that survives a few weeks deserves a real note of its own.\n`;
          Object.keys(cats).sort().forEach(c=>{
            md+=`\n## ${c[0].toUpperCase()+c.slice(1)}\n\n`;
            cats[c].forEach(i=>{
              md+=`### ${i.title||'Untitled idea'}\n`;
              if(i.venture) md+=`*${i.venture}*\n`;
              const body=vaultHtmlToMd(i.content||i.description||'');
              if(body) md+=`\n${body}\n`;
              md+='\n';
            });
          });
          await Vault.write(`${VAULT_OUT}/Idea Bank.md`,md);
          written.push(`${VAULT_OUT}/Idea Bank.md`);
        }

        const goals=JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
        if(goals.length){
          let md=`---\ntags: [nyla-os, goals, snapshot]\nsource: nyla-os\nupdated: ${ymd()}\n---\n\n# Goals snapshot\n\nWhere the goals in Nyla OS stood on ${ymd()}. A snapshot, not a live view — the live one is in the app.\n\n| Goal | Progress | Period | Venture |\n|---|---|---|---|\n`;
          goals.forEach(g=>{
            md+=`| ${String(g.title||'').replace(/\|/g,'/')} | ${g.progress||0}% | ${g.periodType||''} | ${g.venture||''} |\n`;
          });
          const withNotes=goals.filter(g=>g.description);
          if(withNotes.length){
            md+=`\n## Detail\n`;
            withNotes.forEach(g=>{ md+=`\n### ${g.title}\n\n${vaultHtmlToMd(g.description)}\n`; });
          }
          await Vault.write(`${VAULT_OUT}/Goals Snapshot.md`,md);
          written.push(`${VAULT_OUT}/Goals Snapshot.md`);
        }

        /* A machine-readable snapshot next to the notes. Nyla OS data lives in
           localStorage, which nothing outside this browser can read — so a
           Claude session on the Mac has no way to see any of it. This file is
           that bridge. Dot-prefixed, so Obsidian ignores it.
           Deliberately excludes the period and cycle logs: nothing about her
           body goes into a file written for something else to read. */
        const snapshot = {
          app: 'nyla-os',
          writtenAt: new Date().toISOString(),
          note: 'Written by Nyla OS when the vault sync runs. As fresh as the last time she used the app.',
          profile: JSON.parse(localStorage.getItem('nylaos_profile') || '{"name":"Nyla"}'),
          goals: (JSON.parse(localStorage.getItem('nylaos_goals') || '[]')).map(g => ({
            title: g.title, progress: g.progress || 0, periodType: g.periodType || '', venture: g.venture || '',
            description: _htmlToText(g.description || '').slice(0, 600),
            milestones: (g.milestones || []).map(m => ({ title: m.title, done: !!m.done })),
          })),
          tasks: (() => {
            const all = JSON.parse(localStorage.getItem('nylaos_tasks') || '[]');
            const cut = Date.now() - 45 * 864e5;
            return {
              open: all.filter(t => !t.done).map(t => ({ text: t.text, due: t.calendarDate || null, venture: t.venture || '', priority: t.priority || '', projectId: t.projectId || null })),
              doneRecently: all.filter(t => t.done && t.doneAt && new Date(t.doneAt).getTime() > cut).map(t => ({ text: t.text, doneAt: t.doneAt })),
            };
          })(),
          ideas: (JSON.parse(localStorage.getItem('nylaos_ideas') || '[]')).map(i => ({
            title: i.title, category: i.category || '', venture: i.venture || '', body: vaultHtmlToMd(i.content || '').slice(0, 600),
          })),
          books: (JSON.parse(localStorage.getItem('nylaos_books') || '[]')).map(b => ({ title: b.title, author: b.author || '', status: b.status || '', rating: b.rating || null, finishedAt: b.finishedAt || null })),
          social: (JSON.parse(localStorage.getItem('nylaos_social_accounts') || '[]')).map(a => ({ platform: a.platform || '', handle: a.handle || '', followers: a.followers || 0, goal: a.goal || null })),
          notebook: pages.filter(p => !holdsSecrets(p.name, _htmlToText(p.content || ''))).map(p => ({ folder: fname[p.folderId] || 'Unfiled', name: p.name || 'Untitled', updated: p.updated || null, chars: _htmlToText(p.content || '').length })),
          vaultFolder: VAULT_OUT,
        };
        await Vault.write(`${VAULT_OUT}/.snapshot.json`, JSON.stringify(snapshot, null, 2));
        written.push(`${VAULT_OUT}/.snapshot.json`);

        // An index note so the folder has a front door in the graph.
        const link=p=>`[[${p.split('/').pop().replace(/\.md$/,'')}]]`;
        let idx=`---\ntags: [nyla-os, meta]\nsource: nyla-os\nupdated: ${ymd()}\n---\n\n# From Nyla OS\n\nWritten by Nyla OS on ${new Date().toLocaleString()}. **Edits made here are overwritten on the next sync** — if a note matters, move it out of this folder.\n\n`;
        const byFolder={};
        written.filter(w=>w.includes('/Notebook/')).forEach(w=>{ const f=w.split('/')[2]; (byFolder[f]=byFolder[f]||[]).push(w); });
        Object.keys(byFolder).sort().forEach(f=>{
          idx+=`## ${f}\n\n`;
          byFolder[f].forEach(w=>{ idx+=`- ${link(w)}\n`; });
          idx+='\n';
        });
        if(heldBack) idx+=`> [!warning] ${heldBack} page${heldBack===1?'' : 's'} held back\n> ${heldBack===1?'A page that looks like it holds credentials was' : 'Pages that look like they hold credentials were'} not written here. ${heldBack===1?'It is' : 'They are'} still in Nyla OS — keys do not belong in a folder that syncs to iCloud.\n\n`;
        if(written.some(w=>w.endsWith('Idea Bank.md'))) idx+=`## Other\n\n- [[Idea Bank]]\n`;
        if(written.some(w=>w.endsWith('Goals Snapshot.md'))) idx+=`- [[Goals Snapshot]]\n`;
        await Vault.write(`${VAULT_OUT}/From Nyla OS.md`,idx);
        written.push(`${VAULT_OUT}/From Nyla OS.md`);

        // Clear out notes we wrote last time that no longer exist in the app.
        // Scoped to our own manifest, so a note Nyla wrote is never at risk.
        const gone=Vault.manifest().filter(p=>!written.includes(p)&&p.startsWith(VAULT_OUT+'/'));
        for(const p of gone) await Vault.remove(p);
        await Vault.pruneEmpty(VAULT_OUT);
        localStorage.setItem('nylaos_vault_manifest',JSON.stringify(written));
        localStorage.setItem('nylaos_vault_last_sync',String(Date.now()));
        Vault._index=null;
        window.dispatchEvent(new CustomEvent('vault-changed'));
        return {written:written.length,removed:gone.length};
      }catch(e){
        Vault.lastError=e.message||String(e);
        console.warn('Vault sync:',e);
        return null;
      }finally{ Vault.busy=false; }
    },

    // Removing a file leaves its folder behind; an emptied folder is noise in
    // Obsidian's sidebar. Only ever walks inside the folder Nyla OS owns.
    async pruneEmpty(root){
      if(!root.startsWith(VAULT_OUT)) return true;
      let dir;
      try{ dir=await Vault.dir(root,false); }catch(e){ return true; }
      let empty=true;
      const kids=[];
      try{ for await (const [name,h] of dir.entries()) kids.push([name,h]); }catch(e){ return false; }
      for(const [name,h] of kids){
        if(h.kind==='directory'){
          if(await Vault.pruneEmpty(`${root}/${name}`)){ try{ await dir.removeEntry(name); }catch(e){ empty=false; } }
          else empty=false;
        } else empty=false;
      }
      return empty;
    },

    lastSync(){ const t=+(localStorage.getItem('nylaos_vault_last_sync')||0); return t||null; },
  };

  Vault.htmlToMd=vaultHtmlToMd;
  Vault.safeName=safeName;
  window.Vault=Vault;

  // Restore the folder link on boot.
  _vGet('vault_dir_handle').then(async h=>{
    if(!h) return;
    try{
      if(await h.queryPermission({mode:'readwrite'})==='granted'){
        Vault.handle=h; Vault.name=h.name;
        window.dispatchEvent(new CustomEvent('vault-changed'));
        Vault.refreshPinCache();
      } else {
        // Held but not yet granted this session — keep it so one click re-grants.
        Vault.handle=h; Vault.name=h.name;
        window.dispatchEvent(new CustomEvent('vault-changed'));
      }
    }catch(e){}
  });
})();

function _htmlToText(html){
  const d=document.createElement('div');d.innerHTML=html;
  return (d.innerText||d.textContent||'').trim();
}

/* ── Notebook backup to IndexedDB (guard against localStorage loss) ── */
(function(){
  const DB_NAME='nylaos_nb_backup', STORE='snapshots';
  const _openBackupDb=()=>new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE);
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
  window._backupNotebooks=async()=>{
    try{
      const folders=localStorage.getItem('nylaos_nb_folders');
      const pages=localStorage.getItem('nylaos_nb_pages');
      if(!pages) return;
      const db=await _openBackupDb();
      const tx=db.transaction(STORE,'readwrite');
      const s=tx.objectStore(STORE);
      s.put({folders,pages,ts:Date.now()},'latest');
      s.put({folders,pages,ts:Date.now()},'snap_'+new Date().toISOString().split('T')[0]);
      tx.oncomplete=()=>{};
    }catch(e){console.warn('Notebook backup:',e);}
  };
  window._restoreNotebooksIfEmpty=async()=>{
    try{
      const existing=localStorage.getItem('nylaos_nb_pages');
      if(existing&&JSON.parse(existing).length>0) return;
      const db=await _openBackupDb();
      const tx=db.transaction(STORE,'readonly');
      const r=tx.objectStore(STORE).get('latest');
      r.onsuccess=()=>{
        if(!r.result) return;
        const snap=r.result;
        if(snap.pages){
          const parsed=JSON.parse(snap.pages);
          if(parsed.length>0){
            localStorage.setItem('nylaos_nb_pages',snap.pages);
            if(snap.folders) localStorage.setItem('nylaos_nb_folders',snap.folders);
            console.log('Notebooks restored from backup ('+parsed.length+' pages)');
          }
        }
      };
    }catch(e){console.warn('Notebook restore:',e);}
  };
  window._restoreNotebooksIfEmpty();
  setInterval(()=>window._backupNotebooks(),30000);
})();

window._exportNotebookMd=function(){
  const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
  const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
  if(!pages.length) return null;
  const grouped={};
  pages.forEach(p=>{const fid=p.folderId??'__unfiled';if(!grouped[fid])grouped[fid]=[];grouped[fid].push(p);});
  let md=`# Nyla OS Notebooks\n*Exported: ${new Date().toLocaleString()}*\n`;
  const sorted=[...folders].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  for(const f of sorted){
    const fps=grouped[f.id]||[];if(!fps.length)continue;
    md+=`\n---\n\n## ${f.name}\n`;
    for(const p of fps){
      md+=`\n### ${p.name||'Untitled'}\n`;
      if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
      const txt=_htmlToText(p.content||'');
      if(txt)md+=txt+'\n';
    }
  }
  return md;
};

/* ── Real Google Docs export ──────────────────────────────────────
   Reuses the same Firebase Google sign-in already used for cloud sync, but
   requests the Docs scope too, so we get a real OAuth access token back and
   can create actual Google Docs via the Docs API — no separate backend needed.
   The token is short-lived (~1hr, browser-session only, never persisted), so
   re-connecting occasionally is expected and handled via a 401 retry below. */
const DOCS_SCOPE = 'https://www.googleapis.com/auth/documents';
let _driveToken = null, _driveTokenExpiry = 0;

async function connectGoogleDrive(){
  if(!_fbAuth){ alert('Firebase config not filled in yet — see code comments.'); return null; }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope(DOCS_SCOPE);
    const result = await _fbAuth.signInWithPopup(provider);
    const credential = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
    if(credential && credential.accessToken){
      _driveToken = credential.accessToken;
      _driveTokenExpiry = Date.now() + 55*60*1000;
      return _driveToken;
    }
    return null;
  }catch(e){
    if(e.code!=='auth/popup-closed-by-user' && typeof toast==='function') toast('Google Docs connection failed: '+e.message,'error',4000);
    return null;
  }
}

async function _createGoogleDoc(title, plainText){
  let token = (_driveToken && Date.now()<_driveTokenExpiry) ? _driveToken : await connectGoogleDrive();
  if(!token) return null;
  const attempt = async tok => {
    const createRes = await fetch('https://docs.googleapis.com/v1/documents', {
      method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'}, body:JSON.stringify({title:title||'Untitled'})
    });
    if(createRes.status===401) return {expired:true};
    if(!createRes.ok) throw new Error('Docs create failed: '+createRes.status);
    const doc = await createRes.json();
    if(plainText && plainText.trim()){
      await fetch(`https://docs.googleapis.com/v1/documents/${doc.documentId}:batchUpdate`, {
        method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
        body:JSON.stringify({ requests:[{ insertText:{ location:{index:1}, text:plainText } }] })
      });
    }
    return { documentId: doc.documentId };
  };
  let result = await attempt(token);
  if(result && result.expired){
    _driveToken = null;
    token = await connectGoogleDrive();
    if(!token) return null;
    result = await attempt(token);
  }
  return result && result.documentId ? result : null;
}

window._exportToGoogleDrive=async function(){
  const md=window._exportNotebookMd();

async function _writeNotebookFile(){
  const h=window._nbFileHandle;
  if(!h) return;
  try{
    let perm=await h.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted') return;

    const folders=JSON.parse(localStorage.getItem('nylaos_nb_folders')||'[]');
    const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');

    const grouped={};
    pages.forEach(p=>{const fid=p.folderId??'__unfiled';if(!grouped[fid])grouped[fid]=[];grouped[fid].push(p);});

    let md=`# Nyla OS Notebooks\n*Last updated: ${new Date().toLocaleString()}*\n`;

    const sorted=[...folders].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    for(const f of sorted){
      const fps=grouped[f.id]||[];if(!fps.length)continue;
      md+=`\n---\n\n## ${f.name}\n`;
      for(const p of fps){
        md+=`\n### ${p.name||'Untitled'}\n`;
        if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
        const txt=_htmlToText(p.content||'');
        if(txt)md+=txt+'\n';
      }
    }
    const unfiled=grouped['__unfiled']||[];
    if(unfiled.length){
      md+=`\n---\n\n## Unfiled\n`;
      for(const p of unfiled){
        md+=`\n### ${p.name||'Untitled'}\n`;
        if(p.updated)md+=`*${new Date(p.updated).toLocaleString()}*\n\n`;
        const txt=_htmlToText(p.content||'');
        if(txt)md+=txt+'\n';
      }
    }

    const w=await h.createWritable();
    await w.write(md);
    await w.close();
  }catch(e){console.warn('Notebook file write:',e);}
}

// Boot Firebase if config is provided
let _cloudListener=null;
(function(){
  if(!FB_CONFIG.apiKey||typeof firebase==='undefined') return;
  try{
    firebase.initializeApp(FB_CONFIG);
    _fbAuth=firebase.auth();
    _fbDb=firebase.firestore();
    _fbAuth.onAuthStateChanged(user=>{
      _fbUser=user;
      // Tear down old real-time listener
      if(_cloudListener){_cloudListener();_cloudListener=null;}
      if(user){
        _setSyncState({status:'syncing',user});
        // onSnapshot fires immediately on attach (initial load) AND on remote changes.
        // We skip _cloudLoad entirely to avoid the double-reload race.
        let _isInitialAttach=true;
        _cloudListener=_fbDb.collection('nylaos').doc(user.uid).onSnapshot(doc=>{
          if(doc.metadata.hasPendingWrites) return; // ignore our own in-flight writes
          const wasInitialAttach=_isInitialAttach; _isInitialAttach=false;
          if(!doc.exists){_setSyncState({status:'synced',user});return;}
          const {snapshot,savedAt}=doc.data();
          const localTs=parseInt(localStorage.getItem('nylaos_cloud_ts')||'0');
          if(snapshot&&savedAt>localTs){
            // Force-apply on the initial attach (first sign-in / fresh session load) so signing
            // in still pulls your cloud data immediately — UNLESS this device already had unsynced
            // edits when the page loaded (_dirty persists across refreshes). A plain page refresh
            // re-triggers "initial attach" too, so without this check, refreshing with unsynced
            // local edits could still silently overwrite them the same way the original bug did.
            _maybeApplyOrConflict(snapshot,savedAt,user,wasInitialAttach && !_dirty);
          } else {
            _setSyncState({status:'synced',user});
          }
        },err=>{console.warn('Cloud listener:',err);_setSyncState({status:'error',user});});
      } else {
        _setSyncState({status:'idle',user:null});
      }
    });
  }catch(e){console.warn('Firebase init:',e);}
})();

/* ── Refresh / reopen recovery ──────────────────────────────────────
   Local writes go straight to localStorage synchronously, so a refresh or
   browser close never loses data on THIS device — the real risk is only
   that the last session ended before its changes finished pushing to the
   cloud. _dirty is persisted across reloads, so on boot we can tell. */
(function(){
  const wasDirtyOnBoot = _dirty;
  setTimeout(()=>{
    if(wasDirtyOnBoot && typeof toast==='function'){
      toast('Picked up where you left off — your edits are safely on this device','info',2600);
    }
    if(wasDirtyOnBoot && _fbUser){ cloudSave(); }
  }, 900);
  // Warn before closing/refreshing a tab with edits that haven't finished syncing to the cloud yet.
  window.addEventListener('beforeunload', e=>{
    if(_dirty && _fbUser){
      e.preventDefault();
      e.returnValue = '';
    }
  });
})();

// True while the window is at least `px` wide — for layouts that need more room than "not mobile".
const useMinWidth = (px) => {
  const [v, setV] = useState(() => window.innerWidth >= px);
  useEffect(() => {
    const fn = () => setV(window.innerWidth >= px);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, [px]);
  return v;
};
const useIsMobile = () => {
  const [v, setV] = useState(() => window.innerWidth < 700);
  useEffect(() => {
    const fn = () => setV(window.innerWidth < 700);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return v;
};

/* ── Data Protection ─────────────────────────────────────────────
   Runs synchronously before React initializes so nothing is lost.
   1. Migrates any legacy keys that were renamed between versions.
   2. Takes an auto-snapshot of all current nylaos_ data so there
      is always a "last session" restore point even after a code update.
──────────────────────────────────────────────────────────────────── */
(function protectData() {
  // Key migrations: [oldKey, newKey]
  const migrations = [
    ['cycleStartDate', 'nylaos_cycleStartDate'],
  ];
  migrations.forEach(([oldK, newK]) => {
    const v = localStorage.getItem(oldK);
    if (v !== null && localStorage.getItem(newK) === null) {
      localStorage.setItem(newK, v);
    }
  });

  // Auto-snapshot: copy every nylaos_ value before new code runs
  try {
    const snap = {};
    let hasData = false;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('nylaos_') && k !== 'nylaos_auto_bak') {
        snap[k] = localStorage.getItem(k);
        hasData = true;
      }
    }
    if (hasData) {
      snap.__savedAt = new Date().toISOString();
      localStorage.setItem('nylaos_auto_bak', JSON.stringify(snap));
    }
  } catch(e) {}
})();

/* ── Color math (shared by the theme generator & ColorWheelPicker) ─ */
const hexToRgb = hex => { hex=(hex||'#000000').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); return {r:parseInt(hex.slice(0,2),16)||0, g:parseInt(hex.slice(2,4),16)||0, b:parseInt(hex.slice(4,6),16)||0}; };
const rgbToHex = (r,g,b) => '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixHex = (hex1, hex2, weight) => {
  const a = hexToRgb(hex1), b = hexToRgb(hex2);
  return rgbToHex(a.r+(b.r-a.r)*weight, a.g+(b.g-a.g)*weight, a.b+(b.b-a.b)*weight);
};
const hsvToHex = (h, s, v) => {
  s = Math.max(0,Math.min(1,s)); v = Math.max(0,Math.min(1,v)); h = ((h%360)+360)%360;
  const c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c;
  let r=0,g=0,b=0;
  if (h<60) [r,g,b]=[c,x,0]; else if (h<120) [r,g,b]=[x,c,0]; else if (h<180) [r,g,b]=[0,c,x];
  else if (h<240) [r,g,b]=[0,x,c]; else if (h<300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return rgbToHex((r+m)*255,(g+m)*255,(b+m)*255);
};
const hexToHsv = hex => {
  const {r,g,b} = hexToRgb(hex);
  const rf=r/255, gf=g/255, bf=b/255;
  const max=Math.max(rf,gf,bf), min=Math.min(rf,gf,bf), d=max-min;
  let h=0;
  if (d!==0) { if(max===rf) h=60*(((gf-bf)/d)%6); else if(max===gf) h=60*((bf-rf)/d+2); else h=60*((rf-gf)/d+4); }
  if (h<0) h+=360;
  return { h, s: max===0?0:d/max, v: max };
};

// Moon phase for a calendar day. A principal phase (new, first quarter, full,
// last quarter) is shown only on the day its exact moment falls in; other days
// get the crescent/gibbous between. Uses astronomy-engine when it's loaded (the
// Cosmic pages and Calendar load it) and a mean-lunation estimate otherwise.
const _moonAngle = d => {
  const A = window.Astronomy;
  if (A) return A.MoonPhase(A.MakeTime(d));
  const days = (d.getTime() - Date.UTC(2000,0,6,18,14)) / 86400000;
  return (((days / 29.530588853) % 1) + 1) % 1 * 360;
};
const getMoonForDate = date => {
  const d0 = new Date(date); d0.setHours(0,0,0,0);
  const d1 = new Date(d0); d1.setDate(d1.getDate()+1);
  const a0 = _moonAngle(d0), a1 = _moonAngle(d1);
  const span = (a1 - a0 + 360) % 360;
  const hit = [[0,0],[90,2],[180,4],[270,6]].find(([t]) => (t - a0 + 360) % 360 < span);
  const idx = hit ? hit[1] : [1,3,5,7][Math.floor(((a0 + span/2) % 360) / 90)];
  return { idx, emoji: moonEmoji[idx], label: moonLabel[idx] };
};

/* ── Cycle model ────────────────────────────────────────────────────
   Periods you log live in nylaos_periods ([{id, start, end}]); your
   average cycle and period length come from that history (or settings
   while there's too little of it). The old single start date is folded
   in once and kept updated, so older code that reads it still works. */
const PERIODS_KEY = 'nylaos_periods';
const CYCLE_SETTINGS_KEY = 'nylaos_cycle_settings';
const localDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const dayDiff = (a, b) => Math.round((localDate(b) - localDate(a)) / 86400000);
const loadPeriods = () => {
  let list = []; try { list = JSON.parse(localStorage.getItem(PERIODS_KEY)||'[]'); } catch(e) {}
  const legacy = localStorage.getItem('nylaos_cycleStartDate');
  if (!list.length && legacy && /^\d{4}-\d{2}-\d{2}$/.test(legacy)) { list = [{ id:1, start:legacy }]; try { localStorage.setItem(PERIODS_KEY, JSON.stringify(list)); } catch(e) {} }
  return list.filter(p=>p.start).sort((a,b)=>a.start.localeCompare(b.start));
};
const cycleStats = (periods = loadPeriods()) => {
  const s = (()=>{ try { return JSON.parse(localStorage.getItem(CYCLE_SETTINGS_KEY)||'{}'); } catch(e) { return {}; } })();
  const gaps = []; for (let i=1;i<periods.length;i++) { const g = dayDiff(periods[i-1].start, periods[i].start); if (g>=18 && g<=45) gaps.push(g); }
  const recent = gaps.slice(-6);
  const lens = periods.filter(p=>p.end).map(p=>dayDiff(p.start,p.end)+1).filter(n=>n>=1&&n<=10).slice(-6);
  const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
  const cycleLength = Math.round(recent.length>=2 ? avg(recent) : recent.length ? (recent[0]+(s.cycleLength||28))/2 : (s.cycleLength||28));
  const periodLength = Math.round(lens.length ? avg(lens) : (s.periodLength||5));
  const variation = recent.length>=2 ? Math.max(...recent)-Math.min(...recent) : null;
  return { cycleLength, periodLength, gaps, variation, fromHistory: recent.length>=2 };
};
const cyclePhasesFor = (len, plen) => {
  const ov = Math.max(plen+2, len-14);
  return [
    { name:'Menstrual',  day1:1,      day2:plen,  color:'#E57373', bg:'#FFF0F0' },
    { name:'Follicular', day1:plen+1, day2:ov-2,  color:'#9C6FD6', bg:'#F5F0FF' },
    { name:'Ovulation',  day1:ov-1,   day2:ov+1,  color:'#F48FB1', bg:'#FFF0F5' },
    { name:'Luteal',     day1:ov+2,   day2:len,   color:'#64B5F6', bg:'#F0F5FF' },
  ].map(p=>({ ...p, label:`Days ${p.day1}–${p.day2}` }));
};
const CYCLE_PHASES = cyclePhasesFor(28, 5);

const getCycleForDate = (date, periods = loadPeriods(), stats) => {
  if (!periods.length) return null;
  const { cycleLength, periodLength } = stats || cycleStats(periods);
  const k = toDateKey(new Date(date));
  const past = periods.filter(p=>p.start<=k);
  const anchor = past.length ? past[past.length-1] : periods[0];
  const diff = dayDiff(anchor.start, k);
  const phases = cyclePhasesFor(cycleLength, anchor.end && diff < cycleLength ? dayDiff(anchor.start, anchor.end)+1 : periodLength);
  // Up to 10 days past due (on or before today) the period is late: keep counting.
  const isLatest = anchor === periods[periods.length-1];
  if (isLatest && diff >= cycleLength && diff < cycleLength + 10 && k <= toDateKey()) {
    return { day: diff+1, cycleLength, ...phases[3], label:`Day ${diff+1} — period is late`, late: diff - cycleLength + 1 };
  }
  const day = diff >= 0 ? (diff % cycleLength) + 1 : ((diff % cycleLength) + cycleLength) % cycleLength + 1;
  const phase = phases.find(p => day >= p.day1 && day <= p.day2) || phases[3];
  return { day, cycleLength, ...phase, predicted: diff >= cycleLength, stale: isLatest && diff >= cycleLength + 10 };
};

const polarToCartesian = (cx, cy, r, deg) => {
  const rad = (deg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
};

const arcPath = (cx, cy, r, a1, a2) => {
  const s = polarToCartesian(cx, cy, r, a1);
  const e = polarToCartesian(cx, cy, r, Math.min(a2, a1 + 359.9));
  const large = (a2 - a1) > 180 ? 1 : 0;
  return `M${s.x.toFixed(2)},${s.y.toFixed(2)} A${r},${r} 0 ${large} 1 ${e.x.toFixed(2)},${e.y.toFixed(2)}`;
};

const sanitize = s => s.replace(/[^a-zA-Z0-9]/g, '_');

/* ── Shared Download Utility ──────────────────────────────────────
   Real client-side file downloads (no backend needed) — used anywhere
   Print/PDF/Drive appears, per the "Download must also appear" rule.  */
const downloadTextFile = (filename, content, mime='text/plain') => {
  const blob = new Blob([content], {type: `${mime};charset=utf-8`});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
};
const downloadAsTxt = (title, content) => downloadTextFile(`${sanitize(title)||'export'}.txt`, `${title}\n\n${_htmlToText(content||'')}`);
const downloadAsMarkdown = (title, content) => downloadTextFile(`${sanitize(title)||'export'}.md`, `# ${title}\n\n${_htmlToText(content||'')}`, 'text/markdown');
const downloadAsDocx = (title, content) => {
  // Word opens HTML saved with a .doc extension + the msword MIME type — a real, widely-supported
  // trick that avoids needing a heavyweight docx-generation library for a no-build-step app.
  const body = content && content.includes('<') ? content : (content||'').split('\n').filter(Boolean).map(p=>`<p>${p}</p>`).join('');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset="utf-8"><title>${title}</title></head>
    <body><h1 style="font-family:Georgia,serif;color:#c4607a;">${title}</h1>${body||'<p></p>'}</body></html>`;
  downloadTextFile(`${sanitize(title)||'export'}.doc`, html, 'application/msword');
};
const downloadAsCsv = (title, rows) => {
  const csv = rows.map(r=>r.map(cell=>`"${String(cell??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadTextFile(`${sanitize(title)||'export'}.csv`, csv, 'text/csv');
};
const printAsPdf = (title, content, meta='') => {
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>${title}</title><style>@media print{body{margin:0;}@page{margin:1in;}}body{font-family:Georgia,serif;max-width:700px;margin:40px auto;line-height:2;color:#333;}h1{font-size:24px;color:#c4607a;}</style></head><body><h1>${title}</h1>${meta?`<p style="font-size:11px;color:#aaa;">${meta}</p>`:''}<hr style="border:none;border-top:1px solid #eee;margin:16px 0;"><div style="white-space:pre-wrap;line-height:2;">${_htmlToText(content||'')||'(no content)'}</div></body></html>`);
  w.document.close(); w.print();
};

/* ── Generic Version History ───────────────────────────────────────
   Reusable across any entity (ideas, notebook pages, ...). Snapshots are
   pushed BEFORE an edit overwrites tracked fields, capped at 20, newest first.
   Restoring never destructively reverts — it re-applies the old fields as a
   normal update, which itself pushes the current state as a new snapshot. */
const VERSION_HISTORY_MAX = 20;
const withVersionSnapshot = (entity, trackedFields) => {
  const snap = { ts: entity.updated || entity.created || new Date().toISOString() };
  trackedFields.forEach(f => { snap[f] = entity[f]; });
  const history = [snap, ...(entity.versionHistory||[])].slice(0, VERSION_HISTORY_MAX);
  return history;
};

const VersionHistoryPanel = ({ entity, trackedFields, onRestore, onClose }) => {
  const history = entity.versionHistory || [];
  return (
    <div onClick={e=>e.stopPropagation()} style={{position:'absolute',top:'110%',right:0,zIndex:250,background:C.card,border:`0.5px solid ${C.border}`,
      borderRadius:12,boxShadow:'0 6px 24px rgba(0,0,0,0.15)',padding:10,minWidth:240,maxHeight:280,overflowY:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:11.5,fontWeight:600,color:C.rose}}>Version History</span>
        <button onClick={onClose} style={{background:'none',border:'none',color:C.textMuted,cursor:'pointer',fontSize:13}}>×</button>
      </div>
      {history.length===0 && <div style={{fontSize:11.5,color:C.textMuted,fontStyle:'italic',padding:'6px 2px'}}>No earlier versions yet — one is saved automatically each time you edit.</div>}
      {history.map((snap,i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 4px',borderBottom:i<history.length-1?`0.5px solid ${C.border}60`:'none'}}>
          <div style={{flex:1,fontSize:11,color:C.textLight}}>{new Date(snap.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
          <button onClick={()=>onRestore(snap)} style={{padding:'3px 10px',borderRadius:7,background:`${C.accent}25`,border:'none',color:C.accent,fontSize:10.5,cursor:'pointer'}}>Restore</button>
        </div>
      ))}
    </div>
  );
};

/* ── Voice to text ───────────────────────────────────────────────────
   Tap the mic, talk, tap again. Words land in whatever field it sits
   next to. Uses the browser's own speech recognition (Chrome, Edge,
   Safari); where that's missing the button says so instead of hiding. */
const SpeechRec = typeof window!=='undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const VoiceButton = ({ onText, size=36, title='Speak instead of typing' }) => {
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  useEffect(()=>()=>{ try{ recRef.current?.stop(); }catch(e){} },[]);
  const toggle = () => {
    if (!SpeechRec) { toast('Voice typing isn’t available in this browser — try Chrome or Safari','error',3200); return; }
    if (listening) { try{ recRef.current?.stop(); }catch(e){} return; }
    const rec = new SpeechRec();
    rec.continuous = true; rec.interimResults = false; rec.lang = navigator.language || 'en-US';
    rec.onresult = e => {
      let said = '';
      for (let i=e.resultIndex;i<e.results.length;i++) if (e.results[i].isFinal) said += e.results[i][0].transcript;
      if (said.trim()) onText(said.trim());
    };
    rec.onerror = e => { if (e.error==='not-allowed') toast('Allow microphone access to use voice typing','error',3000); };
    rec.onend = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); } catch(e) { setListening(false); }
  };
  return (
    <button type="button" onClick={toggle} title={listening?'Stop listening':title} aria-pressed={listening}
      className={listening?'mic-live':''}
      style={{ width:size, height:size, borderRadius:'50%', flexShrink:0, border:`0.5px solid ${listening?C.rose:C.border}`,
        background: listening ? C.rose : 'transparent', color: listening ? '#fff' : C.textLight, cursor:'pointer',
        display:'grid', placeItems:'center', transition:'all .15s' }}>
      <svg width={size*0.45} height={size*0.45} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0014 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>
      </svg>
    </button>
  );
};

/* ── Color Wheel Picker ─────────────────────────────────────────────
   Reusable anywhere a color can be changed: a hue/saturation wheel + brightness
   slider + hex (#RRGGBB) field, replacing native <input type="color"> swatches. */
const ColorWheelPicker = ({ value, onChange, size=140, trigger=null, align='left' }) => {
  const [open, setOpen] = useState(false);
  const hex = value || '#c4607a';
  const [hexDraft, setHexDraft] = useState(hex);
  useEffect(()=>{ setHexDraft(hex); }, [hex]);
  const wheelRef = useRef(null);
  const draggingRef = useRef(false);
  const { h, s, v } = hexToHsv(hex);

  const setFromPoint = (clientX, clientY) => {
    const el = wheelRef.current; if (!el) return;
    const rect = el.getBoundingClientRect();
    const R = rect.width/2;
    const dx = clientX - (rect.left+R), dy = clientY - (rect.top+R);
    let angle = Math.atan2(dy,dx) * 180/Math.PI; if (angle<0) angle += 360;
    const dist = Math.min(1, Math.sqrt(dx*dx+dy*dy)/R);
    onChange(hsvToHex(angle, dist, v));
  };
  const onPointerDown = e => {
    draggingRef.current = true;
    setFromPoint(e.clientX, e.clientY);
    const move = e2 => { if (draggingRef.current) setFromPoint(e2.clientX, e2.clientY); };
    const up = () => { draggingRef.current=false; window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  const markerLeft = 50 + s*Math.cos(h*Math.PI/180)*50;
  const markerTop  = 50 + s*Math.sin(h*Math.PI/180)*50;

  return (
    <div style={{ position:'relative', display:'inline-block' }}>
      <span onClick={()=>setOpen(o=>!o)} style={{ cursor:'pointer', display:'inline-flex' }}>
        {trigger ? trigger(hex) : (
          <span style={{ display:'flex', alignItems:'center', gap:6, padding:'4px 10px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.pinkLight }}>
            <span style={{ width:16, height:16, borderRadius:'50%', background:hex, border:`0.5px solid ${C.border}`, flexShrink:0 }}/>
            <span style={{ fontSize:11.5, color:C.text, fontFamily:'monospace' }}>{hex}</span>
          </span>
        )}
      </span>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{ position:'fixed', inset:0, zIndex:299 }}/>
          <div onClick={e=>e.stopPropagation()} style={{ position:'absolute', top:'calc(100% + 6px)', [align]:0, zIndex:300,
            background:C.card, border:`0.5px solid ${C.border}`, borderRadius:14, padding:14,
            boxShadow:'0 10px 30px rgba(0,0,0,0.18)', width:size+28 }}>
            <div ref={wheelRef} onPointerDown={onPointerDown}
              style={{ width:size, height:size, borderRadius:'50%', margin:'0 auto', position:'relative', cursor:'crosshair', touchAction:'none',
                background:'radial-gradient(circle at center, #fff, transparent 70%), conic-gradient(from 90deg, red, yellow, lime, cyan, blue, magenta, red)' }}>
              <div style={{ position:'absolute', left:`${markerLeft}%`, top:`${markerTop}%`, width:14, height:14, borderRadius:'50%',
                border:'2px solid #fff', boxShadow:'0 0 0 1px rgba(0,0,0,0.35)', background:hex, transform:'translate(-50%,-50%)', pointerEvents:'none' }}/>
            </div>
            <input type="range" min={0} max={100} value={Math.round(v*100)}
              onChange={e=>onChange(hsvToHex(h, s, parseInt(e.target.value)/100))}
              title="Brightness" style={{ width:'100%', marginTop:12, accentColor:hex }}/>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:10 }}>
              <span style={{ width:18, height:18, borderRadius:5, background:hex, border:`0.5px solid ${C.border}`, flexShrink:0 }}/>
              <input value={hexDraft} onChange={e=>{ let val=e.target.value; if(val&&!val.startsWith('#')) val='#'+val; setHexDraft(val); if(/^#[0-9a-fA-F]{6}$/.test(val)) onChange(val); }}
                onBlur={()=>setHexDraft(hex)}
                style={{ flex:1, minWidth:0, padding:'5px 8px', borderRadius:7, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12, fontFamily:'monospace' }}/>
            </div>
          </div>
        </>
      )}
    </div>
  );
};

const searchIndex = () => {
  const L = k => { try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch(e) { return []; } };
  const out = [];
  NAV.forEach(n => { out.push({ kind:'Section', icon:'↗', title:n.label, go:()=>window._navigateTo(n.id) });
    n.sub.filter(x=>x!=='Recently Deleted').forEach(sub => out.push({ kind:'Section', icon:'↗', title:`${n.label} › ${sub}`, go:()=>window._navigateTo(n.id, sub) })); });
  L('nylaos_tasks').filter(t=>t.source!=='calendar').forEach(t => out.push({ kind:'Task', icon:t.done?'✓':'○', title:t.text, sub:[t.calendarDate&&prettyDue(t.calendarDate)?.label, t.done&&'done', t.notes].filter(Boolean).join(' · '), body:t.notes, go:()=>window._navigateTo('tasks', t.done?'Completed':t.calendarDate&&t.calendarDate<=toDateKey()?'Today':t.calendarDate?'Upcoming':'All Tasks') }));
  L('nylaos_events').forEach(e => out.push({ kind:'Event', icon:'📅', title:e.text, sub:[e.date, e.time&&fmtTime(e.time), e.location].filter(Boolean).join(' · '), go:()=>{ window._calendarFocus = e.date; window._navigateTo('calendar','Monthly'); } }));
  L('nylaos_tasks').filter(t=>t.source==='calendar').forEach(e => out.push({ kind:'Event', icon:'📅', title:e.text, sub:e.calendarDate, go:()=>{ window._calendarFocus = e.calendarDate; window._navigateTo('calendar','Monthly'); } }));
  L('nylaos_goals').forEach(g => out.push({ kind:'Goal', icon:'🎯', title:g.title, sub:`${g.progress||0}%${g.venture?` · ${g.venture}`:''}`, body:g.description, go:()=>window._navigateTo('goals', g.periodType==='quarterly'?'Quarterly':g.periodType==='monthly'?'Monthly':'Yearly') }));
  L('nylaos_ideas').forEach(i => out.push({ kind:'Idea', icon:'💡', title:i.title||i.text||'Idea', body:_htmlToText(i.content||i.description||''), go:()=>{ localStorage.setItem('nylaos_idea_open_request', String(i.id)); window._navigateTo('ideas'); } }));
  L('nylaos_nb_pages').forEach(pg => out.push({ kind:'Note', icon:'📝', title:pg.name||'Untitled page', body:_htmlToText(pg.content||''), go:()=>{ localStorage.setItem('nylaos_nb_open_request', String(pg.id)); window._navigateTo('notebook'); } }));
  L('nylaos_books').forEach(b => out.push({ kind:'Book', icon:'📚', title:b.title, sub:b.author, go:()=>window._navigateTo('books','My Library') }));
  L('nylaos_social_content').forEach(c => out.push({ kind:'Post', icon:platformInfo(c.platform).emoji, title:c.title, sub:[c.status, c.date].filter(Boolean).join(' · '), body:[c.caption,c.hook,c.notes].filter(Boolean).join(' '), go:()=>window._navigateTo('social','Content Calendar') }));
  L('nylaos_shopping_list').forEach(i => out.push({ kind:'Shopping', icon:'🛒', title:i.text, go:()=>window._navigateTo('lists','Shopping List') }));
  return out;
};

const GlobalSearch = ({ onClose }) => {
  const [q, setQ] = useState('');
  const [idx, setIdx] = useState(0);
  const index = React.useMemo(searchIndex, []);
  const needle = q.trim().toLowerCase();
  const results = React.useMemo(() => {
    if (!needle) return index.filter(r=>r.kind==='Task' && r.icon==='○').slice(0,6).concat(index.filter(r=>r.kind==='Section' && !r.title.includes('›')).slice(0,8));
    const words = needle.split(/\s+/);
    return index.map(r => {
      const t = (r.title||'').toLowerCase(), b = `${r.sub||''} ${r.body||''}`.toLowerCase();
      if (!words.every(w => t.includes(w) || b.includes(w))) return null;
      const score = (t.startsWith(needle)?0:t.includes(needle)?1:2) + (r.kind==='Section'?0.5:0);
      let snippet = '';
      if (!t.includes(words[0]) && b.includes(words[0])) { const at = b.indexOf(words[0]); snippet = '…'+`${r.sub||''} ${r.body||''}`.slice(Math.max(0,at-40), at+80).trim()+'…'; }
      return { ...r, score, snippet };
    }).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,40);
  }, [needle, index]);
  useEffect(()=>setIdx(0),[needle]);
  const pick = r => { if (!r) return; onClose(); setTimeout(r.go, 0); };
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:9995, background:'rgba(30,12,24,.35)', backdropFilter:'blur(4px)', display:'flex', justifyContent:'center', alignItems:'flex-start', padding:'10vh 14px' }}>
      <div onClick={e=>e.stopPropagation()} className="fade-in" style={{ width:'100%', maxWidth:620, background:C.cream, borderRadius:20, border:`0.5px solid ${C.border}`, boxShadow:'0 30px 70px rgba(0,0,0,.28)', overflow:'hidden' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'14px 18px', borderBottom:`0.5px solid ${C.border}` }}>
          <Ico d={icons.search} size={18} active/>
          <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Search tasks, notes, ideas, goals, posts…"
            onKeyDown={e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); setIdx(i=>Math.min(results.length-1,i+1)); } if(e.key==='ArrowUp'){ e.preventDefault(); setIdx(i=>Math.max(0,i-1)); } if(e.key==='Enter') pick(results[idx]); if(e.key==='Escape') onClose(); }}
            style={{ flex:1, border:'none', background:'transparent', fontSize:16, color:C.text, fontFamily:'inherit' }}/>

// Little counts beside sub-pages, so you can see what's waiting without clicking.
const navBadge = (navId, sub) => {
  try {
    const today = toDateKey();
    if (navId==='tasks') {
      const open = JSON.parse(localStorage.getItem('nylaos_tasks')||'[]').filter(t=>t.source!=='calendar' && !t.done);
      if (sub==='Today') { const n = open.filter(t=>t.calendarDate && t.calendarDate<=today).length; return n ? { n, hot: open.some(t=>t.calendarDate && t.calendarDate<today) } : null; }
      if (sub==='Upcoming') { const n = open.filter(t=>t.calendarDate && t.calendarDate>today).length; return n ? { n } : null; }
      if (sub==='All Tasks') return open.length ? { n:open.length } : null;
      if (sub==='To Do List') { const n = open.filter(t=>t.status==='progress').length; return n ? { n, label:'doing' } : null; }
    }
    if (navId==='calendar' && sub==='Agenda') {
      const n = JSON.parse(localStorage.getItem('nylaos_events')||'[]').filter(e=>e.date===today).length;
      return n ? { n, label:'today' } : null;
    }
    if (navId==='lists') {
      if (sub==='Shopping List') { const n = JSON.parse(localStorage.getItem('nylaos_shopping_list')||'[]').filter(i=>!i.done).length; return n ? { n } : null; }
      if (sub==='Habits') { const hs = JSON.parse(localStorage.getItem('nylaos_habits')||'null') || DEFAULT_HABITS.map((h,i)=>({id:i+1})); const log = JSON.parse(localStorage.getItem('nylaos_habit_log')||'{}'); const left = hs.filter(h=>!log[`${h.id}_${today}`]).length; return left ? { n:left, label:'left' } : null; }
    }
    if (navId==='social' && sub==='Pipeline') { const n = JSON.parse(localStorage.getItem('nylaos_social_content')||'[]').filter(c=>c.status!=='Posted' && c.status!=='Idea').length; return n ? { n } : null; }
  } catch(e) {}
  return null;
};

const QL_KEY = 'nylaos_quick_links';
// Links added after launch. They're appended once to a saved list too, so
// someone who already edited their links still gets them (and can remove them).
const ADDED_QUICK_LINKS = [
  { key:'shq_biz_v1',  label:'Semester HQ OS',   url:'https://biz.semester-hq.com', emoji:'🗂️' },
  { key:'shq_site_v1', label:'Semester HQ Site', url:'https://semester-hq.com',     emoji:'🌐' },

];
const loadQuickLinks = () => {
  const saved = JSON.parse(localStorage.getItem(QL_KEY)||'null');
  let links = saved || QUICK_LINKS.map((l,i)=>({ ...l, id:i+1 }));
  const seen = JSON.parse(localStorage.getItem('nylaos_quick_links_added')||'[]');
  const fresh = ADDED_QUICK_LINKS.filter(l=>!seen.includes(l.key));
  if (fresh.length) {
    fresh.forEach((l,i)=>{ if (!links.some(x=>x.url.replace(/\/$/,'')===l.url)) links = [...links, { label:l.label, url:l.url, emoji:l.emoji, id:Date.now()+i }]; });
    localStorage.setItem(QL_KEY, JSON.stringify(links));
    localStorage.setItem('nylaos_quick_links_added', JSON.stringify([...seen, ...fresh.map(l=>l.key)]));
  }
  return links;
};
const normalizeUrl = u => { const t=u.trim(); if(!t) return ''; return /^[a-z][a-z0-9+.-]*:/i.test(t) ? t : `https://${t}`; };
const linkHost = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e) { return ''; } };

const QuickLinkIcon = ({ link, size=18 }) => {
  const [broken, setBroken] = useState(false);
  const host = linkHost(link.url);
  if (link.emoji || broken || !host) return <span style={{ fontSize:size-3, lineHeight:1 }}>{link.emoji||'🔗'}</span>;
  return <img src={`https://www.google.com/s2/favicons?domain=${host}&sz=64`} alt="" width={size} height={size} onError={()=>setBroken(true)} style={{ borderRadius:4 }}/>;
};

const QuickLinksBar = () => {
  const [links, setLinks] = useState(loadQuickLinks);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ label:'', url:'', emoji:'' });
  const save = l => { setLinks(l); localStorage.setItem(QL_KEY, JSON.stringify(l)); };
  const add = () => {
    const url = normalizeUrl(form.url);
    if (!url) { toast('Paste a link first','error'); return; }
    const label = form.label.trim() || linkHost(url) || 'Link';
    save([...links, { id:Date.now(), label, url, emoji:form.emoji.trim() }]);
    setForm({ label:'', url:'', emoji:'' });
    toast('Link added','success',1300);
  };
  const remove = id => save(links.filter(l=>l.id!==id));
  const move = (i, dir) => { const j=i+dir; if(j<0||j>=links.length) return; const n=[...links]; [n[i],n[j]]=[n[j],n[i]]; save(n); };
  const chipBase = { display:'inline-flex', alignItems:'center', gap:7, padding:'7px 14px', borderRadius:22, background:C.card,

          </span>
        ) : (
          <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" style={chipBase}
            onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-2px)';e.currentTarget.style.borderColor=C.rose;}}
            onMouseLeave={e=>{e.currentTarget.style.transform='none';e.currentTarget.style.borderColor=C.border;}}>
            <QuickLinkIcon link={link}/>{link.label}

          {editing ? '✓ Done' : links.length ? '✎ Edit links' : '+ Add a link'}

        <Card className="fade-in" style={{ marginTop:12, padding:'12px 14px', display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>

  const dueNow = mine.filter(t=>!t.done && t.calendarDate && t.calendarDate<=today).sort((a,b)=>a.calendarDate.localeCompare(b.calendarDate));
