            <Card style={{marginTop:16,padding:'14px 18px',background:`${C.lavender}40`,textAlign:'center'}}>
              <div style={{fontSize:12,color:C.textMuted,marginBottom:4}}>Decision Made</div>
              <div style={{fontSize:16,fontFamily:"'DM Serif Display',serif",color:C.rose}}>{active.verdict}</div>
            </Card>
          )}
        </div>
      )}
      {decisions.length===0&&<div style={{textAlign:'center',padding:32,color:C.textMuted,fontSize:13,fontStyle:'italic'}}>No decisions yet. What are you weighing?</div>}
    </div>
  );
};

/* ── Eisenhower Matrix ──────────────────────────────────────────── */
const EisenhowerMatrix = ({ storageKey='nylaos_tasks' }) => {
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(storageKey)||'[]').filter(t=>!t.done&&t.source!=='calendar'));
  const [input, setInput] = useState('');
  const [addQ, setAddQ] = useState('ui');
  const save = t => { const all=JSON.parse(localStorage.getItem(storageKey)||'[]'); const other=all.filter(x=>x.done||x.source==='calendar'); setTasks(t); localStorage.setItem(storageKey,JSON.stringify([...t,...other])); };
  const setQuadrant = (id, q) => { save(tasks.map(t=>t.id===id?{...t,quadrant:q}:t)); };
  const addTask = () => { if(!input.trim()) return; save([...tasks,{id:Date.now(),text:input.trim(),done:false,quadrant:addQ,created:new Date().toISOString()}]); setInput(''); toast('Task added','success',1200); };
  const complete = id => { save(tasks.map(t=>t.id===id?{...t,done:true,completedDate:toDateKey()}:t)); toast('Done ✓','success',1200); };
  const quads = [
    { key:'ui', label:'Do First', sub:'Urgent & Important', color:'#ea4335', bg:'#ea433512', icon:'🔥' },
    { key:'ni', label:'Schedule', sub:'Not Urgent & Important', color:'#34a853', bg:'#34a85312', icon:'📅' },
    { key:'un', label:'Delegate', sub:'Urgent & Not Important', color:'#fbbc04', bg:'#fbbc0412', icon:'📤' },
    { key:'nn', label:'Eliminate', sub:'Not Urgent & Not Important', color:C.textMuted, bg:`${C.pink}20`, icon:'🗑' },
  ];
  return (
    <div className="fade-in">
      <PageTitle>Eisenhower Matrix</PageTitle>
      <div style={{display:'flex',gap:8,marginBottom:16,alignItems:'center'}}>
        <InlineInput value={input} onChange={e=>setInput(e.target.value)} placeholder="Add task..." onKeyDown={e=>e.key==='Enter'&&addTask()} style={{flex:1}}/>
        <select value={addQ} onChange={e=>setAddQ(e.target.value)} style={{padding:'8px 10px',borderRadius:10,border:`0.5px solid ${C.border}`,background:C.pinkLight,color:C.rose,fontSize:12}}>
          {quads.map(q=><option key={q.key} value={q.key}>{q.icon} {q.label}</option>)}
        </select>
        <button onClick={addTask} style={{padding:'9px 18px',borderRadius:12,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Add</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {quads.map(q=>{
          const items=tasks.filter(t=>!t.done&&(t.quadrant===q.key||(q.key==='ui'&&!t.quadrant)));
          return (
            <div key={q.key} style={{borderRadius:14,padding:14,background:q.bg,border:`1px solid ${q.color}30`,minHeight:180}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                <span style={{fontSize:14}}>{q.icon}</span>
                <div>
                  <div style={{fontSize:12.5,fontWeight:600,color:q.color}}>{q.label}</div>
                  <div style={{fontSize:10,color:C.textMuted}}>{q.sub}</div>
                </div>
              </div>
              {items.map(t=>(
                <div key={t.id} className="card-hover" style={{padding:'8px 10px',borderRadius:8,background:C.card,border:`0.5px solid ${C.border}`,marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
                  <button onClick={()=>complete(t.id)} style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${q.color}`,background:'transparent',cursor:'pointer',flexShrink:0}}/>
                  <span style={{flex:1,fontSize:12,color:C.text}}>{t.text}</span>
                  <select value={t.quadrant||'ui'} onChange={e=>setQuadrant(t.id,e.target.value)} style={{fontSize:10,padding:'2px 4px',borderRadius:4,border:`0.5px solid ${C.border}`,background:'transparent',color:C.textMuted,cursor:'pointer'}}>

const BoredBucket = () => {

  const [input, setInput] = useState('');
  const [expanded, setExpanded] = useState(null);

          <div style={{fontSize:11,color:C.textMuted,textTransform:'uppercase',letterSpacing:1,marginBottom:6}}>You should do...</div>
          <div style={{fontSize:22,fontFamily:"'DM Serif Display',serif",color:C.rose}}>{picked.name}</div>

/* ── Voice Notes ───────────────────────────────────────────────── */
const VoiceNotes = () => {
  const [recording, setRecording] = useState(false);
  const [transcript, setTranscript] = useState('');
  const [status, setStatus] = useState('');
  const recRef = useRef(null);
  const startRecording = () => {
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
      toast('Speech recognition not supported in this browser','error'); return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    let final = '';
    rec.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      setTranscript(final + interim);
    };
    rec.onerror = e => { setStatus('Error: '+e.error); setRecording(false); };
    rec.onend = () => { if(recording) rec.start(); };
    rec.start();
    recRef.current = rec;
    setRecording(true); setStatus('Listening...'); setTranscript('');
  };
  const stopRecording = () => {
    if(recRef.current){ recRef.current.onend=null; recRef.current.stop(); }
    setRecording(false); setStatus('');
  };
  const saveAsNote = () => {
    if(!transcript.trim()){ toast('Nothing to save','error'); return; }
    const pages=JSON.parse(localStorage.getItem('nylaos_nb_pages')||'[]');
    const name='Voice Note · '+new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    pages.push({id:Date.now(),name,folderId:1,content:`<p>${transcript.trim().replace(/\n/g,'</p><p>')}</p>`,created:new Date().toISOString(),updated:new Date().toISOString()});
    localStorage.setItem('nylaos_nb_pages',JSON.stringify(pages));
    toast('Saved to Notebook','success');
    setTranscript('');
  };
  return (
    <div className="fade-in" style={{maxWidth:560}}>
      <PageTitle>Voice Notes</PageTitle>
      <Card style={{textAlign:'center',padding:'30px 24px'}}>
        <button onClick={recording?stopRecording:startRecording} style={{
          width:80,height:80,borderRadius:'50%',border:'none',cursor:'pointer',
          background:recording?'#ea4335':C.rose,color:'#fff',fontSize:28,
          boxShadow:recording?'0 0 0 8px #ea433530':`0 4px 18px ${C.rose}50`,
          transition:'all 0.2s',animation:recording?'checkPop 1s ease infinite':'none',
          display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',
        }}>{recording?'⏹':'🎙'}</button>
        <div style={{fontSize:13,color:recording?'#ea4335':C.textMuted,fontWeight:500,marginBottom:16}}>
          {recording?'Recording... tap to stop':'Tap to start recording'}
        </div>
        {status&&<div style={{fontSize:11,color:C.textMuted,marginBottom:8}}>{status}</div>}
        {transcript&&(
          <>
            <div style={{textAlign:'left',padding:'14px 18px',borderRadius:12,background:C.pinkLight,border:`0.5px solid ${C.border}`,fontSize:13,color:C.text,lineHeight:1.7,marginBottom:14,minHeight:80,whiteSpace:'pre-wrap'}}>{transcript}</div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              <button onClick={saveAsNote} style={{padding:'9px 20px',borderRadius:10,background:C.rose,color:'#fff',border:'none',fontSize:13,cursor:'pointer'}}>Save to Notebook</button>
              <button onClick={()=>setTranscript('')} style={{padding:'9px 20px',borderRadius:10,background:'transparent',border:`0.5px solid ${C.border}`,color:C.textMuted,fontSize:13,cursor:'pointer'}}>Clear</button>
            </div>
          </>
        )}
      </Card>
    </div>
  );
};

/* ── Brain Dump ─────────────────────────────────────────────────────
   Speak or type a messy stream of thoughts; Claude splits it into tasks,
   calendar events, ideas, notes and a shopping list. Everything is shown
   for review (with per-item toggles) before anything is actually saved. */
const BRAIN_DUMP_CATS = [
  { key:'tasks',    label:'Tasks',            emoji:'✅', color:'#4285f4', storeKey:'nylaos_tasks' },
  { key:'events',   label:'Calendar Events',  emoji:'📅', color:'#9080d8', storeKey:'nylaos_events' },
  { key:'ideas',    label:'Ideas',            emoji:'💡', color:'#F4A261', storeKey:'nylaos_ideas' },
  { key:'notes',    label:'Notes',            emoji:'📝', color:'#5a8a6e', storeKey:'nylaos_nb_pages' },
  { key:'shopping', label:'Shopping List',    emoji:'🛒', color:'#c4607a', storeKey:'nylaos_shopping_list' },
];

const BrainDump = () => {
  const [text, setText] = useState('');
  const [recording, setRecording] = useState(false);
  const recRef = useRef(null);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [checked, setChecked] = useState({});

  const startRecording = () => {
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
      toast('Speech recognition not supported in this browser','error'); return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    const base = text ? text+' ' : '';
    let final = '';
    rec.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      setText(base + final + interim);
    };
    rec.onerror = e => { setRecording(false); };
    rec.onend = () => { if(recording) rec.start(); };
    rec.start();
    recRef.current = rec;
    setRecording(true);
  };
  const stopRecording = () => {
    if(recRef.current){ recRef.current.onend=null; recRef.current.stop(); }
    setRecording(false);
  };

  const analyze = async () => {
    if(!text.trim()) return;
    const key = localStorage.getItem('nylaos_api_key');
    if(!key){ toast('Add your API key in Settings → API Keys first','error'); return; }
    setLoading(true);
    try {
      const sys = `You are a brain-dump triage assistant. The user gives you a messy, unstructured stream of thoughts (typed or spoken). Split it into distinct items and reply with STRICT JSON only — no markdown fences, no commentary — in exactly this shape:
{"tasks":[{"text":"","date":"YYYY-MM-DD or empty"}],"events":[{"text":"","date":"YYYY-MM-DD","time":"HH:MM 24h or empty","location":""}],"ideas":[{"title":"","content":""}],"notes":[{"title":"","content":""}],"shopping":[{"text":""}]}
Today's date is ${toDateKey()}. Resolve relative dates ("next Tuesday", "tomorrow") into real YYYY-MM-DD dates. Only include a category's array if it actually has items — otherwise return an empty array for it. Don't invent anything that wasn't said.`;
      const raw = await callClaude({ system:sys, messages:[{role:'user',content:text}], maxTokens:8000, effort:'low' });
      const match = raw.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(match ? match[0] : raw);
      const totalItems = BRAIN_DUMP_CATS.reduce((s,c)=>s+(parsed[c.key]||[]).length,0);
      if (totalItems === 0) { toast('Nothing clear enough to sort — try adding more detail','error'); setLoading(false); return; }
      setResult(parsed);
      const chk = {};
      BRAIN_DUMP_CATS.forEach(c => (parsed[c.key]||[]).forEach((_,i)=>chk[`${c.key}_${i}`]=true));
      setChecked(chk);
    } catch(e) {
      toast('Could not process that — check your API key in Settings','error');
    } finally { setLoading(false); }
  };

  const toggle = k => setChecked(c=>({...c,[k]:!c[k]}));

  const confirmAndSave = () => {
    let added = 0;
    const summaryLines = [];

    const tasks = JSON.parse(localStorage.getItem('nylaos_tasks')||'[]');
    (result.tasks||[]).forEach((t,i)=>{ if(checked[`tasks_${i}`]){ tasks.push({id:Date.now()+Math.random(),text:t.text,done:false,calendarDate:/^\d{4}-\d{2}-\d{2}$/.test(t.date||'')?t.date:null,created:new Date().toISOString()}); added++; summaryLines.push(`<li>✅ ${t.text}${t.date?` — ${t.date}`:''}</li>`); }});
    localStorage.setItem('nylaos_tasks', JSON.stringify(tasks));

    const events = JSON.parse(localStorage.getItem('nylaos_events')||'[]');
    (result.events||[]).forEach((e,i)=>{ if(checked[`events_${i}`]){ const txt=e.text; events.push({id:Date.now()+Math.random(),date:e.date||toDateKey(),text:txt,time:/^\d{2}:\d{2}$/.test(e.time||'')?e.time:null,location:e.location||''}); added++; summaryLines.push(`<li>📅 ${txt} — ${e.date||toDateKey()}</li>`); }});
    localStorage.setItem('nylaos_events', JSON.stringify(events));

    const ideas = JSON.parse(localStorage.getItem('nylaos_ideas')||'[]');

/* ── Tasks ──────────────────────────────────────────────────────────
   A task is just a task: some words, and optionally a day. "Today" and
   a picked date both live in calendarDate, which the Calendar already
   shows, so dating a task no longer makes a second calendar event. */
const addDaysKey = (n, from) => { const d = from ? new Date(from+'T00:00') : new Date(); d.setDate(d.getDate()+n); return toDateKey(d); };
const prettyDue = dk => {
  if (!dk) return null;
  const today = toDateKey();
  if (dk === today) return { label:'Today', tone:'today' };
  if (dk === addDaysKey(1)) return { label:'Tomorrow', tone:'soon' };
  if (dk === addDaysKey(-1)) return { label:'Yesterday', tone:'overdue' };
  const d = new Date(dk+'T00:00');
  const within = (d - new Date(today+'T00:00')) / 86400000;
  const label = within > 0 && within < 7
    ? d.toLocaleDateString('en-US',{weekday:'long'})
    : d.toLocaleDateString('en-US',{month:'short',day:'numeric',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})});
  return { label, tone: dk < today ? 'overdue' : 'later' };
};
const DUE_TONES = () => ({
  today:   { bg:`${C.rose}18`, fg:C.rose },
  soon:    { bg:`${C.accent}20`, fg:C.accent },
  later:   { bg:`${C.lavender}70`, fg:C.textLight },
  overdue: { bg:'#e5737320', fg:'#d05a5a' },
});
const REPEAT_OPTS = [['','Does not repeat'],['daily','Every day'],['weekdays','Every weekday'],['weekly','Every week'],['monthly','Every month']];
const nextRepeatDate = (t) => {
  const base = t.calendarDate && t.calendarDate > toDateKey() ? t.calendarDate : toDateKey();
  const d = new Date(base+'T00:00');
  if (t.repeat==='daily') d.setDate(d.getDate()+1);
  else if (t.repeat==='weekdays') { do { d.setDate(d.getDate()+1); } while (d.getDay()===0 || d.getDay()===6); }
  else if (t.repeat==='weekly') d.setDate(d.getDate()+7);
  else if (t.repeat==='monthly') d.setMonth(d.getMonth()+1);
  return toDateKey(d);
};

// Checks a task off (or back on). A repeating task makes its next copy when
// it's done; unchecking it takes that copy back if it hasn't been touched.
const toggleTaskIn = (list, id) => {
  const t = list.find(x=>x.id===id); if (!t) return { list, spawned:null };
  const today = toDateKey();
  if (!t.done) {
    let spawned = null;
    let next = list.map(x=>x.id===id?{...x,done:true,completedDate:today}:x);
    if (t.repeat) {
      spawned = { ...t, id:Date.now(), done:false, completedDate:null, spawnedId:undefined, calendarDate:nextRepeatDate(t), created:new Date().toISOString() };
      next = next.map(x=>x.id===id?{...x,spawnedId:spawned.id}:x);
      next.push(spawned);
    }
    return { list:next, spawned, nowDone:true };
  }
  const next = list.filter(x=>!(t.spawnedId && x.id===t.spawnedId && !x.done)).map(x=>x.id===id?{...x,done:false,completedDate:null,spawnedId:undefined}:x);
  return { list:next, spawned:null, nowDone:false };
};

// Choose when: Today / a date / no date. Used by the add bar and each row.
const WhenPicker = ({ value, onChange, compact=false }) => {
  const today = toDateKey();
  const mode = !value ? 'none' : value===today ? 'today' : 'date';
  const chip = (active) => ({ padding: compact?'4px 10px':'6px 13px', borderRadius:20, fontSize: compact?11:12, cursor:'pointer', fontFamily:'inherit',
    border:`0.5px solid ${active?C.rose:C.border}`, background: active?C.rose:'transparent', color: active?'#fff':C.textLight, transition:'all .15s', whiteSpace:'nowrap' });
  return (
    <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
      <button type="button" onClick={()=>onChange(today)} style={chip(mode==='today')}>☀ Today</button>
      <button type="button" onClick={()=>onChange(addDaysKey(1))} style={chip(value===addDaysKey(1))}>Tomorrow</button>
      <label style={{ ...chip(mode==='date' && value!==addDaysKey(1)), position:'relative', display:'inline-flex', alignItems:'center', gap:5 }}>
        📅 {mode==='date' && value!==addDaysKey(1) ? prettyDue(value).label : 'Pick date'}
        <input type="date" value={value||''} onChange={e=>onChange(e.target.value||null)}
          style={{ position:'absolute', inset:0, opacity:0, cursor:'pointer', width:'100%' }}/>
      </label>
      <button type="button" onClick={()=>onChange(null)} style={chip(mode==='none')}>No date</button>
    </div>
  );
};

const TaskRow = ({ t, goals, onToggle, onUpdate, onRemove, onStatus, hideStatus=false }) => {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState(t.text);
  const [open, setOpen] = useState(false);
  const due = prettyDue(t.calendarDate);
  const tones = DUE_TONES();
  const linkedGoal = t.goalId ? goals.find(g=>g.id===t.goalId) : null;
  const saveText = () => { setEditing(false); if (text.trim() && text.trim()!==t.text) onUpdate({ text:text.trim() }); else setText(t.text); };
  return (
    <div className="task-row" style={{ borderRadius:14, background:C.card, border:`0.5px solid ${open?C.rose+'60':C.border}`, transition:'all .18s', boxShadow: open?`0 8px 24px ${C.rose}14`:'none' }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px' }}>
        <Checkbox checked={t.done} onChange={onToggle} />
        <div style={{ flex:1, minWidth:0 }}>
          {editing ? (
            <input autoFocus value={text} onChange={e=>setText(e.target.value)} onBlur={saveText}
              onKeyDown={e=>{ if(e.key==='Enter') saveText(); if(e.key==='Escape'){ setText(t.text); setEditing(false); } }}
              style={{ width:'100%', padding:'3px 8px', borderRadius:8, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:14, fontFamily:'inherit' }}/>
          ) : (
            <div onClick={()=>!t.done&&setEditing(true)} style={{ fontSize:14, color:t.done?C.textMuted:C.text, textDecoration:t.done?'line-through':'none', cursor:t.done?'default':'text', lineHeight:1.45, wordBreak:'break-word' }}>{t.text}</div>
          )}
          {(!hideStatus || due || t.repeat || linkedGoal || t.venture || t.notes) && (
            <div style={{ display:'flex', gap:5, marginTop:4, flexWrap:'wrap', alignItems:'center' }}>
              {!hideStatus && (()=>{ const st = TASK_STATUS.find(x=>x.key===taskStatusKey(t)); return (
                <span style={{ fontSize:10.5, padding:'2px 8px', borderRadius:10, background: st.key==='progress'?`${C.accent}22`:st.key==='done'?'#3f9a6a1f':`${C.lavender}80`, color: st.key==='todo'?C.textLight:st.tone(), fontWeight:500 }}>{st.icon} {st.label}</span>
              ); })()}
              {due && <span style={{ fontSize:10.5, padding:'2px 8px', borderRadius:10, background:tones[due.tone].bg, color:tones[due.tone].fg, fontWeight:500 }}>{due.tone==='overdue'?'⚠ ':''}{due.label}</span>}
              {t.repeat && <span style={{ fontSize:10.5, color:C.accent }}>↻ {REPEAT_OPTS.find(r=>r[0]===t.repeat)?.[1]}</span>}
              {linkedGoal && <span style={{ fontSize:10.5, color:C.textLight }}>🎯 {linkedGoal.title}</span>}
              {t.venture && <span style={{ fontSize:10.5, color:C.textLight }}>💼 {t.venture}</span>}
              {t.notes && <span style={{ fontSize:10.5, color:C.textMuted }}>✎ note</span>}
            </div>
          )}
        </div>
        {!t.done && (
          <button onClick={()=>onUpdate({ calendarDate: t.calendarDate===toDateKey()?null:toDateKey() })} title={t.calendarDate===toDateKey()?'Remove from today':'Do it today'}
            className={`row-quick${t.calendarDate===toDateKey()?' on':''}`} style={{ padding:'4px 10px', borderRadius:20, fontSize:11, border:`0.5px solid ${C.border}`, background:t.calendarDate===toDateKey()?`${C.rose}14`:'transparent', color:t.calendarDate===toDateKey()?C.rose:C.textMuted, cursor:'pointer', fontFamily:'inherit', flexShrink:0 }}>☀</button>
        )}
        <button onClick={()=>setOpen(o=>!o)} title="Details" style={{ width:28, height:28, borderRadius:8, border:'none', background:open?`${C.pink}90`:'transparent', color:C.textMuted, cursor:'pointer', fontSize:15, flexShrink:0 }}>⋯</button>
      </div>
      {open && (
        <div className="fade-in" style={{ padding:'4px 14px 14px 46px', display:'flex', flexDirection:'column', gap:10 }}>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
            {TASK_STATUS.map(st=>{ const on = taskStatusKey(t)===st.key; return (
              <button key={st.key} type="button" onClick={()=>onStatus ? onStatus(st.key) : st.key==='done' ? onToggle() : onUpdate({ done:false, completedDate:null, status: st.key==='progress'?'progress':null })}
                style={{ padding:'4px 11px', borderRadius:20, fontSize:11, cursor:'pointer', fontFamily:'inherit', border:`0.5px solid ${on?st.tone():C.border}`, background:on?`${st.tone()}1f`:'transparent', color:on?st.tone():C.textLight }}>{st.icon} {st.label}</button>
            ); })}
          </div>
          <WhenPicker compact value={t.calendarDate||null} onChange={v=>onUpdate({ calendarDate:v })}/>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <select value={t.repeat||''} onChange={e=>onUpdate({ repeat:e.target.value||null })} style={{ padding:'6px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12, fontFamily:'inherit' }}>
              {REPEAT_OPTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
            {goals.length>0 && (
              <select value={t.goalId||''} onChange={e=>onUpdate({ goalId:e.target.value?Number(e.target.value):null })} style={{ padding:'6px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12, fontFamily:'inherit', maxWidth:220 }}>
                <option value="">No goal</option>
                {goals.map(g=><option key={g.id} value={g.id}>🎯 {g.title}</option>)}
              </select>
            )}
          </div>
          <textarea value={t.notes||''} onChange={e=>onUpdate({ notes:e.target.value })} placeholder="Notes…" rows={2}
            style={{ padding:'8px 10px', borderRadius:10, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12.5, fontFamily:'inherit', resize:'vertical' }}/>
          <div style={{ display:'flex', justifyContent:'flex-end' }}>
            <button onClick={onRemove} style={{ fontSize:11.5, color:'#d05a5a', background:'none', border:'none', cursor:'pointer' }}>Delete task</button>
          </div>
        </div>
      )}
    </div>
  );
};

const TaskGroup = ({ title, count, tone, children, collapsible=false }) => {
  const [shut, setShut] = useState(false);
  return (
    <div style={{ marginBottom:22 }}>
      <button onClick={()=>collapsible&&setShut(s=>!s)} style={{ display:'flex', alignItems:'center', gap:8, background:'none', border:'none', padding:'0 2px', marginBottom:9, cursor:collapsible?'pointer':'default' }}>
        <span style={{ fontSize:11, fontWeight:600, letterSpacing:.8, textTransform:'uppercase', color:tone||C.textMuted }}>{title}</span>
        <span style={{ fontSize:10.5, padding:'1px 7px', borderRadius:10, background:`${C.accent}22`, color:C.text }}>{count}</span>
        {collapsible && <span style={{ fontSize:10, color:C.textMuted }}>{shut?'▸':'▾'}</span>}

const TasksPanel = ({ sub }) => {
  const storageKey = 'nylaos_tasks';
  const [tasks, setTasks] = useState(()=>JSON.parse(localStorage.getItem(storageKey)||'[]'));
  const goals = JSON.parse(localStorage.getItem('nylaos_goals')||'[]');
  const today = toDateKey();
  const defaultWhen = sub==='Today' ? today : sub==='Upcoming' ? addDaysKey(1) : null;
  const [input, setInput] = useState('');
  const [when, setWhen] = useState(defaultWhen);
  const [query, setQuery] = useState('');

  const save = t => { setTasks(t); localStorage.setItem(storageKey, JSON.stringify(t)); };
  const add = () => {
    if (!input.trim()) return;
    save([...tasks, { id:Date.now(), text:input.trim(), done:false, calendarDate:when||null, created:new Date().toISOString() }]);
    setInput('');
    toast(when===today?'Added to today ☀':when?`Added for ${prettyDue(when).label}`:'Task added','success',1400);
  };
  const update = (id, patch) => save(tasks.map(t=>t.id===id?{...t,...patch}:t));
  const toggle = id => {
    const { list, spawned, nowDone } = toggleTaskIn(tasks, id);
    save(list);
    if (spawned) toast(`Done ✓ — next one ${prettyDue(spawned.calendarDate).label.toLowerCase()}`,'success',1800);
    else if (nowDone) toast('Done ✓','success',1200);
  };
  const remove = id => {
    const t = tasks.find(x=>x.id===id);
    if (t) addToTrash('task', t.text, t, storageKey);
    save(tasks.filter(x=>x.id!==id));
    toast('Moved to Recently Deleted','info',1500);
  };

  if (sub==='Recently Deleted') return <TrashPanel type={['task','project']} />;
  if (sub==='To Do List' || sub==='Kanban') return <ToDoBoard />;
  if (sub==='Eisenhower') return <EisenhowerMatrix storageKey={storageKey} />;
  if (sub==='Projects') return <ProjectsPanel />;

  const mine = tasks.filter(t=>t.source!=='calendar' && (!query || t.text.toLowerCase().includes(query.toLowerCase())));
  const open = mine.filter(t=>!t.done);
  const row = t => <TaskRow key={t.id} t={t} goals={goals} onToggle={()=>toggle(t.id)} onUpdate={p=>update(t.id,p)} onRemove={()=>remove(t.id)} onStatus={k=>{ save(withTaskStatus(tasks, t.id, k)); if(k==='done') toast('Done ✓','success',1100); }}/>;
  const byDate = (a,b)=>(a.calendarDate||'9999').localeCompare(b.calendarDate||'9999') || a.id-b.id;

  let body;
  if (sub==='Completed') {
    const done = mine.filter(t=>t.done).sort((a,b)=>(b.completedDate||'').localeCompare(a.completedDate||''));
    const groups = {};
    done.forEach(t=>{ const k=t.completedDate||'Earlier'; (groups[k]=groups[k]||[]).push(t); });
    body = done.length===0
      ? <EmptyState icon="✓" title="Nothing finished yet" text="Check something off and it lands here." />
      : Object.entries(groups).map(([k,list])=><TaskGroup key={k} title={k==='Earlier'?'Earlier':prettyDue(k).label} count={list.length}>{list.map(row)}</TaskGroup>);
  } else if (sub==='Today') {
    const overdue = open.filter(t=>t.calendarDate && t.calendarDate<today).sort(byDate);
    const todays = open.filter(t=>t.calendarDate===today);
    const doneToday = mine.filter(t=>t.done && t.completedDate===today);
    const total = todays.length + overdue.length + doneToday.length;
    const pct = total ? Math.round(doneToday.length/total*100) : 0;
    body = (<>
      {total>0 && (
        <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:20, padding:'14px 18px', borderRadius:16, background:C.gradA }}>
          <div style={{ width:46, height:46, borderRadius:'50%', background:`conic-gradient(${C.rose} ${pct*3.6}deg, ${C.card} 0)`, display:'grid', placeItems:'center', flexShrink:0 }}>
            <div style={{ width:36, height:36, borderRadius:'50%', background:C.card, display:'grid', placeItems:'center', fontSize:11, fontWeight:600, color:C.rose }}>{pct}%</div>
          </div>
          <div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:17, color:C.rose }}>{doneToday.length} of {total} done today</div>
            <div style={{ fontSize:12, color:C.textLight }}>{pct===100?'You cleared the day. ✨':overdue.length?(overdue.length===1?'1 carried over — move it or let it go.':`${overdue.length} carried over — move them or let them go.`):'One at a time.'}</div>
          </div>
        </div>
      )}
      {overdue.length>0 && (
        <TaskGroup title="Overdue" count={overdue.length} tone="#d05a5a">
          <div style={{ display:'flex', justifyContent:'flex-end', marginTop:-4 }}>
            <button onClick={()=>save(tasks.map(t=>overdue.some(o=>o.id===t.id)?{...t,calendarDate:today}:t))} style={{ fontSize:11.5, color:C.rose, background:'none', border:'none', cursor:'pointer' }}>Move all to today →</button>
          </div>
          {overdue.map(row)}
        </TaskGroup>
      )}
      <TaskGroup title="Today" count={todays.length} tone={C.rose}>
        {todays.length ? todays.map(row) : <div style={{ fontSize:13, color:C.textMuted, fontStyle:'italic', padding:'6px 2px' }}>Nothing planned for today yet. Add one above, or tap ☀ on any task.</div>}
      </TaskGroup>
      {doneToday.length>0 && <TaskGroup title="Done today" count={doneToday.length} collapsible>{doneToday.map(row)}</TaskGroup>}
    </>);
  } else if (sub==='Upcoming') {
    const future = open.filter(t=>t.calendarDate && t.calendarDate>today).sort(byDate);
    const groups = {};
    future.forEach(t=>{ (groups[t.calendarDate]=groups[t.calendarDate]||[]).push(t); });
    body = future.length===0
      ? <EmptyState icon="📅" title="Nothing scheduled ahead" text="Give a task a date and it shows up here, grouped by day." />
      : Object.entries(groups).map(([k,list])=>{
          const d = new Date(k+'T00:00');
          return <TaskGroup key={k} title={`${prettyDue(k).label}${prettyDue(k).label.includes(' ')?'':' · '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`} count={list.length}>{list.map(row)}</TaskGroup>;
        });
  } else {
    const dated = open.filter(t=>t.calendarDate).sort(byDate);
    const undated = open.filter(t=>!t.calendarDate);
    body = open.length===0
      ? <EmptyState icon="✦" title="All clear" text="Add a task above — date it, put it on today, or leave it for whenever." />
      : (<>
          {undated.length>0 && <TaskGroup title="Anytime" count={undated.length}>{undated.map(row)}</TaskGroup>}
          {dated.length>0 && <TaskGroup title="Scheduled" count={dated.length}>{dated.map(row)}</TaskGroup>}
        </>);
  }

  const openCount = open.length;
  const todayCount = open.filter(t=>t.calendarDate && t.calendarDate<=today).length;
  return (
    <div className="fade-in" style={{ maxWidth:680 }}>
      <PageTitle subtitle={`${openCount} open · ${todayCount} due today or earlier`}
        right={<input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Filter…" style={{ width:150, padding:'7px 12px', borderRadius:20, border:`0.5px solid ${C.border}`, background:C.pinkLight, color:C.text, fontSize:12.5, fontFamily:'inherit' }}/>}>
        {sub}
      </PageTitle>
      {sub!=='Completed' && (
        <Card style={{ padding:'14px 16px', marginBottom:22, boxShadow:`0 10px 30px ${C.rose}10` }}>
          <div style={{ display:'flex', gap:10, marginBottom:10 }}>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Add a task…"
              style={{ flex:1, padding:'10px 4px', border:'none', background:'transparent', color:C.text, fontSize:15, fontFamily:'inherit' }}/>
            <VoiceButton onText={t=>setInput(v=>(v?v+' ':'')+t)} />
            <button onClick={add} disabled={!input.trim()} style={{ padding:'9px 20px', borderRadius:12, background:input.trim()?C.rose:`${C.rose}55`, color:'#fff', border:'none', fontSize:13.5, fontWeight:500, cursor:input.trim()?'pointer':'default' }}>Add</button>
          </div>
          <WhenPicker value={when} onChange={setWhen}/>
        </Card>
      )}
      {body}
    </div>
  );
};

      <Card style={{ padding:'10px 14px', marginBottom:18, display:'flex', gap:10 }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder={placeholder}
          style={{ flex:1, padding:'8px 4px', border:'none', background:'transparent', color:C.text, fontSize:14.5, fontFamily:'inherit' }}/>

/* ── Photos for agent chats ─────────────────────────────────────────
   Show an agent a screenshot, a whiteboard, a receipt, a photo of a
   page. Pictures are shrunk to what Claude actually reads (1568px on
   the long side) and kept in IndexedDB — localStorage holds the whole
   OS and one phone photo would fill it.
   The picker has no type filter on purpose: filtering is what greys
   out files you can plainly see, HEIC photos worst of all. */
const photoDb = (() => {
  let _db = null;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open('nylaos_photo_store', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('photos');
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = rej;
  });
  return {
    save: async (key, dataUrl) => {
      const d = await open();
      return new Promise((res, rej) => { const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').put(dataUrl,key); tx.oncomplete=res; tx.onerror=rej; });
    },
    load: async (key) => {
      const d = await open();
      return new Promise((res, rej) => { const req=d.transaction('photos','readonly').objectStore('photos').get(key); req.onsuccess=e=>res(e.target.result); req.onerror=rej; });
    },
    del: async (key) => {
      const d = await open();
      return new Promise((res, rej) => { const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').delete(key); tx.oncomplete=res; tx.onerror=rej; });
    },
  };
})();

const PDF_MAX_BYTES = 25 * 1024 * 1024;
// Built from the bytes with the type we sniffed, not the one the device
// reported: a PDF picked from some apps arrives claiming to be nothing at all,
// and a mislabelled one would be dropped on the way to Claude.
async function base64DataUrl(file, mediaType) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let binary = '';
  for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return `data:${mediaType};base64,${btoa(binary)}`;
}

// Turns one file into something Claude can be shown: a picture, a PDF sent
// whole, or the text of a document.
async function readAttachment(file) {
  const name = file.name || 'file';
  const kind = await uploadKind(file);
  if (kind === 'image') return { kind: 'image', name, dataUrl: await imageUploadDataUrl(file, 1568, 0.85) };
  if (kind === 'pdf') {
    if (file.size > PDF_MAX_BYTES) throw new Error(`${name} is too big to send. 25MB is the limit for a PDF.`);
    return { kind: 'pdf', name, dataUrl: await base64DataUrl(file, 'application/pdf') };
  }
  const got = await readOneUpload(file, { textOnly: true });
  const text = (got.text || '').trim();
  if (!text) throw new Error(`Couldn't find anything to read in ${name}.`);
  return { kind: 'text', name, text };
}

// Reads attachments back out of IndexedDB so earlier pictures stay part of the
// conversation, not just the newest one.
async function messagesWithPhotos(msgs) {
  const out = [];
  for (const m of msgs) {
    if (m.role !== 'user' || !m.photos || !m.photos.length) { out.push({ role: m.role, content: m.text }); continue; }
    const blocks = [];
    const documents = [];
    for (const id of m.photos) {
      const saved = await photoDb.load(id).catch(() => null);
      if (!saved) continue;
      // Older chats saved a plain data URL for a photo; newer ones save the
      // whole attachment. Both still open.
      const a = typeof saved === 'string' ? { kind: 'image', dataUrl: saved, name: 'photo' } : saved;
      if (a.kind === 'image') {
        const match = /^data:(image\/[a-z+]+);base64,(.*)$/i.exec(a.dataUrl || '');
        if (match) blocks.push({ type: 'image', source: { type: 'base64', media_type: match[1], data: match[2] } });
      } else if (a.kind === 'pdf') {
        const match = /^data:application\/pdf;base64,(.*)$/i.exec(a.dataUrl || '');
        if (match) blocks.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: match[1] } });
      } else if (a.text) {
        documents.push(`--- ${a.name} ---\n${a.text}`);
      }
    }
    const said = m.text || 'Have a look at this.';
    blocks.push({ type: 'text', text: documents.length ? `${said}\n\n${documents.join('\n\n')}` : said });
    out.push({ role: 'user', content: blocks });
  }
  return out;
}

// An attachment that fills itself in from IndexedDB once it's on screen:
// the picture itself, or a small chip naming the document.
function ChatPhoto({ id, size }) {
  const [att, setAtt] = React.useState(null);

}

/* ── Shared chat pieces ──────────────────────────────────────────────
   One composer for every chat: attach photos, PDFs or documents (📎,
   paste, or drop), talk instead of type (mic), Enter to send and
   Shift+Enter for a new line. Replies render light markdown. */
const useAttachments = () => {
  const [items, setItems] = useState([]);
  const [busy, setBusy] = useState(false);
  const add = async (files) => {
    const list = Array.from(files||[]);
    if (!list.length) return;
    setBusy(true);
    for (const file of list) {
      if (items.length + list.indexOf(file) >= 5) { toast('Five files at a time is the limit','error'); break; }
      try {
        const att = await readAttachment(file);
        const id = 'agentatt-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
        await photoDb.save(id, att);
        setItems(p=>[...p,{ ...att, id }]);
      } catch(err) { toast(err?.message || `Couldn't read ${file.name||'that file'}`,'error',3500); }
    }
    setBusy(false);
  };
  const remove = id => { photoDb.del(id).catch(()=>{}); setItems(p=>p.filter(x=>x.id!==id)); };
  const take = () => { const ids = items.map(i=>i.id); setItems([]); return ids; };
  return { items, add, remove, take, busy };
};

// Light markdown for replies: headings, **bold**, *italic*, bullets, numbered lists.
const RichReply = ({ text }) => {
  const inline = (str, key) => {
    const parts = str.split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*|`[^`]+`)/g);
    return parts.map((p,i)=> p.startsWith('**')&&p.endsWith('**') ? <b key={key+'-'+i}>{p.slice(2,-2)}</b>
      : p.startsWith('`')&&p.endsWith('`') ? <code key={key+'-'+i} style={{ background:'rgba(0,0,0,.06)', borderRadius:4, padding:'0 4px' }}>{p.slice(1,-1)}</code>
      : p.length>2 && p.startsWith('*')&&p.endsWith('*') ? <i key={key+'-'+i}>{p.slice(1,-1)}</i> : p);
  };
  const lines = String(text||'').split('\n');
  return (
    <div style={{ whiteSpace:'normal' }}>
      {lines.map((ln,i)=>{
        const h = ln.match(/^#{1,4}\s+(.*)/);
        if (h) return <div key={i} style={{ fontWeight:600, marginTop:i?8:0, marginBottom:2 }}>{inline(h[1],i)}</div>;
        const b = ln.match(/^\s*[-*•]\s+(.*)/);
        if (b) return <div key={i} style={{ display:'flex', gap:7, paddingLeft:4 }}><span>•</span><span>{inline(b[1],i)}</span></div>;
        const n = ln.match(/^\s*(\d+)[.)]\s+(.*)/);
        if (n) return <div key={i} style={{ display:'flex', gap:7, paddingLeft:4 }}><span>{n[1]}.</span><span>{inline(n[2],i)}</span></div>;
        if (!ln.trim()) return <div key={i} style={{ height:7 }}/>;
        return <div key={i}>{inline(ln,i)}</div>;
      })}
    </div>
  );
};

/* ── PDF IndexedDB Storage ──────────────────────────────────────── */
const pdfDb = (() => {
  let _db = null;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open('nylaos_pdf_store', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('pdfs');
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = rej;
  });
  return {
    save: async (key, blob) => {
      const d = await open();
      return new Promise((res, rej) => { const tx=d.transaction('pdfs','readwrite'); tx.objectStore('pdfs').put(blob,key); tx.oncomplete=res; tx.onerror=rej; });
    },
    load: async (key) => {
      const d = await open();
      return new Promise((res, rej) => { const req=d.transaction('pdfs','readonly').objectStore('pdfs').get(key); req.onsuccess=e=>res(e.target.result); req.onerror=rej; });
    },
  };
})();

const loadPdfsInElement = async (el) => {
  const refs = el.querySelectorAll('[data-pdf-key]');
  for (const ref of refs) {
    const key = ref.getAttribute('data-pdf-key');
    const name = ref.getAttribute('data-pdf-name') || 'PDF';
    try {
      const blob = await pdfDb.load(key);
      if (blob) {
        const url = URL.createObjectURL(blob);
        ref.innerHTML = `<p style="font-size:12px;color:#9c7090;margin:0 0 6px 0;padding:0">📄 ${name}</p><iframe src="${url}" width="100%" height="720" style="border:none;border-radius:10px;display:block;box-shadow:0 2px 12px rgba(0,0,0,0.08)"></iframe>`;
      } else {
        ref.innerHTML = `<p style="font-size:12px;color:#c4607a;margin:0">📄 ${name} — PDF not found. Please re-upload.</p>`;
      }
    } catch(e) { console.error('PDF load error', e); }
  }
};

/* ── Rich Text Editor (module-level to avoid remount) ───────────── */
const RichEditorComponent = ({ pageId, initialContent, onUpdate, onMount }) => {
  const ref = useRef(null);
  const [pastePrompt, setPastePrompt] = useState(null); // {html, plain, x, y}

  useEffect(() => {
    if (ref.current) {
      ref.current.innerHTML = initialContent || '<p><br></p>';
      onMount(ref.current);
      ref.current.focus();
      loadPdfsInElement(ref.current);
    }
  }, []);

  const handlePaste = (e) => {
    const html = e.clipboardData.getData('text/html');
    const plain = e.clipboardData.getData('text/plain');
    // Only intercept if there's actual rich content (not just plain text)
    if (!html || html.replace(/<[^>]+>/g,'').trim() === plain.trim()) return;
    e.preventDefault();
    // Position the prompt near the cursor
    const sel = window.getSelection();
    let x = 120, y = 80;
    if (sel && sel.rangeCount) {
      const r = sel.getRangeAt(0).getBoundingClientRect();
      const er = ref.current.getBoundingClientRect();
      x = Math.max(0, r.left - er.left);
      y = Math.max(0, r.top - er.top + 24);
    }
    setPastePrompt({ html, plain, x, y });
  };

  const commitPaste = (useFormatting) => {
    if (!pastePrompt) return;
    ref.current.focus();
    if (useFormatting) {
      document.execCommand('insertHTML', false, pastePrompt.html);
    } else {
      // Strip HTML — paste clean plain text
      const text = pastePrompt.plain.replace(/\n{2,}/g,'\n').replace(/\n/g,'<br>');
      document.execCommand('insertHTML', false, text);
    }
    if (ref.current) onUpdate(ref.current.innerHTML);
    setPastePrompt(null);
  };

  return (
    <div style={{ flex:1, overflowY:'auto', position:'relative', display:'flex', flexDirection:'column' }}>
      {pastePrompt && (
        <div style={{ position:'absolute', left: Math.min(pastePrompt.x, 260), top: pastePrompt.y, zIndex:100,
          background:C.card, border:`0.5px solid ${C.border}`, borderRadius:12, boxShadow:'0 4px 20px rgba(196,96,122,0.15)',
          padding:'10px 14px', display:'flex', flexDirection:'column', gap:7, minWidth:210 }}>
          <div style={{ fontSize:11, fontWeight:600, color:C.roseDark, letterSpacing:0.3, marginBottom:2 }}>How would you like to paste?</div>
          <button onMouseDown={e=>{e.preventDefault();commitPaste(true);}}
            style={{ padding:'7px 12px', borderRadius:8, background:C.pinkLight, border:`0.5px solid ${C.border}`, color:C.text, fontSize:12, cursor:'pointer', textAlign:'left', fontWeight:500 }}>
            ✦ Keep formatting
          </button>
          <button onMouseDown={e=>{e.preventDefault();commitPaste(false);}}
            style={{ padding:'7px 12px', borderRadius:8, background:'transparent', border:`0.5px solid ${C.border}`, color:C.textLight, fontSize:12, cursor:'pointer', textAlign:'left' }}>
            Aa Plain text only
          </button>
          <button onMouseDown={e=>{e.preventDefault();setPastePrompt(null);}}
            style={{ fontSize:10.5, color:C.textMuted, background:'none', border:'none', cursor:'pointer', textAlign:'left', padding:'2px 0' }}>Cancel</button>
        </div>
      )}
      <div ref={ref} contentEditable suppressContentEditableWarning className="rich-editor"
        onInput={() => { if(ref.current) onUpdate(ref.current.innerHTML); }}
        onPaste={handlePaste}
        style={{ flex:1, overflowY:'auto', padding:'28px 36px', outline:'none', fontSize:14.5, lineHeight:1.9, color:'#401828', minHeight:300, fontFamily:"'DM Sans',sans-serif" }}
      />
    </div>
  );
};

/* ── Notebook helpers (module-level so they're always in scope) ── */
const nbDescFids = (folders, fid) => {
  const result=[fid]; const queue=[fid];
  while(queue.length){ const c=queue.shift(); folders.filter(f=>f.parentId===c).forEach(f=>{result.push(f.id);queue.push(f.id);}); }
  return result;
};

/* ── Note Graph (force-directed) ────────────────────────────────── */
const NoteGraph = ({ pages, folders, activePid, onSelectPage }) => {
  const canvasRef = useRef(null);
  const activePidRef = useRef(activePid);
  const tooltipRef = useRef(null);
  useEffect(()=>{ activePidRef.current=activePid; },[activePid]);

  // Palette for folder clusters — soft, distinct
  const FOLDER_PALETTE = ['#c4607a','#9080d8','#5aab8c','#d4842a','#6aaccc','#b86aaa','#7a9a40','#cc5060'];
  const folderColorMap = {};
  (folders||[]).forEach((f,i)=>{ folderColorMap[f.id]=FOLDER_PALETTE[i%FOLDER_PALETTE.length]; });

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas||!pages.length) return;
    const resize=()=>{ canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; draw(); };
    canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
    const W=()=>canvas.width, H=()=>canvas.height;
    const ctx=canvas.getContext('2d');

    // Build edges first so we can size nodes by degree
    const edgeSet=new Set();
    const edges=[];
    pages.forEach(p=>{
      const text=(p.content||'').replace(/<[^>]+>/g,' ');
      const re=/\[\[([^\]]+)\]\]/g; let m;
      while((m=re.exec(text))!==null){
        const target=pages.find(x=>x.name.toLowerCase()===m[1].toLowerCase());
        if(target&&target.id!==p.id){
          const key=[p.id,target.id].sort().join('-');
          if(!edgeSet.has(key)){ edgeSet.add(key); edges.push({s:p.id,t:target.id}); }
        }
      }
      // Auto-link pages in the same folder that share hashtags
      const tagRe=/#([\w-]+)/g; const tags=[];
      while((m=tagRe.exec(text))!==null) tags.push(m[1].toLowerCase());
      if(tags.length){
        pages.filter(q=>q.id!==p.id&&q.folderId===p.folderId).forEach(q=>{
          const qt=(q.content||'').replace(/<[^>]+>/g,' ');
          const hasSameTag=tags.some(t=>qt.toLowerCase().includes('#'+t));
          if(hasSameTag){
            const key=[p.id,q.id].sort().join('-');
            if(!edgeSet.has(key)){ edgeSet.add(key); edges.push({s:p.id,t:q.id}); }
          }
        });
      }
    });

    const degreeMap={};
    pages.forEach(p=>{ degreeMap[p.id]=0; });
    edges.forEach(e=>{ degreeMap[e.s]=(degreeMap[e.s]||0)+1; degreeMap[e.t]=(degreeMap[e.t]||0)+1; });

    // Build nodes — initial positions clustered loosely by folder
    const folderIds=[...new Set(pages.map(p=>p.folderId))];
    const nodes=pages.map(p=>{
      const fi=folderIds.indexOf(p.folderId);
      const angle=(fi/Math.max(folderIds.length,1))*Math.PI*2;
      const spread=0.28;
      return {
        id:p.id, name:p.name, folderId:p.folderId,
        x:W()/2+Math.cos(angle)*W()*spread+(Math.random()-0.5)*80,
        y:H()/2+Math.sin(angle)*H()*spread+(Math.random()-0.5)*80,
        vx:0, vy:0
      };
    });
    const nodeMap={};
    nodes.forEach(n=>nodeMap[n.id]=n);

    let animId, hoverId=null;
    const CREAM=_dk?'#1c1520':'#fdfaf7', LAVENDER='#d4c0f0';
    const LABEL_COLOR=_dk?'#f0e0e8ee':'#3a1828ee', LEGEND_COLOR=_dk?'#e8d0dccc':'#5a2a40cc';

    const draw=()=>{
      const cw=canvas.width, ch=canvas.height;
      ctx.fillStyle=CREAM; ctx.fillRect(0,0,cw,ch);
      // Grid dots
      ctx.fillStyle=_dk?'#3a2a3560':'#e8d8e040';
      for(let gx=0;gx<cw;gx+=28) for(let gy=0;gy<ch;gy+=28){
        ctx.beginPath(); ctx.arc(gx,gy,1,0,Math.PI*2); ctx.fill();
      }
      // Edges
      edges.forEach(e=>{
        const a=nodeMap[e.s],b=nodeMap[e.t]; if(!a||!b) return;
        const isHighlit=hoverId&&(e.s===hoverId||e.t===hoverId);
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=isHighlit?`${LAVENDER}ff`:`${LAVENDER}70`;
        ctx.lineWidth=isHighlit?2:1.2; ctx.stroke();
      });
      // Nodes
      const curActive=activePidRef.current;
      nodes.forEach(n=>{
        const isActive=n.id===curActive;
        const isHover=n.id===hoverId;
        const deg=degreeMap[n.id]||0;
        const r=Math.max(6,Math.min(14, 7+deg*1.8))+(isActive?3:0);
        const color=folderColorMap[n.folderId]||'#9080d8';
        if(isActive||isHover){
          ctx.beginPath(); ctx.arc(n.x,n.y,r+7,0,Math.PI*2);
          ctx.fillStyle=color+'30'; ctx.fill();
        }
        const grad=ctx.createRadialGradient(n.x-r*0.3,n.y-r*0.3,1,n.x,n.y,r);
        grad.addColorStop(0,color+'ff');
        grad.addColorStop(1,color+'99');
        ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
        ctx.strokeStyle=isActive?color:'#fff8';
        ctx.lineWidth=isActive?2:1; ctx.stroke();
        // Label
        const showLabel=isActive||isHover||deg>=2||nodes.length<=12;
        if(showLabel){
          const label=n.name.length>16?n.name.slice(0,15)+'…':n.name;
          ctx.font=`${isActive||isHover?600:400} ${isActive?11:10}px DM Sans,sans-serif`;
          ctx.textAlign='center';
          ctx.fillStyle=LABEL_COLOR;
          ctx.fillText(label,n.x,n.y-r-5);
        }
      });
      // Legend (folder → color)
      const legendFolders=(folders||[]).filter(f=>pages.some(p=>p.folderId===f.id));
      let lx=14, ly=14;
      legendFolders.forEach(f=>{
        const col=folderColorMap[f.id]||'#9080d8';
        ctx.beginPath(); ctx.arc(lx+5,ly+5,5,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
        ctx.font='500 10px DM Sans,sans-serif'; ctx.textAlign='left';
        ctx.fillStyle=LEGEND_COLOR;
        ctx.fillText(f.name,lx+13,ly+9);
        lx+=ctx.measureText(f.name).width+30;
        if(lx>canvas.width-80){ lx=14; ly+=18; }
      });
    };

    const tick=()=>{
      const cw=canvas.width, ch=canvas.height;
      nodes.forEach((a,i)=>{
        nodes.forEach((b,j)=>{ if(j<=i) return;
          const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          const f=Math.min(6000/(d*d),80);
          a.vx-=dx/d*f; a.vy-=dy/d*f; b.vx+=dx/d*f; b.vy+=dy/d*f;
        });
      });
      edges.forEach(e=>{
        const a=nodeMap[e.s],b=nodeMap[e.t]; if(!a||!b) return;
        const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        const f=(d-120)*0.032;
        a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f;
      });
      // Same-folder soft attraction
      nodes.forEach((a,i)=>{
        nodes.forEach((b,j)=>{ if(j<=i||a.folderId!==b.folderId) return;
          const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
          if(d>160){ const f=(d-160)*0.008; a.vx+=dx/d*f; a.vy+=dy/d*f; b.vx-=dx/d*f; b.vy-=dy/d*f; }
        });
      });
      nodes.forEach(n=>{
        n.vx+=(cw/2-n.x)*0.005; n.vy+=(ch/2-n.y)*0.005;
        n.vx*=0.82; n.vy*=0.82;
        n.x=Math.max(40,Math.min(cw-40,n.x+n.vx));
        n.y=Math.max(40,Math.min(ch-40,n.y+n.vy));
      });
      draw();
      animId=requestAnimationFrame(tick);
    };
    tick();

    const getHit=e=>{
      const rect=canvas.getBoundingClientRect();
      const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
      const mx=(e.clientX-rect.left)*sx, my=(e.clientY-rect.top)*sy;
      return nodes.find(n=>Math.sqrt((n.x-mx)**2+(n.y-my)**2)<20);
    };
    const onClick=e=>{ const hit=getHit(e); if(hit) onSelectPage(hit.id); };
    const onMove=e=>{
      const hit=getHit(e);
      const newHover=hit?hit.id:null;
      if(newHover!==hoverId){ hoverId=newHover; canvas.style.cursor=newHover?'pointer':'default'; }
      // tooltip
      const tip=tooltipRef.current;
      if(tip){
        if(hit){ const rect=canvas.getBoundingClientRect(); tip.style.left=(e.clientX-rect.left+10)+'px'; tip.style.top=(e.clientY-rect.top-28)+'px'; tip.textContent=hit.name; tip.style.opacity=1; }
        else tip.style.opacity=0;
      }
    };
    const onLeave=()=>{ hoverId=null; if(tooltipRef.current) tooltipRef.current.style.opacity=0; };
    canvas.addEventListener('click',onClick);
    canvas.addEventListener('mousemove',onMove);
    canvas.addEventListener('mouseleave',onLeave);
    window.addEventListener('resize',resize);
    return()=>{ cancelAnimationFrame(animId); canvas.removeEventListener('click',onClick); canvas.removeEventListener('mousemove',onMove); canvas.removeEventListener('mouseleave',onLeave); window.removeEventListener('resize',resize); };
  },[pages.length, pages.map(p=>p.id+p.name+p.folderId).join(',')]);

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:C.cream,minWidth:0,position:'relative'}}>
      <div style={{padding:'10px 18px',borderBottom:`0.5px solid ${C.border}`,display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <span style={{fontFamily:"'DM Serif Display',serif",fontSize:15,color:C.rose}}>Graph View</span>
        <span style={{fontSize:11,color:C.textMuted}}>{pages.length} notes · nodes sized by connections · colors by notebook</span>
      </div>
      <div style={{position:'relative',flex:1,minHeight:0}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}}/>
        <div ref={tooltipRef} style={{position:'absolute',pointerEvents:'none',background:'#3a1828ee',color:'#fff',fontSize:11,padding:'4px 9px',borderRadius:7,opacity:0,transition:'opacity 0.1s',whiteSpace:'nowrap',zIndex:10}}/>
      </div>
    </div>
  );
};

  const [hoverPid, setHoverPid] = useState(null);

  useEffect(()=>{ const p=pages.find(p=>p.id===activePid); if(p) setHeaderTitle(p.name); },[activePid]);
  useEffect(()=>{
    const onSel = () => {
      try { setFmt({bold:document.queryCommandState('bold'),italic:document.queryCommandState('italic'),underline:document.queryCommandState('underline'),strike:document.queryCommandState('strikeThrough')}); } catch(e){}
    };
    document.addEventListener('selectionchange', onSel);
    return () => document.removeEventListener('selectionchange', onSel);
  }, []);

  const saveFolders = f => { setFolders(f); localStorage.setItem(FK,JSON.stringify(f)); };
  const savePages   = p => { setPages(p);   localStorage.setItem(PK,JSON.stringify(p)); };
  const NB_TRACKED_FIELDS = ['name','content'];
  const lastSnapshotRef = useRef({});
  // Stale-closure-safe: always reads the latest pages from localStorage before updating
  const updateContent = html => {
    if(!activePid) return;
    setPages(prev => {
      const updated = prev.map(p=>{
        if (p.id!==activePid) return p;
        // Debounced: snapshot the pre-edit state at most once every 3 minutes per page,
        // so version history captures meaningful checkpoints instead of one entry per keystroke.
        const now = Date.now();
        const last = lastSnapshotRef.current[p.id] || 0;
        let versionHistory = p.versionHistory;
        if (now - last > 3*60*1000) {
          versionHistory = withVersionSnapshot(p, NB_TRACKED_FIELDS);
          lastSnapshotRef.current[p.id] = now;
        }
        return {...p, content:html, updated:new Date().toISOString(), versionHistory};
      });
      localStorage.setItem(PK,JSON.stringify(updated));
      return updated;
    });
  };
  const restorePageVersion = (page, snap) => {
    setPages(prev => {
      const updated = prev.map(p=>p.id===page.id
        ? {...p, name:snap.name, content:snap.content, updated:new Date().toISOString(), versionHistory:withVersionSnapshot(p, NB_TRACKED_FIELDS)}
        : p);
      localStorage.setItem(PK,JSON.stringify(updated));
      return updated;

  const [showPageHistory, setShowPageHistory] = useState(false);

  const displayPages = searchQ
    ? pages.filter(p=>p.name.toLowerCase().includes(searchQ.toLowerCase())||stripHtml(p.content).toLowerCase().includes(searchQ.toLowerCase()))
    : tagFilter ? pages.filter(p=>getTags(p.content).includes(tagFilter))
    : activeFid===1 ? pages
    : pages.filter(p=>getDescFids(activeFid).includes(p.folderId));

  const exec = (cmd, val=null) => {

  const addPage = () => {

  const NB_TEMPLATES = {

    'Business Idea': `<h2>Business Idea</h2><h3>Concept</h3><p><br></p><h3>Target Audience</h3><p><br></p><h3>Revenue Model</h3><p><br></p><h3>Competitive Advantage</h3><p><br></p><h3>Next Steps</h3><ul><li></li></ul>`,
    'Daily Journal': `<h2>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><h3>How I'm Feeling</h3><p><br></p><h3>Wins Today</h3><ul><li></li></ul><h3>Challenges</h3><p><br></p><h3>Gratitude</h3><ul><li></li></ul><h3>Tomorrow's Intention</h3><p><br></p>`,
    'Course Notes': `<h2>Course Notes</h2><p><strong>Course:</strong></p><p><strong>Date:</strong> ${new Date().toLocaleDateString()}</p><h3>Key Concepts</h3><ul><li></li></ul><h3>Notes</h3><p><br></p><h3>Questions</h3><ul><li></li></ul><h3>Summary</h3><p><br></p>`,
    'Project Plan': `<h2>Project Plan</h2><h3>Objective</h3><p><br></p><h3>Timeline</h3><ul><li><strong>Phase 1:</strong></li><li><strong>Phase 2:</strong></li><li><strong>Phase 3:</strong></li></ul><h3>Resources Needed</h3><ul><li></li></ul><h3>Success Metrics</h3><p><br></p>`,
    'Weekly Review': `<h2>Weekly Review</h2><p><strong>Week of:</strong> ${new Date().toLocaleDateString()}</p><h3>Wins This Week</h3><ul><li></li></ul><h3>What Didn't Work</h3><ul><li></li></ul><h3>What I'm Avoiding</h3><p><br></p><h3>Next Week's #1 Priority</h3><p><br></p><h3>Energy Check</h3><p>How am I feeling? What do I need more/less of?</p>`,
    'Scripting': `<h2>My Dream Life ✦</h2><p><em>Write in present tense as if it's already real...</em></p><p><br></p><p>I wake up in...</p><p>My morning looks like...</p><p>My business is...</p><p>I feel...</p><p>My relationships are...</p><p>My bank account shows...</p><p>I am so grateful for...</p>`,

    'Content Ideas': `<h2>Content Ideas</h2><h3>Instagram</h3><ul><li></li></ul><h3>TikTok</h3><ul><li></li></ul><h3>Blog / Long-form</h3><ul><li></li></ul><h3>Captions / Hooks</h3><p><br></p><h3>Content Pillars</h3><ul><li>Educational:</li><li>Inspirational:</li><li>Behind the scenes:</li><li>Promotional:</li></ul>`,
    'Book Notes': `<h2>Book Notes</h2><p><strong>Title:</strong></p><p><strong>Author:</strong></p><p><strong>Rating:</strong> /10</p><h3>Key Ideas</h3><ul><li></li></ul><h3>Favorite Quotes</h3><blockquote><p></p></blockquote><h3>How This Applies to My Life</h3><p><br></p><h3>Action Items</h3><ul><li></li></ul>`,
    'Letter to Future Self': `<h2>Dear Future Nyla,</h2><p><em>${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</em></p><p><br></p><p>Right now I'm feeling...</p><p>I'm working on...</p><p>I'm dreaming about...</p><p>I hope by the time you read this...</p><p>Don't forget...</p><p><br></p><p>With love,</p><p>Present You ✦</p>`,
    'Shadow Work': `<h2>Shadow Work</h2><p><em>${new Date().toLocaleDateString()}</em></p><h3>What triggered me today?</h3><p><br></p><h3>What pattern does this remind me of?</h3><p><br></p><h3>What am I afraid of underneath this?</h3><p><br></p><h3>What would my highest self say?</h3><p><br></p><h3>Affirmation to release this:</h3><p><br></p>`,
  };
  const addFromTemplate = (templateName) => {
    const pg = {id:Date.now(),name:templateName,folderId:activeFid,content:NB_TEMPLATES[templateName],created:new Date().toISOString(),updated:new Date().toISOString()};
    savePages([...pages,pg]); setActivePid(pg.id); setHeaderTitle(templateName);
    toast('Created from template','success',1500);
  };
  const [showTemplates, setShowTemplates] = useState(false);

  const uploadFiles = async (files) => {
    const mdToHtml = (text) => {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
      const lines = text.split('\n'); const out = []; let inList = false;
      for (const line of lines) {
        const t = line.trim();
        if (t.startsWith('### ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h3>${inline(esc(t.slice(4)))}</h3>`); }
        else if (t.startsWith('## ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h2>${inline(esc(t.slice(3)))}</h2>`); }
        else if (t.startsWith('# ')) { if(inList){out.push('</ul>');inList=false;} out.push(`<h1>${inline(esc(t.slice(2)))}</h1>`); }
        else if (t.startsWith('- ')||t.startsWith('* ')) { if(!inList){out.push('<ul>');inList=true;} out.push(`<li>${inline(esc(t.slice(2)))}</li>`); }
        else if (t==='') { if(inList){out.push('</ul>');inList=false;} out.push('<p><br></p>'); }
        else { if(inList){out.push('</ul>');inList=false;} out.push(`<p>${inline(esc(line))}</p>`); }
      }
      if(inList) out.push('</ul>');
      return out.join('')||'<p><br></p>';
    };
    const newPages = []; const base = Date.now();
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const name = file.name.replace(/\.[^/.]+$/, '');
      let content = '';
      if (file.type === 'application/pdf') {
        try {
          const pdfKey = `pdf_${Date.now()}_${i}`;
          await pdfDb.save(pdfKey, file);
          content = `<div contenteditable="false" data-pdf-key="${pdfKey}" data-pdf-name="${file.name}" style="margin:12px 0;user-select:none;border-radius:10px;overflow:hidden;border:0.5px solid #f0d0dc"><div style="padding:8px 14px;background:#faf5f8;font-size:12px;color:#9c7090">📄 ${file.name} — loading...</div></div><p><br></p>`;
        } catch(e) {
          content = `<p><em>📄 Could not save PDF: <strong>${file.name}</strong></em></p><p><br></p>`;
        }
      } else {
        try {
          const text = await file.text();
          content = file.name.endsWith('.md')
            ? mdToHtml(text)
            : text.split('\n\n').map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('') || '<p><br></p>';
        } catch(e) { content = `<p><em>Imported: ${file.name}</em></p><p><br></p>`; }
      }
      newPages.push({id:base+i,name,folderId:activeFid,content,created:new Date().toISOString(),updated:new Date().toISOString()});
    }
    if (newPages.length > 0) {
      savePages([...pages,...newPages]);
      const last = newPages[newPages.length-1];
      setActivePid(last.id); setHeaderTitle(last.name);
    }
